# yaml-language-server: $schema=../../core/schemas/resources.schema.json
# LLM serving and quality: vLLM/HF systems, online and offline loads, startup, lm-eval, parity, data generation.
# Metric names follow OpenTelemetry gen_ai naming intent: no units in names, base units (s), UCUM.
apiVersion: bench/v1alpha1
kind: Pack
metadata: {name: llm-serving}
spec:
  prefix: llm
  version: 0.2.0
  requires: {core: "0.2"}
  types:
    - {name: vllm, for: System, schema: schemas/system-vllm.json, refs: {model: Model}}
    - {name: hf-transformers, for: System, schema: schemas/system-hf-transformers.json, refs: {model: Model}}
    - {name: lm-eval-model, for: System, schema: schemas/system-lm-eval.json, refs: {model: Model}}
    - name: serve
      for: Workload
      schema: schemas/workload-serve.json
      levels: [service]
      runner: vllm-bench
      load: [closed, open, batch, ramp]
      default_metrics: [llm.ttft.p99, llm.itl.median, llm.output_throughput]
      scenarios:
        single_stream: {executor: closed, concurrency: 1, requests: 1024}
        multi_stream: {executor: closed, concurrency: 8, requests: 1024}
        server: {executor: open, rate: 1.0, arrival: poisson, duration: 10m, warmup: 1m}
        offline: {executor: batch, requests: 2048}
    - {name: latency, for: Workload, schema: schemas/workload-latency.json, levels: [model], runner: vllm-bench,
       load: [iterations], default_metrics: [llm.batch_latency.mean]}
    - {name: throughput, for: Workload, schema: schemas/workload-throughput.json, levels: [model], runner: vllm-bench,
       load: [batch], default_metrics: [llm.output_throughput, llm.request_throughput]}
    - {name: startup, for: Workload, schema: schemas/workload-startup.json, levels: [service], runner: vllm-bench,
       load: [], default_metrics: [llm.startup.cold, llm.startup.warm]}
    - {name: lm-eval, for: Workload, schema: schemas/workload-lm-eval.json, levels: [model, service], runner: lm-eval,
       load: [], default_metrics: [llm.eval.exact_match], non_identity: [flags.output_path, flags.log_samples]}
    - {name: parity, for: Workload, schema: schemas/workload-parity.json, levels: [service], runner: vllm-bench,
       load: [], default_metrics: [llm.parity.greedy_match_ratio]}
    - {name: generate, for: Workload, schema: schemas/workload-generate.json, levels: [service], runner: vllm-bench,
       load: [batch], default_metrics: [core.duration]}
  vocabularies:
    levels: [model]
  attributes:
    - {key: system.model, class: run, role: root, type: string, plot: true, stored_in: benchmarks.props}
    - {key: system.model_id, class: identity, role: root, type: string, stored_in: benchmarks.props}
    - {key: system.precision, class: identity, role: root, type: enum, values: [fp32, bf16, fp16, fp8, fp4, int8, int4], plot: true, stored_in: benchmarks.props}
    - {key: system.tp, class: identity, role: root, type: int, order: numeric, plot: true, stored_in: benchmarks.props}
    - {key: system.pp, class: identity, role: root, type: int, order: numeric, stored_in: benchmarks.props}
    - {key: case.input_len, class: identity, role: root, type: int, order: numeric, plot: true, stored_in: benchmarks.props}
    - {key: case.output_len, class: identity, role: root, type: int, order: numeric, plot: true, stored_in: benchmarks.props}
    - {key: case.card, class: identity, role: root, type: string, stored_in: benchmarks.props}
    - {key: run.quality.harness, class: run, role: root, type: string, stored_in: benchmark_runs.props}
    - {key: run.quality.harness_version, class: run, role: root, type: string, stored_in: benchmark_runs.props}
    - {key: run.quality.protocol, class: run, role: root, type: string, stored_in: benchmark_runs.props, description: "digest over harness, task version, prompt and filter pipeline as the harness computed it; recorded, never authored"}
    - {key: run.quality.model_revision, class: run, role: root, type: string, stored_in: benchmark_runs.props}
    - {key: run.quality.dataset_digest, class: run, role: root, type: string, stored_in: benchmark_runs.props, description: "digest of the scored question list"}
    - {key: run.quality.temperature, class: run, role: root, type: float, order: numeric, stored_in: benchmark_runs.props}
    - {key: run.quality.seed, class: run, role: root, type: int, order: numeric, stored_in: benchmark_runs.props, description: "a run attribute, never identity"}
    - {key: run.quality.samples_digest, class: run, role: root, type: string, stored_in: benchmark_runs.props, description: "digest of the per-sample attachment kept beside the Result"}
  runners:
    - {name: vllm-bench, protocol: process/v1, command: [python3, -m, spyre_bench.llm.vllm_runner]}
    - {name: lm-eval, protocol: process/v1, command: [python3, -m, spyre_bench.llm.lm_eval_runner]}
  gates:
    - {id: llm.server_ready, phase: in, reason: SERVER_START_FAILED}
    - {id: llm.dataset_digest, phase: post, reason: DATASET_MISMATCH, check: "run.quality.dataset_digest equals the digest the Benchmark's input declares"}
    - {id: llm.records_complete, phase: post, reason: RECORDS_INCOMPLETE, check: "llm.eval.n_samples equals the input's expect.records"}
    - {id: llm.no_errors, phase: post, reason: INFRASTRUCTURE, check: "llm.eval.error_frac is 0"}
    - {id: llm.no_truncation, phase: post, reason: TRUNCATION, check: "llm.eval.truncated_frac <= 0.01"}
    - {id: llm.harness_pinned, phase: post, reason: PROTOCOL_UNPINNED, check: "run.quality.harness_version and run.quality.protocol are recorded"}
    - {id: llm.model_pinned, phase: post, reason: MODEL_UNPINNED, check: "run.quality.model_revision is recorded"}
    - {id: llm.determinism, phase: post, reason: SEED_UNPINNED, check: "a greedy case ran at temperature 0; a sampled case recorded run.quality.seed"}
  metrics:
    - {name: llm.ttft.mean, class: latency_ttft, unit: s, direction: lower_is_better, category: performance, statistic: mean, compare: relative,
       noise: {min_repeats: 3}, otel: gen_ai.server.time_to_first_token}
    - {name: llm.ttft.p99, class: latency_ttft, unit: s, direction: lower_is_better, category: performance, statistic: p99, compare: relative,
       noise: {min_repeats: 3}, otel: gen_ai.server.time_to_first_token}
    - {name: llm.itl.median, class: latency_itl, unit: s, direction: lower_is_better, category: performance, statistic: median, compare: relative, noise: {min_repeats: 3}}
    - {name: llm.itl.p99, class: latency_itl, unit: s, direction: lower_is_better, category: performance, statistic: p99, compare: relative, noise: {min_repeats: 3}}
    - {name: llm.tpot.p99, class: latency_itl, unit: s, direction: lower_is_better, category: performance, statistic: p99, compare: relative,
       noise: {min_repeats: 3}, otel: gen_ai.server.time_per_output_token}
    - {name: llm.e2el.mean, class: latency_e2e, unit: s, direction: lower_is_better, category: performance, statistic: mean, compare: relative}
    - {name: llm.e2el.p99, class: latency_e2e, unit: s, direction: lower_is_better, category: performance, statistic: p99, compare: relative}
    - {name: llm.output_throughput, class: throughput, unit: "{token}/s", direction: higher_is_better, category: performance, statistic: value, compare: relative}
    - {name: llm.request_throughput, class: throughput, unit: "{request}/s", direction: higher_is_better, category: performance, statistic: value, compare: relative}
    - {name: llm.goodput_at_slo, class: throughput, unit: "{request}/s", direction: higher_is_better, category: performance, statistic: value,
       compare: relative, description: "requests/s meeting every bound of the workload's slo"}
    - {name: llm.batch_latency.mean, class: latency_e2e, unit: s, direction: lower_is_better, category: performance, statistic: mean, compare: relative}
    - {name: llm.startup.cold, class: startup_time, unit: s, direction: lower_is_better, category: performance, statistic: value, compare: relative, noise: {min_repeats: 1}}
    - {name: llm.startup.warm, class: startup_time, unit: s, direction: lower_is_better, category: performance, statistic: value, compare: relative, noise: {min_repeats: 3}}
    - {name: llm.eval.exact_match, class: quality_score, unit: "1", direction: higher_is_better, category: quality, statistic: mean, compare: absolute}
    - {name: llm.parity.greedy_match_ratio, class: quality_score, unit: "1", direction: higher_is_better, category: quality, statistic: ratio, compare: exact}
    - {name: llm.eval.acc, class: quality_score, unit: "1", direction: higher_is_better, category: quality, statistic: mean, compare: absolute}
    - {name: llm.eval.acc_norm, class: quality_score, unit: "1", direction: higher_is_better, category: quality, statistic: mean, compare: absolute}
    - {name: llm.eval.f1, class: quality_score, unit: "1", direction: higher_is_better, category: quality, statistic: mean, compare: absolute}
    - {name: llm.eval.exact_match_stderr, class: diagnostic, unit: "1", direction: lower_is_better, category: diagnostic, statistic: value, compare: absolute,
       description: "standard error of llm.eval.exact_match as the harness reports it"}
    - {name: llm.eval.acc_stderr, class: diagnostic, unit: "1", direction: lower_is_better, category: diagnostic, statistic: value, compare: absolute}
    - {name: llm.eval.acc_norm_stderr, class: diagnostic, unit: "1", direction: lower_is_better, category: diagnostic, statistic: value, compare: absolute}
    - {name: llm.eval.f1_stderr, class: diagnostic, unit: "1", direction: lower_is_better, category: diagnostic, statistic: value, compare: absolute}
    - {name: llm.eval.n_samples, class: diagnostic, unit: "{record}", direction: none, category: diagnostic, statistic: value, compare: exact,
       description: "records the harness scored; compared with the input's expect.records by llm.records_complete"}
    - {name: llm.eval.error_frac, class: diagnostic, unit: "1", direction: lower_is_better, category: diagnostic, statistic: value, compare: absolute,
       description: "share of requests that errored or came back empty"}
    - {name: llm.eval.truncated_frac, class: diagnostic, unit: "1", direction: lower_is_better, category: diagnostic, statistic: value, compare: absolute,
       description: "share of generations that hit max_tokens or a prompt cut by max_model_len"}
    - {name: llm.parity.mean_abs_prob_err, class: quality_score, unit: "1", direction: lower_is_better, category: quality, statistic: mean, compare: absolute}
    - {name: llm.parity.max_abs_prob_err, class: quality_score, unit: "1", direction: lower_is_better, category: quality, statistic: max, compare: absolute}
    - {name: llm.parity.tie_adjusted_match_ratio, class: quality_score, unit: "1", direction: higher_is_better, category: quality, statistic: ratio, compare: absolute}
    - {name: llm.parity.ref_coverage, class: quality_score, unit: "1", direction: higher_is_better, category: quality, statistic: ratio, compare: absolute}
    - {name: llm.eval.invalid_frac, class: diagnostic, unit: "1", direction: lower_is_better, category: diagnostic, statistic: value, compare: absolute,
       description: "share of answers the scorer could not parse; a failed request counts here when the harness has no error counter"}
