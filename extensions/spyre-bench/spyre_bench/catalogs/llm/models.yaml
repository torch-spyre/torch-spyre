# yaml-language-server: $schema=../../core/schemas/resources.schema.json
# The models the shared vLLM benchmarks serve. A Model names its weights by role; `model_id` hashes
# the (role, asset) set, so bumping a revision below starts a new benchmark rather than bending the
# old trend line.
#
# A revision of all zeros next to `revision_pinned` is this repository's convention for "not pinned
# yet" (the schema cannot say "unpinned" there); the annotation marks it and the runner lets the hub
# resolve its default. Pinned revisions match the CI cache config, so an offline host already has them.
apiVersion: bench/v1alpha1
kind: Model
metadata: {name: micro-g3.3-8b-instruct-1b, description: the small decoder the smoke cases use}
spec:
  assets: [{role: weights, asset: micro-g3.3-8b-instruct-1b-weights}]
  family: granite
  architecture: decoder-only
---
apiVersion: bench/v1alpha1
kind: Model
metadata: {name: granite-3.3-8b-instruct}
spec:
