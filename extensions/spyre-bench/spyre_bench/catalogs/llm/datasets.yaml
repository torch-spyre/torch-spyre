# yaml-language-server: $schema=../../core/schemas/resources.schema.json
# What the bytes mean. A serve Benchmark names one of these as a workload input; `role: trace` says
# the records are replayed in recorded order, which is what makes prefill chunking, prefix reuse and
# KV-block pressure visible in a way a fixed prompt shape cannot.
apiVersion: bench/v1alpha1
kind: Dataset
metadata: {name: trace-cics, description: "recorded CICS router prompts, replayed in recorded order"}
spec:
  asset: trace-cics-files
  role: trace
  schema: {record: {prompt: text, output_len: int}}
---
apiVersion: bench/v1alpha1
kind: Dataset
metadata: {name: trace-aiops, description: "recorded AIOps router prompts, replayed in recorded order"}
spec:
  asset: trace-aiops-files
  role: trace
  schema: {record: {prompt: text, output_len: int}}
