# yaml-language-server: $schema=../../core/schemas/resources.schema.json
# The bytes behind each shared dataset. `sha256` is the integrity gate, so a truncated transfer or a
# silently replaced artifact fails the fetch instead of skewing a benchmark.
#
# The traces are one recording of real router prompts, split by workload; the version in the path is
# the recording, so re-recording means a new Asset rather than an edit to this one.
apiVersion: bench/v1alpha1
kind: Asset
metadata: {name: trace-cics-files}
spec:
  type: fileset
  format: jsonl
  version: 2025.11.03-e2ee1b0
  license: internal
  visibility: internal
  source: {store: spyre-datasets, path: spyre-inference/vllm-bench-data/converted_traces/2025.11.03_e2ee1b0_reordered}
  integrity:
    files:
      - path: cics_results_2025.11.03_e2ee1b0_correct_order.jsonl
        sha256: e0efa895b4a22b601748c7dda9e8a2db146773fb8735fc45ee2920c042b40fb7
