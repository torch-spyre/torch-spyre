# A multi-file dataset: the records and the images they reference arrive as one archive, so the
# consumer needs the extraction directory as well as the jsonl. `consumer.env` names the variable
# the server reads it from.
apiVersion: bench/v1alpha1
kind: Asset
metadata:
  name: vision-invoices-files
  annotations: {consumer.env: SPYRE_VISION_IMAGES_DATASET}
spec:
  type: fileset
  format: jsonl
  version: 2026.11.10
  license: internal
  visibility: internal
  source: {store: spyre-datasets, path: spyre-inference/datasets/vision}
  integrity:
    files:
      - path: oracle_invoices_2026.11.10.tar.gz
        sha256: 583541f089bba7ea18bdaf7c7c782db0ab58572428ac5663f3d533c28a90d927
---
# Nothing is stored: a pure function of the tool, the seed and the lengths the Workload states.
apiVersion: bench/v1alpha1
kind: Asset
metadata: {name: random-prompts-gen}
spec:
  type: generator
  version: "1"
  license: Apache-2.0
  visibility: public
  source: {generator: {tool: vllm-bench-random, seed: 0, params: {range_ratio: 0.0}}}
