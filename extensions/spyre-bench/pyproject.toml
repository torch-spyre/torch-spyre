[project]
name = "spyre-bench"
version = "0.1.0"
description = "Benchmark catalog engine: bench/v1alpha1 schemas, packs, identity, planning and validity"
readme = "README.md"
requires-python = ">=3.11"
# Stdlib `re` is forbidden repo-wide (enforce-import-regex-instead-of-re), so `regex` is a hard dependency.
# jsonschema is optional: without it the engine falls back to a stdlib validator for the schema subset.
dependencies = [
    "pyyaml",
    "regex",
]

[project.scripts]
spyre-bench = "spyre_bench.cli:main"

[project.optional-dependencies]
jsonschema = ["jsonschema>=4"]
# The read-only store behind plan reuse lookups, the rows-landed check and verdict.
clickhouse = ["clickhouse-connect>=1.3.0"]
# The ingest derivation behind the stored benchmark_id; see docs/README.md ("Ingest identity").
ingest = ["spyre-clickhouse-ingest>=0.1"]

[tool.uv.sources]
spyre-clickhouse-ingest = { path = "../clickhouse-ingest" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "jsonschema>=4",
]

# Core schemas, packs and shared catalogs are data read from the package directory at run time.
[tool.setuptools]
packages = ["spyre_bench"]

[tool.setuptools.package-data]
spyre_bench = [
    "core/pack.yaml",
    "core/metric-context.yaml",
    "core/schemas/*.json",
    "core/schemas/tool-output/*.json",
    "packs/index.yaml",
    "packs/*/pack.yaml",
    "packs/*/schemas/*.json",
    # Shared resource declarations a product catalog resolves against; see `spyre-bench catalogs`.
    "catalogs/*/*.yaml",
    "ondemand_policy.json",
]

[tool.ruff]
line-length = 120
