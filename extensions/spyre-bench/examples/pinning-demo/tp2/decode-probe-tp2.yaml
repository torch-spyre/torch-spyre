# yaml-language-server: $schema=../../../spyre_bench/core/schemas/resources.schema.json
# Two ranks, one per card: each rank is pinned behind {pin_wrapper} when the policy is per_device with layout ranks;
# for every other policy the wrapper passes the command through.
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: decode-probe-tp2}
spec:
  type: perf
  level: model
  tier: sanity
  system: demo-llm-a-hf-fp16
  workload:
    type: llm/latency
    shape: {batch_size: 1, input_len: 512, output_len: 1}
    load: {executor: iterations, iterations: 10, warmup_iterations: 2}
  run:
    repeats: 5
    timeout: 30m
    est: 10m
    isolation: process
    command:
      - "{python}"
      - stub_ranks.py
      - "--ranks=2"
      - "--wrapper={pin_wrapper}"
      - "--"
      - "{python}"
      - stub_decode.py
      - "--out-len={case.shape.output_len}"
      - "--repeat={repeat}"
      - "--out={repeat_dir}"
  matrix:
    axes:
      out: {path: workload.shape.output_len, values: [1, 129], token: "out{}"}
