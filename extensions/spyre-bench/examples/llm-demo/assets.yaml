apiVersion: bench/v1alpha1
kind: Asset
metadata: {name: random-prompts-gen, description: "a pure function of (tool, seed, params): nothing is stored"}
spec:
  type: generator
  version: "1"
  license: Apache-2.0
  visibility: public
  source: {generator: {tool: vllm-bench-random, seed: 0, params: {range_ratio: 0.0}}}
---
apiVersion: bench/v1alpha1
kind: Asset
metadata: {name: parity-prompts-files}
spec:
