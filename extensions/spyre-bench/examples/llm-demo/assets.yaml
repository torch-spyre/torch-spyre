  format: jsonl
  version: "1"
  license: Apache-2.0
  visibility: internal
  source: {store: demo-cache, path: corpus/parity-prompts/1}
  integrity: {files: [{path: prompts.jsonl, sha256: "5555555555555555555555555555555555555555555555555555555555555555"}]}
---
apiVersion: bench/v1alpha1
kind: Asset
metadata: {name: demo-llm-a-reference-outputs, description: "output of running a model: stored, content-addressed, with lineage"}
spec:
  type: generated
  format: jsonl
  version: "1"
  visibility: internal
  produced_by: {benchmark: reference-outputs-demo-llm-a, output: outputs, policy: {regenerate: if_inputs_change}}
  source: {store: demo-store, path: datasets/generated/demo-llm-a-reference-outputs/1}
  integrity: {manifest: {path: SHA256SUMS, sha256: "6666666666666666666666666666666666666666666666666666666666666666"}}
---
