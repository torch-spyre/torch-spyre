# yaml-language-server: $schema=../../../spyre_bench/core/schemas/resources.schema.json
apiVersion: bench/v1alpha1
kind: System
metadata: {name: demo-llm-a-hf-fp16}
spec: {type: llm/hf-transformers, backend: hf-demo, token: demoa, model: demo-llm-a, precision: fp16}
---
apiVersion: bench/v1alpha1
kind: Benchmark
metadata: {name: latency-demo-llm-a}
spec:
  type: perf
  level: model
  tier: sanity
  system: demo-llm-a-hf-fp16
  workload:
    type: llm/latency
    shape: {batch_size: 1, input_len: 512, output_len: 64}
    load: {executor: iterations, iterations: 10, warmup_iterations: 2}
  run: {timeout: 30m, est: 10m}
  matrix:
    axes:
      batch: {path: workload.shape.batch_size, values: [1, 4], token: "b{}"}
