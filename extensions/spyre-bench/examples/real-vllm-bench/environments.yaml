# What a case needs: a number of cards and a CPU pinning policy. Architecture, queue and node pools are chosen by the launcher,
# not named here. Policy `none` is the default until the vLLM path pins CPUs itself; the `-device-local` twins request it and
# are used only by a run that sets BENCH_ENVIRONMENT (see benchmarks/README.md).

apiVersion: bench/v1alpha1
kind: Environment
metadata: {name: spyre-1card, description: "one card"}
spec:
  devices:
    requests: [{name: cards, device_class: spyre/pf, count: 1}]
  host: {cpu_pinning: {policy: none}}
  labels: {device.count: 1}
---
apiVersion: bench/v1alpha1
kind: Environment
metadata: {name: spyre-1card-device-local, description: "one card, process tree pinned to the CPUs local to the cards"}
spec:
  devices:
    requests: [{name: cards, device_class: spyre/pf, count: 1}]
  host: {cpu_pinning: {policy: device_local, require_verified: true}}
  labels: {device.count: 1}
---
