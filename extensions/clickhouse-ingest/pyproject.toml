[project]
name = "spyre-clickhouse-ingest"
version = "0.1.0"
description = "Shared schema-v2 ClickHouse schema, identity and write path for the Spyre CI ingests"
readme = "README.md"
requires-python = ">=3.11"
# Deliberately NOT depending on torch_spyre: installing it to obtain a schema module would pull
# torch/numpy/ortools, and ortools has no ppc64le/s390x wheel -- the ingest would break on p/z.
# The ingest runtime is three wheels, and clickhouse-connect is the only one this package needs.
dependencies = [
    "clickhouse-connect>=1.3.0",
    # hw_parse imports it: the repos forbid stdlib `re` (enforce-import-regex-instead-of-re), so a
    # module here hard-imports `regex` and must declare it or the next consumer gets ImportError.
    # Unlike ortools it ships ppc64le/s390x wheels, so this costs the p/z ingests nothing.
    "regex",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
