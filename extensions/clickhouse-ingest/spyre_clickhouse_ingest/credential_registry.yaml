# Credentials that Jenkins discovery cannot see or that are not bound yet, plus who to ask about
# them. Names only: no value is stored here. An unknown owner, rotation or expiry stays empty / 0.
# status: in_use | unused | planned. probe_status: existing | designed | none.
entries:
  - id: CURVEBENDER_SPYRE_CI_API_KEY
    system: external
    scope: litellm.cb.ete.res.ibm.com
    kind: LiteLLM virtual key (AI)
    description: Curvebender LiteLLM proxy key used for model evaluation and the analyst Claude-gateway alias
    status: in_use
    consumers: [model evaluation scripts, analyst-runner (ANALYST_CLAUDE_GW_TOKEN)]
    stored_in: ['laptop project .env: CURVEBENDER_SPYRE_CI_API_KEY', 'Jenkins credential: not created (CLAUDE_GW_TOKEN_CRED_ID unset)']
    probe: {type: litellm-models, status: designed, call: 'GET /v1/models, 401 means failing'}
    owner: ''
    owner_email: ''
    issuer: Curvebender (IBM LiteLLM proxy)
    notes: Held by ashokponkumar; the issuer's owner, rotation and expiry are not documented.

  - id: CURVEBENDER_SPYRE_CI_MANAGE_API_KEY
    system: external
    scope: litellm.cb.ete.res.ibm.com
    kind: LiteLLM virtual key (management)
    description: Curvebender management key for the Spyre CI team; no consumer
    status: unused
    consumers: []
    stored_in: ['laptop project .env: CURVEBENDER_SPYRE_CI_MANAGE_API_KEY']
    probe: {type: none, status: none, call: 'never called: unused and its scope is undocumented'}
    owner: ''
    owner_email: ''
    issuer: Curvebender (IBM LiteLLM proxy)
    notes: Held by ashokponkumar; scope undocumented. Candidate for revocation if it stays unused.

  - id: prometheus-alerts-reader-token
    system: jenkins
    scope: system
    kind: Secret text
    description: Bearer token of the prometheus-alerts-reader ServiceAccount (torch-cicd), read-only on the Prometheus alerts API
    status: planned
    consumers: [prometheus-alert-poller (pipelines/ops/Jenkinsfile.prometheus-alert-poller)]
    stored_in: ['Jenkins credential: not created yet']
    probe: {type: k8s, status: existing, call: JWT exp read locally; a Prometheus alerts GET would be a new type}
    owner: ''
    owner_email: ''
    issuer: OpenShift ServiceAccount on torch-cicd, issued by cluster admins
    notes: Not created, so no owner is assigned. The ServiceAccount token lifetime chosen at issue time sets the expiry.

  - id: analyst-jenkins-read-token
    system: jenkins
    scope: system
    kind: Username with password
    description: Read-only Jenkins API user for the analyst Jenkins tools (JENKINS_URL, JENKINS_USER, JENKINS_TOKEN)
    status: planned
    consumers: [analyst-runner (jenkins_* tools)]
    stored_in: ['Jenkins credential: not created yet']
    probe: {type: none, status: designed, call: GET /me/api/json as the user; 401 means failing}
    owner: ''
    owner_email: ''
    issuer: Jenkins controller (user API token)
    notes: Account and id are proposed names; nothing exists.

  - id: analyst-github-app-installation-token
    system: gha
    scope: org:torch-spyre
    kind: GitHub App installation token
    description: Read-only Actions installation token for the analyst GitHub tools (ANALYST_GITHUB_TOKEN); shares the ingest rate budget
    status: planned
    consumers: [analyst-runner (gha_run, gha_jobs)]
    stored_in: [not created yet]
    probe: {type: github-app, status: none, call: needs a signed App JWT; not covered by the probes yet}
    owner: ''
    owner_email: ''
    issuer: GitHub App on github.com, torch-spyre org
    notes: Installation tokens last one hour, so the stored secret is the App key, not the token.

  - id: slack-spyre-ci-bot-token-test-workspace
    system: jenkins
    scope: system
    kind: Secret text
    description: Slack bot token (chat:write) for one thread per incident; used by the router and the assistant delivery adapter
    status: in_use
    consumers: [incident-router, pr-incident-doctor, analyst assistant (SLACK_BOT_TOKEN)]
    stored_in: ['Jenkins credential: slack-spyre-ci-bot-token-test-workspace']
    probe: {type: slack, status: designed, call: auth.test; the existing slack probe checks webhook URLs only}
    owner: ''
    owner_email: ''
    issuer: Slack app (test workspace)
    notes: The id says test workspace; whether production needs another token is open.

  - id: analyst-ask-spyre-mcp-token
    system: dashboard
    scope: ask-spyre-mcp
    kind: Bearer token
    description: Caller token for the Ask Spyre MCP gateway (ANALYST_MCP_TOKEN); the gateway is not deployed
    status: planned
    consumers: [analyst-runner (mcp tools)]
    stored_in: [not created yet]
    probe: {type: none, status: none, call: no deployed endpoint to call}
    owner: ''
    owner_email: ''
    issuer: spyre-dashboard (V2_MCP_ENABLED is off)
    notes: Token issuance for non-browser callers is undecided.

  - id: analyst-spyre-llm-token
    system: cluster
    scope: spyre-experience/experience-summary
    kind: Bearer token
    description: Optional token for the Spyre-hosted model server (ANALYST_SPYRE_LLM_TOKEN)
    status: planned
    consumers: [analyst-runner (spyre_llm backend)]
    stored_in: [not created yet]
    probe: {type: none, status: none, call: the service is ClusterIP and takes no token today}
    owner: ''
    owner_email: ''
    issuer: unknown
    notes: Only needed if the model service gains authentication.
