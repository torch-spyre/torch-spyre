<svg viewBox="0 0 820 486" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="hfa-arr" markerWidth="8" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ── Input: stock HF checkpoint ── -->
  <rect x="255" y="10" width="310" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="410" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Stock HuggingFace checkpoint</text>
  <text x="410" y="46" text-anchor="middle" font-size="10.5" fill="#3b82f6">weights, tokenizer, config, from transformers</text>

  <line x1="410" y1="56" x2="410" y2="74" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#hfa-arr)"/>

  <!-- ── Loader ── -->
  <rect x="120" y="76" width="580" height="46" rx="6" fill="#374151"/>
  <text x="410" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" font-family="monospace">AutoSpyreModelForCausalLM.from_pretrained(...)</text>
  <text x="410" y="112" text-anchor="middle" font-size="10.5" fill="#d1d5db">select adapter by config type, load, patch, move to spyre</text>

  <line x1="410" y1="122" x2="410" y2="140" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#hfa-arr)"/>

  <!-- ── Prepared model container ── -->
  <rect x="30" y="142" width="760" height="256" rx="8" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="410" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Prepared model, one HF instance patched in place</text>

  <!-- Column headers -->
  <text x="222" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857" letter-spacing="0.4">KEPT FROM TRANSFORMERS</text>
  <text x="598" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" letter-spacing="0.4">REPLACED BY THE ADAPTER</text>

  <!-- vertical divider -->
  <line x1="410" y1="176" x2="410" y2="384" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- LEFT column: kept (green) -->
  <!-- 5 boxes h=32 spacing 38 starting y=198 -->
  <rect x="62" y="198" width="320" height="32" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="222" y="218" text-anchor="middle" font-size="11" fill="#065f46">Pretrained weights</text>

  <rect x="62" y="236" width="320" height="32" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="222" y="256" text-anchor="middle" font-size="11" fill="#065f46">Tokenizer and config</text>

  <rect x="62" y="274" width="320" height="32" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="222" y="294" text-anchor="middle" font-size="11" fill="#065f46">Token embeddings</text>

  <rect x="62" y="312" width="320" height="32" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="222" y="332" text-anchor="middle" font-size="11" fill="#065f46">QKV and output projections</text>

  <rect x="62" y="350" width="320" height="32" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="222" y="370" text-anchor="middle" font-size="11" fill="#065f46">MLP (SwiGLU)</text>

  <!-- RIGHT column: replaced (orange) -->
  <!-- 6 boxes h=28 spacing 31 starting y=196 -->
  <rect x="438" y="196" width="320" height="28" rx="4" fill="#fff7f4" stroke="#f5c8a8" stroke-width="1.2"/>
  <text x="452" y="214" font-size="11" fill="#9a3412"><tspan font-weight="700">RoPE</tspan>  precomputed rotation matmul</text>

  <rect x="438" y="227" width="320" height="28" rx="4" fill="#fff7f4" stroke="#f5c8a8" stroke-width="1.2"/>
  <text x="452" y="245" font-size="11" fill="#9a3412"><tspan font-weight="700">RMSNorm</tspan>  device-dtype class patch</text>

  <rect x="438" y="258" width="320" height="28" rx="4" fill="#fff7f4" stroke="#f5c8a8" stroke-width="1.2"/>
  <text x="452" y="276" font-size="11" fill="#9a3412"><tspan font-weight="700">LM head</tspan>  padded to stick-aligned vocab</text>

  <rect x="438" y="289" width="320" height="28" rx="4" fill="#fff7f4" stroke="#f5c8a8" stroke-width="1.2"/>
  <text x="452" y="307" font-size="11" fill="#9a3412"><tspan font-weight="700">Decoder blocks</tspan>  compiled block_forward</text>

  <rect x="438" y="320" width="320" height="28" rx="4" fill="#fff7f4" stroke="#f5c8a8" stroke-width="1.2"/>
  <text x="452" y="338" font-size="11" fill="#9a3412"><tspan font-weight="700">Attention mask</tspan>  fp16 built on CPU</text>

  <rect x="438" y="351" width="320" height="28" rx="4" fill="#fff7f4" stroke="#f5c8a8" stroke-width="1.2"/>
  <text x="452" y="369" font-size="11" fill="#9a3412"><tspan font-weight="700">generate()</tspan>  64-block padded decode loop</text>

  <line x1="410" y1="398" x2="410" y2="416" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#hfa-arr)"/>

  <!-- ── Device ── -->
  <rect x="240" y="418" width="340" height="46" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="410" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Spyre accelerator</text>
  <text x="410" y="454" text-anchor="middle" font-size="10.5" fill="#4f46e5">compiled blocks execute through torch_spyre</text>
</svg>
