[build-system]
requires = [
    # any change here should be reflected in the build dependencies below
    "build",  # only required to build torch_sendnn
    "cmake>=3.27,<4.0.0",
    "expecttest>=0.3.0", # imported by torch.testing._internal.common_utils
    "jinja2",
    "ninja",
    "numpy",
    "pyyaml", # needed for codegen
    "regex",
    "setuptools>=77.0.3",  # match upstream torch dependency range
    "torch~=2.13.0",
#    "torch>=2.13.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "torch_spyre"
authors = [
    {name = "Torch-Spyre Core Team"}
]
description = "Torch-Spyre out of tree registration"
dependencies = [
    "numpy",
    "regex",
    "torch~=2.13.0",
#    "torch>=2.13.0",
    "psutil",
    # CP-SAT LX layout solver. `layout_solver` defaults to "cpsat" (see config.py),
    # so a base install needs ortools to actually get it -- without this, every
    # default-config compile falls back to the greedy allocator with a warning.
    # No PyPI wheel or sdist for s390x/ppc64le; those arches keep the documented
    # greedy fallback (ppc64le gets a from-source build in spyre-frameworks
    # instead, installed out-of-band -- see pipelines/components/ortools there).
    "ortools>=9.0; platform_machine != 's390x' and platform_machine != 'ppc64le'",
]
requires-python = ">=3.11"
dynamic = ["version"]

[dependency-groups]
# mlir_ktdp (ktir-mlir-frontend), which the OpSpec->KTIR emitter imports lazily,
# is deliberately NOT declared here.  It is a scikit-build-core/CMake project that
# must configure against a matching LLVM/MLIR, so it cannot be installed
# unattended, and pinning it here would put this file in the path of every
# routine bump.  Install it with `tools/install-ktir.sh`; the commit it is tested
# against is `tools/ktir-mlir-frontend.pin`, which explains the rest.

[project.optional-dependencies]
# ortools is now a base dependency (on wheel-supported arches) since layout_solver
# defaults to "cpsat" -- see `dependencies` above. This extra is kept as a no-op
# alias so existing `--extra cpsat` / `.[cpsat]` call sites (e.g. spyre-frameworks'
# Containerfile.dev) keep working unchanged.
cpsat = [
    "ortools>=9.0; platform_machine != 's390x' and platform_machine != 'ppc64le'",
]
build = [ # no-isolation build
    # any change here should be reflected in the build system above
    "build",  # only required to build torch_sendnn
    "cmake>=3.27,<4.0.0",
    "expecttest>=0.3.0", # imported by torch.testing._internal.common_utils
    "jinja2",
    "ninja",
    "numpy",
    "pyyaml", # needed for codegen
    "regex",
    "setuptools>=77.0.3",  # match upstream torch dependency range
    "torch~=2.13.0",
#    "torch>=2.13.0",
    "wheel"
]
test = [
    "pytest~=9.0",
    "pydantic",             # needed by test framework to support pydantic models for config
    "pytest-xdist",         # -n1 worker isolation for segfault resilience
#    "torch_sendnn",        # must be installed manually
]
lint = [
    "mypy~=2.1.0",
    "pre-commit~=4.6.0",
    "types-PyYAML~=6.0.12.20260518",
    "uv~=0.11.15",
]

[project.entry-points."torch.backends"]
torch_spyre = "torch_spyre:_autoload"

[tool.setuptools]
package-dir = { torch_spyre = "torch_spyre" }
package-data = { torch_spyre = ["*.dll", "*.dylib", "*.so"] }

[tool.setuptools.packages.find]
exclude = ["tests"]  # exclude packages matching these glob patterns (empty by default)

[tool.setuptools.dynamic]
version = {attr = "torch_spyre.version.__version__"}  # any module attribute compatible with ast.literal_eval
readme = {file = ["README.rst", "USAGE.rst"]}

[tool.ruff]
line-length = 88

[tool.mypy]
ignore_missing_imports = true
exclude=["tests/inductor", "captured"]

[[tool.mypy.overrides]]
module = ["torch_spyre._inductor.*"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
filterwarnings = [
    # Suppress torch.jit.script_method DeprecationWarning triggered by
    # importing torch._inductor.compile_fx (which transitively imports torch.utils.mkldnn).
    # https://github.com/pytorch/pytorch/blob/70d99e9/torch/jit/_script.py#L366
    "ignore::DeprecationWarning:torch.jit._script",
]
norecursedirs = ['tests/models']

[tool.uv]
required-version = ">=0.9.0"
index-strategy = "unsafe-best-match"
override-dependencies = ['setuptools>=70.1.0,<82']

[tool.uv.sources]
torch = [
#  { path = "../pytorch", editable = true },
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.pip]
universal = true
