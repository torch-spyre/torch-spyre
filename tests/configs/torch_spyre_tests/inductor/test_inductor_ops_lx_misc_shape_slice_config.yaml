# LX-planning shard: inductor_ops family 'misc_shape_slice', both wrap classes
# (LxPlanningTwoOpPointwiseAdditionTest '(x + x) / 2' and
#  LxPlanningTwoOpReductionTest 'torch.sum(x, dim=0)').
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). Known LX-planning failures are
# listed as `mode: xfail` blocks (none at present; the in-file .py
# skip-lists were removed as duplicates).
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        # The storage_offset placeholder tests run LX planning over a
        # restickified stick-offset input, which the non-LX shard does not
        # exercise.  Only the pointwise wrap is listed: these tests call the
        # module-level _compile_and_run rather than self.compare_with_cpu,
        # which is the sole caller of wrap(), so no second op is ever
        # attached and the reduction copy would re-run an identical body.
        - names:
            - LxPlanning.*::test_slice.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_storage_offset_placeholder.*_lx_planning_pointwise
          mode: mandatory_success
          tags:
            - ops__inductor_misc_shape
