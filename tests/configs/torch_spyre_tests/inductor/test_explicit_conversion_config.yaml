test_suite_config:
  labels: [unit, regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_dtype_conversion.py
      unlisted_test_mode: skip
      tests:
        # Tests that are known to fail or to be rejected still run here as
        # mandatory_success: their expected outcome (strict xfail with raises=, or an
        # asserted rejection) is declared on the test itself, so a skip here would hide it.
        - names:
            - TestExplicitConversion::test_to_dtype_fp16_to_fp32_2d_stick_aligned
            - TestExplicitConversion::test_to_dtype_fp16_to_fp32_fp32_stick_aligned
            - TestExplicitConversion::test_to_dtype_bf16_to_fp32_2d_stick_aligned
            - TestExplicitConversion::test_to_dtype_fp16_to_fp32_unaligned_4x16
            - TestExplicitConversion::test_to_dtype_fp16_to_fp32_unaligned_4x68
            - TestExplicitConversion::test_to_dtype_chain_fp16_fp32_bf16
            - TestExplicitConversion::test_neg_fp16_dtype_preserved_after_explicit_cast
            - TestExplicitConversion::test_abs_fp16_dtype_preserved
            - TestExplicitConversion::test_to_dtype_transposed_fp16_to_fp32
            - TestExplicitConversion::test_to_dtype_expanded_view_fp16_to_fp32
            - TestExplicitConversion::test_float_shortcut_value_correctness
            - TestExplicitConversion::test_bfloat16_shortcut_from_fp16_value_correctness
            - TestExplicitConversion::test_special_values_nan_inf_preserved_through_fp16_fp32_conversion
            - TestExplicitConversion::test_same_dtype_cast_is_noop_in_compiled_graph
            - TestExplicitConversion::test_fp32_to_bool_compiled
            - TestExplicitConversion::test_wa_exp_add_3d_stick_aligned
            - TestExplicitConversion::test_wa_exp_sub_3d_stick_aligned
            - TestExplicitConversion::test_wa_exp_mul_4d_stick_aligned
            - TestExplicitConversion::test_explicit_fp16_to_fp32_chained_add_mul_3d
            - TestExplicitConversion::test_wa_exp_add_non_contiguous_2d
            - TestExplicitConversion::test_half_shortcut_value_correctness
            - TestExplicitConversion::test_bfloat16_shortcut_from_fp32_value_correctness
            - TestExplicitConversion::test_explicit_fp16_to_fp32_add_3d_unaligned
            - TestExplicitConversion::test_explicit_fp16_to_fp32_add_4d_unaligned
            - TestExplicitConversion::test_eager_to_dtype_fp32_to_fp16
            - TestExplicitConversion::test_to_dtype_strided_slice_fp16_to_fp32
          mode: mandatory_success

        - names:
            - TestModelIntegration::test_compiled_linear_fp16
          mode: mandatory_success

  global:
    supported_dtypes:
      - name: float16
      - name: bfloat16
      - name: float32
      - name: bool
