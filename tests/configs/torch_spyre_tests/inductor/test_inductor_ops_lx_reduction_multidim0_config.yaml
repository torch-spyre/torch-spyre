# LX-planning shard: inductor_ops family 'reduction_multidim0', both wrap classes
# (LxPlanningTwoOpPointwiseAdditionTest '(x + x) / 2' and
#  LxPlanningTwoOpReductionTest 'torch.sum(x, dim=0)').
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). The xfail lists below are
# the source of truth for known LX-planning failures (the in-file .py
# skip-lists were removed as duplicates).
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        # DeepTools 092f4e79 coordinate masking miscomputes this padded
        # fp16 sum over (63, 129): 0.58984375 instead of -0.468017578125.
        # https://github.com/torch-spyre/torch-spyre/issues/5515
        - names:
            - LxPlanning.*::test_reduce_multidim_keepdim0_sum_pad_2d_dim_01_all_lx_planning_(pointwise|reduction)
          mode: xfail_strict
        - names:
            - LxPlanning.*::test_reduce_multidim_keepdim0.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_reduce_edge_multidim_keepdim0.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_mean_layout_multidim_keepdim0.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_any_multidim.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_all_multidim.*_lx_planning_(pointwise|reduction)
          mode: mandatory_success
