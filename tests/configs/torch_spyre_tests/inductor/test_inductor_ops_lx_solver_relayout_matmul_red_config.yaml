# Solver-relayout sweep shard: mirrors test_inductor_ops_lx_matmul_config.yaml but runs
# Split by wrap suffix so each shard fits the 60 minute job budget: the
# CP-SAT co-optimizing configuration compiles roughly 2.5x slower per test
# than the greedy LX shards this file mirrors. The split keys on the
# _lx_planning_{pointwise,reduction} METHOD suffix: the OOT runner strips
# the ClassName:: prefix from `names:` entries and matches bare method
# names, so a class-name split does not select anything.
# tests/inductor/test_inductor_ops_lx_solver_relayout.py, the LX-planning
# wrap re-wrapped with layout_solver=cpsat, co_optimizing_lx_planning=True
# and lx_solver_relayout=True. The xfail floor is inherited from the
# LX-planning shard; deltas found by this sweep are appended per shard.
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_solver_relayout.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            - SolverRelayout.*::test_einsum_einsum_67x255_255x128_lx_planning_reduction
            - SolverRelayout.*::test_einsum_einsum_67x256_256x128_lx_planning_reduction
            - SolverRelayout.*::test_matmul_tiled_y_lx_planning_reduction
            - SolverRelayout.*::test_mm_autocast_f16_disabled_lx_planning_reduction
            - SolverRelayout.*::test_mm_autocast_f16_enabled_lx_planning_reduction
            - SolverRelayout.*::test_addmm_1152_10x1152_1152x1152_lx_planning_reduction
            - SolverRelayout.*::test_addmm_out_basic_lx_planning_reduction
            - SolverRelayout.*::test_fp8_scaled_mm_128x128x128_1.0_1.0_0.0_lx_planning_reduction
            # Novel under the co-optimizing CP-SAT configuration: the chosen
            # work division is too fine for the fused fp8-quantize kernel's
            # temporal-loop distribution (sbf-ddc DtException in dxp).
            - SolverRelayout.*::test_fp8_scaled_mm_4x128x1024_1.0_1.0_0.0_lx_planning_reduction
            - SolverRelayout.*::test_fp8_scaled_mm_4x128x1024_1.0_1.0_5.0_lx_planning_reduction
            - SolverRelayout.*::test_fp8_scaled_mm_4x128x1024_1.0_3.0_0.0_lx_planning_reduction
            - SolverRelayout.*::test_fp8_scaled_mm_4x128x1024_2.0_1.0_0.0_lx_planning_reduction
            - SolverRelayout.*::test_fp8_scaled_mm_4x128x1024_2.0_3.0_0.0_lx_planning_reduction
            - SolverRelayout.*::test_fp8_scaled_mm_4x128x1024_2.0_3.0_0.5_lx_planning_reduction
          mode: xfail
        # Known LX-planning failures for the large-matmul variants. Kept in a
        # separate xfail entry so they carry the slow__plat_* tags: a variant
        # resolves to exactly one entry, so the slow tags MUST live on the
        # entry the variant selects (the first matching entry, which for these
        # tagless names is this xfail entry) or --skip-slow cannot deselect
        # them. Without the tags here, --skip-slow left these ~1 hour tests
        # running on ppc64le and s390x.
        - names:
            - SolverRelayout.*::test_large_matmul_matmul_2d_M2048_K2048_N65536_lx_planning_reduction
          mode: xfail
          tags:
            - ops__inductor-matmul
            - slow__plat_ppc64
            - slow__plat_s390x
        - names:
            - SolverRelayout.*::test_(addmm|mm|bmm|einsum|matmul|linear).*_lx_planning_reduction
          mode: mandatory_success
          tags:
            - ops__inductor-matmul
        - names:
            - SolverRelayout.*::test_large_matmul.*_lx_planning_reduction
          mode: mandatory_success
          tags:
            - ops__inductor-matmul
            - slow__plat_ppc64
            - slow__plat_s390x
