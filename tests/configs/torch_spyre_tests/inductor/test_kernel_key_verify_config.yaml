# The transpose-edge tests with the kernel cache on and every stored kernel key
# checked against a computed one (precomputed_kernel_key="verify"). Catches a
# kernel-cache key input that kernel_key_fingerprint() does not cover.
test_suite_config:
  labels: [unit, regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_kernel_key_verify.py
      unlisted_test_mode: mandatory_success
