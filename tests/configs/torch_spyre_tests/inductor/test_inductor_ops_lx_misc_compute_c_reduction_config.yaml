# LX-planning shard: inductor_ops family 'misc_compute_c' (reduction wrap).
#
# The attention/sdpa/rope/qkv tests compile slowly (70-120s per sdpa test) and run
# once per wrap class, which made one ~21 minute job. The family is split by wrap
# class for CI wall-clock balance: this file runs the reduction wrap
# (LxPlanningTwoOpReductionTest,
# 'torch.sum(x, dim=0)'); test_inductor_ops_lx_misc_compute_c_pointwise_config.yaml
# runs the other. Each half is about 9-10 minutes.
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). The xfail lists below are
# the source of truth for known LX-planning failures (the in-file .py
# skip-lists were removed as duplicates).
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        - names:
            - LxPlanning.*::test_attention.*_lx_planning_reduction
            - LxPlanning.*::test_sdpa.*_lx_planning_reduction
            - LxPlanning.*::test_rope_fms.*_lx_planning_reduction
            - LxPlanning.*::test_qkv_attn_paths_fms.*_lx_planning_reduction
          mode: mandatory_success
