# LX-planning shard: inductor_ops family 'reduction_index_b', the pointwise-addition wrap ((x + x) / 2) -- LxPlanningTwoOpPointwiseAdditionTest.
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). Tests that were previously
# skipped via the in-file skip-lists are marked xfail here instead.
test_suite_config:
  labels: [core, full]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        - names:
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_aminmax_keepdim.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_sum_keepdim0.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_sum_keepdim1.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_mean_keepdim0.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_mean_keepdim1.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_vector_norm_keepdim.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_matrix_norm_keepdim.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_linalg_norm_keepdim.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_argmin_keepdim0.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_min_tuple_output_keepdim0.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_logsumexp_keepdim0_known_xfail.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_mean_3d_dim0_keepdim.*_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_index_copy_.*_lx_planning_pointwise
          mode: mandatory_success
