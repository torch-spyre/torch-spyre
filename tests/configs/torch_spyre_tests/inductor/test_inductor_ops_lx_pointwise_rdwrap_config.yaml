# LX-planning shard: inductor_ops family 'pointwise', the sum-reduction wrap (torch.sum(x, dim=0)) -- LxPlanningTwoOpReductionTest.
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). Tests that were previously
# skipped via the in-file skip-lists are marked xfail here instead.
test_suite_config:
  labels: [core, full]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        # Former skip-list entries (in-file POINTWISE/REDUCTION_TEST_FAILURES) now run and are
        # expected to fail. Non-strict xfail: an unexpected pass (XPASS) does not fail CI.
        - names:
            - LxPlanningTwoOpReductionTest.*::test_alias_operands_cube_67x256_lx_planning_reduction
            - LxPlanningTwoOpReductionTest.*::test_alias_operands_cube_67x71x256_lx_planning_reduction
            - LxPlanningTwoOpReductionTest.*::test_alias_operands_double_67x71x256_lx_planning_reduction
            - LxPlanningTwoOpReductionTest.*::test_alias_operands_triple_67x256_lx_planning_reduction
            - LxPlanningTwoOpReductionTest.*::test_alias_operands_triple_67x71x256_lx_planning_reduction
            - LxPlanningTwoOpReductionTest.*::test_pointwise_binary_op_div_67x256_67x256_lx_planning_reduction
            - LxPlanningTwoOpReductionTest.*::test_pointwise_binary_op_div_67x71x256_67x71x256_lx_planning_reduction
            - LxPlanningTwoOpReductionTest.*::test_pointwise_range_op_clamp_fp16_lx_planning_reduction
            - LxPlanningTwoOpReductionTest.*::test_pointwise_unary_op_reciprocal_67x71x256_lx_planning_reduction
          mode: xfail
        - names:
            - LxPlanningTwoOpReductionTest.*::test_(pointwise|sqrt|rsqrt|log_|alias_operands|cmp|logical_not|bool|eq_scalar|scalar_(comparison|multidim|vs_tensor)_base|scalar_comparison_simple1|eq_scalar_constant_int).*_lx_planning_reduction
          mode: mandatory_success
          tags:
            - ops__inductor-pointwise
