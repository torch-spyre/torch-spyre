test_suite_config:
  # 9.6 min as one job (run 41202882088); split so each shard is ~4.8 min.
  shards: 2
  labels: [unit, regression, integration, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops.py
      unlisted_test_mode: skip
      tests:
        - names:
            # k_expr: test_addmm or test_mm_ or test_bmm or test_einsum
            #         or test_matmul or test_large_matmul or test_linear
            #
            - TestOps::test_(addmm|mm|bmm|einsum|matmul|linear).*
            - TestOps::test_fp8_scaled_mm.*
            - TestOps::test_fp8_scaled_bmm.*
            - TestOps::test_fp8_chained_scaled_mm.*
            - TestOps::test_fp8_3d_activation_reshape.*
          mode: mandatory_success
          tags:
            - ops__inductor-matmul
        - names:
            - TestOps::test_large_matmul.*
          mode: mandatory_success
          tags:
            - ops__inductor-matmul
        - names:
            - TestOps::test_grouped_mm.*
          mode: mandatory_success
          tags:
            - ops__inductor-matmul
