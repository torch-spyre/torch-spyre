# Misc shape shard C: concat and pad tests.
#
# Split out from shard A to reduce per-job CI time.  Shard A covers tensor
# factory, copy/clone, and slice/split.  Shard B covers shape ops,
# squeeze/unsqueeze, t/transpose, dtype conversion, and restickify.
#
# When a new test is added to test_inductor_ops.py that belongs in the misc
# shape group, assign it to whichever shard keeps the jobs balanced.

test_suite_config:
  labels: [unit, regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops.py
      unlisted_test_mode: skip
      tests:
        - names:
            # concat / pad
            - TestOps::test_cat.*
            - TestOps::test_pad.*
            - TestOps::test_keep_by_index_2d_dim0
            - TestOps::test_keep_by_index_3d_dim0
            - TestOps::test_keep_by_index_4d_dim0
            - TestOps::test_keep_by_index_moe_router
          mode: mandatory_success
          tags:
            - ops__inductor_misc_shape
        # Backend regression: these cases fail their correctness check.
        # Remove this block when https://github.com/torch-spyre/torch-spyre/issues/5950
        # is fixed.
        - names:
            - TestOps::test_keep_by_index_2d_dim1
            - TestOps::test_keep_by_index_4d_dim2
          mode: xfail  # xfail: AssertionError, #5950
          tags:
            - ops__inductor_misc_shape
