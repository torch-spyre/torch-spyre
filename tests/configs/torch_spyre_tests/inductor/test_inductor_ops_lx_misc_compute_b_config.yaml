# LX-planning shard: inductor_ops family 'misc_compute_b', both wrap classes
# (LxPlanningTwoOpPointwiseAdditionTest '(x + x) / 2' and
#  LxPlanningTwoOpReductionTest 'torch.sum(x, dim=0)').
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). Known LX-planning failures are
# listed as `mode: xfail_strict` blocks (none at present; the in-file .py
# skip-lists were removed as duplicates).
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and must fail (strict). An
        # unexpected pass (XPASS) fails CI so fixed bugs are noticed. Entries
        # failing in both wraps collapse to (pointwise|reduction).
        - names:
            # fp16_fp32_1d256: mixed EA, stick reordering unsupported (#TODO:
            # remove when multi-arg pointwise with mixed EA is supported)
            - LxPlanning.*::test_div_mixed_dtype_true_div_fp16_fp32_1d256_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_div_mixed_dtype_floor_div_fp16_fp32_1d256_lx_planning_(pointwise|reduction)
          mode: xfail_strict
        - names:
            - LxPlanning.*::test_layernorm.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_rmsnorm.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_softmax.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_softplus.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_embedding.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_isin.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_inplace_copy.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_inplace_op.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_bitwise_and.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_bitwise_not.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_dropout_functional.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_fallback.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_fill_scalar.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_implicit_loading.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_is_nonzero.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_item.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_log_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_mean_3d_dim0_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_mean_3d_dim1_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_mean_default.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_normal_randn_cpu.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_compiled_randn_fallback_cpu.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_overwrite.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_tril.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_triu.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_uniform_cpu.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_uniform_custom_range_cpu.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_random_from_cpu.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_where.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_restickify_add_transpose.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_restickify_clone.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_prod.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_div_rounding_mode_floor_fp16_rand_2d_lx_planning_(pointwise|reduction)
