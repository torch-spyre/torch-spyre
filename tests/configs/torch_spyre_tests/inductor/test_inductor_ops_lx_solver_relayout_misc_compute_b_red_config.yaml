# Solver-relayout sweep shard: mirrors test_inductor_ops_lx_misc_compute_b_config.yaml but runs
# Split by wrap suffix so each shard fits the 60 minute job budget: the
# CP-SAT co-optimizing configuration compiles roughly 2.5x slower per test
# than the greedy LX shards this file mirrors. The split keys on the
# _lx_planning_{pointwise,reduction} METHOD suffix: the OOT runner strips
# the ClassName:: prefix from `names:` entries and matches bare method
# names, so a class-name split does not select anything.
# tests/inductor/test_inductor_ops_lx_solver_relayout.py, the LX-planning
# wrap re-wrapped with layout_solver=cpsat, co_optimizing_lx_planning=True
# and lx_solver_relayout=True. The xfail floor is inherited from the
# LX-planning shard; deltas found by this sweep are appended per shard.
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_solver_relayout.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            - SolverRelayout.*::test_restickify_add_transpose_10x20_add_transpose_lx_planning_reduction
            - SolverRelayout.*::test_restickify_add_transpose_64x129_add_transpose_lx_planning_reduction
            - SolverRelayout.*::test_restickify_add_transpose_7x13_add_transpose_lx_planning_reduction
          mode: xfail
        - names:
            - SolverRelayout.*::test_layernorm.*_lx_planning_reduction
            - SolverRelayout.*::test_rmsnorm.*_lx_planning_reduction
            - SolverRelayout.*::test_softmax.*_lx_planning_reduction
            - SolverRelayout.*::test_softplus.*_lx_planning_reduction
            - SolverRelayout.*::test_embedding.*_lx_planning_reduction
            - SolverRelayout.*::test_isin.*_lx_planning_reduction
            - SolverRelayout.*::test_inplace_copy.*_lx_planning_reduction
            - SolverRelayout.*::test_inplace_op.*_lx_planning_reduction
            - SolverRelayout.*::test_bitwise_and.*_lx_planning_reduction
            - SolverRelayout.*::test_bitwise_not.*_lx_planning_reduction
            - SolverRelayout.*::test_dropout_functional.*_lx_planning_reduction
            - SolverRelayout.*::test_fallback.*_lx_planning_reduction
            - SolverRelayout.*::test_fill_scalar.*_lx_planning_reduction
            - SolverRelayout.*::test_implicit_loading.*_lx_planning_reduction
            - SolverRelayout.*::test_is_nonzero.*_lx_planning_reduction
            - SolverRelayout.*::test_item.*_lx_planning_reduction
            - SolverRelayout.*::test_log_lx_planning_reduction
            - SolverRelayout.*::test_mean_3d_dim0_lx_planning_reduction
            - SolverRelayout.*::test_mean_3d_dim1_lx_planning_reduction
            - SolverRelayout.*::test_mean_default.*_lx_planning_reduction
            - SolverRelayout.*::test_normal_randn_cpu.*_lx_planning_reduction
            - SolverRelayout.*::test_overwrite.*_lx_planning_reduction
            - SolverRelayout.*::test_tril.*_lx_planning_reduction
            - SolverRelayout.*::test_triu.*_lx_planning_reduction
            - SolverRelayout.*::test_uniform_cpu.*_lx_planning_reduction
            - SolverRelayout.*::test_uniform_custom_range_cpu.*_lx_planning_reduction
            - SolverRelayout.*::test_random_from_cpu.*_lx_planning_reduction
            - SolverRelayout.*::test_where.*_lx_planning_reduction
            - SolverRelayout.*::test_core_reduction_invalid_dims_api.*_lx_planning_reduction
            - SolverRelayout.*::test_core_reduction_invalid_dims_spyre.*_lx_planning_reduction
            - SolverRelayout.*::test_single_dim_reduction_invalid_dims_api.*_lx_planning_reduction
            - SolverRelayout.*::test_single_dim_reduction_invalid_dims_spyre.*_lx_planning_reduction
            - SolverRelayout.*::test_restickify_add_transpose.*_lx_planning_reduction
            - SolverRelayout.*::test_prod.*_lx_planning_reduction
          mode: mandatory_success
