# LX-planning shard: inductor_ops family 'reduction_scalar', the pointwise-addition wrap ((x + x) / 2) -- LxPlanningTwoOpPointwiseAdditionTest.
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). Tests that were previously
# skipped via the in-file skip-lists are marked xfail here instead.
test_suite_config:
  labels: [core, full]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        # Former skip-list entries (in-file POINTWISE/REDUCTION_TEST_FAILURES) now run and are
        # expected to fail. Non-strict xfail: an unexpected pass (XPASS) does not fail CI.
        - names:
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_conv2d_1x3x32_ksize3_no_pad_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_conv2d_1x64_ksize3_depthwise_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_conv2d_2x32_ksize1_stride2_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_conv2d_2x3x32_ksize1_lx_planning_pointwise
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_conv2d_mistral_model_lx_planning_pointwise
          mode: xfail
        - names:
            - LxPlanningTwoOpPointwiseAdditionTest.*::test_(all_dim|any_dim|count_nonzero|cummax|cummin|cumprod|logcumsumexp|max_default|median|mode_|nanmean|nanmedian|nanquantile|nansum|quantile|std_|topk|conv2d|var_).*_lx_planning_pointwise
          mode: mandatory_success
          tags:
            - ops__inductor-reduction
