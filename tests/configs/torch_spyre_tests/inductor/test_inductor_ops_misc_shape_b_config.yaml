# Misc shape shard B: shape ops, squeeze/unsqueeze, t/transpose, dtype
# conversion, and restickify.
#
# Pair with test_inductor_ops_misc_shape_a_config.yaml which covers tensor
# factory, copy/clone, and concat/split/slice/pad.  Together they replace the
# former test_inductor_ops_misc_shape_config.yaml.
#
# When a new test is added to test_inductor_ops.py that belongs in the misc
# shape group, assign it to whichever shard keeps the two jobs balanced.

test_suite_config:
  labels: [unit, regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops.py
      unlisted_test_mode: skip
      tests:
        # unbind along the stick dim gives a wrong value: each output is a
        # sub-stick slice, which DMA cannot move since flex #2061 (whole 128B
        # flits only), so the copy back picks up neighbouring elements.
        # Tracked by flex #2083 (sub-stick DMA transfers); remove when it
        # lands. Non-strict because the outcome depends on the flex build:
        # flex without #2061 still passes these. Exact names are matched
        # before the test_unbind.* pattern below.
        - names:
            - TestOps::test_unbind_1d_dim0
            - TestOps::test_unbind_2d_dim1
            - TestOps::test_unbind_2d_dimneg1
            - TestOps::test_unbind_3d_dim2
            - TestOps::test_unbind_3d_dimneg1
            - TestOps::test_unbind_4d_dim3
          mode: xfail
          tags:
            - ops__inductor_misc_shape
        - names:
            # shape ops
            - TestOps::test_flatten.*
            # flip: non-stick dims reverse via index_select; the stick-dim
            # cases are skipped inside the test: they fault the card
            - TestOps::test_flip.*
            - TestOps::test_permute.*
            - TestOps::test_unbind.*
            - TestOps::test_size_one.*
            - TestOps::test_unfold.*
            # squeeze covers test_squeeze and test_squeeze_reduction
            - TestOps::test_squeeze.*
            # unsqueeze covers test_unsqueeze and test_unsqueeze_broadcast
            - TestOps::test_unsqueeze.*
            # t / transpose — each prefix covers the contiguous variant too
            - TestOps::test_t_1d.*
            - TestOps::test_t_2d.*
            - TestOps::test_transpose_2d.*
            - TestOps::test_transpose_3d.*
            - TestOps::test_transpose_4d.*
            - TestOps::test_transpose_patterns.*
            # dtype conversion — test_to_dtype.* covers test_to_dtype_op_map too
            - TestOps::test_to_dtype.*
            - TestOps::test_round_trip_to_dtype.*
            - TestOps::test_reduction_with_to_dtype.*
            - TestOps::test_float32_to_int_(truncates|saturates).*
            - TestOps::test_float16_to_int_.*
            - TestOps::test_int_to_(float16|bool)_.*
            - TestOps::test_int32_int64_.*
            - TestOps::test_gather_staggered_index_amax.*
            - TestOps::test_trunc_.*
            - TestOps::test_add_constant.*
            - TestOps::test_repeat.*
            # multiops split test
            - TestOps::test_multiops_split.*
          mode: mandatory_success
          tags:
            - ops__inductor_misc_shape
