# LX-planning shard: inductor_ops family 'pointwise' (part a: all but
# test_cmp.*), both wrap classes
# (LxPlanningTwoOpPointwiseAdditionTest '(x + x) / 2' and
#  LxPlanningTwoOpReductionTest 'torch.sum(x, dim=0)').
#
# Auto-split of test_inductor_ops_lx_planning.py, mirroring the
# test_inductor_ops.py config sharding. The full (non-truncated) test
# set is enabled in CI via TEST_LX_PLANNING_FULL=1 + TEST_LX_PLANNING_RUN_SKIPS=1
# (see .github/workflows/_test_matrix.yaml). The xfail lists below are
# the source of truth for known LX-planning failures (the in-file .py
# skip-lists were removed as duplicates).
#
# The 'pointwise' family is split in two for CI wall-clock balance: the
# test_cmp.* group alone is ~2/3 of the tests and ~half the runtime, so it
# lives in test_inductor_ops_lx_pointwise_b_config.yaml.
test_suite_config:
  labels: [regression, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops_lx_planning.py
      unlisted_test_mode: skip
      tests:
        # Known LX-planning failures -- run and expected to fail. Non-strict
        # xfail: an unexpected pass (XPASS) does not fail CI. Entries failing
        # in both wraps collapse to (pointwise|reduction).
        - names:
            - LxPlanning.*::test_pointwise_binary_op_div_67x71x256_67x71x256_lx_planning_reduction
          mode: xfail
        - names:
            - LxPlanning.*::test_(pointwise|sqrt|rsqrt|log_|pow_|alias_operands|logical_not|bool|eq_scalar|scalar_(comparison|multidim|vs_tensor)_base|scalar_comparison_simple1|eq_scalar_constant_int).*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_binary_op_stick_crossing_last_dim_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_exp_fp16.*_lx_planning_(pointwise|reduction)
            - LxPlanning.*::test_exp_fp32.*_lx_planning_(pointwise|reduction)
          mode: mandatory_success
          tags:
            - ops__inductor-pointwise
