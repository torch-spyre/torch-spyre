test_suite_config:
  # Selected by the "integration" tier, which is what a Flex PR run executes
  # (preset trigger-pr-validation: torch-spyre-dev -> smoke + integration).
  # "regression" and "trunk" keep it in the wider runs. See the module docstring
  # in tests/profiler/test_flex_pr_profiling.py.
  labels: [regression, integration, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/profiler/test_flex_pr_profiling.py
      unlisted_test_mode: mandatory_success
