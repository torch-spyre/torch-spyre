test_suite_config:
  labels: [trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/profiler/test_spyre_profiler.py
      unlisted_test_mode: mandatory_success
      tests:
        # Temporarily skipped: UnicodeDecodeError from a garbage kernel-event
        # name, traced to an ABI/stride mismatch between libaiupti (struct grew
        # +40 bytes in libaiupti #114) and the AIUPTI/Kineto bridge built into
        # torch_spyre. Re-enable once they are rebuilt against a matching ABI.
        - names: [TestSpyreProfiler::test_basic_profile]
          mode: mandatory_success
        # Listed explicitly so the config-coverage checker (CHECK 2) sees full
        # coverage once this file has an explicit tests: list. These run normally.
        - names:
            - TestSpyreProfiler::test_event_list
            - TestSpyreProfiler::test_profiler_timestamp_consistency
          mode: mandatory_success
        - names:
            - TestMemoryProfilerTimeline::test_memory_timeline_no_id_spyre
            - TestMemoryProfilerTimeline::test_memory_timeline_no_id_cpu
          mode: mandatory_success
        - names:
            - TestOverExtendedKernelDurations::test_find_over_extended_activities
            - TestOverExtendedKernelDurations::test_find_over_extended_activities_invalid_events
            - TestOverExtendedKernelDurations::test_activity_duration_limit
            - test_find_device_overlaps
            - test_find_device_overlaps_invalid_events
            - test_kernel_time_overlap
            - test_trace_analyzer_device_overlap
          mode: mandatory_success
