test_suite_config:
  labels: [unit, regression, integration, trunk]
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/tensor/test_tensor_layout.py
      # The classes in this OOT-native file are decorated with
      # @instantiate_parametrized_tests, so run_test.sh does NOT inject
      # instantiate_device_type_tests for them, even though they mix parametrized
      # and plain test methods. The wrapper is not generated and pytest collects
      # the original classes directly.
      unlisted_test_mode: mandatory_success
