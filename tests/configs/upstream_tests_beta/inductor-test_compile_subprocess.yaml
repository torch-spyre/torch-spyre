test_suite_config:
  labels: [trunk]

  files:
    - path: ${TORCH_ROOT}/test/inductor/test_compile_subprocess.py
      unlisted_test_mode: skip
      tests:
        # This test exercises subprocess management and asynchronous operations, which are not dependent on specific PyTorch operations or data types.
        # It is classified as mandatory_success because it does not interact with the torch-spyre layer, focusing on subprocess handling.
        # Relevant Spyre capabilities are not engaged, as the test is purely about subprocess management and not about tensor operations or data types.
        - names:
            - TestSubprocess::test_async
          mode: mandatory_success
        # These tests exercise subprocess management and do not interact with the torch-spyre layer.
        # They are classified as 'skip' because they do not require any Spyre-specific capabilities.
        # The primary limitation is the absence of a 'device' argument in the test methods.
        - names:
            - TestSubprocess::test_progressive
          mode: skip  # does not engage the torch-spyre layer

  global:
