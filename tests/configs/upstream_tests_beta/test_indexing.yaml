test_suite_config:
  labels: [trunk]
  files:
    - path: ${TORCH_ROOT}/test/test_indexing.py
      unlisted_test_mode: skip
      tests:
        # ---------------------------------------------------------------------------
        # General indexing behavior: boundary checks, error handling, basic semantics.
        # These tests validate the fundamental __getitem__/__setitem__ interface
        # that Spyre supports regardless of indirect access implementation.
        # Tests in this group raise errors at Python / ATen dispatch layer before
        # reaching any device kernel.
        # ---------------------------------------------------------------------------
        - names:
            - NumpyTests::test_everything_returns_views
            - NumpyTests::test_index_no_floats
            - NumpyTests::test_none_index
            - NumpyTests::test_truncate_leading_1s
            - TestIndexing::test_empty_slice
            - TestIndexing::test_index_put_accumulate_empty
            - TestIndexing::test_invalid_index
            - TestIndexing::test_multiple_int
            - TestIndexing::test_none
            - TestIndexing::test_out_of_bound_index
            - TestIndexing::test_setitem_expansion_error
            - TestIndexing::test_single_int
            - TestIndexing::test_unravel_index_errors
            - TestIndexing::test_zero_dim_index
          mode: mandatory_success
        # Upstream regression: test_boolean_assignment_value_mismatch now fails on the Spyre
        # backend. The int64->float32 dtype cast lowers to spyre.to_dtype_cpu, whose output
        # FallbackKernel lacks a FixedTiledLayout, raising torch._inductor.exc.InductorError.
        - names:
            - NumpyTests::test_boolean_assignment_value_mismatch
          mode: skip  # skip: InductorError (missing FixedTiledLayout) on upstream PyTorch bump

        # The slice itself succeeds; the assertEqual that follows compares int64 tensors and
        # compile fails with "abs on DataFormats.IEEE_INT32".
        # No open issue yet: https://github.com/torch-spyre/torch-spyre/issues/6199
        - names:
            - TestIndexing::test_step  # issue 6199
            - TestIndexing::test_variable_slicing  # issue 6199
            - NumpyTests::test_empty_tuple_index  # issue 6199
            - NumpyTests::test_ellipsis_index  # issue 6199
            - NumpyTests::test_single_int_index  # issue 6199
            - NumpyTests::test_single_bool_index  # issue 6199
          mode: xfail  # xfail: Spyre backend does not support: abs on DataFormats.IEEE_INT32

        # ---------------------------------------------------------------------------
        # torch.Tensor.__setitem__ with step slices and integer row assignment.
        # These use slice_scatter and basic row setitem — NOT tensor-index indirect
        # access. Both die on copy_from_d2d of a sliced view whose storage_offset is
        # not stick-aligned (test_step_assignment: float32, offset 1;
        # test_int_assignment: int64, offset 2).
        # Covered by https://github.com/torch-spyre/torch-spyre/issues/4329
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_step_assignment  # issue 4329
            - TestIndexing::test_int_assignment  # issue 4329
          mode: xfail  # xfail: copy_from_d2d sliced view requires stick-aligned storage_offset

        # ===========================================================================
        # INDIRECT ACCESS — ALL tests below exercise tensor-index-mediated memory
        # access.
        # ===========================================================================

        # ---------------------------------------------------------------------------
        # aten::index.Tensor — indirect read via tensor index
        # The first failure in these two is the assertEqual that follows the index:
        # aten::isnan (https://github.com/torch-spyre/torch-spyre/issues/1738)
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_index  # issue 1738
            - TestIndexing::test_advancedindex  # issue 1738
          mode: xfail  # xfail: aten::isnan not registered

        # These two raised before aten::index.Tensor gained the x[index] kernel and now
        # pass on the latest image (confirmed locally with the normal run and --runxfail).
        - names:
            - TestIndexing::test_advancedindex_big
            - TestIndexing::test_index_getitem_copy_bools_slices
          mode: mandatory_success

        # ---------------------------------------------------------------------------
        # Advanced (fancy) indexing with a list of index tensors, a bool/byte mask, or an
        # index on a dim other than 0. Spyre aten::index.Tensor implements only
        # x[index] with a single 1-D int32/int64 index tensor on dim 0 and raises
        # NotImplementedError for every other form. Covered by the open request to
        # implement index.Tensor with a list of index tensors:
        # https://github.com/torch-spyre/torch-spyre/issues/1219
        # Bool/byte masks additionally need aten::nonzero (#4498).
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_int_indices  # issue 1219
            - TestIndexing::test_int_indices2d  # issue 1219
            - TestIndexing::test_int_indices_broadcast  # issue 1219
            - TestIndexing::test_list_indices  # issue 1219
            - TestIndexing::test_basic_advanced_combined  # issue 1219
            - TestIndexing::test_ellipsis_tensor  # issue 1219
            - TestIndexing::test_bool_indices  # issue 1219, 4498
            - TestIndexing::test_bool_indices_accumulate  # issue 1219, 4498
            - TestIndexing::test_multiple_bool_indices  # issue 1219, 4498
            - TestIndexing::test_multi_dimensional_bool_mask  # issue 1219, 4498
            - TestIndexing::test_byte_mask  # issue 1219, 4498
            - TestIndexing::test_byte_mask_accumulate  # issue 1219, 4498
            - TestIndexing::test_multiple_byte_mask  # issue 1219, 4498
          mode: xfail  # xfail: Spyre aten::index.Tensor supports only x[index] with a single 1-D int32/int64 index tensor on dim 0

        # Skipped, not xfail: this test puts the Spyre runtime stream into an error state
        # ([flex_runtime_stream] ERRR) even though it is reported as XFAIL. Every later test
        # that touches the device then fails with "StreamInErrorState: cannot launch H2D"
        # (e.g. test_index_tensor_empty_indices, test_invalid_index, test_single_int).
        # The mask-indexing form it uses is the one in
        # https://github.com/torch-spyre/torch-spyre/issues/1219
        - names:
            - TestIndexing::test_index_scalar_with_bool_mask  # issue 1219
          mode: skip  # skip: corrupts runtime stream (StreamInErrorState) for later tests

        - names:
            - TestIndexing::test_bool_mask_assignment  # issue 692
            - TestIndexing::test_multi_dimensional_bool_mask_assignment  # issue 692
            - TestIndexing::test_byte_tensor_assignment  # issue 692
          mode: xfail  # xfail: aten::_index_put_impl_ not registered

        # assertEqual → isclose → aten::isnan. Covered by
        # https://github.com/torch-spyre/torch-spyre/issues/1738
        - names:
            - TestIndexing::test_index_setitem_bools_slices  # issue 1738
          mode: xfail  # xfail: aten::isnan not registered

        # Dies on (c > 0).sum() before v[c > 0]: compile fails with "unexpected argument
        # PointwiseOp(op='identity' ... torch.bool ... to fp32t". The bool→int64 sum is the
        # request in https://github.com/torch-spyre/torch-spyre/issues/461
        - names:
            - TestIndexing::test_byte_mask2d  # issue 461
          mode: xfail  # xfail: unexpected argument PointwiseOp(op='identity') on torch.bool input

        # ---------------------------------------------------------------------------
        # aten::index_put / index_put_ — indirect write via tensor index
        # YAML first abort: aten::_index_put_impl_ — already #692.
        # https://github.com/torch-spyre/torch-spyre/issues/692
        # test_index_src_datatype is a READ followed by a write; the first failure
        # differs per dtype, so each has its own entry:
        #   bfloat16 / float32 / int64 — aten::_index_put_impl_ (#692)
        #   bool — Spyre aten::index.Tensor does not support bool source tensors (#6043)
        # Upstream dtype coverage:
        #   test_index_put_accumulate_large_tensor  no @dtypes — runs once
        #   test_index_put_src_datatype @dtypes(float16, float32, int8, int16, int32, int64, bfloat16)
        #     excluded: int8, int16, int32 (not in supported_dtypes); active: float16, int64, bfloat16
        #   test_index_src_datatype     same @dtypes set; same exclusions apply
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_index_src_datatype  # issue 6043
          mode: xfail  # xfail: Spyre aten::index.Tensor does not support bool source tensors
          edits:
            dtypes:
              include:
                - name: bool

        - names:
            - TestIndexing::test_index_src_datatype  # issue 692
          mode: xfail  # xfail: aten::_index_put_impl_ not registered

        - names:
            - TestIndexing::test_index_put_accumulate_large_tensor  # issue 692
            - TestIndexing::test_index_put_src_datatype  # issue 692
          mode: xfail  # xfail: aten::_index_put_impl_ not registered

        # ---------------------------------------------------------------------------
        # torch.take_along_dim — gather along a dimension using an index tensor
        # YAML first abort is aten::sort.values_stable.
        # Upstream dtype coverage:
        #   test_take_along_dim         @dtypes(long, float32) active; float64 excluded
        #   test_take_along_dim_invalid @dtypes(long, float) — validates API contract
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_take_along_dim  # issue 4500
            - TestIndexing::test_take_along_dim_invalid  # issue 4500
          mode: xfail  # xfail: aten::sort.values_stable not registered

        # ---------------------------------------------------------------------------
        # torch.index_reduce_ — scatter-reduce via index tensor
        # Dies on dest.clone() of a noncontig view (storage_offset=1) before
        # index_reduce_. Same copy_from_d2d stick-aligned offset as embedding.
        # Covered by https://github.com/torch-spyre/torch-spyre/issues/4329
        # @parametrize("reduce", ["prod","amin","amax","mean"])
        # Upstream dtype coverage: @dtypes(*all_types_and(torch.half, torch.bfloat16))
        # Active after filter: float16, int64, bfloat16; excluded: float64, int8/16/32, uint8
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_index_reduce  # issue 4329
          mode: xfail  # xfail: copy_from_d2d sliced view requires stick-aligned storage_offset

        # ---------------------------------------------------------------------------
        # torch.index_copy / index_copy_ — indirect write at indexed positions
        # test_index_copy: aten::randperm.generator_out (#4499) in setup.
        # test_index_copy_scalars: bool fails on the bool result from IEEE_INT32
        # (#4332); the other dtypes pass. The bool entry is listed first so it is
        # selected before the entry with no dtype restriction.
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_index_copy  # issue 4499
          mode: xfail  # xfail: aten::randperm.generator_out not registered

        - names:
            - TestIndexing::test_index_copy_scalars  # issue 4332
          mode: xfail  # xfail: torch.bool result from operands with device format IEEE_INT32
          edits:
            dtypes:
              include:
                - name: bool

        - names:
            - TestIndexing::test_index_copy_scalars
          mode: mandatory_success

        # test_index_copy_deterministic: x0[index,:,:] = src dies on copy_from_d2d
        # dest offset 9552 (fp32, not a multiple of 32). Covered by
        # https://github.com/torch-spyre/torch-spyre/issues/4329
        - names:
            - TestIndexing::test_index_copy_deterministic  # issue 4329
          mode: xfail  # xfail: copy_from_d2d sliced view requires stick-aligned storage_offset

        # ---------------------------------------------------------------------------
        # torch.index_fill / index_fill_ — fill values at indexed positions
        # YAML first abort is eager aten::index_fill_.int_Scalar (#4414).
        # https://github.com/torch-spyre/torch-spyre/issues/4414
        # Upstream dtype coverage:
        #   @dtypes(*all_types_and_complex_and(torch.half, torch.bool, torch.bfloat16))
        #   Active after filter: float16, int64, bfloat16, bool
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_index_fill  # issue 4414
          mode: xfail  # xfail: aten::index_fill_.int_Scalar not registered

        # ---------------------------------------------------------------------------
        # torch.index_select — selects along a dimension using an index tensor
        # The first error differs per dtype, so each dtype group has its own entry:
        #   float16 / float32 / int64 — copy_from_d2d storage_offset 1  (#4329)
        #   bool — torch.bool from IEEE_INT32  (#4332)
        #   bfloat16 — aten::isnan in assertEqual  (#1738)
        # @onlyNativeDeviceTypes: privateuse1 IS treated as native — collected on Spyre.
        # Upstream dtype coverage:
        #   @dtypes(*all_types_complex_float8_and(torch.half, torch.bool, torch.bfloat16))
        #   Active after filter: float16, float32, int64, bfloat16, bool
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_index_select  # issue 4329
          mode: xfail  # xfail: copy_from_d2d sliced view requires stick-aligned storage_offset
          edits:
            dtypes:
              include:
                - name: float16
                - name: float32
                - name: int64

        - names:
            - TestIndexing::test_index_select  # issue 4332
          mode: xfail  # xfail: torch.bool result from operands with device format IEEE_INT32
          edits:
            dtypes:
              include:
                - name: bool

        - names:
            - TestIndexing::test_index_select  # issue 1738
          mode: xfail  # xfail: aten::isnan not registered
          edits:
            dtypes:
              include:
                - name: bfloat16

        # ---------------------------------------------------------------------------
        # NumpyTests — integer fancy indexing
        # test_empty_fancy_index: fills an empty tensor (RuntimeError, https://github.com/torch-spyre/torch-spyre/issues/6268)
        # test_index_is_larger / test_broadcast_subspace: _index_put_impl_ (#692)
        # ---------------------------------------------------------------------------
        - names:
            - NumpyTests::test_empty_fancy_index  # issue 6268
          mode: xfail  # xfail: RuntimeError: spyre_fill_tensor: cannot fill empty tensor

        - names:
            - NumpyTests::test_index_is_larger  # issue 692
            - NumpyTests::test_broadcast_subspace  # issue 692
          mode: xfail  # xfail: aten::_index_put_impl_ not registered

        # Dies on ind[-1] = 10 (offset=19) before the IndexError check.
        # Covered by https://github.com/torch-spyre/torch-spyre/issues/4329
        - names:
            - NumpyTests::test_trivial_fancy_out_of_bounds  # issue 4329
          mode: xfail  # xfail: copy_from_d2d sliced view requires stick-aligned storage_offset

        # ---------------------------------------------------------------------------
        # NumpyTests — boolean mask indexing
        # Mask / list indexing is the x[index] subset limit (#1219), plus aten::nonzero
        # (#4498) for the bool forms. test_broaderrors_indexing hits the same limit
        # before it reaches _index_put_impl_.
        # ---------------------------------------------------------------------------
        - names:
            - NumpyTests::test_boolean_indexing_weirdness  # issue 1219
            - NumpyTests::test_boolean_indexing_weirdness_tensors  # issue 1219
            - NumpyTests::test_boolean_indexing_alldims  # issue 1219
            - NumpyTests::test_broaderrors_indexing  # issue 1219
            - NumpyTests::test_boolean_indexing_onedim  # issue 1219, 4498
            - NumpyTests::test_boolean_indexing_twodim  # issue 1219, 4498
            - NumpyTests::test_boolean_list_indexing  # issue 1219, 4498
          mode: xfail  # xfail: Spyre aten::index.Tensor supports only x[index] with a single 1-D int32/int64 index tensor on dim 0

        # ---------------------------------------------------------------------------
        # Error-type validation. CPU raises IndexError / RuntimeError from its own argument
        # checks; Spyre's aten::index.Tensor raises NotImplementedError first, so the
        # expected exception type is wrong. No open issue yet: https://github.com/torch-spyre/torch-spyre/issues/6204
        # ---------------------------------------------------------------------------
        - names:
            - NumpyTests::test_boolean_shape_mismatch  # issue 6204
            - TestIndexing::test_index_tensor_empty_indices  # issue 6204
          mode: xfail  # xfail: NotImplementedError raised where IndexError is expected

        - names:
            - TestIndexing::test_empty_ndim_index_bool
            - TestIndexing::test_index_limits
          mode: mandatory_success

        # ---------------------------------------------------------------------------
        # aten::index.Tensor extended edge cases
        # test_empty_ndim_index: x[index] subset limit (#1219).
        # test_empty_index: compile fails on a stick expression (3*d0 + d1), same family
        # as https://github.com/torch-spyre/torch-spyre/issues/3454
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_empty_ndim_index  # issue 1219
          mode: xfail  # xfail: Spyre aten::index.Tensor supports only x[index] with a single 1-D int32/int64 index tensor on dim 0

        - names:
            - TestIndexing::test_empty_index  # issue 3454
          mode: xfail  # xfail: Unexpected stick expression 3*d0 + d1

        # assertEqual(a[0], a[zero]) → isclose → aten::isnan. Covered by
        # https://github.com/torch-spyre/torch-spyre/issues/1738
        - names:
            - TestIndexing::test_getitem_scalars  # issue 1738
          mode: xfail  # xfail: aten::isnan not registered

        # ---------------------------------------------------------------------------
        # Scalar-tensor setitem — indirect write path
        # assertEqual after row assign → isclose → aten::isnan. Covered by
        # https://github.com/torch-spyre/torch-spyre/issues/1738
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_setitem_scalars  # issue 1738
          mode: xfail  # xfail: aten::isnan not registered

        # ---------------------------------------------------------------------------
        # aten::index_put extended cases — indirect write (#692)
        # test_index_ind_dtype is a READ with a non-int32/int64 index dtype (#1219).
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_index_ind_dtype  # issue 1219
          mode: xfail  # xfail: Spyre aten::index.Tensor supports only x[index] with a single 1-D int32/int64 index tensor on dim 0

        - names:
            - TestIndexing::test_index_put_accumulate_expanded_values  # issue 692
            - TestIndexing::test_index_put_non_accumulate_deterministic  # issue 692
          mode: xfail  # xfail: aten::_index_put_impl_ not registered

        # Hardcodes torch.double on the device (except MPS). Same spyre_empty
        # guard as the open https://github.com/torch-spyre/torch-spyre/issues/1228
        - names:
            - TestIndexing::test_index_put_accumulate_duplicate_indices  # issue 1228
          mode: xfail  # xfail: Spyre backend does not support dtype Double

        # ---------------------------------------------------------------------------
        # torch.index_add — indirect accumulation via index tensor
        # test_index_add_large_index_vectorized_path passes on Spyre.
        # Upstream dtype coverage: @dtypes(*all_types_and(torch.half, torch.bfloat16))
        # Active after filter: float16, int64, bfloat16
        # ---------------------------------------------------------------------------
        - names:
            - TestIndexing::test_index_add_large_index_vectorized_path
          mode: mandatory_success

        # assertEqual after index_add → isclose → aten::isnan. Covered by
        # https://github.com/torch-spyre/torch-spyre/issues/1738
        - names:
            - TestIndexing::test_index_add_deterministic  # issue 1738
          mode: xfail  # xfail: aten::isnan not registered

  global:
    supported_dtypes:
      # -----------------------------------------------------------------------
      # Active dtypes — run on Spyre today
      # -----------------------------------------------------------------------
      - name: float16
        description: Spyre primary float dtype. Active in test_index_put_src_datatype, test_index_src_datatype, test_index_copy, test_index_fill, test_index_reduce,
          test_take_along_dim (via all_types_and / explicit @dtypes).
      - name: float32
        description: Active in test_take_along_dim, test_take_along_dim_invalid, test_index_reduce (all_types_and), test_index_copy, test_index_fill, test_index_select,
          test_index_put_src_datatype.
      - name: int64
        description: Active in test_advancedindex (@dtypes(float64,int64) — float64 excluded), test_take_along_dim, test_index_reduce, test_index_copy,
          and as integer index dtype.
      - name: bfloat16
        description: Active in test_index_put_src_datatype, test_index_copy, test_index_fill, test_index_reduce, test_index_add_large_index_vectorized_path.
      - name: bool
        description: Active in test_index_fill, test_index_copy, test_index_select. Also prevents extract_dtype_from_name from filtering tests whose method
          names contain "bool" (e.g. test_bool_indices, test_bool_mask_assignment, test_byte_mask).
      # -----------------------------------------------------------------------
      # Excluded dtypes — present in upstream @dtypes but NOT yet supported on Spyre.
      # -----------------------------------------------------------------------
      # - name: float64    # reason: Spyre maximum floating-point precision is float32.
      # - name: int8       # reason: 8-bit integer ops not supported on Spyre.
      # - name: int16      # reason: 16-bit integer ops not supported on Spyre.
      # - name: int32      # reason: 32-bit integer ops not supported on Spyre.
      # - name: uint8      # reason: unsigned integer ops not supported on Spyre.
      # - name: complex64  # reason: complex arithmetic not supported on Spyre.
      # - name: complex128 # reason: complex arithmetic not supported on Spyre.
      # - name: float8_e4m3fn    # reason: float8 not supported on Spyre.
      # - name: float8_e4m3fnuz  # same.
      # - name: float8_e5m2      # same.
      # - name: float8_e5m2fnuz  # same.
