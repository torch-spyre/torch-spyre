test_suite_config:
  labels: [trunk]

  files:
    - path: ${TORCH_ROOT}/test/inductor/test_compile.py
      unlisted_test_mode: skip
      tests:
        - names:
            - TestStandaloneInductor::test_inductor_via_export2
          mode: mandatory_success
        - names:
            - TestStandaloneInductor::test_inductor_via_export1
          mode: xfail  # xfail: RuntimeError
        - names:
            - TestStandaloneInductor::test_inductor_generate_debug_compile
            - TestStandaloneInductor::test_inductor_generate_debug_symbol
            - TestStandaloneInductor::test_inductor_via_bare_module
            - TestStandaloneInductor::test_inductor_via_fx
            - TestStandaloneInductor::test_inductor_via_fx_dict_input
            - TestStandaloneInductor::test_inductor_via_fx_tensor_return
            - TestStandaloneInductor::test_inductor_via_make_fx
            - TestStandaloneInductor::test_inductor_via_op_with_multiple_outputs
          mode: skip  # does not engage the torch-spyre layer

  global:
    supported_dtypes:
      - name: bfloat16
      - name: bool
      - name: float16
      - name: float32
      - name: int64
    supported_ops:
      - name: _scaled_dot_product_fused_attention_overrideable
