test_suite_config:
  labels: [trunk]

  files:
    - path: ${TORCH_ROOT}/test/inductor/test_benchmark_fusion.py
      unlisted_test_mode: skip
      tests:
        # These tests exercise CPU-specific kernel fusion operations, which are not supported by the Spyre backend.
        # They are classified as mandatory_success because they do not engage the Spyre layer, ensuring compatibility.
        # The relevance lies in verifying that CPU-only operations do not trigger Spyre-specific errors or limitations.
        - names:
            - BenchmarkFusionCpuTest::test_foreach_kernel
            - BenchmarkFusionCpuTest::test_foreach_kernel_cpu
          mode: mandatory_success
        # These tests exercise CPU-specific optimizations and behaviors, such as register spilling and kernel fusion.
        # They are classified as 'skip' because they do not engage the torch-spyre layer, focusing solely on CPU performance.
        # Relevant Spyre capabilities include efficient CPU tensor operations but not the torch-spyre layer's specific optimizations.
        - names:
            - BenchmarkFusionCpuTest::test_avoid_register_spilling
            - BenchmarkFusionCpuTest::test_avoid_register_spilling_cpu
            - BenchmarkFusionCpuTest::test_register_spills
            - BenchmarkFusionCpuTest::test_register_spills_cpu
            - BenchmarkFusionCpuTest::test_resnet18
            - BenchmarkFusionCpuTest::test_resnet18_cpu
            - BenchmarkFusionCpuTest::test_softmax
            - BenchmarkFusionCpuTest::test_softmax_cpu
            - BenchmarkFusionCpuTest::test_tield_kernel_fusion
            - BenchmarkFusionCpuTest::test_tield_kernel_fusion_cpu
          mode: skip  # does not engage the torch-spyre layer

  global:
    supported_dtypes:
      - name: bfloat16
      - name: bool
      - name: float16
      - name: float32
      - name: int64
