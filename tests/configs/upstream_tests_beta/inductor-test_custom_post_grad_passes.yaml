test_suite_config:

  files:
    - path: ${TORCH_ROOT}/test/inductor/test_custom_post_grad_passes.py
      unlisted_test_mode: skip
      tests:
        # These tests exercise custom pre- and post-graduation passes without involving the torch-spyre layer.
        # They are classified as mandatory_success because they do not engage the Spyre backend, ensuring compatibility.
        # Relevant Spyre capabilities include handling custom passes without backend interaction, ensuring seamless integration.
        - names:
            - TestPostGradCustomPrePostPass::test_custom_backend_pass
          mode: mandatory_success
        # These tests exercise custom pre and post-graduation passes, focusing on tensor operations and graph manipulations.
        # They are classified as 'skip' because they do not engage the torch-spyre layer, which is required for Spyre-specific optimizations.
        # Relevant Spyre limitations include the need for explicit torch-spyre layer engagement for backend-specific optimizations.
        - names:
            - TestPostGradCustomPrePostPass::test_custom_joint_pass_post
            - TestPostGradCustomPrePostPass::test_custom_joint_pass_pre
            - TestPostGradCustomPrePostPass::test_custom_post_pass
            - TestPostGradCustomPrePostPass::test_custom_pre_grad_pass
            - TestPostGradCustomPrePostPass::test_custom_pre_pass
          mode: skip  # does not engage the torch-spyre layer

  global:
    supported_dtypes:
      - name: bfloat16
      - name: bool
      - name: float16
      - name: float32
      - name: int64
