test_suite_config:

  files:
    - path: ${TORCH_ROOT}/test/inductor/test_compiled_optimizers.py
      unlisted_test_mode: skip
      tests:
        # These tests exercise basic optimizer functionalities without involving any specific ops or dtypes.
        # They are classified as mandatory_success because they do not engage the torch-spyre layer, ensuring compatibility.
        # Relevant Spyre capabilities include handling basic optimizer operations without specialized hardware acceleration.
        - names:
            - CompiledOptimizerTests::test_get_value_on_static_address
            - CompiledOptimizerTests::test_guard_on_none_grads
          mode: mandatory_success
        # These tests exercise various optimizer operations (e.g., ASGD, AdamW, RMSprop) with float32 tensors.
        # They are classified as mandatory_success because they do not engage the torch-spyre layer.
        # Relevant Spyre limitations include unsupported float32 operations and incomplete optimizer coverage.
        - names:
            - CompiledOptimizerParityTests::test_correctness
          mode: mandatory_success
          edits:
            dtypes:
              exclude:
                - name: float32
        # These tests exercise various optimizer functionalities and tensor operations.
        # They are skipped because they do not interact with the torch-spyre layer.
        # Relevant Spyre capabilities include support for specific dtypes and ops.
        - names:
            - CompiledOptimizerTests::test_S429861
            - CompiledOptimizerTests::test_basic_shampoo
            - CompiledOptimizerTests::test_closure_graph_break
            - CompiledOptimizerTests::test_compile_time_smoketest
            - CompiledOptimizerTests::test_foreach_map_adam
            - CompiledOptimizerTests::test_static_address_finalizer
          mode: skip  # does not engage the torch-spyre layer

  global:
    supported_dtypes:
      - name: bfloat16
      - name: bool
      - name: float16
      - name: float32
      - name: int64
