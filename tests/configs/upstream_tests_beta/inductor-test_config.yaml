test_suite_config:

  files:
    - path: ${TORCH_ROOT}/test/inductor/test_config.py
      unlisted_test_mode: skip
      tests:
        # These tests exercise the PyTorch Inductor configuration API and backend selection, ensuring that the compilation and configuration mechanisms work correctly.
        # They are classified as mandatory_success because they do not interact with the Spyre backend, focusing instead on core PyTorch functionality.
        # The relevance to Spyre is minimal, as these tests do not leverage any specific Spyre capabilities or limitations.
        - names:
            - TestInductorConfig::test_compile_api
            - TestInductorConfig::test_compile_api_passes_config
            - TestInductorConfig::test_non_inductor_backend
          mode: mandatory_success
        # These tests exercise configuration and utility functions in PyTorch Inductor, focusing on API options, code generation, and error handling.
        # They are classified as 'skip' because they do not interact with the torch-spyre layer, which is responsible for backend-specific operations.
        # The relevant Spyre capabilities are limited to basic tensor operations and do not include the specific functionalities tested here.
        - names:
            - TestInductorConfig::test_api_options
            - TestInductorConfig::test_codegen_skips_custom_passes
            - TestInductorConfig::test_get_compiler_config
            - TestInductorConfig::test_hasattr
            - TestInductorConfig::test_invalid_backend
            - TestInductorConfig::test_invalid_names
            - TestInductorConfig::test_options_do_something
            - TestInductorConfig::test_patch
            - TestInductorConfig::test_save_load
            - TestInductorConfig::test_select_decomp_table_fallback_embedding_bag_byte_unpack
            - TestInductorConfig::test_set
          mode: skip  # does not engage the torch-spyre layer

  global:
    supported_dtypes:
      - name: bfloat16
      - name: bool
      - name: float16
      - name: float32
      - name: int64
    supported_ops:
