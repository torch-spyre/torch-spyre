test_suite_config:
  labels: [trunk]

  files:
    - path: ${TORCH_ROOT}/test/test_torch.py
      unlisted_test_mode: skip
      tests:
        # These tests exercise various tensor operations and memory management behaviors across different dtypes.
        # They are classified as mandatory_success because they cover core functionalities and memory safety checks.
        # Relevant Spyre capabilities include support for bfloat16, bool, float16, float32, and int64 dtypes, and basic tensor ops.
        - names:
            - TestDevicePrecision::test_from_sequence
            - TestTorchDeviceType::test_index_add_mem_overlap
            - TestTorchDeviceType::test_index_copy_mem_overlap
            - TestTorchDeviceType::test_lazy_clone
            - TestTorchDeviceType::test_memory_format_consistency
            - TestTorchDeviceType::test_narrow_empty
            - TestTorchDeviceType::test_parallel_cow_materialize_error
            - TestTorchDeviceType::test_scatter_mem_overlap
            - TestTorchDeviceType::test_storage_use_count
          mode: mandatory_success
        # Upstream regression: test_is_signed_spyre copies a uint8 (Byte) tensor to the device and
        # fails with "Spyre backend does not support dtype Byte for host transfers" (#1588).
        - names:
            - TestTorchDeviceType::test_is_signed
          mode: skip  # skip: uint8 host transfer unsupported (#1588)
        # Upstream regression: test_lazy_clone_view fails on every dtype with "views of sharded
        # Spyre tensors are not supported" (#5817).
        - names:
            - TestTorchDeviceType::test_lazy_clone_view
          mode: skip  # skip: views of sharded tensors unsupported (#5817)
        # Skipped: flaky/unsupported on the Spyre backend.
        - names:
            - TestTorch::test_normal_shape
          mode: skip
        # ---------------------------------------------------------------------------
        # Indirect access — mandatory_success
        # Supported gather / scatter / mask / put / embedding operations (forward /
        # inference path).
        # ---------------------------------------------------------------------------
        - names:
            - TestTorch::test_index_select
            - TestTorch::test_gather_neg_dim
            - TestTorch::test_index_select_neg_dim
            - TestTorch::test_index_copy_neg_dim
            - TestTorch::test_index_fill_neg_dim
            - TestTorch::test_index_add_neg_dim
            - TestTorch::test_scatter_neg_dim
            - TestTorch::test_index_add
            - TestTorch::test_index_add_all_dtypes
            - TestTorch::test_index_add_cornercase
            - TestTorch::test_index_add_correctness
            - TestTorchDeviceType::test_scatter_zero_size_index
            - TestTorchDeviceType::test_masked_scatter_large_tensor
          mode: mandatory_success

        # ---------------------------------------------------------------------------
        # torch.repeat_interleave — YAML unique abort is Mod(d0, 2)
        # https://github.com/torch-spyre/torch-spyre/issues/4531
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_repeat_interleave  # issue 4531
          mode: xfail  # xfail: Unexpected stick expression Mod(d0, 2)

        # ---------------------------------------------------------------------------
        # Tensor.scatter_(reduce=) — unique abort is
        # aten::scatter.reduce_out (analysis label copy_from_d2d is wrong for the
        # pytest first abort). Same string as #4413.
        # test_scatter_reduce_scalar is #4552 value_reduce_out.
        # https://github.com/torch-spyre/torch-spyre/issues/4413
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_scatter_reduce_non_unique_index  # issue 4413
            - TestTorchDeviceType::test_scatter_reduce_operations_to_large_input  # issue 4413
          mode: xfail  # xfail: aten::scatter.reduce_out not registered

        # ---------------------------------------------------------------------------
        # index_add bfloat16 — unique abort is Tensor-likes not close
        # (1/15, abs 0.03125). YAML precision: cannot override explicit
        # assertEqual(atol=1e-2, rtol=0).
        # https://github.com/torch-spyre/torch-spyre/issues/4538
        # ---------------------------------------------------------------------------
        - names:
            - TestDevicePrecision::test_index_add_bfloat16  # issue 4538
          mode: xfail  # xfail: bfloat16 index_add disagrees with CPU (abs 0.03125)

        # ---------------------------------------------------------------------------
        # stride-2 last-dim clone — unique abort is 2*d1
        # (#3454 Case 2 k*d linear form).
        # Keep test_masked_select on #4553 (int16 DCI, different first abort).
        # https://github.com/torch-spyre/torch-spyre/issues/3454
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_masked_select_discontiguous  # issue 3454
          mode: xfail  # xfail: Unexpected stick expression 2*d1

        # ---------------------------------------------------------------------------
        # Tensor.put_ / torch.put — unique abort is aten::put_
        # https://github.com/torch-spyre/torch-spyre/issues/4540
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_put  # issue 4540
            - TestTorchDeviceType::test_put_empty  # issue 4540
            - TestTorchDeviceType::test_put_accumulate  # issue 4540
            - TestTorchDeviceType::test_nondeterministic_alert_put  # issue 4540
            - TestTorchDeviceType::test_nondeterministic_alert_put_accumulate  # issue 4540
          mode: xfail  # xfail: aten::put_ not registered

        # ---------------------------------------------------------------------------
        # torch.take — unique abort is aten::take
        # https://github.com/torch-spyre/torch-spyre/issues/4307
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_take  # issue 4307
            - TestTorchDeviceType::test_take_empty  # issue 4307
          mode: xfail  # xfail: aten::take not registered

        # ---------------------------------------------------------------------------
        # Tensor.masked_scatter_ — eager abort is aten::masked_scatter_
        # Compiled of the same 1-D call is #4437 (mask broadcast).
        # https://github.com/torch-spyre/torch-spyre/issues/4437
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_masked_scatter  # issue 4437
            - TestTorchDeviceType::test_masked_scatter_bool_tensor  # issue 4437
          mode: xfail  # xfail: aten::masked_scatter_ not registered (eager); compile is #4437

        # ---------------------------------------------------------------------------
        # torch.scatter_add — unique abort is aten::scatter_add.out
        # https://github.com/torch-spyre/torch-spyre/issues/4396
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_scatter_add_bool  # issue 4396
            - TestTorchDeviceType::test_scatter_add_non_unique_index  # issue 4396
            - TestTorchDeviceType::test_scatter_add_one_dim_deterministic  # issue 4396
            - TestTorchDeviceType::test_scatter_add_to_large_input  # issue 4396
          mode: xfail  # xfail: aten::scatter_add.out not registered

        # ---------------------------------------------------------------------------
        # torch.scatter / Tensor.scatter_ — unique abort is
        # aten::scatter.src_out. Same string as #1002 (#4401 same kernel).
        # https://github.com/torch-spyre/torch-spyre/issues/1002
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_scatter_bool  # issue 1002
            - TestTorchDeviceType::test_scatter_to_large_input  # issue 1002
          mode: xfail  # xfail: aten::scatter.src_out not registered

        # ---------------------------------------------------------------------------
        # advanced indexing mixed CPU/device — unique abort is
        # aten::index.Tensor_out. Same string as #1219.
        # https://github.com/torch-spyre/torch-spyre/issues/1219
        # ---------------------------------------------------------------------------
        - names:
            - TestDevicePrecision::test_advancedindex_mixed_cpu_devices  # issue 1219
            - TestTorchDeviceType::test_deterministic_interpolate_bilinear  # issue 1219
            - TestTorchDeviceType::test_no_nondeterministic_alert_interpolate_bilinear  # issue 1219
            - TestTorchDeviceType::test_no_nondeterministic_alert_interpolate_trilinear  # issue 1219
          mode: xfail  # xfail: Spyre aten::index.Tensor supports only x[index] with a single 1-D int32/int64 index tensor on dim 0

        # CPU raises RuntimeError "indices should be either on cpu or on the same device as
        # the indexed tensor"; Spyre's aten::index.Tensor raises NotImplementedError first,
        # so assertRaisesRegex does not match. https://github.com/torch-spyre/torch-spyre/issues/6204
        - names:
            - TestDevicePrecision::test_advancedindex_mixed_devices_error  # issue 6204
          mode: xfail  # xfail: NotImplementedError raised where RuntimeError "indices should be either on cpu ..." is expected

        # ---------------------------------------------------------------------------
        # index_put mem overlap — unique abort is
        # aten::_index_put_impl_. Same string as #692.
        # Dies on x.index_put_ before the overlap check.
        # https://github.com/torch-spyre/torch-spyre/issues/692
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_index_put_mem_overlap  # issue 692
          mode: xfail  # xfail: aten::_index_put_impl_ not registered

        # ---------------------------------------------------------------------------
        # nn.EmbeddingBag — unique abort is aten::_embedding_bag
        # Same string as #4319.
        # Not #4320 (embedding_renorm_).
        # https://github.com/torch-spyre/torch-spyre/issues/4319
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_nondeterministic_alert_EmbeddingBag_max  # issue 4319
          mode: xfail  # xfail: aten::_embedding_bag not registered

        # ---------------------------------------------------------------------------
        # Tensor.index_fill_ — unique abort is
        # aten::index_fill_.int_Scalar. Same string as #4414.
        # https://github.com/torch-spyre/torch-spyre/issues/4414
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_index_fill_mem_overlap  # issue 4414
          mode: xfail  # xfail: aten::index_fill_.int_Scalar not registered

        # ---------------------------------------------------------------------------
        # Tensor.scatter_(value=, reduce=) — unique abort is
        # aten::scatter.value_reduce_out (eager).
        # https://github.com/torch-spyre/torch-spyre/issues/4552
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_scatter_reduce_scalar  # issue 4552
          mode: xfail  # xfail: aten::scatter.value_reduce_out not registered

        # ---------------------------------------------------------------------------
        # int16 DMA — unique abort is Unsupported DCI
        # cpu_type=int16, dev_type=int16. test_masked_select setup randint
        # maskType=int16 (uint8/int8 PASS).
        # https://github.com/torch-spyre/torch-spyre/issues/4553
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_masked_select  # issue 4553
          mode: xfail  # xfail: Unsupported DCI int16 DMA

        # ---------------------------------------------------------------------------
        # transpose then contiguous — leftover unique abort is
        # no mechanism to resolve stick incompatibility. Same string as #3265
        # (x.t().clone()). Dies on t.transpose(0,1).contiguous() before
        # masked_scatter_. 
        # https://github.com/torch-spyre/torch-spyre/issues/3265
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_masked_scatter_inplace_noncontiguous  # issue 3265
          mode: xfail  # xfail: no mechanism to resolve stick incompatibility

        # ---------------------------------------------------------------------------
        # torch.index_add_ on very large tensors — skip entirely to avoid CI hang.
        # Root cause: aten::index_add.out is not registered for the Spyre backend.
        # The test does NOT fail fast — it first runs a 524,288-iteration Python
        # reference loop (32 × 16,384 steps) where every iteration calls .item()
        # for a synchronous device-to-host scalar transfer, consuming ~19 minutes
        # before the missing op is even reached.
        # Tensor sizes: output [1, 32, 16384, 6144] bfloat16 ≈ 6 GB on device.
        # Observed wall-clock: 1145 s (run N), 890 s (run N-1) — worsening each run.
        # An xfail would still run the body, so the hang would remain; a skip is the only option.
        # Use mode: skip (not xfail) so CI does not wait for the timeout at all.
        # Remove this entry once aten::index_add.out is implemented on Spyre.
        # Covered by https://github.com/torch-spyre/torch-spyre/issues/3507 (Enable Tensor.index_add_,
        # which includes aten::index_add.out). #4538 is a different bug (incorrect bf16 results).
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_index_add_large_inputs  # issue 3507
          mode: skip  # skip: hangs ~19 min before reaching the missing aten::index_add.out
        # ---------------------------------------------------------------------------
        # Gather backward. aten::gather is not enabled on Spyre.
        # Covered by https://github.com/torch-spyre/torch-spyre/issues/4328
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_gather_backward_deterministic_path  # issue 4328
          mode: xfail  # xfail: aten::gather not enabled on Spyre
        # Upstream regression: these assertRaisesRegex() against a specific CPU error message
        # (e.g. "Empty tensor not supported", "unsupported operation", "Expected all tensors to
        # be on the same device", "CPU Scalar support for tensor1 argument"), but on Spyre the
        # underlying op (bernoulli_.float, masked_scatter_, multinomial.out, put_,
        # __ilshift__.Tensor, addcmul.out) is unimplemented, or a different error surfaces first
        # (_local_scalar_dense), so none of the expected patterns match.
        - names:
            - TestTorchDeviceType::test__local_scalar_dense_with_empty_tensor
            - TestTorchDeviceType::test_addcmul_cuda_errors_with_cpu_scalars
            - TestTorchDeviceType::test_bernoulli_mem_overlap
            - TestTorchDeviceType::test_masked_scatter_mem_overlap
            - TestTorchDeviceType::test_multinomial_device_constrain
            - TestTorchDeviceType::test_put_mem_overlap
            - TestTorchDeviceType::test_shift_mem_overlap
          mode: skip  # skip: NotImplementedError / error message mismatch on upstream PyTorch bump
        # These tests exercise the `addcdiv` operation with different dtypes, focusing on tensor operations and broadcasting.
        # They are classified as `mandatory_success` because the Spyre backend must support these operations for basic functionality.
        # The primary limitation is the unsupported `float32` dtype, which causes an `InductorError` due to unexpected arguments.
        - names:
            - TestTorchDeviceType::test_addcdiv
          mode: mandatory_success
          edits:
            dtypes:
              exclude:
                - name: float32
        # These tests validate error-message handling for non-native device operations.
        - names:
            - TestTorchDeviceType::test_assertRaisesRegex_ignore_msg_non_native_device
          mode: mandatory_success

        # ---------------------------------------------------------------------------
        # torch.Tensor.item. Supported dtypes PASS.
        # float8_e4m3fn / float8_e5m2fnuz — RuntimeOperationFill (#4506)
        # float8_e4m3fnuz / float8_e5m2 — does not support dtype (#4497)
        # https://github.com/torch-spyre/torch-spyre/issues/4506
        # https://github.com/torch-spyre/torch-spyre/issues/4497
        # ---------------------------------------------------------------------------
        - names:
            - TestTorchDeviceType::test_item
          mode: mandatory_success
        - names:
            - TestTorchDeviceType::test_item  # issue 4506 / 4497
          mode: xfail  # xfail: RuntimeOperationFill / dtype not supported (float8)
          edits:
            dtypes:
              include:
                - name: float8_e4m3fn
                - name: float8_e4m3fnuz
                - name: float8_e5m2
                - name: float8_e5m2fnuz

        # These tests exercise a wide range of PyTorch operations, including tensor manipulations, mathematical operations, and gradient scaling, across various data types.
        # They are classified as xfail on the Spyre backend due to unsupported operations, data types, and memory formats, as well as missing features like deterministic paths and non-deterministic alerts.
        # The most relevant Spyre capabilities include support for bfloat16, bool, float16, float32, and int64 data types, and a subset of operations that are fully supported across all these types. Limitations include unsupported complex half data types, non-contiguous memory formats, and missing deterministic paths for certain operations.
        - names:
            - TestTorchDeviceType::test_addcmul
            - TestTorchDeviceType::test_clone_all_dtypes_and_devices
            - TestTorchDeviceType::test_complex_half_experimental_warning
            - TestTorchDeviceType::test_conv_transposed_backward_agnostic_to_memory_format
            - TestTorchDeviceType::test_copy_all_dtypes_and_devices
            - TestTorchDeviceType::test_deterministic_replication_pad2d
            - TestTorchDeviceType::test_exponential_no_zero
            - TestTorchDeviceType::test_grad_scale_will_not_overflow
            - TestTorchDeviceType::test_grad_scaler_deprecated_warning
            - TestTorchDeviceType::test_grad_scaling_autocast
            - TestTorchDeviceType::test_grad_scaling_clipping_separate_unscale
            - TestTorchDeviceType::test_grad_scaling_unscale_sparse
            - TestTorchDeviceType::test_grad_scaling_update_scale
            - TestTorchDeviceType::test_invalid_shapes_grid_sampler
            - TestTorchDeviceType::test_lazy_clone_binary_op_no_materialize
            - TestTorchDeviceType::test_lazy_clone_view_materialize
            - TestTorchDeviceType::test_memory_format_factory_like_functions_preserve
            - TestTorchDeviceType::test_memory_format_preserved_after_permute
            - TestTorchDeviceType::test_memory_format_propagation_rules
            - TestTorchDeviceType::test_memory_format_type_shortcuts
            - TestTorchDeviceType::test_multinomial_empty_w_replacement
            - TestTorchDeviceType::test_multinomial_empty_wo_replacement
            - TestTorchDeviceType::test_nondeterministic_alert_AdaptiveAvgPool2d
            - TestTorchDeviceType::test_nondeterministic_alert_AdaptiveAvgPool3d
            - TestTorchDeviceType::test_nondeterministic_alert_AdaptiveMaxPool2d
            - TestTorchDeviceType::test_nondeterministic_alert_AvgPool3d
            - TestTorchDeviceType::test_nondeterministic_alert_CTCLoss
            - TestTorchDeviceType::test_nondeterministic_alert_FractionalMaxPool2d
            - TestTorchDeviceType::test_nondeterministic_alert_FractionalMaxPool3d
            - TestTorchDeviceType::test_nondeterministic_alert_MaxPool3d
            - TestTorchDeviceType::test_nondeterministic_alert_MaxUnpool1d
            - TestTorchDeviceType::test_nondeterministic_alert_MaxUnpool2d
            - TestTorchDeviceType::test_nondeterministic_alert_MaxUnpool3d
            - TestTorchDeviceType::test_nondeterministic_alert_NLLLoss
            - TestTorchDeviceType::test_nondeterministic_alert_ReflectionPad1d
            - TestTorchDeviceType::test_nondeterministic_alert_ReflectionPad3d
            - TestTorchDeviceType::test_nondeterministic_alert_ReplicationPad1d
            - TestTorchDeviceType::test_nondeterministic_alert_ReplicationPad2d
            - TestTorchDeviceType::test_nondeterministic_alert_ReplicationPad3d
            - TestTorchDeviceType::test_nondeterministic_alert_bincount
            - TestTorchDeviceType::test_nondeterministic_alert_grid_sample_2d
            - TestTorchDeviceType::test_nondeterministic_alert_grid_sample_3d
            - TestTorchDeviceType::test_nondeterministic_alert_histc
            - TestTorchDeviceType::test_nondeterministic_alert_interpolate_bicubic
            - TestTorchDeviceType::test_nondeterministic_alert_interpolate_bilinear
            - TestTorchDeviceType::test_nondeterministic_alert_interpolate_linear
            - TestTorchDeviceType::test_nondeterministic_alert_interpolate_trilinear
            - TestTorchDeviceType::test_nondeterministic_resize_quantized
            - TestTorchDeviceType::test_params_invalidated_with_grads_invalidated_and_graph_partition
            - TestTorchDeviceType::test_params_invalidated_with_grads_invalidated_between_unscale_and_step
            - TestTorchDeviceType::test_reduced_type_float_copy
            - TestTorchDeviceType::test_storage_all_devices
            - TestTorchDeviceType::test_storage_meta_from_tensor
            - TestTorchDeviceType::test_where_scalar_handcrafted_values
          mode: xfail   # xfail: dxp_standalone not detected
        # ---------------------------------------------------------------------------
        # Failures grouped by the op or condition that raises.
        # ---------------------------------------------------------------------------
        # aten::masked_fill_.Scalar is registered now, but masked_fill_ with a 1-D mask fails in
        # layout propagation (mixed EA). https://github.com/torch-spyre/torch-spyre/issues/1004
        - names:
            - TestTorchDeviceType::test_masked_fill_bool_tensor  # issue 1004
            - TestTorchDeviceType::test_masked_fill_mem_overlap  # issue 1004
          mode: xfail  # xfail: Unsupported: Multi-arg pointwise with mixed EA, STANDARD input must broadcast
        # aten::remainder.Tensor_out not registered. https://github.com/torch-spyre/torch-spyre/issues/4416
        - names:
            - TestTorchDeviceType::test_scalar_check  # issue 4416
          mode: xfail  # xfail: Could not run 'aten::remainder.Tensor_out'
        # Prefix-scan ops not registered (aten::_cummax_helper, _cummin_helper, cumprod.out,
        # _logcumsumexp). https://github.com/torch-spyre/torch-spyre/issues/3388
        - names:
            - TestTorchDeviceType::test_cummax_cummin  # issue 3388
            - TestTorchDeviceType::test_cummax_discontiguous  # issue 3388
            - TestTorchDeviceType::test_cummin_discontiguous  # issue 3388
            - TestTorchDeviceType::test_cumprod  # issue 3388
            - TestTorchDeviceType::test_logcumsumexp  # issue 3388
          mode: xfail  # xfail: Could not run 'aten::_cummax_helper' / '_cummin_helper' / 'cumprod.out' / '_logcumsumexp'
        # aten::glu.out not registered. https://github.com/torch-spyre/torch-spyre/issues/496
        - names:
            - TestTorchDeviceType::test_dim_function_empty  # issue 496
          mode: xfail  # xfail: Could not run 'aten::glu.out'
        # aten::gather.out not registered. https://github.com/torch-spyre/torch-spyre/issues/4328
        - names:
            - TestTorchDeviceType::test_gather_backward_one_dim  # issue 4328
          mode: xfail  # xfail: Could not run 'aten::gather.out'
        # Random sampling ops not registered (aten::bernoulli_.Tensor, bernoulli_.float, exponential_).
        # https://github.com/torch-spyre/torch-spyre/issues/5851
        - names:
            - TestTorchDeviceType::test_bernoulli_p  # issue 5851
            - TestTorchDeviceType::test_bernoulli_self  # issue 5851
            - TestTorchDeviceType::test_exponential  # issue 5851
          mode: xfail  # xfail: Could not run 'aten::bernoulli_.Tensor' / 'bernoulli_.float' / 'exponential_'
        # aten::cauchy_, geometric_ and log_normal_ not registered. https://github.com/torch-spyre/torch-spyre/issues/5851
        - names:
            - TestTorchDeviceType::test_cauchy  # issue 5851
            - TestTorchDeviceType::test_geometric  # issue 5851
            - TestTorchDeviceType::test_log_normal  # issue 5851
          mode: xfail  # xfail: Could not run 'aten::cauchy_' / 'geometric_' / 'log_normal_'
        # assertEqual -> isclose -> aten::isnan. https://github.com/torch-spyre/torch-spyre/issues/1738
        - names:
            - TestTorchDeviceType::test_copy_math_view  # issue 1738
            - TestTorchDeviceType::test_deterministic_cumsum  # issue 1738
            - TestTorchDeviceType::test_hook_remove  # issue 1738
            - TestTorchDeviceType::test_narrow_copy_non_contiguous  # issue 1738
          mode: xfail  # xfail: Could not run 'aten::isnan'
        # bfloat16 / float16 / float32: assertEqual -> aten::isnan. https://github.com/torch-spyre/torch-spyre/issues/1738
        - names:
            - TestTorchDeviceType::test_deterministic_empty  # issue 1738
          mode: xfail  # xfail: Could not run 'aten::isnan'
          edits:
            dtypes:
              include:
                - name: bfloat16
                - name: float16
                - name: float32
        # bool / int64: the filled-memory check returns False. https://github.com/torch-spyre/torch-spyre/issues/6260
        - names:
            - TestTorchDeviceType::test_deterministic_empty  # issue 6260
          mode: xfail  # xfail: AssertionError: tensor(False, device='spyre:0') is not true
          edits:
            dtypes:
              include:
                - name: bool
                - name: int64
        # Stick expression 2*d1 (stride-2 write). https://github.com/torch-spyre/torch-spyre/issues/3454
        - names:
            - TestTorchDeviceType::test_discontiguous_out_cumsum  # issue 3454
          mode: xfail  # xfail: Unexpected stick expression 2*d1
        # float32 / int64: constant stick expression 1. https://github.com/torch-spyre/torch-spyre/issues/5196
        - names:
            - TestTorchDeviceType::test_diff  # issue 5196
          mode: xfail  # xfail: Unexpected stick expression 1
          edits:
            dtypes:
              include:
                - name: float32
                - name: int64
        # bool: wrong values (Tensor-likes are not close, 1 / 1 elements); a 1-element bool
        # clone() returns the wrong value too. https://github.com/torch-spyre/torch-spyre/issues/6043
        - names:
            - TestTorchDeviceType::test_diff  # issue 6043
          mode: xfail  # xfail: AssertionError: Tensor-likes are not close
          edits:
            dtypes:
              include:
                - name: bool
        # float16 / float32 / int64: copy_from_d2d storage_offset not stick-aligned. https://github.com/torch-spyre/torch-spyre/issues/4329
        - names:
            - TestTorchDeviceType::test_diff_noncontig  # issue 4329
          mode: xfail  # xfail: copy_from_d2d sliced view requires stick-aligned storage_offset
          edits:
            dtypes:
              include:
                - name: float16
                - name: float32
                - name: int64
