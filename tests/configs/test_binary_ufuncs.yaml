            precision:
              atol: 1e-3
              rtol: 1e-3
          - name: int64
      - name: mul
      - name: sub
      - name: gcd
        force_xfail: true
    supported_modules:
      - name: torch.nn.Linear
      - name: torch.nn.Conv2d
      - name: torch.nn.ReLU
