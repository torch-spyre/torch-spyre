test_suite_config:
  files:
    - path: ${TORCH_ROOT}/test/test_binary_ufuncs.py
      unlisted_test_mode: skip
      tests:
        - names:
            - TestBinaryUfuncs::test_scalar_support
            - TestBinaryUfuncs::test_contig_vs_transposed
          mode: xfail
          tags:
            - model_1
            - model_2
          edits:
            ops:
              include:
                - name: add
                  description: inject add — binary_ufuncs_with_references excludes it if ref is None
              exclude:
                - name: gcd
                  description: gcd causes buffer alignment errors for this test
            dtypes:
              include:
                - name: float32
              exclude:
                - name: bfloat16
                  description: bfloat16 unsupported on Spyre for this test
        - names:
            - TestBinaryUfuncs::generate_not_implemented_tests
          mode: mandatory_success
          edits:
            dtypes:
              exclude:
                - name: float64
        - names:
            - TestBinaryUfuncs::test_binary_op_mem_overlap
          mode: mandatory_success
          edits:
            dtypes:
              include:
                - name: float64
        - names:
            - TestBinaryUfuncs::test_divide_by_zero_rounding
          mode: mandatory_success
          edits:
            dtypes:
              include:
                - name: bfloat16
                - name: float16
                - name: float32
                - name: float64

  global:
    supported_dtypes:
      - name: float16
      - name: int64
    supported_ops:
      - name: add
        dtypes:
          - name: float16
            precision:
              atol: 1e-3
              rtol: 1e-3
          - name: int64
      - name: mul
      - name: sub
      - name: gcd
        force_xfail: true
    supported_modules:
      - name: torch.nn.Linear
      - name: torch.nn.Conv2d
      - name: torch.nn.ReLU
        force_xfail: true
