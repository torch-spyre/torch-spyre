name: upstream-tests-beta-matrix (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow — not triggered directly.
#
# Extracted from upstream_tests_beta.yaml's `upstream-tests` job so the
# per-suite matrix (and its retry/stall-watching/JUnit-XML reporting via
# ./.github/actions/run-test-suite) has a single source of truth. Callers
# provide a prebuilt torch-spyre wheel artifact (built however they see fit —
# against the pinned pytorch-cpu wheel, or against a local pytorch source
# checkout) and this workflow installs it and runs every upstream-beta suite
# against it.
#
# Callers:
#   - upstream_tests_beta.yaml (push-to-main trunk): artifact_name only,
#     pytorch_sha left empty (release branch derived from pyproject.toml).
#   - build_test_pytorch_source.yaml (pytorch/pytorch dispatch): both
#     artifact_name and pytorch_sha set to the exact commit under test.
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded torch-spyre wheel artifact to download and install
        required: false
        type: string
        default: torch-spyre-wheel
      pytorch_sha:
        description: Exact pytorch/pytorch commit SHA to check out. Empty = release branch derived from pyproject.toml.
        required: false
        type: string
        default: ''
      pytorch_wheel_artifact_name:
        description: >-
          Name of a prebuilt PyTorch wheel artifact to install in place of the
          pinned pytorch-cpu wheel (e.g. a from-source build at pytorch_sha).
          Empty (default) = keep the pinned wheel install-prebuilt-torch-spyre
          resolves normally.
        required: false
        type: string
        default: ''
      mode:
        description: >-
          Forwarded to run_test.sh as --mode. 'gating' (default) fails the
          job on test failures; 'validate' still records failures in the
          summary/JUnit XML but does not fail the job on them.
        required: false
        type: string
        default: gating
  # ---------------------------------------------------------------------------
  # Lets build_test_pytorch_source.yaml's `test` job dispatch this workflow
  # from a *step* (via actions/github-script + createWorkflowDispatch,
  # mirroring trigger_other_repos-style dispatch) instead of a job-level
  # `uses:`, so that job can wrap the dispatch with CRCR in_progress/completed
  # callback steps. Mirrors the workflow_call inputs above (GHA doesn't allow
  # sharing an inputs: block between two triggers) plus two dispatch-only
  # inputs used to find/read the resulting run and its source artifacts.
  # ---------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Name of the uploaded torch-spyre wheel artifact to download and install
        required: false
        type: string
        default: torch-spyre-wheel
      pytorch_sha:
        description: Exact pytorch/pytorch commit SHA to check out. Empty = release branch derived from pyproject.toml.
        required: false
        type: string
        default: ''
      pytorch_wheel_artifact_name:
        description: >-
          Name of a prebuilt PyTorch wheel artifact to install in place of the
          pinned pytorch-cpu wheel (e.g. a from-source build at pytorch_sha).
          Empty (default) = keep the pinned wheel install-prebuilt-torch-spyre
          resolves normally.
        required: false
        type: string
        default: ''
      mode:
        description: >-
          Forwarded to run_test.sh as --mode. 'gating' (default) fails the
          job on test failures; 'validate' still records failures in the
          summary/JUnit XML but does not fail the job on them.
        required: false
        type: string
        default: gating
      correlation_id:
        description: >-
          Opaque token set by the dispatching step, used only so it can find
          the run it just created (the dispatch API returns no run ID) --
          surfaced via run-name below.
        required: true
        type: string
      source_run_id:
        description: >-
          Workflow run ID to download the torch-spyre/PyTorch wheel artifacts
          from. Empty (default) = current run.
        required: false
        type: string
        default: ''

run-name: >-
  ${{ github.workflow }}${{ inputs.correlation_id && format(' ({0})', inputs.correlation_id) || '' }}

defaults:
  run:
    shell: bash

jobs:
  upstream-tests:
    name: ${{ matrix.suite.name }}
    runs-on:
      - x86_64
      - spyre_pf_x1
      - linux
      - image_spyre_backend
    timeout-minutes: 60
    env:
      # The CI env var is very important.
      # GitHub actions automatically sets CI=true
      # which causes the pytest inductor tests to fail with AssertionError
      # due to a mix of fallbacks and decompositions.
      # Here we set it to an empty string (or we could also unset it).
      CI: ''

    # ---------------------------------------------------------------------------
    # To add a new upstream test suite, append an entry here:
    #   - name: <human-readable label shown in the GHA UI>
    #     config: <filename inside tests/configs/>
    #
    # The JUnit XML report is automatically named after the config file, e.g.:
    #   test_view_ops_config.yaml  ->  test_view_ops_config.xml
    # ---------------------------------------------------------------------------
    strategy:
      fail-fast: false   # run all suites even if one fails
      matrix:
        suite:
          - name: Indexing
            config: test_indexing.yaml
          - name: Linear algebra
            config: test_linalg.yaml
          - name: NeuralNet pooling
            config: nn-test_pooling.yaml
          - name: NeuralNet embedding
            config: nn-test_embedding.yaml
          - name: NeuralNet init
            config: nn-test_init.yaml
          - name: NeuralNet load state dictionary
            config: nn-test_load_state_dict.yaml
          - name: NeuralNet module hooks
            config: nn-test_module_hooks.yaml
          - name: Profiler execution trace
            config: profiler-test_execution_trace.yaml
          - name: Profiler memory
            config: profiler-test_memory_profiler.yaml
          - name: Profiler torch tidy
            config: profiler-test_torch_tidy.yaml
          - name: Profiler
            config: profiler-test_profiler.yaml
          - name: Reductions
            config: test_reductions.yaml
          - name: Shape ops
            config: test_shape_ops.yaml
          - name: Tensor creation ops
            config: test_tensor_creation_ops.yaml
          - name: Unary ops
            config: test_unary_ufuncs.yaml
          - name: Binary ops
            config: test_binary_ufuncs.yaml
          - name: Spectral ops
            config: test_spectral_ops.yaml
          - name: View ops
            config: test_view_ops.yaml
          - name: Torch
            config: test_torch.yaml
          - name: Sort and select
            config: test_sort_and_select.yaml
          - name: Inductor debug trace
            config: inductor-test_debug_trace.yaml
          - name: Inductor execution lowering stack trace
            config: inductor-test_exc_lowering_stack_trace.yaml
          - name: Inductor fuzzer
            config: inductor-test_fuzzer.yaml
          - name: Inductor move constructor to gpu
            config: inductor-test_move_constructors_to_gpu.yaml
          - name: Inductor pattern matcher
            config: inductor-test_pattern_matcher.yaml
          - name: Inductor scatter optimization
            config: inductor-test_scatter_optimization.yaml
          - name: Inductor torch binding
            config: inductor-test_torchbind.yaml
          - name: Inductor auto functionalize
            config: inductor-test_auto_functionalize.yaml
          - name: Inductor benchmark fusion
            config: inductor-test_benchmark_fusion.yaml
          - name: Inductor test code cache
            config: inductor-test_codecache.yaml
          - name: Inductor test compile
            config: inductor-test_compile.yaml
          - name: Inductor test compile subprocess
            config: inductor-test_compile_subprocess.yaml
          - name: Inductor test compiled optimizers
            config: inductor-test_compiled_optimizers.yaml
          - name: Inductor test config
            config: inductor-test_config.yaml
          - name: Inductor test control flow
            config: inductor-test_control_flow.yaml
          # Inductor test cpu select algorithm is split it into three parts to prevent job timeout
          - name: Inductor test cpu select algorithm part 1
            config: inductor-test_cpu_select_algorithm_part1.yaml
          - name: Inductor test cpu select algorithm part 2
            config: inductor-test_cpu_select_algorithm_part2.yaml
          - name: Inductor test cpu select algorithm part 3
            config: inductor-test_cpu_select_algorithm_part3.yaml
          ####################
          - name: Inductor test custom op autotune
            config: inductor-test_custom_op_autotune.yaml
          - name: Inducotr test custom post grad passes
            config: inductor-test_custom_post_grad_passes.yaml
          # All xfail tests. Will result in zero tests collected in "no xfail" mode.
          # There are some mandatory success tests which have been commented out due a potential exclude bug.
          # Once the bug is resolved, this config can be enabled.
          # - name: Ops
          #   config: test_ops.yaml
          # All xfail tests. Will result in zero tests collected in "no xfail" mode.
          # Retaining the yaml for future use as new spyre capabilities are added.
          # - name: NeuralNet lazy modules
          #   config: nn-test_lazy_modules.yaml
          # - name: Masked
          #   config: test_masked.yaml
          # - name: Inductor scheduler
          #   config: inductor-test_inductor_scheduler.yaml
          # - name: Inductor op dtype properties
          #   config: inductor-test_op_dtype_prop.yaml
          # - name: NeuralNet convolution
          #   config: nn-test_convolution.yaml
          # All xfail/skip tests (no mandatory_success entries). Will result in
          # zero tests collected in "not xfail" mode.
          # Retaining the yaml for future use as new spyre capabilities are added.
          # - name: Inductor mkldnn pattern matcher
          #   config: inductor-test_mkldnn_pattern_matcher.yaml

    steps:
      # Sparse checkout into the GHA workspace so the local composite
      # actions under .github/actions/ are available.
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre

      - run: |
          export TORCH_SPYRE_DIR="$GITHUB_WORKSPACE/torch-spyre"
          ls -la "$TORCH_SPYRE_DIR"
          echo "TORCH_SPYRE_DIR $TORCH_SPYRE_DIR"
          echo "TORCH_SPYRE_DIR=${TORCH_SPYRE_DIR}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/checkout-pytorch
        with:
          sha: ${{ inputs.pytorch_sha }}

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'

      - name: Install prebuilt torch-spyre
        uses: ./.github/actions/install-prebuilt-torch-spyre
        with:
          artifact_name: ${{ inputs.artifact_name }}
          run_id: ${{ inputs.source_run_id }}
          github_token: ${{ inputs.source_run_id != '' && github.token || '' }}

      # pytorch/pytorch dispatch path only (build_test_pytorch_source.yaml):
      # override the pinned pytorch-cpu wheel with the exact PyTorch build
      # torch-spyre's _C.so was compiled against.
      - name: Install prebuilt PyTorch
        if: ${{ inputs.pytorch_wheel_artifact_name != '' }}
        uses: ./.github/actions/install-prebuilt-pytorch
        with:
          artifact_name: ${{ inputs.pytorch_wheel_artifact_name }}
          run_id: ${{ inputs.source_run_id }}
          github_token: ${{ inputs.source_run_id != '' && github.token || '' }}

      - name: Derive report paths
        run: |
          REPORT_NAME="${{ matrix.suite.config }}"; REPORT_NAME="${REPORT_NAME%.yaml}.xml"
          echo "REPORT_NAME=${REPORT_NAME}" >> "$GITHUB_ENV"
          echo "REPORT_PATH=${GITHUB_WORKSPACE}/${REPORT_NAME}" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.suite.name }} tests
        uses: ./.github/actions/run-test-suite
        with:
          suite_name: ${{ matrix.suite.name }}
          config: tests/configs/upstream_tests_beta/${{ matrix.suite.config }}
          extra_test_flags: -v -m "not xfail" --mode=${{ inputs.mode }}
          junit_xml_path: ${{ env.REPORT_PATH }}
          report_name: ${{ env.REPORT_NAME }}

      # ---------------------------------------------------------------------------
      # Upload the JUnit XML as a GHA artifact so it can be downloaded and
      # ingested by the Spyre dashboard.
      #
      # if: always() ensures the report is uploaded even when tests fail —
      # a failed run is exactly when you most want the dashboard to show results.
      #
      # Artifact name matches the report filename so multiple matrix jobs don't
      # overwrite each other (each config produces a distinct name).
      # ---------------------------------------------------------------------------
      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.REPORT_NAME }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn   # warn (not fail) if pytest itself crashed
          retention-days: 90 # for now keep it for 90 days until we push to COS
