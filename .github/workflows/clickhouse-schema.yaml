name: clickhouse-schema

# Applies extensions/clickhouse-ingest/schema/ (and schema-ch-mgmt/ to its own database) to an empty throwaway server twice; the second
# pass must change nothing. Live databases are applied by the spyre-frameworks Jenkins job
# Spyre/ops/clickhouse-schema, never from here.
on:
  pull_request:
    paths:
      - extensions/clickhouse-ingest/schema/**
      - extensions/clickhouse-ingest/schema-ch-mgmt/**
      - extensions/clickhouse-ingest/spyre_clickhouse_ingest/**
      - extensions/clickhouse-ingest/tests/**
      - extensions/clickhouse-ingest/spyre_clickhouse_ingest/apply_schema.py
      - extensions/clickhouse-ingest/spyre_clickhouse_ingest/sandbox.py
      - extensions/clickhouse-ingest/tests/test_sandbox.py
      - extensions/clickhouse-ingest/spyre_clickhouse_ingest/sandbox_server.py
      - extensions/clickhouse-ingest/tests/test_sandbox_server.py
      - extensions/clickhouse-ingest/tests/test_kernel_rekey_migration.py
      - .github/workflows/clickhouse-schema.yaml

concurrency:
  group: clickhouse-schema-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        # Match prod's major.minor: the formatter output the drift check compares is versioned.
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_SKIP_USER_SETUP: '1'
        ports: [8123:8123]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Unit tests
        working-directory: extensions/clickhouse-ingest
        run: uv run --with pytest --with chdb python -m pytest -q tests
      - name: Apply to an empty database, then prove it converged
        working-directory: extensions/clickhouse-ingest
        # Scoped to this step: the unit tests assert on these variables being unset.
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: '8123'
          CLICKHOUSE_SECURE: '0'
          CLICKHOUSE_DB: default
        run: |
          set -euo pipefail
          curl -sf localhost:8123 --data-binary 'CREATE DATABASE v2'
          uv run python -m spyre_clickhouse_ingest.apply_schema --database v2
          uv run python -m spyre_clickhouse_ingest.apply_schema --database v2 --check

      - name: Apply ch_mgmt to an empty database, then prove it converged
        working-directory: extensions/clickhouse-ingest
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: '8123'
          CLICKHOUSE_SECURE: '0'
          CLICKHOUSE_DB: default
        run: |
          set -euo pipefail
          curl -sf localhost:8123 --data-binary 'CREATE DATABASE ch_mgmt'
          uv run python -m spyre_clickhouse_ingest.apply_schema --schema-dir schema-ch-mgmt --database ch_mgmt
          uv run python -m spyre_clickhouse_ingest.apply_schema --schema-dir schema-ch-mgmt --database ch_mgmt --check
      - name: Grant the ch_mgmt roles and check them
        working-directory: extensions/clickhouse-ingest
        run: |
          set -euo pipefail
          sed 's/--.*//' schema-ch-mgmt/roles/chlogins-roles.sql | tr '\n' ' ' | tr ';' '\n' |
            while IFS= read -r stmt; do
              if [ -n "${stmt// /}" ]; then curl -sf localhost:8123 --data-binary "$stmt"; fi
            done
          curl -sf localhost:8123 --data-binary "SELECT role_name, access_type, database, table
            FROM system.grants WHERE role_name LIKE 'dashboard_chlogins_%' ORDER BY ALL" > grants.actual
          printf '%b\n' \
            'dashboard_chlogins_reader\tSELECT\tch_mgmt\tlogin_events' \
            'dashboard_chlogins_reader\tSELECT\tch_mgmt\tlogin_requests' \
            'dashboard_chlogins_writer\tINSERT\tch_mgmt\tlogin_events' \
            'dashboard_chlogins_writer\tINSERT\tch_mgmt\tlogin_requests' \
            'dashboard_chlogins_writer\tSELECT\tch_mgmt\tlogin_events' \
            'dashboard_chlogins_writer\tSELECT\tch_mgmt\tlogin_requests' > grants.expected
          diff <(sort grants.expected) <(sort grants.actual)
