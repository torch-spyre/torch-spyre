name: push-model-ops-logs-to-clickhouse

# Triggers automatically when the nightly completes, OR manually so you can
# re-ingest any historical run by supplying its run ID.
#
# Follows tests-nightly, not a model-ops workflow of its own: the suites are now a
# `capability` tier of that nightly (see _test_matrix.yaml's model_ops job), so the run
# whose logs carry the model-ops output IS the tests-nightly run.
#
# This downloads EVERY job log in that run, so the nightly's regression suites arrive
# here too. parse_model_ops_logs.py discards them: it keys on the job name and accepts
# only names carrying a \bSpyre\b token (_suite_from_filename), which the model_ops jobs
# have and the regression matrix jobs do not. A nightly with no capability tier therefore
# parses to zero records, and the HAS_VARIANT_DATA guard below skips the ingest rather
# than overwriting good suites with empty ones.
on:
  workflow_run:
    workflows:
      - tests-nightly
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to parse and ingest
        required: true
        default: ''

concurrency:
  group: model-ops-ch-${{ github.event.workflow_run.id || inputs.gha_run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ingest:
    name: Parse model-ops logs -> ClickHouse
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'

    env:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}
      # Unset => the v2 write is a no-op, so this can deploy before the migration lands.
      CLICKHOUSE_DB_V2: ${{ secrets.CLICKHOUSE_DB_V2 }}
      INGEST_SCHEMA: both

      INGEST_COMPONENT: torch-spyre
      # The arch of the ANALYSED leg, not of this ingest job. See the note in
      # push-hw-diagnostics-to-clickhouse.yaml: arch is a run_id hash input.
      LEG_ARCH: x86_64

      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id        || inputs.gha_run_id }}
      TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name      || 'model-ops-tests' }}
      TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha   || github.sha }}

    steps:
      # -----------------------------------------------------------------
      # Sparse-checkout only the two scripts we need so the workspace is
      # kept minimal (same pattern as push-hw-diagnostics-to-clickhouse).
      # -----------------------------------------------------------------
      - name: Checkout scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/scripts/parse_model_ops_logs.py
            .github/scripts/ingest_model_ops.py
            # The ingest imports it; listing only the entry point fails the import at startup.
            extensions/clickhouse-ingest
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # latest-known, not "latest": it resolves to the newest uv whose checksum is
          # bundled INTO this setup-uv pin, resolved locally with no release lookup. A
          # just-published release is not yet mirrored on releases.astral.sh, so "latest"
          # 404s there and falls back to GitHub Releases, which rate-limits (429) once the
          # fleet requests it concurrently. Bumping setup-uv moves this version forward.
          version: latest-known

      - name: Setup venv
        run: |
          uv venv
          source .venv/bin/activate
          echo "VIRTUAL_ENV $VIRTUAL_ENV"

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          # Installed from this checkout, not a git URL, so the library is always the same commit
          # as the script importing it.
          CHLIB="${GITHUB_WORKSPACE}/extensions/clickhouse-ingest"
          if [ ! -f "${CHLIB}/pyproject.toml" ]; then
            echo "::error::spyre-clickhouse-ingest not found at ${CHLIB} -- the checkout step must" \
                 "sparse-checkout extensions/clickhouse-ingest with cone mode off."
            exit 1
          fi
          uv pip install clickhouse-connect regex "${CHLIB}"

      # actions4gh/setup-gh@v1.0.2 extracts the gh tarball but never lands
      # the binary on PATH before it calls `gh auth login`, so every job
      # fails with "spawn gh ENOENT" (upstream actions4gh/setup-gh#7, #11,
      # unresolved). Install gh directly instead; downstream steps already
      # set GH_TOKEN, which `gh` picks up implicitly, so no `gh auth login`
      # call is needed here.
      - name: Setup the GitHub CLI
        env:
          # Offline floor only: used when api.github.com can't be reached to resolve the
          # latest release, so a transient API failure degrades to a known-good gh instead
          # of failing the job.
          GH_CLI_VERSION_FLOOR: 2.98.0
        run: |
          set -euo pipefail
          # Track the latest gh release rather than a pin: nothing here depends on a
          # specific gh version, and a pin silently rots (this fleet had 2.92.0 and 2.97.0
          # drifting apart across workflows).
          GH_CLI_VERSION="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
                              | jq -r '.tag_name // empty' | sed 's/^v//')" || GH_CLI_VERSION=""
          if [ -z "$GH_CLI_VERSION" ]; then
            echo "api.github.com unreachable; flooring to ${GH_CLI_VERSION_FLOOR}"
            GH_CLI_VERSION="${GH_CLI_VERSION_FLOOR}"
          fi
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/gh-cli.tar.gz"
          mkdir -p "${RUNNER_TEMP}/gh-cli"
          tar -xzf "${RUNNER_TEMP}/gh-cli.tar.gz" -C "${RUNNER_TEMP}/gh-cli" --strip-components=1
          echo "${RUNNER_TEMP}/gh-cli/bin" >> "${GITHUB_PATH}"

      # -----------------------------------------------------------------
      # Download one raw log file per matrix job from the triggering run.
      # Each file is written to raw_logs/<idx>_<safe_job_name>.txt
      # (identical structure to what push-hw-diagnostics-to-clickhouse uses).
      # -----------------------------------------------------------------
      - name: Download job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p raw_logs

          # Only the model-ops jobs, and strip the reusable-workflow prefix from the name.
          #
          # The triggering run is the whole nightly (222 jobs), 17 of whose regression jobs
          # also carry a "Spyre" token ("Test Multi-Spyre Allgather", "Test Spyre") -- enough
          # to pass the parser's own \bSpyre\b filter and land as fake model-ops suites. So
          # select on the caller's job id, which is exact, not on the "Spyre" substring.
          #
          # The name is then reduced to the suite alone. A reusable workflow reports its jobs
          # as "<caller-job-id> / <job name>", and the parser derives suite_name from that
          # name verbatim -- so leaving the prefix on would write 'model-ops  GPT OSS 20B
          # Spyre' and break continuity with the 51,356 rows stored under 'GPT OSS 20B Spyre'.
          gh api \
            "/repos/${{ github.repository }}/actions/runs/${TRIGGERING_RUN_ID}/jobs" \
            --paginate \
            --jq '.jobs[]
                  | select(.name | startswith("model-ops / "))
                  | {id: .id, name: (.name | sub("^model-ops / "; ""))}' \
          > /tmp/jobs.jsonl

          if [ ! -s /tmp/jobs.jsonl ]; then
            echo "[info] no model-ops jobs in run ${TRIGGERING_RUN_ID} (no capability tier)."
          fi

          python3 - << 'PYEOF'
          import json, os, re, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          jobs = [json.loads(l) for l in open("/tmp/jobs.jsonl") if l.strip()]

          # gh 2.97.0 started refusing to emit a response body that contains
          # terminal escape sequences unless --allow-escape-sequences is passed,
          # and Actions job logs are full of them. Without the flag every
          # download exits 1 with an empty body, raw_logs/ stays empty and the
          # ingest is silently skipped. The flag does not exist before 2.97.0,
          # so probe for it rather than pinning a version.
          esc = subprocess.run(
              ["gh", "api", "--help"], capture_output=True, text=True
          ).stdout
          esc_flag = (
              ["--allow-escape-sequences"] if "--allow-escape-sequences" in esc else []
          )

          downloaded = 0
          for idx, j in enumerate(jobs):
              safe   = re.sub(r"[^\w\s\-\.]", "", j["name"]).strip()
              out    = f"raw_logs/{idx}_{safe}.txt"
              result = subprocess.run(
                  ["gh", "api", *esc_flag,
                   f"/repos/{repo}/actions/jobs/{j['id']}/logs"],
                  capture_output=True, env={**os.environ},
              )
              if result.returncode == 0 and result.stdout:
                  open(out, "wb").write(result.stdout)
                  downloaded += 1
                  print(f"  OK   {out}")
              else:
                  err = result.stderr.decode("utf-8", "replace").strip()
                  print(f"  SKIP {j['name']} (rc={result.returncode}): {err}")

          print(f"[info] downloaded {downloaded}/{len(jobs)} job logs")

          # Every completed run has at least one job with a log, so zero
          # downloads means the download mechanism itself broke -- not that the
          # nightly produced nothing. Fail loudly here; otherwise the
          # empty-data guard downstream skips the ingest and the job still
          # reports success, which is how this outage stayed green for days.
          if jobs and downloaded == 0:
              print(f"::error::downloaded 0 of {len(jobs)} job logs -- aborting")
              sys.exit(1)
          PYEOF

      # -----------------------------------------------------------------
      # Parse the raw logs:
      #   • model_ops_log.txt        — cleaned plain-text combined log
      #   • $JSON_FILE               — structured JSON for ClickHouse
      # -----------------------------------------------------------------
      - name: Parse logs
        run: |
          source .venv/bin/activate

          SAFE_WF=$(echo "${TRIGGERING_WORKFLOW}" | tr ' ' '_')
          JSON_FILE="model_ops_${SAFE_WF}_${TRIGGERING_RUN_ID}.json"
          echo "JSON_FILE=${JSON_FILE}" >> "$GITHUB_ENV"

          LOG_FILE="model_ops_log_${TRIGGERING_SHA}_${TRIGGERING_RUN_ID}.txt"
          echo "LOG_FILE=${LOG_FILE}" >> "$GITHUB_ENV"

          python3 .github/scripts/parse_model_ops_logs.py \
            --log-dir raw_logs \
            --run-id  "${TRIGGERING_RUN_ID}" \
            --out     "${JSON_FILE}" \
            --log-out "${LOG_FILE}"

          # Guard: skip ingest when parse produced no variant data (all-zero suites).
          # This happens when GHA job logs are not yet available or the test run had
          # no parseable XPASS/XFAIL lines (e.g. the run was still in progress when
          # the ingest workflow triggered).
          TOTAL_VARIANTS=$(python3 -c "
          import json, sys
          try:
              recs = json.load(open('${JSON_FILE}'))
              total = sum(
                  len(op.get('variants', []))
                  for r in recs
                  for cat in (r.get('operations') or {}).values()
                  for op in (cat if isinstance(cat, list) else [])
              )
              print(total)
          except Exception as e:
              print(0)
          " 2>/dev/null || echo 0)

          echo "TOTAL_VARIANTS=${TOTAL_VARIANTS}" >> "$GITHUB_ENV"
          echo "[info] Total parsed variants: ${TOTAL_VARIANTS}"
          if [ "${TOTAL_VARIANTS}" -eq 0 ]; then
            echo "HAS_VARIANT_DATA=false" >> "$GITHUB_ENV"
            echo "[warn] No variant data found in parsed JSON — skipping ClickHouse ingest to avoid overwriting good data with empty suites."
          else
            echo "HAS_VARIANT_DATA=true" >> "$GITHUB_ENV"
          fi

      # -----------------------------------------------------------------
      # Ingest the JSON into ClickHouse (creates the table if absent).
      # Skipped when the parse step produced no variant data.
      # -----------------------------------------------------------------
      - name: Ingest into ClickHouse
        if: env.HAS_VARIANT_DATA == 'true'
        run: |
          source .venv/bin/activate
          # --trigger-type is the RUN's test_type (a run_id hash input), not the capability
          # analysis name -- the writer passes 'model_ops' for that itself.
          python3 .github/scripts/ingest_model_ops.py \
            --json-file    "${JSON_FILE}" \
            --workflow     "${TRIGGERING_WORKFLOW}" \
            --branch       "${TRIGGERING_BRANCH}" \
            --sha          "${TRIGGERING_SHA}" \
            --run-id       "${TRIGGERING_RUN_ID}" \
            --schema       "${INGEST_SCHEMA}" \
            --component    "${INGEST_COMPONENT}" \
            --arch         "${LEG_ARCH}" \
            --gha-run-id   "${TRIGGERING_RUN_ID}" \
            --trigger-type capability

      # -----------------------------------------------------------------
      # Upload both artefacts so you can inspect them without re-running.
      # if: always() ensures upload even when the ingest step fails.
      # -----------------------------------------------------------------
      - name: Upload Logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model_ops_log_${{ env.TRIGGERING_SHA }}_${{ env.TRIGGERING_RUN_ID }}
          path: ${{ env.LOG_FILE }}
          retention-days: 10

      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.JSON_FILE }}
          path: ${{ env.JSON_FILE }}
          retention-days: 10

      - name: Summary
        if: always()
        run: |-
          SUITE_COUNT=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('${JSON_FILE}'))
              passed  = sum(1 for r in data if r.get('outcome') == 'passed')
              failed  = sum(1 for r in data if r.get('outcome') == 'failed')
              error   = sum(1 for r in data if r.get('outcome') == 'error')
              unknown = sum(1 for r in data if r.get('outcome') == 'unknown')
              print(f'{len(data)}|{passed}|{failed}|{error}|{unknown}')
          except Exception:
              print('0|0|0|0|0')
          " 2>/dev/null || echo '0|0|0|0|0')

          IFS='|' read -r TOTAL PASSED FAILED ERROR UNKNOWN <<< "${SUITE_COUNT}"
          {
            echo "### Model-Ops ClickHouse Ingest Summary"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Triggering workflow | ${TRIGGERING_WORKFLOW} |"
            echo "| Triggering run ID   | ${TRIGGERING_RUN_ID} |"
            echo "| Branch              | ${TRIGGERING_BRANCH} |"
            echo "| Commit SHA          | ${TRIGGERING_SHA:0:12} |"
            echo "| Total suites        | ${TOTAL} |"
            echo "| Passed              | ${PASSED} |"
            echo "| Failed              | ${FAILED} |"
            echo "| Error               | ${ERROR} |"
            echo "| Unknown             | ${UNKNOWN} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
