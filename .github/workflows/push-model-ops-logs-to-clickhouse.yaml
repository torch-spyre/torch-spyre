name: push-model-ops-logs-to-clickhouse

# Feeds the v1 model_ops tables from the model-ops job logs of a trunk `tests` run, until the
# dashboard reads v2. The v2 capability verdicts are not written here: the suites record them
# as JUnit capability.* properties, which push-to-clickhouse ingests with the rest of the run.
# Also runs manually, to re-ingest a historical run by its ID.
on:
  workflow_run:
    workflows:
      - tests
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to parse and ingest
        required: true
        default: ''

concurrency:
  group: model-ops-ch-${{ github.event.workflow_run.id || inputs.gha_run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ingest:
    name: Parse model-ops logs -> ClickHouse
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion != 'cancelled')

    env:
      # The arch of the ANALYSED leg, not of this ingest job. See the note in
      # push-hw-diagnostics-to-clickhouse.yaml: arch is a run_id hash input.
      LEG_ARCH: x86_64

      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id        || inputs.gha_run_id }}
      TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha   || github.sha }}

    steps:
      # Checkout so ./.github/actions/... resolves; the action itself locates or
      # sparse-checks-out the scripts and library it actually needs.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Ingest model-ops capability logs into ClickHouse
        id: ingest
        uses: ./.github/actions/ingest-model-ops-to-clickhouse
        with:
          gha-run-id: ${{ env.TRIGGERING_RUN_ID }}
          branch: ${{ env.TRIGGERING_BRANCH }}
          sha: ${{ env.TRIGGERING_SHA }}
          arch: ${{ env.LEG_ARCH }}
          schema: v1
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          clickhouse-host: ${{ secrets.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ secrets.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ secrets.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ secrets.CLICKHOUSE_DB }}
          # Unset => the v2 write is a no-op, so this can deploy before the migration lands.
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}

      - name: Upload Logs artifact
        if: always() && steps.ingest.outputs.log-file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model_ops_log_${{ env.TRIGGERING_SHA }}_${{ env.TRIGGERING_RUN_ID }}
          path: ${{ steps.ingest.outputs.log-file }}
          retention-days: 10

      - name: Upload JSON artifact
        if: always() && steps.ingest.outputs.json-file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.ingest.outputs.json-file }}
          path: ${{ steps.ingest.outputs.json-file }}
          retention-days: 10

      - name: Summary
        if: always() && steps.ingest.outputs.json-file != ''
        run: |-
          SUITE_COUNT=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('${{ steps.ingest.outputs.json-file }}'))
              passed  = sum(1 for r in data if r.get('outcome') == 'passed')
              failed  = sum(1 for r in data if r.get('outcome') == 'failed')
              error   = sum(1 for r in data if r.get('outcome') == 'error')
              unknown = sum(1 for r in data if r.get('outcome') == 'unknown')
              print(f'{len(data)}|{passed}|{failed}|{error}|{unknown}')
          except Exception:
              print('0|0|0|0|0')
          " 2>/dev/null || echo '0|0|0|0|0')

          IFS='|' read -r TOTAL PASSED FAILED ERROR UNKNOWN <<< "${SUITE_COUNT}"
          {
            echo "### Model-Ops ClickHouse Ingest Summary"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Triggering run ID   | ${TRIGGERING_RUN_ID} |"
            echo "| Branch              | ${TRIGGERING_BRANCH} |"
            echo "| Commit SHA          | ${TRIGGERING_SHA:0:12} |"
            echo "| Total suites        | ${TOTAL} |"
            echo "| Passed              | ${PASSED} |"
            echo "| Failed              | ${FAILED} |"
            echo "| Error               | ${ERROR} |"
            echo "| Unknown             | ${UNKNOWN} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
