name: spyre-ci

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  # Set initial status when PR is opened/reopened (not on synchronize)
  set-initial-status:
    name: Set Initial Spyre CI Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    steps:
      - name: Set awaiting trigger status
        uses: actions/github-script@v7
        with:
          script: |-
            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request.head.sha,
                state: 'pending',
                context: 'spyre-ci',
                description: 'Awaiting test trigger - comment "bot:test" to run'
              });
            } catch (error) {
              core.setFailed(`Failed to set commit status: ${error.message}`);
              throw error;
            }
