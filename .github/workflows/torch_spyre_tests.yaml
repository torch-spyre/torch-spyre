name: tests

# One of torch-spyre's four "trunk" (push-to-main) workflows -- see
# model_ops_tests.yaml, upstream_tests.yaml, upstream_tests_beta.yaml for the
# others. A push run passes test_type: trunk (below) so it's distinguishable
# from a manually-dispatched regression run once tier-tagging reaches ClickHouse.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to check out and test
        required: false
        type: string
        default: ''
      repository:
        description: Full clone URL of the fork to check out (e.g. "https://github.com/myuser/torch-spyre.git"); leave empty for the base repo
        required: true
        type: string
        default: ''
      pr_url_hash:
        description: |
          Hash of the full URL of the PR that triggered this run.
          Required when triggered by an external PR.
        required: true
        type: string
      rpm_location:
        description: The Artifactory location where to download the RPM from
        required: false
        type: string
        default: ''
      rpm_names:
        description: A space separated list of RPM names to download and install
        required: false
        type: string
        default: ''
      build_torch_spyre:
        description: Whether to re-build torch-spyre after installing the RPM
        required: false
        type: boolean
        default: true
      runner_label:
        description: |
          Per-PR ephemeral runner-set IMAGE label to select
          (image_spyre_backend_pr_<component>_<sha12>, e.g. image_spyre_backend_pr_flex_8ddcf3e155e9).
          Empty = use the standing image_spyre_backend set (the RPM is then installed at
          runtime via rpm_names; the ephemeral flow leaves this set and rpm_names empty).
        required: false
        type: string
        default: ''
      test_type:
        description: >-
          Suite subset to run: smoke | unit | integration | regression |
          trunk | suite_<group> | <label>.
          Default: regression (every config labeled for full functional
          coverage).
        required: false
        type: string
        default: regression

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.html_url) || (github.event_name == 'workflow_dispatch'
    && inputs.pr_url_hash != '' && inputs.pr_url_hash) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: read # so that gh pr view can fetch the file list

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: changes
  #
  # Runs on every PR and merge-queue check. Delegates to the shared
  # detect-doc-only-change composite action, which checks if any file outside
  # tests/docs/, docs/, README.md, or CODEOWNERS was modified.
  #
  # code_changed=true  --> non-doc files changed  --> run tests
  # code_changed=false --> only doc/CODEOWNERS files changed --> skip tests
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      integration_labeled: ${{ steps.label.outputs.labeled }}
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Check which paths changed
        id: filter
        uses: ./.github/actions/detect-doc-only-change

      - name: Check for the integration-test label
        id: label
        uses: ./.github/actions/detect-integration-test-label

  # ---------------------------------------------------------------------------
  # Job 2: delegate to the shared test matrix
  #
  # Only runs when `changes.code_changed == 'true'`. For docs-only PRs the
  # reusable workflow is never invoked — no hardware runners are consumed.
  # Also skipped when `integration-test` is labeled -- spyre-frameworks' Jenkins
  # integration run owns this commit's testing instead. Read via the composite
  # action, NOT `github.event.pull_request.labels`: a merge_group payload has no
  # pull_request object, so the inline expression is always false in the queue and
  # the whole suite re-ran there -- on one measured merge-queue commit that was
  # 815 GHA check-runs / ~21 h of runner time re-testing what the PR just passed.
  # ---------------------------------------------------------------------------
  run-tests:
    needs: changes
    if: |
      needs.changes.outputs.code_changed == 'true' &&
      needs.changes.outputs.integration_labeled != 'true'
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      runner_label: linux
      # Per-PR ephemeral image label when provided, else the standing set.
      image_label: ${{ inputs.runner_label || 'image_spyre_backend' }}
      extra_test_flags: -v -m "not xfail"
      extra_test_flags_multi_spyre: -v
      checkout_pytorch: false
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}
      rpm_location: ${{ inputs.rpm_location || '' }}
      rpm_names: ${{ inputs.rpm_names || '' }}
      build_torch_spyre: ${{ inputs.build_torch_spyre == true }}
      test_type: ${{ inputs.test_type || (github.event_name == 'push' && 'trunk' || 'regression') }}
    # ClickHouse connection for the perf job's inline ingest (a no-op here in
    # practice: perf is non-PR-gated and this workflow's test_type is never
    # perf). Forwarded for consistency with the other _test_matrix callers.
    secrets:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}

  # ---------------------------------------------------------------------------
  # Job 3: run-spyre-unit-tests (required check gate)
  #
  # This job name MUST match the branch protection required check exactly:
  #   "tests / Run Spyre unit tests"
  #
  # It fans in the reusable workflow result. Three outcomes are handled:
  #
  #   run-tests result = success -> all suites passed      -> green
  #   run-tests result = skipped -> docs-only PR, no tests -> green (instant)
  #   run-tests result = failure -> one or more suites bad -> red   (blocks merge)
  #
  # This job must ALWAYS run, including for an `integration-test`-labeled commit:
  # it is a REQUIRED check, and a required check that is skipped is reported as
  # MISSING rather than green, which blocks the merge queue outright. So when the
  # label hands testing to Jenkins, run-tests is skipped but this gate still runs
  # and reports green -- Jenkins publishes its own verdict separately.
  # ---------------------------------------------------------------------------
  run-spyre-unit-tests:
    name: Run Spyre unit tests
    runs-on: ubuntu-latest
    needs: [changes, run-tests]
    if: always()
    steps:
      - name: Evaluate test results
        run: |-
          RESULT="${{ needs.run-tests.result }}"
          echo "run-tests result: ${RESULT}"

          if [[ "${{ needs.changes.outputs.integration_labeled }}" == "true" ]]; then
            echo "integration-test label set -- the Jenkins integration run owns this"
            echo "commit's testing and reports its own check. Passing this required"
            echo "gate so the merge queue is not blocked by a missing check."
            exit 0
          fi

          if [[ "${RESULT}" == "success" ]]; then
            echo "All test suites passed."
            exit 0
          fi

          if [[ "${RESULT}" == "skipped" ]]; then
            echo "Tests skipped — docs-only change, no test-relevant files modified."
            exit 0
          fi

          echo "One or more test suites failed or were cancelled."
          exit 1
