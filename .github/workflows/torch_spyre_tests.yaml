name: tests

# One of torch-spyre's four "trunk" (push-to-main) workflows -- see
# model_ops_tests.yaml, upstream_tests.yaml, upstream_tests_beta.yaml for the
# others. A push run passes test_type: trunk (below) so it's distinguishable
# from a manually-dispatched regression run once tier-tagging reaches ClickHouse.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to check out and test
        required: false
        type: string
        default: ''
      repository:
        description: Full clone URL of the fork to check out (e.g. "https://github.com/myuser/torch-spyre.git"); leave empty for the base repo
        required: true
        type: string
        default: ''
      pr_url_hash:
        description: |
          Hash of the full URL of the PR that triggered this run.
          Required when triggered by an external PR.
        required: true
        type: string
      rpm_location:
        description: The Artifactory location where to download the RPM from
        required: false
        type: string
        default: ''
      rpm_names:
        description: A space separated list of RPM names to download and install
        required: false
        type: string
        default: ''
      build_torch_spyre:
        description: Whether to re-build torch-spyre after installing the RPM
        required: false
        type: boolean
        default: true
      runner_label:
        description: |
          Per-PR ephemeral runner-set IMAGE label to select
          (image_spyre_backend_pr_<component>_<sha12>, e.g. image_spyre_backend_pr_flex_8ddcf3e155e9).
          Empty = use the standing image_spyre_backend set (the RPM is then installed at
          runtime via rpm_names; the ephemeral flow leaves this set and rpm_names empty).
        required: false
        type: string
        default: ''
      test_type:
        description: >-
          Suite subset to run: smoke | unit | integration | regression |
          trunk | suite_<group> | <label>.
          Default: regression (every config labeled for full functional
          coverage).
        required: false
        type: string
        default: regression

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.pull_request.html_url) || (github.event_name == 'workflow_dispatch'
    && inputs.pr_url_hash != '' && inputs.pr_url_hash) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: read # so that gh pr view can fetch the file list

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: changes
  #
  # Runs on every PR and merge-queue check. Delegates to the shared
  # detect-doc-only-change composite action, which checks if any file outside
  # tests/docs/, docs/, extensions/clickhouse-ingest/docs/, README.md,
  # extensions/clickhouse-ingest/README.md, or CODEOWNERS was modified.
  #
  # code_changed=true  --> non-doc files changed  --> run tests
  # code_changed=false --> only doc/CODEOWNERS files changed --> skip tests
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      integration_labeled: ${{ steps.label.outputs.labeled }}
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Check which paths changed
        id: filter
        uses: ./.github/actions/detect-doc-only-change

      - name: Check for the integration-test label
        id: label
        uses: ./.github/actions/detect-integration-test-label

  # ---------------------------------------------------------------------------
  # Job 2: delegate to the shared test matrix
  #
  # Only runs when `changes.code_changed == 'true'`. For docs-only PRs the
  # reusable workflow is never invoked — no hardware runners are consumed.
  # Also skipped when `integration-test` is labeled -- spyre-frameworks' Jenkins
  # integration run owns this commit's testing instead. Read via the composite
  # action, NOT `github.event.pull_request.labels`: a merge_group payload has no
  # pull_request object, so the inline expression is always false in the queue and
  # the whole suite re-ran there -- on one measured merge-queue commit that was
  # 815 GHA check-runs / ~21 h of runner time re-testing what the PR just passed.
  # ---------------------------------------------------------------------------
  run-tests:
    needs: changes
    # Also skipped once auto_merge is enabled on the PR, and for every merge-queue run -- native GHA checks aren't required there; the gate below still reports green since "skipped" isn't a failure.
    # Repo variable GHA_FULL_MERGE_QUEUE_TESTS=true lifts the label and merge-queue skips so GHA runs the full suite;
    # GHA_TESTS_ON_AUTO_MERGE=true lifts the auto-merge skip on PRs.
    # Fork PR runs read every variable as empty, so these skips apply to them as if the variables were unset, never more tests than a same-repo PR.
    if: |
      needs.changes.outputs.code_changed == 'true' &&
      (needs.changes.outputs.integration_labeled != 'true' || vars.GHA_FULL_MERGE_QUEUE_TESTS == 'true') &&
      !(github.event_name == 'pull_request' && github.event.pull_request.auto_merge != null && vars.GHA_TESTS_ON_AUTO_MERGE != 'true') &&
      (github.event_name != 'merge_group' || vars.GHA_FULL_MERGE_QUEUE_TESTS == 'true')
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      runner_label: linux
      # Per-PR ephemeral image label when provided, else the merge-queue or
      # standing set for this event.
      image_label: ${{ inputs.runner_label || (github.event_name == 'merge_group' && 'image_spyre_backend_mq') || 'image_spyre_backend' }}
      # xfail-marked tests run here too. A strict xfail that starts passing fails
      # the run, and an intermittent one should be marked non-strict
      # (`expect_fail_unstable`), which keeps it an xfail and reports its XPASS.
      extra_test_flags: -v
      extra_test_flags_multi_spyre: -v
      checkout_pytorch: false
      ref: ${{ inputs.ref || '' }}
      repository: ${{ inputs.repository || '' }}
      rpm_location: ${{ inputs.rpm_location || '' }}
      rpm_names: ${{ inputs.rpm_names || '' }}
      build_torch_spyre: ${{ inputs.build_torch_spyre == true }}
      test_type: ${{ inputs.test_type || (github.event_name == 'push' && 'trunk' || 'regression') }}
    # ClickHouse connection for the perf job's inline ingest (a no-op here in
    # practice: perf is non-PR-gated and this workflow's test_type is never
    # perf). Forwarded for consistency with the other _test_matrix callers.
    secrets:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_DB_V2: ${{ secrets.CLICKHOUSE_DB_V2 }}
      CLICKHOUSE_V2_HOST: ${{ secrets.CLICKHOUSE_V2_HOST }}
      CLICKHOUSE_V2_PORT: ${{ secrets.CLICKHOUSE_V2_PORT }}
      CLICKHOUSE_V2_USER: ${{ secrets.CLICKHOUSE_V2_USER }}
      CLICKHOUSE_V2_PASSWORD: ${{ secrets.CLICKHOUSE_V2_PASSWORD }}

  # ---------------------------------------------------------------------------
  # Job 3: run-spyre-unit-tests (advisory test-result gate)
  #
  # Advisory: the only ruleset (main, release-0.5, merge queue included) requires
  # "linters" and "Spyre Test (amd64)", not this job. Keep `if: always()` so it
  # still reports when run-tests is skipped.
  #
  # It fans in the reusable workflow result. Three outcomes are handled:
  #
  #   run-tests result = success -> all suites passed      -> green
  #   run-tests result = skipped -> docs-only PR, no tests -> green (instant)
  #   run-tests result = failure -> one or more suites bad -> red
  # ---------------------------------------------------------------------------
  run-spyre-unit-tests:
    name: Run Spyre unit tests
    runs-on: ubuntu-latest
    needs: [changes, run-tests]
    if: always()
    steps:
      - name: Evaluate test results
        run: |-
          RESULT="${{ needs.run-tests.result }}"
          echo "run-tests result: ${RESULT}"

          if [[ "${{ needs.changes.outputs.integration_labeled }}" == "true" && "${RESULT}" == "skipped" ]] && ${{ vars.GHA_FULL_MERGE_QUEUE_TESTS != 'true' }}; then
            echo "integration-test label set -- the Jenkins integration run owns this"
            echo "commit's testing and reports its own check. Passing this required"
            echo "gate so the merge queue is not blocked by a missing check."
            exit 0
          fi

          if [[ "${RESULT}" == "success" ]]; then
            echo "All test suites passed."
            exit 0
          fi

          if [[ "${RESULT}" == "skipped" ]]; then
            echo "Tests skipped — docs-only change, no test-relevant files modified."
            exit 0
          fi

          echo "One or more test suites failed or were cancelled."
          exit 1

  # Replaces Jenkins' downstream fan-out in the merge queue: hf-adapters' integration suite runs on its main
  # against this commit's torch-spyre and gates "Spyre Test (amd64)".
  downstream-hf-adapters:
    name: Integration (hf-adapters)
    needs: [changes, decide-spyre-test]
    if: github.event_name == 'merge_group' && needs.decide-spyre-test.outputs.owns == 'true' && needs.decide-spyre-test.outputs.downstream == 'true' &&
      needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      # Default branch: the dispatch action is not taken from the queued change.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.SPYRE_CI_APP_ID }}
          private-key: ${{ secrets.SPYRE_CI_PRIVATE_KEY }}
          owner: torch-spyre
          repositories: hf-adapters
          permission-actions: write
      - uses: ./.github/actions/dispatch-downstream-integration
        with:
          repository: torch-spyre/hf-adapters
          extra_inputs: '{}'
          token: ${{ steps.app-token.outputs.token }}
          torch_spyre_ref: ${{ github.sha }}
          hash_source: ${{ github.event.merge_group.head_ref }}
          merge_group_ref: ${{ github.event.merge_group.head_ref }}

  # Informational twin of the job above: dispatched and linked in the run summary but never awaited, and deliberately
  # not in the gate's needs, so a slow or hung run can neither delay nor fail the gate.
  downstream-spyre-inference:
    name: Integration (spyre-inference) - dispatched, not awaited
    needs: [changes, decide-spyre-test]
    if: github.event_name == 'merge_group' && needs.decide-spyre-test.outputs.owns == 'true' && needs.decide-spyre-test.outputs.downstream == 'true' &&
      needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      # Default branch: the dispatch action is not taken from the queued change.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.SPYRE_CI_APP_ID }}
          private-key: ${{ secrets.SPYRE_CI_PRIVATE_KEY }}
          owner: torch-spyre
          repositories: spyre-inference
          permission-actions: write
      - uses: ./.github/actions/dispatch-downstream-integration
        with:
          repository: torch-spyre/spyre-inference
          extra_inputs: '{"image_rpms":"true"}'
          wait: 'false'
          token: ${{ steps.app-token.outputs.token }}
          torch_spyre_ref: ${{ github.sha }}
          hash_source: ${{ github.event.merge_group.head_ref }}
          merge_group_ref: ${{ github.event.merge_group.head_ref }}

  # Reads the variables once, so the downstream jobs and the gate below cannot disagree about them if
  # they are flipped while a run is in flight.
  decide-spyre-test:
    name: Decide whether GHA owns the check
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || github.event_name == 'pull_request'
    outputs:
      owns: ${{ steps.v.outputs.owns }}
      downstream: ${{ steps.v.outputs.downstream }}
    steps:
      - id: v
        env:
          OWNS: ${{ vars.GHA_FULL_MERGE_QUEUE_TESTS == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && (github.event.pull_request.auto_merge
            == null || vars.GHA_TESTS_ON_AUTO_MERGE == 'true'))) }}
          DOWNSTREAM: ${{ vars.GHA_DOWNSTREAM_INTEGRATION == 'true' }}
        run: |
          {
            echo "owns=${OWNS}"
            echo "downstream=${DOWNSTREAM}"
          } >> "$GITHUB_OUTPUT"

  # Posts the required "Spyre Test (amd64)" context on merge-queue entries and on PRs where GHA ran
  # the suite and owns the check; the name only matches then, so a skipped run can never satisfy it.
  # THIS name must match the ruleset exactly: rename either arm of the `name:`
  # below and the required check goes MISSING, blocking every merge.
  merge-queue-spyre-test:
    name: ${{ needs.decide-spyre-test.outputs.owns == 'true' && 'Spyre Test (amd64)' || 'gha-merge-queue-tests (inactive)' }}
    runs-on: ubuntu-latest
    needs: [decide-spyre-test, changes, run-tests, downstream-hf-adapters]
    if: always() && (github.event_name == 'merge_group' || github.event_name == 'pull_request')
    steps:
      # Fork PR runs cannot read repo variables, so the owns decision above is false for them. spyre_test_status.yaml
      # runs in the base repo, applies the variables there and posts the PR-head status from this verdict.
      - name: Record the suite verdict
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          RUN_TESTS: ${{ needs.run-tests.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_TESTS" = success ]; then verdict=success
          elif [ "$RUN_TESTS" = skipped ] && [ "$CHANGES" = success ] && [ "$CODE_CHANGED" = false ]; then verdict=success
          elif [ "$RUN_TESTS" = skipped ] && [ "$CHANGES" = success ]; then verdict=skipped
          else verdict=failure
          fi
          echo "verdict=${verdict}"
          printf '%s %s' "$verdict" "$ATTEMPT" > verdict.txt
      - name: Upload the suite verdict
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Attempt-scoped: the artifacts API lists every attempt's uploads, so a
          # shared name would let attempt 1's verdict stand in for attempt 2's.
          name: spyre-test-verdict-${{ github.run_attempt }}
          path: verdict.txt
          retention-days: 1
          overwrite: true
      - name: GHA does not own this check here
        if: ${{ needs.decide-spyre-test.outputs.owns != 'true' }}
        run: echo "Jenkins owns the Spyre Test (amd64) check here."
      - name: Check all suites passed
        if: ${{ needs.decide-spyre-test.outputs.owns == 'true' }}
        run: |-
          # run-tests may only be skipped for a docs-only change; a failed `changes` job also skips it.
          if ${{ (needs.run-tests.result == 'success' || (needs.run-tests.result == 'skipped' && needs.changes.result == 'success' && needs.changes.outputs.code_changed == 'false')) && (github.event_name != 'merge_group' || needs.decide-spyre-test.outputs.downstream != 'true' || needs.downstream-hf-adapters.result == 'success' || (needs.changes.result == 'success' && needs.changes.outputs.code_changed == 'false')) }}; then
            echo "All test suites passed."
            exit 0
          fi
          echo "Test suites failed, were cancelled, or did not run."
          exit 1
