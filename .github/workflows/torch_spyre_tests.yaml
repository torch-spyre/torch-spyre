name: tests

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to check out and test
        required: false
        type: string
        default: ''
      rpm_location:
        description: The Artifactory location where to download the RPM from
        required: false
        type: string
        default: ''
      rpm_names:
        description: A space separated list of RPM names to download and install
        required: false
        type: string
        default: ''
      build_torch_spyre:
        description: Whether to re-build torch-spyre after installing the RPM
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: read # so that gh pr view can fetch the file list

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: changes
  #
  # Runs on every PR. Uses gh CLI to fetch the full list of changed files
  # and checks if any file outside tests/docs/, docs/, or README.md was modified.
  #
  # code_changed=true  --> non-doc files changed  --> run tests
  # code_changed=false --> only doc files changed --> skip tests
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - name: Check which paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On pull_request events, fetch the full list of changed files via
          # the GitHub API. On push to main/tag or workflow_dispatch, assume
          # tests should always run since we don't have a PR to query.
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            FILES=$(gh pr view ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --json files --jq '.files[].path')
          else
            # push to main, tag, or manual dispatch -- always run tests
            FILES="non-doc-change"
          fi

          echo "Changed files:"
          echo "$FILES"

          # Check if any changed file is outside the doc directories.
          # tests/docs/, docs/, and README.md are the only paths that should skip tests.
          NON_DOC=$(echo "$FILES" | grep -v '^tests/docs/' | grep -v '^docs/' | grep -v '^README\.md$' || true)

          if [[ -z "$NON_DOC" ]]; then
            echo "Only doc files changed — skipping tests."
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Non-doc files changed — running tests."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: delegate to the shared test matrix
  #
  # Only runs when `changes.code_changed == 'true'`. For docs-only PRs the
  # reusable workflow is never invoked — no hardware runners are consumed.
  # ---------------------------------------------------------------------------
  run-tests:
    name: Run test matrix
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      runner_label: linux_for_pr_tests
      extra_test_flags: -v
      checkout_pytorch: false
      torch_root: ''
      ref: ${{ inputs.ref || '' }}
      rpm_location: ${{ inputs.rpm_location || '' }}
      rpm_names: ${{ inputs.rpm_names || '' }}
      build_torch_spyre: ${{ inputs.build_torch_spyre == true }}
