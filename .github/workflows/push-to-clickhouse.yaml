name: push-to-clickhouse

# Runs automatically after model-module-tests,upstream-tests completes etc.
# Also supports manual dispatch for re-ingesting a specific run.
on:
  workflow_run:
    workflows:
      - model-module-tests
      - upstream-pytorch-tests
      - model-ops-tests
      - tests # covers torch spyre tests
      - integration-tests # amd64 arch_override dispatch target from spyre-frameworks
      # to add more workflows
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to re-ingest (leave blank to skip)
        required: false
        default: ''
      workflow_name:
        description: Workflow name (model-module-tests | upstream-tests | model-ops-tests | integration-tests)
        required: false
        default: upstream-pytorch-tests
      clickhouse_env:
        description: >-
          ClickHouse instance for a MANUAL re-ingest: "prod" (the CLICKHOUSE_*
          secret set) or "dev" (the CLICKHOUSE_*_DEV set). Default prod. Lets a
          manual re-ingest target dev WITHOUT editing this file and pushing to
          main (see the env block below). The automatic workflow_run path always
          uses prod: for a workflow_run event this input is empty, so the env
          ternary falls through to the prod secret set.
        required: false
        default: prod

concurrency:
  # Allow at most one ingest per triggering run (re-runs queue behind)
  group: ingest-${{ github.event.workflow_run.id || inputs.gha_run_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # needed to download artifacts from the triggering run

jobs:
  ingest:
    name: Ingest XML -> ClickHouse
    runs-on:
      - x86_64
      - spyre_pf_x0
      - linux
      - image_spyre_backend
    timeout-minutes: 15
    # Skip if the triggering workflow was cancelled (but ingest failures are fine)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'

    env:
      # ---------------------------------------------------------------------------
      # Set these secrets in your repo / org settings:
      #   CLICKHOUSE_HOST   e.g. clickhouse.internal.example.com
      #   CLICKHOUSE_PORT   e.g. 8123  (HTTP interface)
      #   CLICKHOUSE_USER   e.g. spyre_writer
      #   CLICKHOUSE_PASS   the password
      #   CLICKHOUSE_DB     e.g. spyre
      # ---------------------------------------------------------------------------

      # Instance selected by the clickhouse_env input: "dev" -> the *_DEV secret
      # set, anything else (incl. "prod" and the empty value a workflow_run event
      # sends) -> the plain PROD set. The `!= 'dev'` test (not `== 'prod'`) is
      # deliberate: it keeps the AUTOMATIC workflow_run path on prod, since that
      # event carries no input. A secret context key must be a literal name, so
      # this is a per-name ternary, not a computed `secrets[...]` lookup. This is
      # what lets a manual DEV re-ingest happen with no edit+push to main.
      CLICKHOUSE_HOST: ${{ inputs.clickhouse_env != 'dev' && secrets.CLICKHOUSE_HOST || secrets.CLICKHOUSE_HOST_DEV }}
      CLICKHOUSE_PORT: ${{ inputs.clickhouse_env != 'dev' && secrets.CLICKHOUSE_PORT || secrets.CLICKHOUSE_PORT_DEV }}
      CLICKHOUSE_USER: ${{ inputs.clickhouse_env != 'dev' && secrets.CLICKHOUSE_USER || secrets.CLICKHOUSE_USER_DEV }}
      CLICKHOUSE_PASS: ${{ inputs.clickhouse_env != 'dev' && secrets.CLICKHOUSE_PASS || secrets.CLICKHOUSE_PASS_DEV }}
      CLICKHOUSE_DB: ${{ inputs.clickhouse_env != 'dev' && secrets.CLICKHOUSE_DB || secrets.CLICKHOUSE_DB_DEV }}

      # Metadata about the triggering run
      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id || inputs.gha_run_id }}
      TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name || inputs.workflow_name }}
      TRIGGERING_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TRIGGERING_AT: ${{ github.event.workflow_run.created_at || '' }}
      # display_title carries "integration-tests (<test_type>)" via that workflow's
      # run-name: — this is the only way a workflow_run-triggered job can recover the
      # original dispatch tier (integration/regression/smoke/etc) without an extra API call.
      TRIGGERING_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title || '' }}
      # Triggering event (push/pull_request/schedule/workflow_dispatch/merge_group; empty on manual re-ingest) -- gates the PR-number lookup below.
      TRIGGERING_EVENT: ${{ github.event.workflow_run.event || '' }}


    steps:
      - name: Print TRIGERRING Envs
        run: |
          echo "All TRIGGERING_* vars:"
          env | grep TRIGGERING_
          which python3
          python3 --version

      # Check out the local composite action (and the ingest script it runs).
      # The uv/venv/deps/ingest steps that used to live here inline now live in
      # .github/actions/ingest-xml-to-clickhouse, shared with the perf job's
      # inline push so there is one ingest implementation. `uses: ./...`
      # resolves against the workspace, so the action tree must be present.
      - name: Checkout (for the composite action and ingest script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/actions
            .github/scripts/ingest_xml.py
          sparse-checkout-cone-mode: false

      # actions4gh/setup-gh@v1.0.2 extracts the gh tarball but never lands
      # the binary on PATH before it calls `gh auth login`, so every job
      # fails with "spawn gh ENOENT" (upstream actions4gh/setup-gh#7, #11,
      # unresolved). Install gh directly instead; downstream steps already
      # set GH_TOKEN, which `gh` picks up implicitly, so no `gh auth login`
      # call is needed here.
      - name: Setup the GitHub CLI
        env:
          GH_CLI_VERSION: 2.97.0
        run: |
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/gh-cli.tar.gz"
          mkdir -p "${RUNNER_TEMP}/gh-cli"
          tar -xzf "${RUNNER_TEMP}/gh-cli.tar.gz" -C "${RUNNER_TEMP}/gh-cli" --strip-components=1
          echo "${RUNNER_TEMP}/gh-cli/bin" >> "${GITHUB_PATH}"

      - name: Resolve PR number
        id: resolve-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An unconditional commit->PR lookup stamped a trunk/scheduled run with whatever PR previously merged that commit; only trust it for an actual pull_request-triggered run.
          if [[ "${TRIGGERING_EVENT}" == "pull_request" ]]; then
            PR=$(gh api \
              "/repos/${{ github.repository }}/commits/${TRIGGERING_SHA}/pulls" \
              --jq '.[0].number // 0')
          else
            PR=0
          fi
          echo "Resolved PR number: ${PR} (triggering event: ${TRIGGERING_EVENT:-<manual dispatch>})"
          echo "pr_number=${PR}" >> "${GITHUB_OUTPUT}"

      # ---------------------------------------------------------------------------
      # Download every artifact from the triggering run and unzip it. Artifact
      # *names* carry no file extension (only the file inside the zip does), so
      # filtering must happen post-unzip by actual filename, not by artifact
      # name — a `select(.name | endswith(".xml"))` here dropped every artifact.
      # The ingest step globs *.xml in the unzip dir, so non-XML files that come
      # along are simply ignored.
      #
      # `--paginate` is required: the artifacts endpoint defaults to 30 per
      # page, and a run with more jobs than that (e.g. the model-ops-tests /
      # integration-tests matrices) silently lost every artifact past the
      # first page, with no error — rows just never showed up in ClickHouse.
      # `--paginate` applies `--jq` per page and concatenates the filtered
      # results across pages (`gh api` rejects `--slurp` combined with
      # `--jq`), so the per-artifact objects come out as a JSON stream, not
      # a single array; python3 slurps that stream into one array below.
      # ---------------------------------------------------------------------------
      - name: List artifacts from triggering run
        id: list-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=$(gh api --paginate \
            "/repos/${{ github.repository }}/actions/runs/${TRIGGERING_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | {id: .id, name: .name}' \
            | python3 -c "import json,sys; print(json.dumps([json.loads(l) for l in sys.stdin if l.strip()]))")
          echo "artifacts=$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "Found artifacts:"
          echo "$ARTIFACTS" | python3 -c "import json,sys; [print(' •', a['name']) for a in json.load(sys.stdin)]"

      - name: Download XML artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p xml_artifacts
          export ARTIFACTS='${{ steps.list-artifacts.outputs.artifacts }}'
          python3 <<'PYEOF'
          import json, os, subprocess, sys
          artifacts = json.loads(os.environ['ARTIFACTS'])
          repo  = os.environ['GITHUB_REPOSITORY']
          for a in artifacts:
              print(f"Downloading: {a['name']} (id={a['id']})")
              with open(f"xml_artifacts/{a['name']}.zip", "wb") as f:
                result = subprocess.run([
                    "gh", "api",
                    f"/repos/{repo}/actions/artifacts/{a['id']}/zip",
                ], check=True, env={**os.environ}, capture_output=True)
                f.write(result.stdout)
              subprocess.run([
                  "unzip", "-o", f"xml_artifacts/{a['name']}.zip",
                  "-d", "xml_artifacts/"
              ], check=True)
          PYEOF
          echo "Downloaded XML files:"
          find xml_artifacts -name "*.xml" 2>/dev/null || echo "(none)"

      # ---------------------------------------------------------------------------
      # Parse each XML file and insert rows into ClickHouse.
      # The Python script is in .github/scripts/ingest_xml.py (see below).
      # ---------------------------------------------------------------------------
      - name: Extract suite tier from display title
        id: extract-tier
        run: |
          # display_title is "integration-tests (regression)" / "integration-tests (integration)" / etc.
          # Fall back to empty (ingest_xml.py defaults it to 'unknown') for manual workflow_dispatch
          # re-ingests or older runs whose display_title predates this convention.
          TIER=$(echo "${TRIGGERING_DISPLAY_TITLE}" | sed -n 's/.*(\(.*\))\s*$/\1/p')
          echo "Resolved tier: ${TIER:-<none>}"
          echo "tier=${TIER}" >> "${GITHUB_OUTPUT}"

      # Delegate the venv+deps+ingest to the shared composite action (the same
      # one the perf job uses for its inline push). The ClickHouse connection
      # comes from this job's env block above (DEV vs PROD toggle lives there);
      # no product checkout exists here, so the action sparse-checks-out the
      # script itself when torch-spyre-dir is not passed.
      - name: Ingest XML files into ClickHouse
        uses: ./.github/actions/ingest-xml-to-clickhouse
        with:
          xml-dir: xml_artifacts
          workflow: ${{ env.TRIGGERING_WORKFLOW }}
          branch: ${{ env.TRIGGERING_BRANCH }}
          sha: ${{ env.TRIGGERING_SHA }}
          gha-run-id: ${{ env.TRIGGERING_RUN_ID }}
          triggered-at: ${{ env.TRIGGERING_AT }}
          pr-number: ${{ steps.resolve-pr.outputs.pr_number }}
          trigger-type: ${{ steps.extract-tier.outputs.tier }}
          platform: x86_64
          clickhouse-host: ${{ env.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ env.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ env.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ env.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ env.CLICKHOUSE_DB }}

      - name: Summary
        if: always()
        run: |-
          XML_COUNT=$(find xml_artifacts -name "*.xml" 2>/dev/null | wc -l || echo 0)
          {
            echo "### ClickHouse Ingest Summary"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Triggering workflow | ${TRIGGERING_WORKFLOW} |"
            echo "| Triggering run ID   | ${TRIGGERING_RUN_ID} |"
            echo "| PR number           | ${{ steps.resolve-pr.outputs.pr_number }} |"
            echo "| Branch              | ${TRIGGERING_BRANCH} |"
            echo "| Commit SHA          | ${TRIGGERING_SHA:0:12} |"
            echo "| XML files ingested  | ${XML_COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"
