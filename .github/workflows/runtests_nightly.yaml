name: tests-nightly

on:
  schedule:
    - cron: 0 2 * * *

  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to check out and test
        required: false
        type: string
        default: ''
      rpm_location:
        description: The Artifactory location where to download the RPM from
        required: false
        type: string
        default: ''
      rpm_names:
        description: A space separated list of RPM names to download and install
        required: false
        type: string
        default: ''
      build_torch_spyre:
        description: Whether to re-build torch-spyre after installing the RPM
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # Delegate entirely to the shared test matrix.
  # Nightly always runs everything — no doc-skip logic needed.
  # ---------------------------------------------------------------------------
  run-tests:
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      runner_label: linux
      extra_test_flags: --cpu-compile -vvv -s
      checkout_pytorch: true
      ref: ${{ inputs.ref || '' }}
      rpm_location: ${{ inputs.rpm_location || '' }}
      rpm_names: ${{ inputs.rpm_names || '' }}
      build_torch_spyre: ${{ inputs.build_torch_spyre == true }}
    # ClickHouse connection for the perf job's inline ingest. Nightly is
    # schedule-triggered (never pull_request), so a nightly test_type=perf run
    # can ingest here. Forwarded explicitly, matching the other callers.
    secrets:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}

  # ---------------------------------------------------------------------------
  # Model-ops capability suites, as a tier of THIS nightly rather than a cron of
  # their own. The standalone model_ops_tests_nightly.yaml fired at the same
  # 0 2 * * *, rebuilt the same wheel two hours after the orchestrator built it,
  # and minted its own run_id -- so its results could not join artifact_results.
  # A separate call because test_type is per-call: the run above is `regression`.
  # ---------------------------------------------------------------------------
  model-ops:
    needs: [run-tests]
    # Independent signal, not gated on run-tests' outcome: needs: is here only to
    # order the wheel reuse below, and GitHub's default `needs` gating would
    # otherwise skip this whole tier -- and its nightly capability-drift coverage
    # -- the first time an unrelated regression-suite job fails or is cancelled.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_test_matrix.yaml
    with:
      runner_label: linux
      test_type: capability
      # -v only: the model-ops suites ran with plain -v under their own workflow, and
      # --cpu-compile would change what the capability verdicts MEAN (an op compiled for
      # the CPU is exactly the fallback these suites exist to detect).
      extra_test_flags: -v
      checkout_pytorch: true
      ref: ${{ inputs.ref || '' }}
      rpm_location: ${{ inputs.rpm_location || '' }}
      rpm_names: ${{ inputs.rpm_names || '' }}
      build_torch_spyre: ${{ inputs.build_torch_spyre == true }}
      # Reuse the wheel run-tests already built above instead of rebuilding it a
      # second time under the same nightly -- exactly the duplication the comment
      # above says folding this in was meant to end. Only when run-tests actually
      # built one itself: the RPM-only dispatch path (rpm_names set, build_torch_spyre
      # false) skips the build there too, so there would be nothing to download.
      torch_spyre_wheel_artifact_name: >-
        ${{ (inputs.rpm_names || '') == '' && 'torch-spyre-wheel' || '' }}
    secrets:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}

  # ---------------------------------------------------------------------------
  # Job 2: run-spyre-unit-tests (fan-in gate)
  #
  # Fans in the reusable workflow result. Reports a single green/red status.
  #   run-tests result = success -> all suites passed -> green
  #   run-tests result = failure -> one or more suites bad -> red
  # ---------------------------------------------------------------------------
  run-spyre-unit-tests:
    name: Run Spyre unit tests
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: always()
    steps:
      - name: Evaluate test results
        run: |-
          RESULT="${{ needs.run-tests.result }}"
          echo "run-tests result: ${RESULT}"

          if [[ "${RESULT}" == "success" ]]; then
            echo "All test suites passed."
            exit 0
          fi

          echo "One or more test suites failed or were cancelled."
          exit 1
