name: build-test-pytorch-source

# ---------------------------------------------------------------------------
# Reusable workflow. Only called via workflow_call, by the
# `gate_and_build`/`build_and_test` jobs in
# push-pytorch-dispatch-to-clickhouse.yaml -- once a repository_dispatch from
# pytorch/pytorch has been gated and a commit SHA extracted, or (on
# schedule/workflow_dispatch) once that workflow has resolved a nightly SHA
# or been given an explicit one. Manual on-demand builds of a specific
# pytorch/pytorch commit go through that workflow's workflow_dispatch (with
# a pytorch_sha input) rather than dispatching this one directly.
#
# Builds that exact PyTorch commit from source (once), builds torch-spyre
# against it (editable, --local-pytorch style), packages BOTH as wheels, and
# hands them to the shared _upstream_tests_beta_matrix.yaml reusable workflow
# to run every upstream-beta suite against them -- the PyTorch wheel is
# required so the test job installs the exact PyTorch build torch-spyre's
# _C.so is ABI-bound to, not the pinned pytorch-cpu wheel the matrix's normal
# (upstream_tests_beta.yaml) path installs. Reports its lifecycle
# (torch_build -> torch_spyre_build -> running_tests -> completed) and final
# test-result counts back into the same ClickHouse row the caller's `ingest`
# job created, keyed on github.event.client_payload.delivery_id (shared
# across the whole workflow_call, since the github context always reflects
# the caller).
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      pytorch_sha:
        description: Exact pytorch/pytorch commit SHA to build
        required: true
        type: string
      run_torch_spyre_tests:
        description: >-
          Also run torch-spyre's own test suite (tests/, via _test_matrix.yaml)
          against the wheels the `build` job produces, in addition to the
          upstream-beta suites. Non-blocking: a failure here does not fail
          this workflow. Default false -- manual workflow_dispatch opt-in only.
        required: false
        type: boolean
        default: false
      torch_spyre_test_type:
        description: >-
          Suite subset for the torch-spyre test run when
          run_torch_spyre_tests is true. Forwarded verbatim to
          _test_matrix.yaml's test_type input: smoke | unit | integration |
          regression | trunk | suite_<group> | <label>.
        required: false
        type: string
        default: regression

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build PyTorch@${{ inputs.pytorch_sha }} + torch-spyre
    runs-on:
      - x86_64
      - spyre_pf_x1
      - linux
      - image_spyre_backend
    timeout-minutes: 180
    env:
      # GitHub Actions sets CI=true which causes pytest inductor tests to fail.
      CI: ''
      # Consumed by the "Report stage: ..." steps below, which write dispatch
      # lifecycle updates into ClickHouse -- for repository_dispatch runs,
      # into the same row push-pytorch-dispatch-to-clickhouse.yaml's
      # `ingest` job already created; for schedule/workflow_dispatch
      # (nightly) runs, which skip `ingest` entirely, the first "Report
      # stage: torch_build" write below is what creates the row. Available
      # because the caller invokes this reusable workflow with
      # `secrets: inherit`.
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST_DEV }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT_DEV }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER_DEV }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS_DEV }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB_DEV }}
    outputs:
      pytorch_build_seconds: ${{ steps.compute_durations.outputs.pytorch_build_seconds }}
      torch_spyre_build_seconds: ${{ steps.compute_durations.outputs.torch_spyre_build_seconds }}
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Checkout torch-spyre
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre

      - name: Checkout pytorch@${{ inputs.pytorch_sha }}
        uses: ./.github/actions/checkout-pytorch
        with:
          sha: ${{ inputs.pytorch_sha }}

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # latest-known, not "latest": it resolves to the newest uv whose checksum is
          # bundled INTO this setup-uv pin, resolved locally with no release lookup. A
          # just-published release is not yet mirrored on releases.astral.sh, so "latest"
          # 404s there and falls back to GitHub Releases, which rate-limits (429) once the
          # fleet requests it concurrently. Bumping setup-uv moves this version forward.
          version: latest-known

      - name: Write dispatch payload to file
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          # workflow_dispatch (manual UI run) and schedule (nightly cron,
          # relayed here from push-pytorch-dispatch-to-clickhouse.yaml) have
          # no client_payload, so the ingest script would find an empty
          # delivery_id and refuse to ingest — synthesize one keyed on this
          # run instead.
          SYNTHETIC_DELIVERY_ID: ${{ github.event_name }}-${{ github.run_id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            printf '{"delivery_id":"%s","event_type":"%s","payload":{"action":"manual_dispatch"}}' \
              "$SYNTHETIC_DELIVERY_ID" "${{ github.event_name }}" > payload.json
          else
            printf '%s' "$PAYLOAD_JSON" > payload.json
          fi


      - name: 'Report stage: torch_build'
        continue-on-error: true
        run: |
          echo "T_TORCH_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          uv run --with clickhouse-connect --with regex \
            torch-spyre/.github/scripts/ingest_pytorch_dispatch.py \
            --payload-file payload.json \
            --event-type "${{ github.event.action }}" \
            --run-id   "${{ github.run_id }}" \
            --run-link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --job-name build_and_test \
            --stage torch_build \
            --progress in_progress \
            --pytorch-sha "${{ inputs.pytorch_sha }}" \
            --torch-spyre-sha "${{ github.sha }}"

      - name: Build PyTorch from source
        uses: ./.github/actions/build-pytorch-from-source

      - name: Upload PyTorch wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytorch-wheel-${{ inputs.pytorch_sha }}
          path: pytorch/dist/*.whl
          if-no-files-found: error
          retention-days: 5

      - name: 'Report stage: torch_spyre_build'
        continue-on-error: true
        run: |
          echo "T_TORCH_SPYRE_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          uv run --with clickhouse-connect --with regex \
            torch-spyre/.github/scripts/ingest_pytorch_dispatch.py \
            --payload-file payload.json \
            --event-type "${{ github.event.action }}" \
            --run-id   "${{ github.run_id }}" \
            --run-link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --job-name build_and_test \
            --stage torch_spyre_build \
            --progress in_progress \
            --pytorch-sha "${{ inputs.pytorch_sha }}" \
            --torch-spyre-sha "${{ github.sha }}"

      - name: Build torch-spyre against local PyTorch
        uses: ./.github/actions/build-torch-spyre-local-pytorch

      - name: Upload torch-spyre wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torch-spyre-wheel-${{ inputs.pytorch_sha }}
          path: torch-spyre/dist/*.whl
          if-no-files-found: error
          retention-days: 5

      - name: Compute build durations
        id: compute_durations
        run: |
          NOW="$(date +%s)"
          echo "pytorch_build_seconds=$(( T_TORCH_SPYRE_BUILD_START - T_TORCH_BUILD_START ))" >> "$GITHUB_OUTPUT"
          echo "torch_spyre_build_seconds=$(( NOW - T_TORCH_SPYRE_BUILD_START ))" >> "$GITHUB_OUTPUT"

      - name: 'Report stage: running_tests'
        continue-on-error: true
        run: |
          uv run --with clickhouse-connect --with regex \
            torch-spyre/.github/scripts/ingest_pytorch_dispatch.py \
            --payload-file payload.json \
            --event-type "${{ github.event.action }}" \
            --run-id   "${{ github.run_id }}" \
            --run-link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --job-name build_and_test \
            --stage running_tests \
            --progress in_progress \
            --pytorch-sha "${{ inputs.pytorch_sha }}" \
            --torch-spyre-sha "${{ github.sha }}"

      # upstream HUD requires same check_run_id
      # however check_run_id differs across jobs
      # therefore we need to have both the callbacks
      # under the same job.
      # so moving this to final job.
      # - name: Report CI started to pytorch/pytorch
      #   # Only repository_dispatch (real PR-triggered CI) needs an
      #   # in_progress ping -- pytorch/pytorch's CRCR only watches those
      #   # runs live. Nightly (schedule) doesn't need one, and
      #   # workflow_dispatch (manual/ad-hoc) is never relayed at all.
      #   if: github.event_name == 'repository_dispatch'
      #   continue-on-error: true
      #   uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
      #   with:
      #     status: in_progress
      #     job-name: linux-x86_64 / pytorch / test

  # ---------------------------------------------------------------------------
  # Run every upstream-beta suite (as a per-suite matrix, with retry/stall-
  # watching/JUnit-XML reporting) against the wheel `build` just packaged.
  # Shared with upstream_tests_beta.yaml so the suite list has a single
  # source of truth.
  #
  # Dispatched via a step (github-script + createWorkflowDispatch, mirroring
  # trigger_other_repos-style dispatch) rather than a job-level `uses:`, so
  # this job can wrap the dispatch with CRCR in_progress/completed callback
  # steps -- the CRCR check-run is scoped per-job, so both callbacks have to
  # originate from the same job as each other (see build's commented-out
  # in_progress step, moved out of that job for the same reason).
  # ---------------------------------------------------------------------------
  test:
    name: Run upstream-beta test matrix
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - name: Report CI started to pytorch/pytorch
        # Only repository_dispatch (real PR-triggered CI) needs an
        # in_progress ping -- pytorch/pytorch's CRCR only watches those
        # runs live. Nightly (schedule) doesn't need one, and
        # workflow_dispatch (manual/ad-hoc) is never relayed at all.
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: in_progress
          job-name: linux-x86_64 / pytorch / test

      - name: Dispatch and wait for upstream-beta test matrix
        id: dispatch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PYTORCH_SHA: ${{ inputs.pytorch_sha }}
        with:
          script: |
            const workflowFile = '_upstream_tests_beta_matrix.yaml';
            const correlationId = `${context.runId}-${context.runNumber}-${Date.now()}`;
            const pytorchSha = process.env.PYTORCH_SHA;

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
              ref: context.ref,
              inputs: {
                artifact_name: `torch-spyre-wheel-${pytorchSha}`,
                pytorch_sha: pytorchSha,
                pytorch_wheel_artifact_name: `pytorch-wheel-${pytorchSha}`,
                mode: 'validate',
                correlation_id: correlationId,
                source_run_id: `${context.runId}`,
              },
            });

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let run;
            // Poll for the dispatched run to appear (createWorkflowDispatch
            // returns nothing, so it has to be found by its run-name).
            for (let attempt = 0; !run && attempt < 30; attempt++) {
              await sleep(10000);
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowFile,
                event: 'workflow_dispatch',
              });
              run = data.workflow_runs.find((r) => r.name && r.name.includes(correlationId));
            }
            if (!run) {
              core.setFailed(`Could not find dispatched run for correlation_id ${correlationId}`);
              return;
            }
            core.info(`Found dispatched run ${run.id} (${run.html_url})`);
            core.setOutput('run_id', `${run.id}`);

            // Poll until it finishes. mode: validate means the matrix
            // itself never fails on test failures, so this only fails on
            // an infra-level problem (e.g. the run erroring out or timing
            // out) -- test-result failures are non-blocking, same as the
            // job-level `uses:` this replaces.
            let conclusion = run.conclusion;
            for (let attempt = 0; run.status !== 'completed' && attempt < 700; attempt++) {
              await sleep(30000);
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              run = data;
              conclusion = run.conclusion;
            }
            if (run.status !== 'completed') {
              core.setFailed(`Dispatched run ${run.id} did not complete in time`);
              return;
            }
            core.info(`Dispatched run ${run.id} completed with conclusion: ${conclusion}`);
            core.setOutput('conclusion', conclusion);

      - name: Report CI completed to pytorch/pytorch
        if: always() && github.event_name == 'repository_dispatch'
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ steps.dispatch.outputs.conclusion }}
          job-name: linux-x86_64 / pytorch / test

  # ---------------------------------------------------------------------------
  # Manual opt-in only (run_torch_spyre_tests, surfaced as a workflow_dispatch
  # input on push-pytorch-dispatch-to-clickhouse.yaml): run torch-spyre's own
  # test suite -- the same _test_matrix.yaml used by tests.yaml/PR CI -- against
  # the exact wheels `build` just produced, instead of rebuilding them.
  # Non-blocking: this must never fail the overall run or feed the
  # pytorch/pytorch CRCR / ClickHouse reporting in `report` below. Same
  # mechanism the `test` job above uses (mode: validate, forwarded to
  # run_test.sh's own --mode flag) rather than continue-on-error -- GitHub
  # Actions does not support continue-on-error on a job that calls a
  # reusable workflow via `uses:`.
  # ---------------------------------------------------------------------------
  torch_spyre_tests:
    name: Run torch-spyre tests
    needs: build
    if: ${{ inputs.run_torch_spyre_tests }}
    uses: ./.github/workflows/_test_matrix.yaml
    secrets: inherit
    with:
      runner_label: linux
      extra_test_flags: -v -m "not xfail" --mode=validate
      extra_test_flags_multi_spyre: -v --mode=validate
      checkout_pytorch: false
      test_type: ${{ inputs.torch_spyre_test_type }}
      pytorch_wheel_artifact_name: pytorch-wheel-${{ inputs.pytorch_sha }}
      torch_spyre_wheel_artifact_name: torch-spyre-wheel-${{ inputs.pytorch_sha }}

  # ---------------------------------------------------------------------------
  # Aggregate the per-suite JUnit XMLs the `test` matrix uploaded (one per
  # suite, instead of the single combined report this job used to produce
  # inline) and report final counts + timings back into ClickHouse.
  # ---------------------------------------------------------------------------
  report:
    name: Report results
    needs: [build, test]
    if: always()
    runs-on:
      - x86_64
      - spyre_pf_x0
      - linux
      - image_spyre_backend
    env:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST_DEV }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT_DEV }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER_DEV }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS_DEV }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB_DEV }}
    steps:
      - name: Checkout torch-spyre
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # latest-known, not "latest": it resolves to the newest uv whose checksum is
          # bundled INTO this setup-uv pin, resolved locally with no release lookup. A
          # just-published release is not yet mirrored on releases.astral.sh, so "latest"
          # 404s there and falls back to GitHub Releases, which rate-limits (429) once the
          # fleet requests it concurrently. Bumping setup-uv moves this version forward.
          version: latest-known

      # actions4gh/setup-gh@v1.0.2 extracts the gh tarball but never lands
      # the binary on PATH before it calls `gh auth login`, so every job
      # fails with "spawn gh ENOENT" (upstream actions4gh/setup-gh#7, #11,
      # unresolved). Install gh directly instead; downstream steps already
      # set GH_TOKEN, which `gh` picks up implicitly, so no `gh auth login`
      # call is needed here.
      - name: Setup the GitHub CLI
        env:
          GH_CLI_VERSION: 2.97.0
        run: |
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/gh-cli.tar.gz"
          mkdir -p "${RUNNER_TEMP}/gh-cli"
          tar -xzf "${RUNNER_TEMP}/gh-cli.tar.gz" -C "${RUNNER_TEMP}/gh-cli" --strip-components=1
          echo "${RUNNER_TEMP}/gh-cli/bin" >> "${GITHUB_PATH}"


      - name: Write dispatch payload to file
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          # Must match the `build` job's synthetic delivery_id exactly (same
          # github.event_name + github.run_id) so this job's "completed"
          # stage row replaces the same ClickHouse row -- not a new one --
          # for workflow_dispatch/schedule (nightly) runs, which have no
          # client_payload to read a delivery_id from.
          SYNTHETIC_DELIVERY_ID: ${{ github.event_name }}-${{ github.run_id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            printf '{"delivery_id":"%s","event_type":"%s","payload":{"action":"manual_dispatch"}}' \
              "$SYNTHETIC_DELIVERY_ID" "${{ github.event_name }}" > payload.json
          else
            printf '%s' "$PAYLOAD_JSON" > payload.json
          fi

      - name: Download all JUnit XML artifacts from the test matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 torch-spyre/.github/scripts/download_run_xml_artifacts.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ needs.test.outputs.run_id }}" \
            --output-dir xml_artifacts

      - name: Parse test results (counts)
        id: test_results
        run: |
          shopt -s nullglob globstar
          xml_files=(xml_artifacts/**/*.xml)
          args=()
          for f in "${xml_files[@]}"; do
            args+=(--junit-xml "$f")
          done
          python3 torch-spyre/.github/scripts/parse_junit_xml_counts.py \
            "${args[@]}" \
            --summary-title "Upstream Beta test results"

      - name: Upload merged JUnit XML reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-beta-reports-${{ inputs.pytorch_sha }}
          path: xml_artifacts/**/*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: 'Report stage: completed'
        continue-on-error: true
        env:
          TEST_RESULTS_JSON: ${{ steps.test_results.outputs.test_results_json }}
          MAX_DURATION_SECONDS: ${{ steps.test_results.outputs.max_duration_seconds }}
          # Only a genuine 'success' when tests actually ran (total > 0) --
          # a build/test job that reports 'success' without collecting any
          # tests (e.g. a matrix/artifact-download problem) must not be
          # recorded as a passing run.
          CONCLUSION: >-
            ${{ 
              fromJSON(steps.test_results.outputs.test_results_json).total > 0
              && fromJSON(steps.test_results.outputs.test_results_json).failed == 0
              && 'success' || 'failure'
            }}
          # Empty whenever `build` failed before reaching compute_durations
          # (e.g. the PyTorch/torch-spyre build itself failed) — omitted
          # below rather than passed through, since build_stage_result_payload.py
          # rejects an empty --duration-value.
          PYTORCH_BUILD_SECONDS: ${{ needs.build.outputs.pytorch_build_seconds }}
          TORCH_SPYRE_BUILD_SECONDS: ${{ needs.build.outputs.torch_spyre_build_seconds }}
        run: |
          args=()
          [[ -n "$PYTORCH_BUILD_SECONDS" ]] && args+=(--duration-value "pytorch_build_seconds=${PYTORCH_BUILD_SECONDS}")
          [[ -n "$TORCH_SPYRE_BUILD_SECONDS" ]] && args+=(--duration-value "torch_spyre_build_seconds=${TORCH_SPYRE_BUILD_SECONDS}")
          [[ -n "$MAX_DURATION_SECONDS" ]] && args+=(--duration-value "tests_seconds=${MAX_DURATION_SECONDS}")

          python3 torch-spyre/.github/scripts/build_stage_result_payload.py \
            --test-results-json "${TEST_RESULTS_JSON}" \
            --conclusion "${CONCLUSION}" \
            "${args[@]}" \
            --output-file result_payload.json
          uv run --with clickhouse-connect --with regex \
            torch-spyre/.github/scripts/ingest_pytorch_dispatch.py \
            --payload-file payload.json \
            --event-type "${{ github.event.action }}" \
            --run-id   "${{ github.run_id }}" \
            --run-link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --job-name build_and_test \
            --stage completed \
            --progress completed \
            --pytorch-sha "${{ inputs.pytorch_sha }}" \
            --torch-spyre-sha "${{ github.sha }}" \
            --result-payload-file result_payload.json


      - name: Report CI completed to pytorch/pytorch (nightly)
        # event-type: nightly only applies to the actual nightly (schedule)
        # run -- never sent for repository_dispatch, see the step below.
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: >-
            ${{ 
              fromJSON(steps.test_results.outputs.test_results_json).total > 0
              && fromJSON(steps.test_results.outputs.test_results_json).failed == 0
              && 'success' || 'failure'
            }}
          test-results: >-
            {
              "passed": ${{ fromJSON(steps.test_results.outputs.test_results_json).passed }},
              "failed": ${{ fromJSON(steps.test_results.outputs.test_results_json).failed }},
              "skipped": ${{ fromJSON(steps.test_results.outputs.test_results_json).skipped }},
              "total": ${{ fromJSON(steps.test_results.outputs.test_results_json).total }}
            }
          job-name: linux-x86_64 / pytorch / test
          event-type: nightly
          # Ties this callback to the upstream pytorch/pytorch commit the
          # nightly resolution step picked, matching pytorch-redhat-ci's
          # crcr-nightly.yml convention of keying delivery-id on the
          # resolved source SHA rather than a run-specific token.
          delivery-id: ${{ inputs.pytorch_sha }}


      # ---------------------------------------------------------------------------
      # Report the nightly result to the RHEL CI Results Relay (see
      # https://github.com/TorchedHat/pytorch-redhat-ci onboarding docs).
      # Nightly (schedule) only -- same gating as the pytorch/pytorch CRCR
      # relay's nightly step above.
      # ---------------------------------------------------------------------------
      - name: Mint OIDC token for RHEL Results Relay
        id: rhel_oidc
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const token = await core.getIDToken("rhel-results-relay");
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Report result to RHEL Results Relay
        if: always() && github.event_name == 'schedule'
        # Best-effort only -- see the onboarding docs' "Never gate your CI on
        # reporting" guidance. A relay outage must never fail this workflow.
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.rhel_oidc.outputs.token }}
          CALLBACK_URL: https://hg21hqq0r6.execute-api.us-east-1.amazonaws.com/default/crcr-rhel-workflow
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          # Same convention as the pytorch/pytorch CRCR relay's delivery-id
          # above -- keyed on the bare resolved pytorch_sha, not a composite
          # string.
          DELIVERY_ID: ${{ inputs.pytorch_sha }}
          # Same rule the CRCR relay callbacks above use: only a real
          # "success" once tests actually ran (total > 0).
          CONCLUSION: >-
            ${{
              steps.test_results.outputs.test_results_json
              && fromJSON(steps.test_results.outputs.test_results_json).total > 0
              && fromJSON(steps.test_results.outputs.test_results_json).failed == 0
              && 'success' || 'failure'
            }}
        run: |
          PAYLOAD=$(jq -n \
            --arg delivery_id "$DELIVERY_ID" \
            --arg conclusion "$CONCLUSION" \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            '{
              schema_version: 1,
              event_type: "nightly",
              delivery_id: $delivery_id,
              status: "completed",
              conclusion: $conclusion,
              workflow_name: $workflow_name,
              run_id: $run_id,
              run_attempt: $run_attempt,
              job_name: "linux-x86_64 / pytorch / test"
            }')

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -d "$PAYLOAD" \
            --max-time 15)

          BODY=$(cat /tmp/response.txt)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Result reported successfully to RHEL CI Relay"
          else
            echo "::warning::Failed to report result to RHEL CI Relay (HTTP $HTTP_CODE) -- non-blocking"
          fi
