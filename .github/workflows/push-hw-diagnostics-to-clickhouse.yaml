name: push-hw-diagnostics-to-clickhouse

on:
  workflow_run:
    workflows:
      - tests
    types: [completed]
  workflow_dispatch:
    inputs:
      gha_run_id:
        description: GHA run ID to parse and ingest
        required: true
        default: ''

concurrency:
  group: hw-diag-${{ github.event.workflow_run.id || inputs.gha_run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ingest:
    name: Parse logs -> ClickHouse
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'cancelled'

    env:
      TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id        || inputs.gha_run_id }}
      TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name       || 'tests' }}

      INGEST_COMPONENT: torch-spyre
      # The arch of the ANALYSED legs, not of this ingest job -- so never $(uname -m), which
      # would report the ingest runner. Literal x86_64 because every leg this workflow follows
      # runs on the x86 pool today (all 30 node_names in prod are p1-worker-*, the x86 ARC
      # runners). arch is a run_id hash input, so when a p/z leg starts feeding this ingest the
      # value MUST come from the parsed record instead: a wrong arch derives a run_id that joins
      # nothing, silently. parse_hw_failures.py does not capture arch yet.
      LEG_ARCH: x86_64

    steps:
      # Checkout so ./.github/actions/... resolves; the action itself locates or
      # sparse-checks-out the scripts and library it actually needs.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Ingest hardware-failure diagnostics into ClickHouse
        id: ingest
        uses: ./.github/actions/ingest-hw-diagnostics-to-clickhouse
        with:
          gha-run-id: ${{ env.TRIGGERING_RUN_ID }}
          workflow-name: ${{ env.TRIGGERING_WORKFLOW }}
          component: ${{ env.INGEST_COMPONENT }}
          arch: ${{ env.LEG_ARCH }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          clickhouse-host: ${{ secrets.CLICKHOUSE_HOST }}
          clickhouse-port: ${{ secrets.CLICKHOUSE_PORT }}
          clickhouse-user: ${{ secrets.CLICKHOUSE_USER }}
          clickhouse-pass: ${{ secrets.CLICKHOUSE_PASS }}
          clickhouse-db: ${{ secrets.CLICKHOUSE_DB }}

      - name: Upload JSON artifact
        if: always() && steps.ingest.outputs.json-file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.ingest.outputs.json-file }}
          path: ${{ steps.ingest.outputs.json-file }}
          retention-days: 10
