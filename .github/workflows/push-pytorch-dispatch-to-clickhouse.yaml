name: push-pytorch-dispatch-to-clickhouse

# Entry point for repository_dispatch events sent by pytorch/pytorch's CI
# relay (Cross-Repository CI Relay, aka CRCR), plus a nightly cron path.
#
# - ingest: classifies the dispatch (PR opened / new commit / closed /
#   merged) and records it in ClickHouse. Only runs for repository_dispatch
#   triggers -- there is no dispatch payload to classify on schedule/manual
#   nightly runs.
# - gate_and_build / build_and_test: on repository_dispatch, gates on
#   "merged PR targeting main" and extracts the merge commit SHA. On
#   schedule, or workflow_dispatch with no pytorch_sha input, instead
#   resolves the exact upstream commit pytorch/pytorch's own "nightly"
#   branch was cut from (same approach as pytorch-redhat-ci's
#   crcr-nightly.yml). A workflow_dispatch run that *does* supply
#   pytorch_sha builds that exact commit instead, skipping nightly
#   resolution entirely. Either way it kicks off the build-from-source +
#   upstream test pipeline in build_test_pytorch_source.yaml.
run-name: >-
  ${{
    github.event_name == 'schedule' && 'PyTorch CRCR Nightly Trigger (cron)' ||
    (github.event_name == 'workflow_dispatch' && github.event.inputs.pytorch_sha != '' &&
      format('PyTorch CRCR Manual Trigger - {0}', github.event.inputs.pytorch_sha)) ||
    github.event_name == 'workflow_dispatch' && 'PyTorch CRCR Nightly Trigger (manual)' ||
    format(
      'PyTorch CRCR CI Trigger - {0}',
      github.event.client_payload.event_type == 'pull_request' &&
      format(
        'PR #{0} ({1})',
        github.event.client_payload.payload.pull_request.number,
        github.event.client_payload.payload.action
      ) ||
      format('Push {0}', github.event.client_payload.payload.after)
    )
  }}
on:
  repository_dispatch:
    types: [pull_request]
  schedule:
    - cron: 0 4 * * *    # nightly, daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      pytorch_sha:
        description: >-
          Exact pytorch/pytorch commit SHA to build. Leave empty to resolve
          and build the current nightly (same as the scheduled cron run).
        required: false
        type: string
      run_torch_spyre_tests:
        description: >-
          Also run torch-spyre's own test suite (tests/) against the built
          PyTorch commit, in addition to the upstream-beta suites. Manual
          dispatch only; non-blocking (does not fail this run).
        required: false
        type: boolean
        default: false
      torch_spyre_test_type:
        description: >-
          Suite subset for the torch-spyre test run when
          run_torch_spyre_tests is enabled: smoke | unit | integration |
          regression | trunk | suite_<group> | <label>.
        required: false
        type: string
        default: regression


concurrency:
  group: >-
    crcr-l2-${{ github.event.client_payload.payload.repository.full_name || 'nightly' }}-${{
    github.event.client_payload.payload.pull_request.number || github.run_id }}-${{ github.event.client_payload.payload.action || 'nightly'}}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to mint the OIDC tokens used by:
  #  - the pytorch/pytorch CRCR relay callbacks in build_test_pytorch_source.yaml
  #  - the RHEL CI Results Relay callback in report_to_rhel_relay below
  id-token: write

jobs:
  ingest:
    name: Classify dispatch -> ClickHouse
    # Nothing to classify on schedule/workflow_dispatch (nightly) runs --
    # there is no repository_dispatch client_payload to record.
    if: github.event_name == 'repository_dispatch'
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 10

    env:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST_DEV }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT_DEV }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER_DEV }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS_DEV }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB_DEV }}

    steps:
      - name: Checkout ingest script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/scripts/ingest_pytorch_dispatch.py

      - name: Write dispatch payload to file
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD_JSON" > payload.json

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # latest-known, not "latest": it resolves to the newest uv whose checksum is
          # bundled INTO this setup-uv pin, resolved locally with no release lookup. A
          # just-published release is not yet mirrored on releases.astral.sh, so "latest"
          # 404s there and falls back to GitHub Releases, which rate-limits (429) once the
          # fleet requests it concurrently. Bumping setup-uv moves this version forward.
          version: latest-known

      - name: Setup venv
        run: |
          uv venv
          source .venv/bin/activate

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          uv pip install clickhouse-connect regex
          echo "VIRTUAL_ENV $VIRTUAL_ENV"

      - name: Classify dispatch and ingest into ClickHouse
        continue-on-error: true
        run: |
          source .venv/bin/activate
          python3 .github/scripts/ingest_pytorch_dispatch.py \
            --payload-file payload.json \
            --event-type "${{ github.event.action }}" \
            --run-id   "${{ github.run_id }}" \
            --run-link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summary
        if: always()
        run: |-
          {
            echo "### PyTorch Dispatch Ingest Summary"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Event type | ${{ github.event.action }} |"
            echo "| Run ID        | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  gate_and_build:
    name: Gate on merged PR to main, extract build SHA
    runs-on:
      - x86_64
      - linux
      - image_ingest
    outputs:
      pytorch_sha: ${{ steps.extract.outputs.pytorch_sha }}
      should_build: ${{ steps.extract.outputs.should_build }}

    env:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST_DEV }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT_DEV }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER_DEV }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS_DEV }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB_DEV }}

    steps:
      - name: Checkout pyproject.toml
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            pyproject.toml
          sparse-checkout-cone-mode: false

      - name: Extract build parameters from payload
        id: extract
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          EVENT_TYPE: ${{ github.event.client_payload.event_type }}
          EXPLICIT_SHA: ${{ github.event.inputs.pytorch_sha }}
        run: |
          set -euo pipefail

          # ---- Manual path: workflow_dispatch with an explicit pytorch_sha
          # input. Build exactly that commit -- skip nightly resolution
          # entirely, since the whole point of passing pytorch_sha is to
          # override it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${EXPLICIT_SHA}" ]; then
            echo "Manual trigger: building explicit pytorch_sha=${EXPLICIT_SHA}"
            echo "pytorch_sha=${EXPLICIT_SHA}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- Nightly path: schedule cron, or manual workflow_dispatch of
          # this workflow with no pytorch_sha input given. There is no
          # repository_dispatch payload to gate on here -- instead resolve
          # the exact upstream commit pytorch/pytorch's own "nightly" branch
          # was cut from, the same way pytorch-redhat-ci's crcr-nightly.yml
          # does: the nightly branch's HEAD commit message embeds the
          # source main SHA in parentheses, e.g. "... (abcdef0123...)".
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Nightly trigger (${{ github.event_name }}): resolving source SHA from pytorch/pytorch@nightly"
            NIGHTLY_SHA=$(curl -fsSL "https://api.github.com/repos/pytorch/pytorch/commits?sha=nightly&per_page=1" | jq -r '.[0].sha // empty')
            if [ -z "${NIGHTLY_SHA}" ]; then
              echo "::error::Could not resolve HEAD for pytorch/pytorch/nightly"
              exit 1
            fi

            COMMIT_MSG=$(curl -fsSL "https://api.github.com/repos/pytorch/pytorch/commits/${NIGHTLY_SHA}" | jq -r '.commit.message')
            SOURCE_SHA=$(echo "$COMMIT_MSG" | grep -oP '\(([a-f0-9]{40})\)' | tr -d '()')
            if [ -z "${SOURCE_SHA}" ]; then
              echo "::error::Could not extract source SHA from latest nightly commit"
              exit 1
            fi

            echo "Resolved pytorch/pytorch@nightly -> source ${SOURCE_SHA}"
            echo "pytorch_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # torch-spyre's pinned PyTorch minor version (e.g. "2.13" from
          # "torch~=2.13.0" in pyproject.toml) maps 1:1 onto the
          # pytorch/pytorch release branch this repo currently tracks
          # (e.g. "release/2.13"). Recomputed on every dispatch so this
          # keeps following whichever release branch pyproject.toml is
          # pinned to, without needing to touch this workflow on bump.
          PINNED_MINOR=$(grep -v '^#' pyproject.toml | grep -oE 'torch~=[0-9]+\.[0-9]+' | head -1 | grep -oE '[0-9]+\.[0-9]+')
          if [ -z "${PINNED_MINOR}" ]; then
            echo "::error::Could not determine pinned PyTorch version from pyproject.toml"
            exit 1
          fi
          RELEASE_BRANCH="release/${PINNED_MINOR}"
          echo "Tracking base refs: main, ${RELEASE_BRANCH}"

          # ---- Filter: only merged PRs targeting main or the tracked release branch ----
          if [ "${EVENT_TYPE}" = "pull_request" ]; then
            ACTION=$(echo "$PAYLOAD_JSON" | jq -r '.payload.action // empty')
            BASE_REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.base.ref // empty')
            if [ "${ACTION}" != "closed" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${BASE_REF}" != "main" ] && [ "${BASE_REF}" != "${RELEASE_BRANCH}" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # .pull_request.merged is unreliable on repository_dispatch
            # payloads, so gate on the "Merged" label instead.
            HAS_MERGED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.labels // [] | map(.name) | index("Merged") // ""')
            if [ -z "${HAS_MERGED}" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # .pull_request.merge_commit_sha is *also* unreliable on
            # repository_dispatch payloads (same class of issue as
            # `.merged` above) — pytorch/pytorch's own CI relay has been
            # observed forwarding it stale or empty. Rather than trust it,
            # resolve the target branch's actual current HEAD directly
            # against pytorch/pytorch
            SHA=$(git ls-remote https://github.com/pytorch/pytorch.git "refs/heads/${BASE_REF}" | cut -f1)
            if [ -z "${SHA}" ]; then
              echo "::error::Could not resolve HEAD of pytorch/pytorch@${BASE_REF}"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Resolved pytorch/pytorch@${BASE_REF} -> ${SHA}"
            echo "pytorch_sha=${SHA}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_TYPE}" = "push" ]; then
            # Not wired up yet — push dispatches are ignored for now.
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown event_type: ${EVENT_TYPE}"
            exit 1
          fi

      - name: Checkout ingest script
        if: steps.extract.outputs.should_build == 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            .github/scripts/ingest_pytorch_dispatch.py

      - name: Write dispatch payload to file
        if: steps.extract.outputs.should_build == 'false'
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD_JSON" > payload.json

      - name: Install uv
        if: steps.extract.outputs.should_build == 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # latest-known, not "latest": it resolves to the newest uv whose checksum is
          # bundled INTO this setup-uv pin, resolved locally with no release lookup. A
          # just-published release is not yet mirrored on releases.astral.sh, so "latest"
          # 404s there and falls back to GitHub Releases, which rate-limits (429) once the
          # fleet requests it concurrently. Bumping setup-uv moves this version forward.
          version: latest-known

      - name: Record gate rejection in ClickHouse
        if: steps.extract.outputs.should_build == 'false'
        continue-on-error: true
        run: |
          uv run --with clickhouse-connect --with regex \
            .github/scripts/ingest_pytorch_dispatch.py \
            --payload-file payload.json \
            --event-type "${{ github.event.action }}" \
            --run-id   "${{ github.run_id }}" \
            --run-link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --job-name build_and_test \
            --stage rejected \
            --progress rejected

  build_and_test:
    needs: gate_and_build
    if: ${{ needs.gate_and_build.outputs.should_build == 'true' }}
    uses: ./.github/workflows/build_test_pytorch_source.yaml
    secrets: inherit
    with:
      pytorch_sha: ${{ needs.gate_and_build.outputs.pytorch_sha }}
      # Manual-dispatch-only opt-in -- empty/false on schedule and
      # repository_dispatch triggers, which have no workflow_dispatch inputs.
      run_torch_spyre_tests: ${{ github.event.inputs.run_torch_spyre_tests == 'true' }}
      torch_spyre_test_type: ${{ github.event.inputs.torch_spyre_test_type || 'regression' }}
