name: Test matrix (reusable)

# ---------------------------------------------------------------------------
# Reusable workflow — not triggered directly.
# Called by tests.yml and tests-nightly.yml.
#
# All differences between the two callers are expressed as inputs:
#   - runner_label      : linux
#   - extra_test_flags  : "-v" (PR) vs "--cpu-compile -vvv -s" (nightly)
#   - checkout_pytorch  : false (PR) vs true (nightly)
#   - ref / rpm_*       : forwarded from workflow_dispatch inputs
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      # Runner pool to use for both test jobs
      runner_label:
        description: Runner label appended to the fixed labels (linux)
        required: true
        type: string

      # IMAGE selector label for runs-on. Normal runs use the standing
      # image_spyre_backend set; the per-PR ephemeral flow passes that PR's set
      # label (image_spyre_backend_pr_<component>_<sha12>, e.g.
      # image_spyre_backend_pr_flex_8ddcf3e155e9) so jobs land on the per-PR image
      # (the RPM is baked in -> no runtime sudo). Default keeps existing callers
      # unchanged.
      image_label:
        description: Image scaleSetLabel to select (image_spyre_backend | image_spyre_backend_pr_<KEY>)
        required: false
        type: string
        default: image_spyre_backend

      # Flags appended to every `bash tests/run_test.sh <config>` call for the test job
      extra_test_flags:
        description: Extra flags passed to run_test.sh for the test job (e.g. "-v" or "--cpu-compile -vvv -s")
        required: true
        type: string

      # Flags appended to every `bash tests/run_test.sh <config>` call for the test_multi_spyre job
      extra_test_flags_multi_spyre:
        description: Extra flags passed to run_test.sh for the test_multi_spyre job (e.g. "-v")
        required: false
        type: string
        default: ''

      # Whether to run checkout-pytorch (nightly only)
      checkout_pytorch:
        description: Whether to check out the pre-built PyTorch tree
        required: false
        type: boolean
        default: false

      # workflow_dispatch pass-throughs
      ref:
        description: Branch, tag, or SHA to check out
        required: false
        type: string
        default: ''
      repository:
        description: Full clone URL of the fork to check out (e.g. "https://github.example.com/myuser/torch-spyre.git"); leave empty for the base repo
        required: false
        type: string
        default: ''
      rpm_location:
        description: Artifactory location for RPM download
        required: false
        type: string
        default: ''
      rpm_names:
        description: Space-separated list of RPM names to download and install
        required: false
        type: string
        default: ''
      build_torch_spyre:
        description: Whether to re-build torch-spyre after installing the RPM
        required: false
        type: boolean
        default: true
      enable_tier_delta:
        description: >
          Skip configs whose tiers already have results for this commit+arch, so a
          regression run after an integration run executes only what regression adds.
          Off by default: a delta must be asked for. Degrades to the full tier on any
          ClickHouse error, so it can never under-test silently.
        type: boolean
        default: false
        required: false
      test_type:
        description: >-
          Suite subset to run: smoke | unit | integration | regression |
          trunk | suite_<group> | <label>. Selects configs whose
          test_suite_config.labels array contains this value literally, or
          (for suite_<group>) whose path sits under that directory -- there
          is no catch-all value that ignores a config's labels.
          integration covers the device-layer surfaces flex and
          deeptools/dbo-opt exercise most (streams, job launch
          plans, codegen, LX/scratchpad planning, tensor layout,
          allocator/GC, D2D copies). Default: regression (every config
          labeled for full functional coverage) -- callers that want the
          narrower CI default (e.g. integration-tests.yaml) pass test_type
          explicitly.
        required: false
        type: string
        default: regression
      config_dir:
        description: Run only this tests/configs/ subdir (e.g. model_ops_tests); empty = torch_spyre_tests, or the whole tree for trunk
        required: false
        type: string
        default: ''
      report_retention_days:
        description: Days to keep the uploaded JUnit XML reports
        required: false
        type: number
        default: 10

      # Spyre-Next integration path: test the PRE-BAKED dev image directly instead
      # of checking out + rebuilding torch-spyre on the runner. The ephemeral ARC
      # runner is FROM torch-spyre-dev, which already has the editable-installed
      # torch_spyre + the full source tree (incl tests/, tests/configs/) + the
      # shared venv at $PREBAKED_TORCH_SPYRE_DIR. When true: skip the product
      # checkout, the build_torch_spyre wheel job, and install-prebuilt-torch-spyre;
      # run the suite against the baked dir. DEFAULT false → the normal PR/nightly
      # callers (tests.yml / tests-nightly.yml) are byte-for-byte unchanged.
      component:
        description: >
          Component to stamp on v2 ingest rows. Defaults to this repo's own product; set it
          when this matrix runs ANOTHER component's suite, so the rows (and the test_case_id
          they hash into) name the suite's real owner.
        required: false
        type: string
        default: torch-spyre
      run_id:
        description: >
          UUID identifying this TEST RUN, minted by the dispatching orchestrator above the
          CI split and threaded through so artifact_results (written by Jenkins) and
          test_case_runs (written by the ingest below) carry ONE identity. Empty on a
          GHA-initiated run, which then derives its own from the run coordinate.
        required: false
        type: string
        default: ''
      prebaked_image:
        description: Test the pre-baked torch-spyre-dev image (no checkout/build). Integration path only.
        required: false
        type: boolean
        default: false

      bench_mode:
        description: >-
          Perf job only: off (default, nothing changes) | side-by-side (also feed the same report.xml through the
          benchmarks/ catalog and file the engine's results as a connected CI run in the bench-<workflow> series) | replace (skip the
          legacy ingest and store the catalog's rows in v2 only, keeping the legacy workflow name and run id; fails on a report
          row no case declares).
        required: false
        type: string
        default: off

      # pytorch/pytorch dispatch path only (build_test_pytorch_source.yaml):
      # override the pinned pytorch-cpu wheel with the exact PyTorch build
      # torch-spyre's _C.so is compiled against. Empty (default) = every
      # existing caller keeps installing the pinned wheel unchanged.
      pytorch_wheel_artifact_name:
        description: >-
          Name of a prebuilt PyTorch wheel artifact to install in place of
          the pinned pytorch-cpu wheel (e.g. a from-source build at a given
          pytorch_sha). Empty (default) = keep the pinned wheel.
        required: false
        type: string
        default: ''

      # Same pytorch/pytorch dispatch path: skip build_torch_spyre entirely
      # and install a torch-spyre wheel built elsewhere (e.g. against that
      # same from-source PyTorch) instead. Empty (default) = every existing
      # caller keeps building its own wheel unchanged.
      torch_spyre_wheel_artifact_name:
        description: >-
          Name of a prebuilt torch-spyre wheel artifact to install instead of
          building one. When set, the build_torch_spyre job is skipped.
          Empty (default) = build torch-spyre from source as usual.
        required: false
        type: string
        default: ''

    secrets:
      # ClickHouse connection for the perf job's inline benchmark ingest. The
      # perf report.xml is written on the card runner and is NOT uploaded as an
      # artifact (benchmark numbers must not become world-readable on a public
      # repo), so it cannot ride the push-to-clickhouse.yaml artifact-download
      # path the way the matrix suites do. Instead the perf job pushes it inline.
      # All optional: a caller that omits them (or a non-perf run) simply skips
      # the inline push, leaving every existing caller byte-for-byte unchanged.
      # CLICKHOUSE_HOST/PORT only back up the v2 endpoint; the scoped v2 login is the credential.
      CLICKHOUSE_HOST:
        required: false
      CLICKHOUSE_PORT:
        required: false
      CLICKHOUSE_DB_V2:
        required: false
      CLICKHOUSE_V2_HOST:
        required: false
      CLICKHOUSE_V2_PORT:
        required: false
      CLICKHOUSE_V2_USER:
        required: false
      CLICKHOUSE_V2_PASSWORD:
        required: false

defaults:
  run:
    shell: bash

env:
  # Read by the ingest library: fail when a v2 database has no v2 host; the v2 database list.
  CH_REQUIRE_V2_HOST: ${{ vars.CH_REQUIRE_V2_HOST }}
  CH_V2_DATABASES: ${{ vars.CH_V2_DATABASES }}
  # Kill switch, red-on-park and the per-call retry deadline of the v2 write path.
  CH_WRITE_RESILIENCE: ${{ vars.CH_WRITE_RESILIENCE }}
  CH_WRITE_STRICT: ${{ vars.CH_WRITE_STRICT }}
  CH_WRITE_DEADLINE_S: ${{ vars.CH_WRITE_DEADLINE_S || '120' }}
  # The baked torch-spyre source dir in the dev image (runner is FROM
  # torch-spyre-dev). Used by the prebaked_image path in place of a checkout.
  PREBAKED_TORCH_SPYRE_DIR: /home/senuser/torch-spyre
  # The baked SHARED venv in the dev image. It lives at $HOME/.venv (the dev
  # image exports it as $VIRTUAL_ENV), NOT nested under PREBAKED_TORCH_SPYRE_DIR
  # — so run-test-suite's default relative '.venv' cannot resolve after it cd's
  # into the source dir. The prebaked path passes this absolute path instead.
  PREBAKED_VENV_PATH: /home/senuser/.venv
  # tests/configs/ subdirs with their own caller (or job); the default trunk scan skips them.
  DEDICATED_CONFIG_DIRS: distributed_tests model_ops_tests upstream_tests upstream_tests_beta

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: generate filtered test matrix
  #
  # Reads test_suite_config.labels from every YAML under
  # tests/configs/torch_spyre_tests/ and emits a JSON matrix containing only
  # the configs that match inputs.test_type.  The test job below consumes this
  # output via fromJSON so that only the requested subset of runners starts.
  #
  # trunk scans all of tests/configs/ minus DEDICATED_CONFIG_DIRS; config_dir scans just that subdir.
  # ---------------------------------------------------------------------------
  generate_matrix:
    name: Generate test matrix (${{ inputs.test_type || 'regression' }})
    # Normal path: ubuntu-latest with a fresh sparse checkout of the configs.
    # Prebaked path: run ON the runner image so the matrix is computed from the
    # SAME PR-pinned configs baked into the dev image (not a re-fetch of main),
    # keeping content-addressed consistency.
    runs-on: ${{ inputs.prebaked_image && fromJSON(format('["x86_64","spyre_pf_x0","{0}","{1}"]', inputs.runner_label, inputs.image_label)) || 'ubuntu-latest'
      }}
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      resolved_test_type: ${{ steps.filter.outputs.resolved_test_type }}
      # Dir that matrix.suite.config is relative to.
      config_root: ${{ steps.filter.outputs.config_root }}
      # [{tier, covering_run}, ...] for the tiers this run SKIPS. The ingest copies those
      # runs' case rows in, so a delta run reports its whole tier rather than only the part
      # it executed. Empty ([] or "") whenever the delta is off or the lookup fails.
      covered_runs: ${{ steps.filter.outputs.covered_runs }}
      # Scopes failed-suite descriptors to this call; artifacts are run-scoped and nightly calls this workflow twice.
      call_id: ${{ steps.call_id.outputs.call_id }}
    steps:
      - name: Generate per-call id
        id: call_id
        run: echo "call_id=$(python3 -c 'import uuid; print(uuid.uuid4().hex[:12])')" >> "$GITHUB_OUTPUT"

      # NORMAL: sparse-checkout the configs from github.com at the requested ref.
      - if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          # trunk and config_dir scan the whole tests/configs/ tree; every other tier stays scoped to torch_spyre_tests.
          sparse-checkout: |
            ${{ ((inputs.test_type || 'regression') == 'trunk' || inputs.config_dir != '') && 'tests/configs' || 'tests/configs/torch_spyre_tests' }}
            tests/oot_framework/utils/filter_configs.py
            tests/oot_framework/utils/test_layout.py
            .github/scripts/resolve_covered_tiers.py
            .github/runner_overrides.yaml
            .github/suite_test_flags.yaml
            .github/test_layout_policy.json
            .github/test_timings.json
          sparse-checkout-cone-mode: false

      - name: Filter configs by TEST_TYPE
        id: filter
        env:
          RAW_TEST_TYPE: ${{ inputs.test_type || 'regression' }}
          CONFIG_DIR: ${{ inputs.config_dir }}
          ENABLE_TIER_DELTA: ${{ inputs.enable_tier_delta }}
          DELTA_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          DELTA_ARCH: ${{ inputs.runner_label }}
          # Absent secrets fail open: the lookup is skipped and the full tier runs.
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_DB_V2: ${{ secrets.CLICKHOUSE_DB_V2 }}
          CLICKHOUSE_V2_HOST: ${{ secrets.CLICKHOUSE_V2_HOST }}
          CLICKHOUSE_V2_PORT: ${{ secrets.CLICKHOUSE_V2_PORT }}
          CLICKHOUSE_V2_USER: ${{ secrets.CLICKHOUSE_V2_USER }}
          CLICKHOUSE_V2_PASSWORD: ${{ secrets.CLICKHOUSE_V2_PASSWORD }}
        run: |
          # Prebaked: read the configs baked in the dev image; else the checkout cwd.
          # cd into the source root so every path below stays repo-relative and
          # byte-identical to the normal path (the CI-coverage scanner greps
          # `--config-dir tests/configs/torch_spyre_tests` literally).
          if [ "${{ inputs.prebaked_image }}" = "true" ]; then
            cd "${PREBAKED_TORCH_SPYRE_DIR}"
          else
            pip install pyyaml --quiet
          fi

          # perf is NOT an OOT pytest-config suite: it is a benchmark mode of
          # `make tests` (TEST_TYPE=perf shells out to spyre-perf-suite; see the
          # Makefile `ifeq ($(TEST_TYPE),perf)` branch). It carries no
          # test_suite_config.labels, so the config filter below would always
          # return an empty matrix. Route it to the dedicated `perf` job instead:
          # emit an empty matrix (the `test` matrix job is then skipped) and pin
          # resolved_test_type=perf so the downstream perf gate fires.
          if [ "${RAW_TEST_TYPE}" = "perf" ]; then
            echo "matrix={\"suite\":[]}" >> "$GITHUB_OUTPUT"
            echo "resolved_test_type=perf" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # v1 model-ops: delete once the dashboard reads v2 capabilities
          # capability is the same kind of exception as perf: the model-ops suites carry no
          # test_suite_config.labels either, so the config filter would return an empty matrix.
          # Unlike perf it IS a matrix -- one job per model config -- so the suite list is
          # declared in the `model_ops` job's own strategy rather than emitted here, and this
          # only pins the tier so that job's gate fires and the label-driven `test` matrix skips.
          if [ "${RAW_TEST_TYPE}" = "capability" ]; then
            echo "matrix={\"suite\":[]}" >> "$GITHUB_OUTPUT"
            echo "resolved_test_type=capability" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # trunk covers everything torch-spyre's push-to-main workflows
          # exercise across tests/configs/, not just torch_spyre_tests (see
          # Makefile's TEST_TYPE=trunk docs). Every other tier keeps the
          # narrower torch_spyre_tests-only scope. --config-dir is kept a
          # literal path (not a shell variable) in both branches on purpose:
          # tests/scripts/check_test_coverage.sh greps workflow YAMLs for a
          # literal `--config-dir <path>` token to detect dynamic coverage,
          # and can't resolve a variable.
          # Tiers already covered for this commit+arch. Empty unless the delta is
          # enabled AND the lookup succeeds -- the script prints nothing and exits 0
          # on any failure, so an unreachable ClickHouse runs the full tier.
          # ONE lookup for both consumers: --format both prints the bare tier CSV on line 1
          # (what filter_configs matches) and the json with covering run ids on line 2 (what
          # the ingest copies from). head/tail rather than a shell json parser -- an embedded
          # python -c here would need every line indented or its unindented lines terminate
          # this block scalar and break the workflow.
          EXCLUDE_TIERS=""
          COVERED_RUNS="[]"
          # Guard on the HOST, which is what the resolver needs; SPYRE_CH_URL was never set
          # by anything, so this condition could never be true and the delta never ran.
          if [ "${ENABLE_TIER_DELTA}" = "true" ] && [ -n "${CLICKHOUSE_V2_HOST:-${CLICKHOUSE_HOST:-}}" ]; then
            _delta_out=$(python3 .github/scripts/resolve_covered_tiers.py \
              --commit-sha "${DELTA_SHA}" \
              --arch "${DELTA_ARCH}" \
              --test-type "${RAW_TEST_TYPE}" \
              --format both || true)
            EXCLUDE_TIERS=$(printf '%s\n' "${_delta_out}" | head -1)
            COVERED_RUNS=$(printf '%s\n' "${_delta_out}" | tail -1)
            [ -n "${COVERED_RUNS}" ] || COVERED_RUNS="[]"
          fi
          echo "covered_runs=${COVERED_RUNS}" >> "$GITHUB_OUTPUT"
          # Array, not a string: expands to zero words when empty, so no unquoted
          # word-splitting is needed to pass 0-or-2 args.
          _delta_args=()
          if [ -n "${EXCLUDE_TIERS}" ]; then
            _delta_args=(--exclude-tiers "${EXCLUDE_TIERS}")
            echo "tier delta: skipping configs already covered by ${EXCLUDE_TIERS}"
          fi

          if [ "${RAW_TEST_TYPE}" = "trunk" ] || [ -n "${CONFIG_DIR}" ]; then
            CONFIG_ROOT=tests/configs
            matrix=$(python3 tests/oot_framework/utils/filter_configs.py \
              --config-dir tests/configs \
              --test-type "${RAW_TEST_TYPE}" \
              "${_delta_args[@]}" \
              --runner-map .github/runner_overrides.yaml \
              --flags-map .github/suite_test_flags.yaml \
              --layout-policy .github/test_layout_policy.json \
              --timings .github/test_timings.json \
              --format matrix-json)
          else
            CONFIG_ROOT=tests/configs/torch_spyre_tests
            matrix=$(python3 tests/oot_framework/utils/filter_configs.py \
              --config-dir tests/configs/torch_spyre_tests \
              --test-type "${RAW_TEST_TYPE}" \
              "${_delta_args[@]}" \
              --runner-map .github/runner_overrides.yaml \
              --flags-map .github/suite_test_flags.yaml \
              --layout-policy .github/test_layout_policy.json \
              --timings .github/test_timings.json \
              --format matrix-json)
          fi

          # Whole-tree scans keep only CONFIG_DIR when set, else drop DEDICATED_CONFIG_DIRS.
          if [ "${CONFIG_ROOT}" = "tests/configs" ]; then
            matrix=$(echo "${matrix}" | python3 -c "
          import json, os, sys
          keep, drop = os.environ['CONFIG_DIR'].strip('/'), os.environ['DEDICATED_CONFIG_DIRS'].split()
          data = json.load(sys.stdin)
          data['suite'] = [s for s in data['suite'] if (s['config'].startswith(keep + '/') if keep else s['config'].split('/')[0] not in drop)]
          print(json.dumps(data))
          ")
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "config_root=${CONFIG_ROOT}" >> "$GITHUB_OUTPUT"

          # test_type is now the literal label vocabulary (smoke/unit/
          # integration/regression/trunk) with no alias-resolution layer, so
          # everything downstream (TORCH_SPYRE_TEST_TYPE env var, the
          # test_multi_spyre distributed-suite gate) can compare against the
          # trimmed raw input directly.
          resolved=$(echo "${RAW_TEST_TYPE}" | xargs)
          echo "resolved_test_type=$resolved" >> "$GITHUB_OUTPUT"

      # push-to-clickhouse.yaml runs on workflow_run and cannot receive a dispatch input, so the
      # orchestrator's uuid rides an artifact it already enumerates. Skipped when empty (a
      # GHA-initiated run); kept 7 days so a delayed or re-run ingest still finds it.
      - name: Record threaded run_id for the ingest
        if: ${{ inputs.run_id != '' }}
        env:
          THREADED_RUN_ID: ${{ inputs.run_id }}
        run: printf '%s' "${THREADED_RUN_ID}" > run-id.txt
      - name: Upload threaded run_id
        if: ${{ inputs.run_id != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-id
          path: run-id.txt
          retention-days: 14

      # The tier the ingest records and hashes into run_id. Only the integration-tests run-name
      # carries it; every other caller's display_title is a PR title or commit subject.
      - name: Record suite tier for the ingest
        env:
          RESOLVED_TEST_TYPE: ${{ steps.filter.outputs.resolved_test_type }}
        run: printf '%s' "${RESOLVED_TEST_TYPE}" > test-type.txt
      - name: Upload suite tier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-type
          path: test-type.txt
          retention-days: 14
          overwrite: true

  # ---------------------------------------------------------------------------
  # Job 0a: derive THIS LEG'S artifact identity
  #
  # A GHA leg installs this PR's build on top of a prebaked image, so what it runs is a
  # DIFFERENT artifact from the image Jenkins published -- and had no identity, which is the
  # whole of the artifact_results coverage gap. spyre-frameworks #1782 stamps the image with
  # its own artifact_id; gha_artifact_id() chains this leg's delta onto it.
  #
  # Its OWN job: the identity is per RUN, not per suite, so deriving it in the ~90-cell matrix
  # would mint 90 copies of one fact. Cardless spyre_pf_x0, and it cannot run on ubuntu-latest
  # -- the base id lives in the image's filesystem. No `needs`, so it never gates the run.
  # ---------------------------------------------------------------------------
  artifact_identity:
    name: Derive artifact identity
    runs-on:
      - x86_64
      - spyre_pf_x0
      - ${{ inputs.runner_label }}
      - ${{ inputs.image_label }}
    timeout-minutes: 10
    # Belt and braces with the action's degrade-to-empty: telemetry never reddens a run.
    continue-on-error: true
    # For jobs that ingest inline (perf), which cannot read the uploaded artifact.
    outputs:
      record: >-
        ${{ steps.derive.outputs.artifact_id != '' && format('{0}|{1}|{2}',
        steps.derive.outputs.artifact_id, steps.derive.outputs.base_artifact_id,
        steps.delta.outputs.installed) || '' }}
    steps:
      # Action, script and library together, so the action finds them in $GITHUB_WORKSPACE.
      # At THIS ref, like every other job -- one definition of the id formula per commit.
      - name: Checkout the identity action, script and library
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          sparse-checkout: |
            .github/actions/derive-gha-artifact-id
            .github/scripts/derive_artifact_id.py
            extensions/clickhouse-ingest
          sparse-checkout-cone-mode: false

      # Run-level facts only: a per-job `uv pip freeze` describes one cell, not the run.
      # EMPTY on the prebaked path, deliberately -- that path tests the image's own bytes
      # UNCHANGED. derive_artifact_id.py still mints this leg's own id through `component`
      # even with installed="", since the base image's stamped id was minted under whichever
      # component built it (e.g. spyre-backend), not necessarily this leg's own.
      - name: Describe what this leg installs on top of the image
        id: delta
        env:
          PREBAKED: ${{ inputs.prebaked_image }}
          HEAD_SHA: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          RPM_NAMES: ${{ inputs.rpm_names }}
          TS_WHEEL: ${{ inputs.torch_spyre_wheel_artifact_name }}
          PT_WHEEL: ${{ inputs.pytorch_wheel_artifact_name }}
        run: |
          set -euo pipefail
          TOKENS=""
          if [ "${PREBAKED}" = "true" ]; then
            echo "prebaked image: tested unchanged, so this leg's id is minted from the base"
            echo "id + component alone (see derive_artifact_id.py)."
          else
            # The sha, not the wheel filename -- that version does not move per commit.
            TOKENS="torch-spyre@${HEAD_SHA:0:12}"
            if [ -n "${RPM_NAMES}" ]; then
              TOKENS="${TOKENS} ${RPM_NAMES}"
            fi
            if [ -n "${TS_WHEEL}" ]; then
              TOKENS="${TOKENS} torch-spyre-wheel@${TS_WHEEL}"
            fi
            if [ -n "${PT_WHEEL}" ]; then
              TOKENS="${TOKENS} pytorch-wheel@${PT_WHEEL}"
            fi
            echo "installed on top: ${TOKENS}"
          fi
          echo "installed=${TOKENS}" >> "$GITHUB_OUTPUT"

      - name: Derive and upload the artifact identity
        id: derive
        uses: ./.github/actions/derive-gha-artifact-id
        with:
          component: ${{ inputs.component }}
          arch: x86_64
          installed: ${{ steps.delta.outputs.installed }}

  # ---------------------------------------------------------------------------
  # Job 0b: build torch-spyre ONCE
  #
  # Compiles the torch_spyre._C extension a single time and uploads it as a
  # wheel artifact. Every test / test_multi_spyre matrix job below installs that
  # one wheel instead of recompiling from source (previously each of the ~90
  # matrix jobs ran its own ~12 min build). Gated exactly like the old per-job
  # build step, so the RPM path (rpm_names set, build disabled) still skips it.
  # ---------------------------------------------------------------------------
  build_torch_spyre:
    name: Build torch-spyre wheel (once)
    # Prebaked path skips the build entirely — torch_spyre is already editable-
    # installed in the baked dev image. Same for the wheel-artifact override
    # path (torch_spyre_wheel_artifact_name set) -- a prebuilt wheel from
    # elsewhere is installed instead, below. (Guarded first so the normal
    # condition is only evaluated off those two paths.)
    if: ${{ !inputs.prebaked_image && inputs.torch_spyre_wheel_artifact_name == '' && (inputs.rpm_names == '' || inputs.build_torch_spyre) }}
    # Compile-only: needs the backend image + SDK toolchain but NO physical Spyre
    # card, so it targets the cardless spyre_pf_x0 pool. This leaves the scarce
    # card runners (spyre_pf_x1/x2) for the test jobs below.
    runs-on:
      - x86_64
      - spyre_pf_x0
      - ${{ inputs.runner_label }}
      - ${{ inputs.image_label }}
    timeout-minutes: 40
    outputs:
      wheel_name: ${{ steps.build.outputs.wheel_name }}
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          # setuptools_scm derives the version from git history, so the wheel
          # build needs the tags and the commits back to the last one. The
          # default fetch-depth 1 (with fetch-tags false) leaves zero tags
          # visible, which silently yields a 0.1.devN version instead of one
          # based on the latest release tag.
          fetch-depth: 0

      # No checkout-pytorch: the C++ build compiles against the installed torch
      # wheel headers; the pytorch source tree (TORCH_ROOT) is only used by the
      # upstream *test* configs, which run in the matrix jobs, not here.
      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'
          # Echo the exact runner-label selectors this job's runs-on used.
          runner_labels: ${{ format('["x86_64","spyre_pf_x0","{0}","{1}"]', inputs.runner_label, inputs.image_label) }}

      - name: Build torch-spyre wheel
        id: build
        uses: ./.github/actions/build-torch-spyre-wheel
        with:
          image_label: ${{ inputs.image_label }}

      - name: Upload torch-spyre wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torch-spyre-wheel
          path: torch-spyre/dist/*.whl
          if-no-files-found: error
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Job 1: test matrix  (dynamic — driven by generate_matrix output)
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.suite.name }}
    needs: [generate_matrix, build_torch_spyre]
    # Run when the single build succeeded, or was skipped (RPM path). If it
    # failed, skip every test job (fail-fast) — build_torch_spyre going red then
    # fails the reusable workflow, blocking merge.
    #
    # The leading `!cancelled() &&` is REQUIRED, not cosmetic: without a
    # status-check function in the `if`, GitHub applies its default
    # transitive-skip and skips this job whenever a `needs` job was skipped.
    # That would make the `== 'skipped'` branch dead code and silently skip
    # every test on the RPM path. (The OR group must stay parenthesised because
    # `&&` binds tighter than `||`.)
    #
    # Skip cleanly in perf mode: generate_matrix emits an empty suite matrix
    # for perf (the work runs in the `perf` job). An eligible job with a
    # zero-entry matrix poisons this reusable workflow's aggregate result to
    # `failure`, which then fails the caller's gate even though the perf job
    # passed. A clean `if:`-false skip does not.
    if: >-
      !cancelled() &&
      needs.generate_matrix.outputs.resolved_test_type != 'perf' &&
      (needs.build_torch_spyre.result == 'success' ||
       needs.build_torch_spyre.result == 'skipped')
    # Don't let one failed suite fail this job -- test_result (below) decides pass/fail after test_retry gets a shot on a fresh pod, so a merge-queue entry isn't evicted before the retry runs.
    continue-on-error: true
    runs-on:
      - x86_64
      - ${{ matrix.suite.runner || 'spyre_pf_x1' }}
      - ${{ inputs.runner_label }}
      - ${{ inputs.image_label }}
    timeout-minutes: 60
    env:
      # GitHub Actions sets CI=true which causes pytest inductor tests to fail.
      # Explicitly clear it.
      CI: ''
      TORCH_SPYRE_TEST_TYPE: ${{ needs.generate_matrix.outputs.resolved_test_type }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate_matrix.outputs.matrix) }}

    steps:
      # Composite actions: NORMAL path sparse-checks-out .github/actions into the
      # workspace. PREBAKED path symlinks the baked .github into the workspace
      # instead — `uses: ./.github/actions/*` resolves against $GITHUB_WORKSPACE
      # (never the shell cwd or an arbitrary baked dir), so without this the
      # baked-but-unlinked actions can't be found ("did you forget to run
      # actions/checkout"). The symlink runs the EXACT baked harness — no fetch,
      # preserving the prebaked provenance guarantee — and lives in the runner's
      # disposable workspace, so the baked tree is only referenced, never mutated.
      - name: Checkout composite actions
        if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Expose baked composite actions in the workspace
        if: ${{ inputs.prebaked_image }}
        run: ln -sfn "${PREBAKED_TORCH_SPYRE_DIR}/.github" "${GITHUB_WORKSPACE}/.github"

      # Product source: NORMAL path checks out the PR ref. PREBAKED path uses the
      # baked /home/senuser/torch-spyre (source + editable venv already in image)
      # → no checkout, no runtime mkdir under $HOME (this was the collision).
      - if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Check out pre-built PyTorch
        if: ${{ inputs.checkout_pytorch }}
        uses: ./.github/actions/checkout-pytorch

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}
          # Echo the exact runner-label selectors this job's runs-on used.
          runner_labels: ${{ format('["x86_64","{0}","{1}","{2}"]', matrix.suite.runner || 'spyre_pf_x1', inputs.runner_label, inputs.image_label) }}

      # Install the wheel built once by build_torch_spyre — no recompile.
      # Skipped on the RPM path (build_torch_spyre skipped) AND on the prebaked
      # path (torch_spyre already editable-installed in the baked image).
      - name: Install prebuilt torch-spyre
        if: >-
          ${{ !inputs.prebaked_image &&
          (needs.build_torch_spyre.result == 'success' || inputs.torch_spyre_wheel_artifact_name != '') }}
        uses: ./.github/actions/install-prebuilt-torch-spyre
        with:
          artifact_name: ${{ inputs.torch_spyre_wheel_artifact_name || 'torch-spyre-wheel' }}

      # pytorch/pytorch dispatch path only (build_test_pytorch_source.yaml):
      # override the pinned pytorch-cpu wheel install-prebuilt-torch-spyre's
      # `uv sync` just resolved, with the exact PyTorch build torch-spyre's
      # _C.so is ABI-bound to. Must run AFTER install-prebuilt-torch-spyre so
      # it wins. No-op (skipped) for every existing caller.
      - name: Install prebuilt PyTorch
        if: ${{ inputs.pytorch_wheel_artifact_name != '' }}
        uses: ./.github/actions/install-prebuilt-pytorch
        with:
          artifact_name: ${{ inputs.pytorch_wheel_artifact_name }}

      - name: Derive report paths
        run: |
          CONFIG="${{ matrix.suite.config }}"
          # A bucket (several short configs in one job) names its report after the bucket.
          REPORT_STEM="${{ matrix.suite.report }}"
          REPORT_NAME="${REPORT_STEM:-$(basename "${CONFIG%.yaml}")}.xml"
          echo "REPORT_NAME=${REPORT_NAME}" >> "$GITHUB_ENV"
          echo "REPORT_PATH=${GITHUB_WORKSPACE}/${REPORT_NAME}" >> "$GITHUB_ENV"
          # Every member of a bucket, root-qualified; one path for anything else.
          MEMBERS="${{ matrix.suite.configs }}"
          ROOT="${{ needs.generate_matrix.outputs.config_root }}"
          CONFIG_PATHS=""
          for m in ${MEMBERS:-$CONFIG}; do CONFIG_PATHS="${CONFIG_PATHS:+$CONFIG_PATHS }${ROOT}/${m}"; done
          echo "CONFIG_PATHS=${CONFIG_PATHS}" >> "$GITHUB_ENV"
          # The job name lists only the first few members; the summary lists them all.
          if [ -n "${MEMBERS}" ]; then
            {
              echo "### ${REPORT_STEM}: $(wc -w <<< "${MEMBERS}") configs in this job"
              for m in ${MEMBERS}; do echo "- \`${m}\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run ${{ matrix.suite.name }} tests
        id: run_tests
        uses: ./.github/actions/run-test-suite
        with:
          suite_name: ${{ matrix.suite.name }}
          # matrix.suite.config is relative to the dir generate_matrix scanned.
          config: ${{ env.CONFIG_PATHS }}
          # Prebaked: run FROM the baked source dir + its SHARED venv at
          # $HOME/.venv (a sibling of the source, not inside it); normal: the
          # checkout (default 'torch-spyre') + its local '.venv'.
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}
          venv_path: ${{ inputs.prebaked_image && env.PREBAKED_VENV_PATH || '.venv' }}
          extra_test_flags: ${{ matrix.suite.extra_test_flags || inputs.extra_test_flags }}
          junit_xml_path: ${{ env.REPORT_PATH }}
          report_name: ${{ env.REPORT_NAME }}
          pre_run: |
            # Reset the AIU setup guard and stale topo so ibm-aiu-setup.sh
            # re-discovers cards. set +u because the script references unset
            # vars; || exit 1 because run-test-suite runs with set +e and a
            # failed refresh must not let tests run with stale topology.
            # Inlined into an eval single-quoted string: no apostrophes, no
            # double-dash tokens.
            set +u
            unset _IBM_AIU_SETUP
            rm -rf /tmp/etc/ibm/spyre/topo.json
            source /etc/profile.d/ibm-aiu-setup.sh || exit 1

      # overwrite: true avoids a silent 409 on re-upload when this leg is manually re-run.
      - name: Upload JUnit XML report
        if: always()
        continue-on-error: true  # transient artifact-service 403s must not fail a job whose tests passed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.REPORT_NAME }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
          retention-days: ${{ inputs.report_retention_days }}
          overwrite: true

      # Records this leg's suite as a uniquely-named artifact so the retry collectors can rebuild a retry matrix without needing this job's own (continue-on-error-muddied) conclusion. Uploaded before the leg finishes, which is what lets the early collector start a retry while the rest of the matrix is still running.
      - name: Save suite descriptor for pod-level retry
        if: failure()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/failed_suite"
          cat > "${RUNNER_TEMP}/failed_suite/suite.json" <<'JSONEOF'
          ${{ toJSON(matrix.suite) }}
          JSONEOF

      # The name carries github.run_attempt: the artifacts REST API is
      # run-scoped, not attempt-scoped (there is no /attempts/N/artifacts
      # endpoint and no attempt field on the artifact object), and a re-run
      # keeps the earlier attempt's descriptors until they expire. Without the
      # attempt in the name, a retry collector on a later attempt reads a
      # stale descriptor from a prior attempt and retries a suite that already
      # passed. See retention-days:1 below -- it does not help within 24h.
      # The name also carries generate_matrix's call_id, because the same run
      # can hold descriptors from another call of this workflow (see call_id).
      - name: Upload failed-suite descriptor
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-suite-${{ needs.generate_matrix.outputs.call_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/failed_suite/suite.json
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 1b: perf benchmark  (test_type=perf only, never per-PR)
  #
  # perf is a benchmark MODE of `make tests`, not an OOT pytest-config suite, so
  # it never appears in the config-driven `test` matrix above (generate_matrix
  # emits an empty matrix for perf). `make tests TEST_TYPE=perf` shells out to
  # the spyre-perf-suite console script baked into the dev image and writes
  # report.xml into RESULTS_DIR. This job runs that single benchmark step on a
  # card runner. The reports are not uploaded as artifacts; the results are
  # consumed only by the ClickHouse ingest path.
  #
  # POLICY: perf is a weekly-only suite -- it must NEVER run on a per-PR trigger
  # (it is expensive and holds a scarce card runner). The `github.event_name !=
  # pull_request` guard below is the hard stop: even if a pull_request path
  # forwarded test_type=perf, this job stays skipped. The weekly/scheduled and
  # orchestrator paths reach here via workflow_dispatch/schedule, not
  # pull_request, so they are unaffected.
  # ---------------------------------------------------------------------------
  perf:
    name: Perf benchmark
    needs: [generate_matrix, build_torch_spyre, artifact_identity]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.generate_matrix.outputs.resolved_test_type == 'perf' &&
      (needs.build_torch_spyre.result == 'success' ||
       needs.build_torch_spyre.result == 'skipped')
    runs-on:
      - x86_64
      - spyre_pf_x1
      - ${{ inputs.runner_label }}
      - ${{ inputs.image_label }}
    timeout-minutes: 120
    env:
      # Flat results dir, matching the Makefile default and PR #3452. The suite
      # writes both report.txt and report.xml here.
      RESULTS_DIR: ${{ github.workspace }}/perf-results
      # Mapped to env so the inline-ingest step can gate on it: secrets cannot be
      # used in a step `if:`. Empty (caller passed no ClickHouse secrets) => the
      # ingest step is skipped and the perf run still succeeds.
      CLICKHOUSE_INGEST_HOST: ${{ secrets.CLICKHOUSE_V2_HOST || secrets.CLICKHOUSE_HOST }}
    steps:
      # ALWAYS sparse-checkout .github from the workflow ref, in BOTH prebaked
      # and normal mode. `uses: ./.github/actions/*` resolves the action
      # DEFINITION against $GITHUB_WORKSPACE/.github before any step of that
      # action runs, so a composite action added on this branch must be present
      # in the workspace even when the benchmark runs from a prebaked image. The
      # matrix jobs symlink the baked .github instead, which is fine there because
      # they only use actions old enough to be in every image; the perf job is the
      # one that references a NEWER action (ingest-xml-to-clickhouse), so a symlink
      # to an older baked .github fails to resolve it ("Can't find action.yml ...
      # Did you forget to run actions/checkout"). A fresh sparse-checkout of just
      # .github is tiny, is owned by the disposable runner workspace (a separate
      # dir from PREBAKED_TORCH_SPYRE_DIR, so the baked tree is never mutated), and
      # always carries the current actions + the .github/scripts the ingest action
      # reads. The benchmark itself still runs from the baked source dir
      # (PREBAKED_TORCH_SPYRE_DIR) below, so prebaked provenance for the RUN is
      # unchanged.
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          # extensions/ too: the ingest action installs the library from this checkout,
          # and .github alone yields the script without it.
          sparse-checkout: |
            .github
            Makefile
            mk
            benchmarks
            extensions/clickhouse-ingest
            extensions/spyre-bench
          sparse-checkout-cone-mode: false

      - if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}

      - name: Install prebuilt torch-spyre
        if: >-
          ${{ !inputs.prebaked_image &&
          (needs.build_torch_spyre.result == 'success' || inputs.torch_spyre_wheel_artifact_name != '') }}
        uses: ./.github/actions/install-prebuilt-torch-spyre
        with:
          artifact_name: ${{ inputs.torch_spyre_wheel_artifact_name || 'torch-spyre-wheel' }}

      # pytorch/pytorch dispatch path only (build_test_pytorch_source.yaml):
      # override the pinned pytorch-cpu wheel install-prebuilt-torch-spyre's
      # `uv sync` just resolved, with the exact PyTorch build torch-spyre's
      # _C.so is ABI-bound to. Must run AFTER install-prebuilt-torch-spyre so
      # it wins. No-op (skipped) for every existing caller.
      - name: Install prebuilt PyTorch
        if: ${{ inputs.pytorch_wheel_artifact_name != '' }}
        uses: ./.github/actions/install-prebuilt-pytorch
        with:
          artifact_name: ${{ inputs.pytorch_wheel_artifact_name }}

      - name: Run perf benchmark (make tests TEST_TYPE=perf)
        id: run-perf
        run: |
          # Prebaked: run FROM the baked source dir + its SHARED venv at
          # $HOME/.venv; normal: the checkout ('torch-spyre') + local '.venv'.
          if [ "${{ inputs.prebaked_image }}" = "true" ]; then
            SRC_DIR="${PREBAKED_TORCH_SPYRE_DIR}"
            VENV="${PREBAKED_VENV_PATH}"
          else
            SRC_DIR="torch-spyre"
            VENV="torch-spyre/.venv"
          fi
          mkdir -p "${RESULTS_DIR}"
          # Refresh AIU setup so the benchmark sees the card topology, mirroring
          # the matrix suites' pre_run. set +u because the script reads unset
          # vars; a failed refresh must abort before the benchmark runs.
          set +u
          unset _IBM_AIU_SETUP
          rm -rf /tmp/etc/ibm/spyre/topo.json
          source /etc/profile.d/ibm-aiu-setup.sh || exit 1
          set -u
          # shellcheck disable=SC1091
          source "${VENV}/bin/activate"
          make -C "${SRC_DIR}" tests TEST_TYPE=perf RESULTS_DIR="${RESULTS_DIR}"

      # The benchmark reports are not uploaded as workflow artifacts; the
      # results are consumed only by the ClickHouse ingest path.
      - name: Confirm perf report was produced
        id: confirm-report
        run: |
          # Fail if the benchmark did not write its report. Do not echo the
          # report contents to the build log.
          test -f "${RESULTS_DIR}/report.xml" \
            || { echo "::error::perf run did not produce report.xml"; exit 1; }
          echo "perf report written to \${RESULTS_DIR} (not uploaded)"

      # Push the perf report to ClickHouse INLINE on this card runner. The
      # report is never uploaded as a workflow artifact (public repo: artifacts
      # are world-readable and benchmark numbers must stay private), so it
      # cannot ride the push-to-clickhouse.yaml artifact-download path the
      # matrix suites use. The composite action is the SAME ingest
      # implementation that workflow reuses, so there is one code path, not two.
      # Gated on the ClickHouse host: a caller that passes no ClickHouse secrets
      # skips the push and the perf run still succeeds. Nightly has secrets, so
      # --trigger-type perf + 0 parsed records fails the ingest step.
      - name: Ingest perf report into ClickHouse (inline, no artifact)
        id: ingest
        if: ${{ env.CLICKHOUSE_INGEST_HOST != '' && inputs.bench_mode != 'replace' }}
        uses: ./.github/actions/ingest-xml-to-clickhouse
        with:
          # strict (the default) on purpose: this step is the only writer and the report is never uploaded,
          # so a failed or parked write is lost data and must show red.
          xml-dir: ${{ env.RESULTS_DIR }}
          workflow: ${{ github.workflow }}
          branch: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref_name }}
          sha: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          gha-run-id: ${{ github.run_id }}
          component: ${{ inputs.component || 'torch-spyre' }}
          # The orchestrator's uuid when this run was Jenkins-dispatched; empty otherwise,
          # and the ingest then falls back to hashing its own run coordinate.
          run-id: ${{ inputs.run_id }}
          triggered-at: ''
          # perf never runs on pull_request (see the job `if:` above), so there
          # is no PR to associate; leave empty.
          pr-number: ''
          trigger-type: perf
          # perf runs on x86 GitHub-hosted runners, so the rows are x86_64.
          platform: x86_64
          artifact-id: ${{ needs.artifact_identity.outputs.record }}
          # Workspace sparse-checkout of this ref's .github — not the baked
          # tree. The benchmark still runs from PREBAKED_TORCH_SPYRE_DIR.
          torch-spyre-dir: ${{ github.workspace }}
          clickhouse-v2-host: ${{ secrets.CLICKHOUSE_V2_HOST || secrets.CLICKHOUSE_HOST }}
          clickhouse-v2-port: ${{ (secrets.CLICKHOUSE_V2_HOST && secrets.CLICKHOUSE_V2_PORT) || (!secrets.CLICKHOUSE_V2_HOST && secrets.CLICKHOUSE_PORT)
            || '' }}
          clickhouse-v2-user: ${{ secrets.CLICKHOUSE_V2_USER }}
          clickhouse-v2-pass: ${{ secrets.CLICKHOUSE_V2_PASSWORD }}
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}

      # bench_mode != off: the report just produced, split into the benchmarks/ catalog's cases (no second suite run).
      - name: Install uv (bench mirror)
        if: ${{ !cancelled() && contains(fromJSON('["side-by-side","replace"]'), inputs.bench_mode) }}
        continue-on-error: ${{ inputs.bench_mode != 'replace' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known

      - name: Mirror the perf report through the bench catalog
        id: bench-mirror
        if: ${{ !cancelled() && contains(fromJSON('["side-by-side","replace"]'), inputs.bench_mode) && steps.confirm-report.outcome == 'success' }}
        continue-on-error: ${{ inputs.bench_mode != 'replace' }}
        env:
          BENCH_MODE: ${{ inputs.bench_mode }}
          ARTIFACT_RECORD: ${{ needs.artifact_identity.outputs.record }}
          BENCH_PURPOSE: on-demand
          BENCH_ENVIRONMENT: one-device
          BENCH_REUSE: never
          BENCH_INVOKER: gha
          BENCH_QUIET: '1'
          BENCH_INGEST: '0'
          BENCH_REQUIRED: '1'
          BENCH_SUITE_FROM: ${{ env.RESULTS_DIR }}
          BENCH_PASS_ENV: BENCH_SUITE_FROM
        run: |
          set -eu
          uv venv --clear .bench-venv
          uv pip install --python .bench-venv/bin/python ./extensions/spyre-bench ./extensions/clickhouse-ingest lxml
          export PATH="${GITHUB_WORKSPACE}/.bench-venv/bin:${PATH}"
          export BENCH_SUBJECT_ID="${ARTIFACT_RECORD%%|*}"
          make bench-validate bench-check-ids
          strict=""
          if [ "${BENCH_MODE}" = "replace" ]; then strict="--strict"; fi
          python3 benchmarks/tools/check_report_coverage.py "${RESULTS_DIR}" ${strict} \
            --cases-file "${GITHUB_WORKSPACE}/bench-cases.txt"
          # Only the cases whose rows this report holds: a declared series the suite no longer emits is not a failure.
          BENCH_CASES="$(paste -sd, "${GITHUB_WORKSPACE}/bench-cases.txt")"
          export BENCH_CASES
          [ -n "${BENCH_CASES}" ] || { echo "::error::the report holds no declared case"; exit 1; }
          make bench-run BENCH_RESULTS_DIR="${GITHUB_WORKSPACE}/bench-results"
          python3 benchmarks/tools/collect_ingest_xml.py "${GITHUB_WORKSPACE}/bench-results" \
            "${GITHUB_WORKSPACE}/bench-results/ingest-xml" --github-output

      # side-by-side: the engine's own results as a connected CI run, filed in the bench-<workflow> series.
      # Per-case rows only; kernel rows stay with the legacy ingest. channel-trust ci is refused by the action
      # on pull_request / workflow_run events (this job never runs on pull_request).
      - name: Ingest the engine results into ClickHouse (side-by-side)
        id: bench-ingest-dir
        if: ${{ !cancelled() && env.CLICKHOUSE_INGEST_HOST != '' && inputs.bench_mode == 'side-by-side' && steps.bench-mirror.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/ingest-xml-to-clickhouse
        with:
          bench-dir: ${{ github.workspace }}/bench-results
          channel-trust: ci
          workflow: ${{ format('bench-{0}', github.workflow) }}
          branch: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref_name }}
          sha: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          gha-run-id: ${{ github.run_id }}
          component: ${{ inputs.component || 'torch-spyre' }}
          trigger-type: perf
          platform: x86_64
          artifact-id: ${{ needs.artifact_identity.outputs.record }}
          torch-spyre-dir: ${{ github.workspace }}
          clickhouse-v2-host: ${{ secrets.CLICKHOUSE_V2_HOST || secrets.CLICKHOUSE_HOST }}
          clickhouse-v2-port: ${{ (secrets.CLICKHOUSE_V2_HOST && secrets.CLICKHOUSE_V2_PORT) || (!secrets.CLICKHOUSE_V2_HOST && secrets.CLICKHOUSE_PORT)
            || '' }}
          clickhouse-v2-user: ${{ secrets.CLICKHOUSE_V2_USER }}
          clickhouse-v2-pass: ${{ secrets.CLICKHOUSE_V2_PASSWORD }}
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}

      # replace: the per-case XMLs under the legacy workflow name and run id (a bench-dir run derives its own
      # run id from the engine run, so it cannot carry the orchestrator's), kernel rows included.
      - name: Ingest the mirrored rows into ClickHouse (replace)
        id: bench-ingest
        if: ${{ !cancelled() && env.CLICKHOUSE_INGEST_HOST != '' && inputs.bench_mode == 'replace' && steps.bench-mirror.outcome == 'success' }}
        uses: ./.github/actions/ingest-xml-to-clickhouse
        with:
          # strict (the default) on purpose: in replace mode this is the only writer of the perf rows.
          xml-dir: ${{ github.workspace }}/bench-results/ingest-xml
          workflow: ${{ github.workflow }}
          branch: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref_name }}
          sha: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          gha-run-id: ${{ github.run_id }}
          component: ${{ inputs.component || 'torch-spyre' }}
          run-id: ${{ inputs.run_id }}
          triggered-at: ''
          pr-number: ''
          trigger-type: perf
          platform: x86_64
          artifact-id: ${{ needs.artifact_identity.outputs.record }}
          torch-spyre-dir: ${{ github.workspace }}
          clickhouse-v2-host: ${{ secrets.CLICKHOUSE_V2_HOST || secrets.CLICKHOUSE_HOST }}
          clickhouse-v2-port: ${{ (secrets.CLICKHOUSE_V2_HOST && secrets.CLICKHOUSE_V2_PORT) || (!secrets.CLICKHOUSE_V2_HOST && secrets.CLICKHOUSE_PORT)
            || '' }}
          clickhouse-v2-user: ${{ secrets.CLICKHOUSE_V2_USER }}
          clickhouse-v2-pass: ${{ secrets.CLICKHOUSE_V2_PASSWORD }}
          clickhouse-db-v2: ${{ secrets.CLICKHOUSE_DB_V2 }}

      # Four honesty lines. Echo only — never upload report.xml (public
      # artifacts would leak benchmark numbers).
      - name: Perf ingest banners
        if: always()
        env:
          EXEC_OUTCOME: ${{ steps.run-perf.outcome }}
          REPORT_OUTCOME: ${{ steps.confirm-report.outcome }}
          INGEST_OUTCOME: ${{ inputs.bench_mode == 'replace' && steps.bench-ingest.outcome || steps.ingest.outcome }}
          BENCH_MODE: ${{ inputs.bench_mode }}
          BENCH_MIRROR_OUTCOME: ${{ steps.bench-mirror.outcome }}
          BENCH_INGEST_OUTCOME: ${{ inputs.bench_mode == 'replace' && steps.bench-ingest.outcome || steps.bench-ingest-dir.outcome }}
        run: |
          if [ "${EXEC_OUTCOME}" = "success" ]; then
            EXEC=PASS
          else
            EXEC=FAIL
          fi
          if [ "${REPORT_OUTCOME}" = "success" ]; then
            VALIDATION=PASS
          else
            VALIDATION=FAIL
          fi
          if [ "${INGEST_OUTCOME}" = "success" ]; then
            INGEST=SUCCESS
          elif [ "${INGEST_OUTCOME}" = "failure" ]; then
            INGEST=FAILED
          else
            INGEST=SKIPPED
          fi
          if [ "${REPORT_OUTCOME}" != "success" ]; then
            REASON="required result file missing/empty"
          elif [ "${INGEST_OUTCOME}" = "failure" ]; then
            REASON="ingest failed"
          elif [ "${INGEST_OUTCOME}" = "skipped" ] || [ -z "${INGEST_OUTCOME}" ]; then
            REASON="ingest not reached"
          else
            REASON="ok"
          fi
          echo "benchmark execution: ${EXEC}"
          echo "report validation: ${VALIDATION}"
          echo "ClickHouse ingest: ${INGEST}"
          echo "reason: ${REASON}"
          echo "bench mode: ${BENCH_MODE:-off}; mirror: ${BENCH_MIRROR_OUTCOME:-n/a}; bench ingest: ${BENCH_INGEST_OUTCOME:-n/a}"

  # v1 model-ops: delete once the dashboard reads v2 capabilities
  # ---------------------------------------------------------------------------
  # Job 1c: model-ops capability suites  (test_type=capability only)
  #
  # Which torch operations a model exercises, and whether each runs on Spyre or
  # falls back to the CPU. Like perf, these suites carry no
  # test_suite_config.labels, so generate_matrix emits an empty matrix and pins
  # resolved_test_type=capability to reach this job instead. Unlike perf this IS
  # a matrix -- one job per model config -- so the suite list lives here.
  #
  # Folded in from the standalone model_ops_tests_nightly.yaml, which ran its own
  # cron at the SAME 0 2 * * * as tests-nightly and duplicated the wheel build.
  # Running under _test_matrix means one nightly, one wheel, and a run_id that is
  # threaded rather than minted -- which is what lets these results join
  # artifact_results instead of orphaning.
  #
  # POLICY: never on a per-PR trigger. Ten model suites each holding a card
  # runner is a nightly cost, and the guard below is the hard stop even if a
  # pull_request path forwarded test_type=capability.
  # ---------------------------------------------------------------------------
  model_ops:
    # The " Spyre" suffix is REQUIRED, not decoration: parse_model_ops_logs.py derives
    # suite_name from the downloaded log's filename, which is the job name, and skips any
    # file whose name lacks a \bSpyre\b token. The standalone workflow's jobs were bare
    # ("GPT OSS 20B"), so every log was skipped and nothing has been ingested since
    # 2026-09-10 -- 10 days of silent zero-row runs. Renaming a job here is what un-breaks
    # it; the stored suite_names ("GPT OSS 20B Spyre") show this is the shape the parser
    # always expected.
    name: ${{ matrix.suite.name }} Spyre
    needs: [generate_matrix, build_torch_spyre]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.generate_matrix.outputs.resolved_test_type == 'capability' &&
      (needs.build_torch_spyre.result == 'success' ||
       needs.build_torch_spyre.result == 'skipped')
    runs-on:
      - x86_64
      - spyre_pf_x1
      - ${{ inputs.runner_label }}
      - ${{ inputs.image_label }}
    timeout-minutes: 60
    env:
      # GitHub Actions sets CI=true, which makes the pytest inductor tests fail on
      # a mix of fallbacks and decompositions. Blanked, as the other suites do.
      CI: ''
    strategy:
      fail-fast: false   # one model's failure must not hide the other nine
      # -----------------------------------------------------------------------
      # To add a suite: append an entry here.
      #   - name: <label shown in the GHA UI>
      #     config: <filename inside tests/configs/model_ops_tests/>
      # The JUnit report is named after the config (granite-4.1-8b.yaml ->
      # granite-4.1-8b.xml).
      # -----------------------------------------------------------------------
      matrix:
        suite:
          - name: GPT OSS 20B
            config: gpt-oss-20b.yaml
          - name: Granite 3.3 8B Instruct FMS
            config: granite-3.3-8b-instruct-fms.yaml
          - name: Granite 3.3 8B Instruct
            config: granite-3.3-8b-instruct.yaml
          - name: Granite 4.1 8B
            config: granite-4.1-8b.yaml
          - name: Meta Llama 3.1 8B Instruct
            config: Meta-Llama-3.1-8B-Instruct.yaml
          - name: Ministral 3 14B Instruct 2512
            config: Ministral-3-14B-Instruct-2512.yaml
          - name: Mistral Small 3.2 24B Instruct 2506
            config: Mistral-Small-3.2-24B-Instruct-2506.yaml
          - name: Gemma 4 26B A4B IT
            config: gemma-4-26B-A4B-it.yaml
          - name: Gemma 4 12B Instruct
            config: gemma-4-12B-it.yaml
          # "7B" kept: suite_name is derived from the job name, and prod's 3,096 rows for this
          # config are all under 'Qwen 2.5 7B Spyre'. Dropping it would fork the series.
          - name: Qwen 2.5 7B
            config: Qwen2.5-7B-Instruct.yaml
    steps:
      # Same reasoning as the perf job: the action DEFINITIONS must be in the
      # workspace even in prebaked mode, so .github is always checked out fresh.
      - name: Checkout composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}

      - if: ${{ inputs.checkout_pytorch }}
        uses: ./.github/actions/checkout-pytorch

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}

      - name: Install prebuilt torch-spyre
        if: >-
          ${{ !inputs.prebaked_image &&
          (needs.build_torch_spyre.result == 'success' || inputs.torch_spyre_wheel_artifact_name != '') }}
        uses: ./.github/actions/install-prebuilt-torch-spyre
        with:
          artifact_name: ${{ inputs.torch_spyre_wheel_artifact_name || 'torch-spyre-wheel' }}

      - name: Derive report paths
        run: |
          REPORT_NAME="${{ matrix.suite.config }}"; REPORT_NAME="${REPORT_NAME%.yaml}.xml"
          echo "REPORT_NAME=${REPORT_NAME}" >> "$GITHUB_ENV"
          echo "REPORT_PATH=${GITHUB_WORKSPACE}/${REPORT_NAME}" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.suite.name }} model ops test suite
        uses: ./.github/actions/run-test-suite
        with:
          suite_name: ${{ matrix.suite.name }}
          config: tests/configs/model_ops_tests/${{ matrix.suite.config }}
          extra_test_flags: -v
          junit_xml_path: ${{ env.REPORT_PATH }}
          report_name: ${{ env.REPORT_NAME }}
          pre_run: |
            # Clear the cached AIU setup guard and stale topo.json before every
            # attempt, so a card left bad by a killed attempt is re-discovered
            # rather than carrying stale state into the retry.
            # set +u because ibm-aiu-setup.sh reads its own guard variable,
            # which the unset just removed; || exit 1 because run-test-suite
            # runs with set +e and a failed refresh must not let tests run
            # against stale topology.
            set +u
            unset _IBM_AIU_SETUP
            rm -rf /tmp/etc/ibm/spyre/topo.json
            source /etc/profile.d/ibm-aiu-setup.sh || exit 1

      # Uploaded even on failure -- a failed run is when the report matters most.
      # The artifact name is the report filename so ten matrix jobs do not
      # overwrite one another.
      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.REPORT_NAME }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn   # warn, not fail, if pytest itself crashed
          retention-days: ${{ inputs.report_retention_days }}

      - name: Annotate job with suite metadata
        if: always()
        run: |
          {
            echo "### Model-ops suite: ${{ matrix.suite.name }}"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Config | \`${{ matrix.suite.config }}\` |"
            echo "| Report | \`${{ env.REPORT_NAME }}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 2: Multi-Spyre test matrix
  #
  # Only runs for test_type values that include the distributed suite:
  #   regression         — includes everything (distributed_tests configs
  #                        carry the regression label)
  #   trunk              — push-to-main coverage (distributed_tests configs
  #                        carry the trunk label too)
  #   integration        — used as the reduced default by integration-tests.yaml;
  #                        distributed comms (streams/barrier/broadcast/gather/
  #                        allgather) are exactly the device-layer surface this
  #                        tier exists to protect, so it always runs alongside it
  #                        (distributed_tests configs carry the "integration"
  #                        label too, so this also matches filter_configs.py's
  #                        own label matching)
  #   suite_distributed — targets the distributed_tests/ directory directly
  #   (empty)           — same as regression
  # For smoke / unit / suite_<other> the distributed job is skipped entirely
  # so no x2 runners are allocated.
  # ---------------------------------------------------------------------------
  test_multi_spyre:
    name: ${{ matrix.suite.name }}
    needs: [generate_matrix, build_torch_spyre]
    # Run for distributed-including test_types AND only when the single build
    # succeeded or was skipped (RPM path). A failed build skips this job too.
    # The leading `!cancelled() &&` is REQUIRED (see the `test` job above):
    # without a status-check function the default transitive-skip would skip
    # this job on the RPM path, where build_torch_spyre is intentionally skipped.
    if: >-
      !cancelled() &&
      inputs.config_dir == '' &&
      (needs.generate_matrix.outputs.resolved_test_type == '' ||
       needs.generate_matrix.outputs.resolved_test_type == 'regression' ||
       needs.generate_matrix.outputs.resolved_test_type == 'trunk' ||
       needs.generate_matrix.outputs.resolved_test_type == 'integration' ||
       needs.generate_matrix.outputs.resolved_test_type == 'suite_distributed') &&
      (needs.build_torch_spyre.result == 'success' ||
       needs.build_torch_spyre.result == 'skipped')
    # See the `test` job above: continue-on-error keeps a single failed suite from prematurely failing the reusable workflow -- test_result decides pass/fail after the retry.
    continue-on-error: true
    runs-on:
      - x86_64
      - spyre_pf_x2
      - ${{ inputs.runner_label }}
      - ${{ inputs.image_label }}
    timeout-minutes: 60
    env:
      CI: ''

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Test Multi-Spyre Setup
            config: distributed_tests/test_general.yaml
          - name: Test Multi-Spyre Barrier
            config: distributed_tests/test_barrier.yaml
          - name: Test Multi-Spyre Broadcast
            config: distributed_tests/test_broadcast.yaml
          - name: Test Multi-Spyre Gather
            config: distributed_tests/test_gather.yaml
          - name: Test Multi-Spyre Allgather
            config: distributed_tests/test_allgather.yaml
          - name: Test Multi-Spyre Allreduce
            config: distributed_tests/test_allreduce.yaml
          - name: Test Multi-Spyre Reduce
            config: distributed_tests/test_reduce.yaml
          - name: Test Multi-Spyre Broadcast Compiled
            config: distributed_tests/test_broadcast_compiled.yaml
          - name: Test Multi-Spyre Allgather Compiled
            config: distributed_tests/test_allgather_compiled.yaml
          - name: Test Multi-Spyre Allreduce Compiled
            config: distributed_tests/test_allreduce_compiled.yaml
          - name: Test Multi-Spyre KV Offload
            config: distributed_tests/test_kv_offload.yaml
          - name: Test Multi-Spyre SharedHostPool
            config: distributed_tests/test_shared_host_pool.yaml
          - name: Test Multi-Spyre Profiler Coll Metadata
            config: distributed_tests/test_profiler_coll_metadata.yaml
          - name: Test Multi-Spyre Allreduce Coalesced
            config: distributed_tests/test_allreduce_coalesced.yaml
          - name: Test Multi-Spyre Allgather Coalesced
            config: distributed_tests/test_allgather_coalesced.yaml
          - name: Test Multi-Spyre ReduceScatter Compiled
            config: distributed_tests/test_reduce_scatter_compiled.yaml

    steps:
      # See the `test` job above: prebaked path symlinks the baked .github into
      # $GITHUB_WORKSPACE so `uses: ./.github/actions/*` resolves to the baked
      # harness (no fetch); normal path sparse-checks-out .github/actions.
      - name: Checkout composite actions
        if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Expose baked composite actions in the workspace
        if: ${{ inputs.prebaked_image }}
        run: ln -sfn "${PREBAKED_TORCH_SPYRE_DIR}/.github" "${GITHUB_WORKSPACE}/.github"

      - if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Check out pre-built PyTorch
        if: ${{ inputs.checkout_pytorch }}
        uses: ./.github/actions/checkout-pytorch

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}
          # Echo the exact runner-label selectors this job's runs-on used.
          runner_labels: ${{ format('["x86_64","spyre_pf_x2","{0}","{1}"]', inputs.runner_label, inputs.image_label) }}

      # Install the wheel built once by build_torch_spyre — no recompile.
      # Skipped on the RPM path (build skipped) AND on the prebaked path.
      - name: Install prebuilt torch-spyre
        if: >-
          ${{ !inputs.prebaked_image &&
          (needs.build_torch_spyre.result == 'success' || inputs.torch_spyre_wheel_artifact_name != '') }}
        uses: ./.github/actions/install-prebuilt-torch-spyre
        with:
          artifact_name: ${{ inputs.torch_spyre_wheel_artifact_name || 'torch-spyre-wheel' }}

      # pytorch/pytorch dispatch path only (build_test_pytorch_source.yaml):
      # override the pinned pytorch-cpu wheel install-prebuilt-torch-spyre's
      # `uv sync` just resolved, with the exact PyTorch build torch-spyre's
      # _C.so is ABI-bound to. Must run AFTER install-prebuilt-torch-spyre so
      # it wins. No-op (skipped) for every existing caller.
      - name: Install prebuilt PyTorch
        if: ${{ inputs.pytorch_wheel_artifact_name != '' }}
        uses: ./.github/actions/install-prebuilt-pytorch
        with:
          artifact_name: ${{ inputs.pytorch_wheel_artifact_name }}

      - name: Derive report paths
        run: |
          CONFIG="${{ matrix.suite.config }}"
          REPORT_NAME="$(basename "${CONFIG%.yaml}.xml")"
          echo "REPORT_NAME=${REPORT_NAME}" >> "$GITHUB_ENV"
          echo "REPORT_PATH=${GITHUB_WORKSPACE}/${REPORT_NAME}" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.suite.name }} tests
        uses: ./.github/actions/run-test-suite
        with:
          suite_name: ${{ matrix.suite.name }}
          config: tests/configs/${{ matrix.suite.config }}
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}
          venv_path: ${{ inputs.prebaked_image && env.PREBAKED_VENV_PATH || '.venv' }}
          extra_test_flags: ${{ inputs.extra_test_flags_multi_spyre }}
          parallel: 'false'
          junit_xml_path: ${{ env.REPORT_PATH }}
          report_name: ${{ env.REPORT_NAME }}
          pre_run: |
            # Multi-Spyre tests require a fresh topology probe: reset the AIU
            # setup guard and stale topo so ibm-aiu-setup.sh re-discovers all
            # attached cards. set +u because the script references unset vars;
            # || exit 1 because run-test-suite runs with set +e and a failed
            # refresh must not let tests run with stale topology.
            # Inlined into an eval single-quoted string: no apostrophes, no
            # double-dash tokens.
            set +u
            unset _IBM_AIU_SETUP
            rm -rf /tmp/etc/ibm/spyre/topo.json
            source /etc/profile.d/ibm-aiu-setup.sh || exit 1

      # overwrite: true -- see the identical note on the `test` job's upload step above.
      - name: Upload JUnit XML report
        if: always()
        continue-on-error: true  # transient artifact-service 403s must not fail a job whose tests passed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.REPORT_NAME }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
          retention-days: ${{ inputs.report_retention_days }}
          overwrite: true

      # See the `test` job's identical step: lets the retry collectors rebuild a retry matrix without relying on this job's (continue-on-error-muddied) own conclusion.
      - name: Save suite descriptor for pod-level retry
        if: failure()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/failed_suite"
          cat > "${RUNNER_TEMP}/failed_suite/suite.json" <<'JSONEOF'
          ${{ toJSON(matrix.suite) }}
          JSONEOF

      # call_id and github.run_attempt in the name: see the single-card upload above.
      - name: Upload failed-suite descriptor
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-suite-multi-${{ needs.generate_matrix.outputs.call_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/failed_suite/suite.json
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2a: test-matrix fan-in -- this job's own completion is the signal
  # collect_failed_suites_early polls for to learn that every leg has finished. It does no
  # work and uploads nothing: an artifact would be one more thing that can fail to appear,
  # and a poller that misses the end of the matrix holds up the final wave behind it.
  # ---------------------------------------------------------------------------
  legs_complete:
    # call_id in the display name is what the poller matches on, so a run holding two calls
    # of this workflow (runtests_nightly.yaml) matches only its own. Keep it in step with
    # FANIN_JOB_NAME in collect_retry_suites.py.
    name: Test matrix fan-in (${{ needs.generate_matrix.outputs.call_id }})
    needs: [generate_matrix, test, test_multi_spyre]
    # always(): the fan-in must happen even when every leg was skipped (perf mode, a failed
    # build) or some leg failed, or the early collector polls on to its deadline.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record that every test leg has finished
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TEST_MULTI_RESULT: ${{ needs.test_multi_spyre.result }}
        run: echo "test=${TEST_RESULT} test_multi_spyre=${TEST_MULTI_RESULT}"

  # ---------------------------------------------------------------------------
  # Job 2b: EARLY retry-wave collector -- starts with the test matrix and returns at the
  # first failed-suite descriptor, so test_retry below claims a fresh pod while the rest of
  # the matrix is still running. The single collector this replaces waited for every leg,
  # which put the runtime of the slowest suite in the matrix between a two-minute flake and
  # its retry. Suites that fail after this snapshot are collect_failed_suites' job.
  # ---------------------------------------------------------------------------
  collect_failed_suites_early:
    name: Collect suites for pod-level retry (early)
    needs: [generate_matrix, build_torch_spyre]
    # The `test` job's own guard: where no leg runs there is nothing to collect.
    if: >-
      !cancelled() &&
      needs.generate_matrix.outputs.resolved_test_type != 'perf' &&
      (needs.build_torch_spyre.result == 'success' ||
       needs.build_torch_spyre.result == 'skipped')
    # This wave is only ever a head start, and collect_failed_suites must not inherit its
    # failures: without this a 502 here would fail the caller's gate on a green run. The
    # final wave retries every failed suite on its own, and test_result says so.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Holds a cardless runner while the matrix runs -- the cost of polling. Normally it
    # returns at the first failure or at the fan-in; --deadline-secs bounds the case where
    # it sees neither, because collect_failed_suites waits on this job.
    timeout-minutes: 95
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      has_failed: ${{ steps.collect.outputs.has_failed }}
    steps:
      # Only the collector script, and deliberately from the default checkout (this
      # workflow's own commit) rather than inputs.ref/inputs.repository: those name the
      # PRODUCT under test, while this is CI harness that must match the workflow running
      # it. Same as the "Checkout composite actions" steps, which also pass neither.
      - name: Checkout the collector script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # The flags travel through env, not interpolated into the command line, so a caller
      # value like "--cpu-compile -vvv -s" reaches the script as one argument. --opt=value
      # is required for those two, not style: argparse reads a bare "-v" as another option.
      - name: Wait for the first failure, then build the retry matrix
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          CALL_ID: ${{ needs.generate_matrix.outputs.call_id }}
          CONFIG_ROOT: ${{ needs.generate_matrix.outputs.config_root }}
          TEST_TYPE: ${{ needs.generate_matrix.outputs.resolved_test_type }}
          EXTRA_TEST_FLAGS: ${{ inputs.extra_test_flags }}
          EXTRA_TEST_FLAGS_MULTI: ${{ inputs.extra_test_flags_multi_spyre }}
        run: |
          python3 .github/scripts/collect_retry_suites.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --call-id "${CALL_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --config-root "${CONFIG_ROOT}" \
            --test-type "${TEST_TYPE}" \
            --extra-test-flags="${EXTRA_TEST_FLAGS}" \
            --extra-test-flags-multi="${EXTRA_TEST_FLAGS_MULTI}" \
            --fanin-job-name="Test matrix fan-in ({call_id})" \
            --deadline-secs=5400 \
            --wait-for-failure

  # ---------------------------------------------------------------------------
  # Job 2c: FINAL retry-wave collector -- after the matrix fans in, collects every failed
  # suite the early wave did not already claim. Both waves are needed: `test` and
  # `test_multi_spyre` are continue-on-error, so a failure no retry job ever re-runs would
  # leave test_result green.
  # ---------------------------------------------------------------------------
  collect_failed_suites:
    name: Collect suites for pod-level retry
    needs: [generate_matrix, test, test_multi_spyre, collect_failed_suites_early]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      has_failed: ${{ steps.collect.outputs.has_failed }}
    steps:
      - name: Checkout the collector script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # --opt=value for the flag options: see the early collector above.
      - name: Build the retry matrix for whatever the early wave left
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          CALL_ID: ${{ needs.generate_matrix.outputs.call_id }}
          CONFIG_ROOT: ${{ needs.generate_matrix.outputs.config_root }}
          TEST_TYPE: ${{ needs.generate_matrix.outputs.resolved_test_type }}
          EXTRA_TEST_FLAGS: ${{ inputs.extra_test_flags }}
          EXTRA_TEST_FLAGS_MULTI: ${{ inputs.extra_test_flags_multi_spyre }}
          # Empty when the early wave was skipped or claimed nothing, which excludes
          # nothing -- a wave that did not run can never cost a suite its retry.
          EARLY_MATRIX: ${{ needs.collect_failed_suites_early.outputs.matrix }}
        run: |
          python3 .github/scripts/collect_retry_suites.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --call-id "${CALL_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --config-root "${CONFIG_ROOT}" \
            --test-type "${TEST_TYPE}" \
            --extra-test-flags="${EXTRA_TEST_FLAGS}" \
            --extra-test-flags-multi="${EXTRA_TEST_FLAGS_MULTI}" \
            --exclude-matrix "${EARLY_MATRIX}"

  # ---------------------------------------------------------------------------
  # Job 2d: pod-level retry, EARLY wave -- re-runs, on brand-new ARC pods, the suites
  # collect_failed_suites_early saw fail, while the rest of the matrix is still running.
  # No further looping: a suite that fails again here is a genuine failure.
  #
  # One job serves both card classes: every per-suite knob (runner label, config paths,
  # report name, flags, --parallel) comes from the matrix entry the collector built, so
  # collect_retry_suites.py holds what `test`/`test_multi_spyre` hold in YAML.
  # ---------------------------------------------------------------------------
  test_retry:
    # The "(pod-level retry)" suffix is load-bearing, not decoration: hw_parse.py derives
    # pod_level_retry from it when ingesting these jobs' logs. Keep it on every wave.
    name: ${{ matrix.suite.name }} (pod-level retry)
    needs: [generate_matrix, build_torch_spyre, collect_failed_suites_early]
    if: >-
      !cancelled() &&
      needs.collect_failed_suites_early.outputs.has_failed == 'true' &&
      (needs.build_torch_spyre.result == 'success' ||
       needs.build_torch_spyre.result == 'skipped')
    runs-on:
      - x86_64
      - ${{ matrix.suite.runner }}
      - ${{ inputs.runner_label }}
      - ${{ inputs.image_label }}
    timeout-minutes: 60
    env:
      CI: ''
      # '' for the multi-card suites, whose first attempt sets none either.
      TORCH_SPYRE_TEST_TYPE: ${{ matrix.suite.test_type }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect_failed_suites_early.outputs.matrix) }}

    steps:
      - name: Checkout composite actions
        if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Expose baked composite actions in the workspace
        if: ${{ inputs.prebaked_image }}
        run: ln -sfn "${PREBAKED_TORCH_SPYRE_DIR}/.github" "${GITHUB_WORKSPACE}/.github"

      - if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Check out pre-built PyTorch
        if: ${{ inputs.checkout_pytorch }}
        uses: ./.github/actions/checkout-pytorch

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}
          runner_labels: ${{ format('["x86_64","{0}","{1}","{2}"]', matrix.suite.runner, inputs.runner_label, inputs.image_label) }}

      - name: Install prebuilt torch-spyre
        if: >-
          ${{ !inputs.prebaked_image &&
          (needs.build_torch_spyre.result == 'success' || inputs.torch_spyre_wheel_artifact_name != '') }}
        uses: ./.github/actions/install-prebuilt-torch-spyre
        with:
          artifact_name: ${{ inputs.torch_spyre_wheel_artifact_name || 'torch-spyre-wheel' }}

      # pytorch/pytorch dispatch path only (build_test_pytorch_source.yaml):
      # override the pinned pytorch-cpu wheel install-prebuilt-torch-spyre's
      # `uv sync` just resolved, with the exact PyTorch build torch-spyre's
      # _C.so is ABI-bound to. Must run AFTER install-prebuilt-torch-spyre so
      # it wins. No-op (skipped) for every existing caller.
      - name: Install prebuilt PyTorch
        if: ${{ inputs.pytorch_wheel_artifact_name != '' }}
        uses: ./.github/actions/install-prebuilt-pytorch
        with:
          artifact_name: ${{ inputs.pytorch_wheel_artifact_name }}

      # The collector derived report_name and config_paths from the failed leg's own
      # descriptor, so this is only the workspace-qualified path plus, for a bucket, the
      # member list the job name is too narrow to show.
      - name: Derive the report path
        env:
          REPORT_NAME: ${{ matrix.suite.report_name }}
          CONFIG_PATHS: ${{ matrix.suite.config_paths }}
          SUITE_NAME: ${{ matrix.suite.name }}
        run: |
          echo "REPORT_PATH=${GITHUB_WORKSPACE}/${REPORT_NAME}" >> "$GITHUB_ENV"
          {
            echo "### ${SUITE_NAME} (pod-level retry)"
            for c in ${CONFIG_PATHS}; do echo "- \`${c}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # The first attempt's report, which this job's upload overwrites; kept as prior_* props.
      - name: Download the first attempt's JUnit XML report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.suite.report_name }}
          path: ${{ runner.temp }}/replaced-report

      - name: Run ${{ matrix.suite.name }} tests (pod-level retry)
        id: run_tests
        uses: ./.github/actions/run-test-suite
        with:
          retried: pod
          replaced_junit_xml: ${{ runner.temp }}/replaced-report/${{ matrix.suite.report_name }}
          suite_name: ${{ matrix.suite.name }}
          config: ${{ matrix.suite.config_paths }}
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}
          venv_path: ${{ inputs.prebaked_image && env.PREBAKED_VENV_PATH || '.venv' }}
          extra_test_flags: ${{ matrix.suite.extra_test_flags }}
          # 'false' for the distributed suites, which drive torchrun themselves.
          parallel: ${{ matrix.suite.parallel }}
          junit_xml_path: ${{ env.REPORT_PATH }}
          report_name: ${{ matrix.suite.report_name }}
          pre_run: |
            set +u
            unset _IBM_AIU_SETUP
            rm -rf /tmp/etc/ibm/spyre/topo.json
            source /etc/profile.d/ibm-aiu-setup.sh || exit 1

      # overwrite: true replaces the failed first attempt's report (same report_name) so downstream consumers see only the corrected result, not a name conflict.
      - name: Upload JUnit XML report
        if: always()
        continue-on-error: true  # transient artifact-service 403s must not fail a job whose tests passed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.suite.report_name }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
          retention-days: ${{ inputs.report_retention_days }}
          overwrite: true

  # ---------------------------------------------------------------------------
  # Job 2e: pod-level retry, FINAL wave -- test_retry's steps for the suites that failed
  # after the early wave's snapshot. Kept a separate job because a matrix is fixed when its
  # job starts: test_retry cannot pick up a suite that fails after it began.
  # ---------------------------------------------------------------------------
  test_retry_final:
    # Same display name as the early wave: a suite is retried by exactly one of them, and
    # hw_parse.py reads pod_level_retry off this suffix.
    name: ${{ matrix.suite.name }} (pod-level retry)
    needs: [generate_matrix, build_torch_spyre, collect_failed_suites]
    if: >-
      !cancelled() &&
      needs.collect_failed_suites.outputs.has_failed == 'true' &&
      (needs.build_torch_spyre.result == 'success' ||
       needs.build_torch_spyre.result == 'skipped')
    runs-on:
      - x86_64
      - ${{ matrix.suite.runner }}
      - ${{ inputs.runner_label }}
      - ${{ inputs.image_label }}
    timeout-minutes: 60
    env:
      CI: ''
      TORCH_SPYRE_TEST_TYPE: ${{ matrix.suite.test_type }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect_failed_suites.outputs.matrix) }}

    steps:
      - name: Checkout composite actions
        if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Expose baked composite actions in the workspace
        if: ${{ inputs.prebaked_image }}
        run: ln -sfn "${PREBAKED_TORCH_SPYRE_DIR}/.github" "${GITHUB_WORKSPACE}/.github"

      - if: ${{ !inputs.prebaked_image }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: torch-spyre
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Check out pre-built PyTorch
        if: ${{ inputs.checkout_pytorch }}
        uses: ./.github/actions/checkout-pytorch

      - uses: ./.github/actions/gather-runner-info
        with:
          verbose: 'true'
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}
          runner_labels: ${{ format('["x86_64","{0}","{1}","{2}"]', matrix.suite.runner, inputs.runner_label, inputs.image_label) }}

      - name: Install prebuilt torch-spyre
        if: >-
          ${{ !inputs.prebaked_image &&
          (needs.build_torch_spyre.result == 'success' || inputs.torch_spyre_wheel_artifact_name != '') }}
        uses: ./.github/actions/install-prebuilt-torch-spyre
        with:
          artifact_name: ${{ inputs.torch_spyre_wheel_artifact_name || 'torch-spyre-wheel' }}

      # See the early wave: pytorch/pytorch dispatch path only, no-op for every other caller.
      - name: Install prebuilt PyTorch
        if: ${{ inputs.pytorch_wheel_artifact_name != '' }}
        uses: ./.github/actions/install-prebuilt-pytorch
        with:
          artifact_name: ${{ inputs.pytorch_wheel_artifact_name }}

      - name: Derive the report path
        env:
          REPORT_NAME: ${{ matrix.suite.report_name }}
          CONFIG_PATHS: ${{ matrix.suite.config_paths }}
          SUITE_NAME: ${{ matrix.suite.name }}
        run: |
          echo "REPORT_PATH=${GITHUB_WORKSPACE}/${REPORT_NAME}" >> "$GITHUB_ENV"
          {
            echo "### ${SUITE_NAME} (pod-level retry)"
            for c in ${CONFIG_PATHS}; do echo "- \`${c}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # The first attempt's report, which this job's upload overwrites; kept as prior_* props.
      - name: Download the first attempt's JUnit XML report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.suite.report_name }}
          path: ${{ runner.temp }}/replaced-report

      - name: Run ${{ matrix.suite.name }} tests (pod-level retry)
        id: run_tests
        uses: ./.github/actions/run-test-suite
        with:
          retried: pod
          replaced_junit_xml: ${{ runner.temp }}/replaced-report/${{ matrix.suite.report_name }}
          suite_name: ${{ matrix.suite.name }}
          config: ${{ matrix.suite.config_paths }}
          torch_spyre_dir: ${{ inputs.prebaked_image && env.PREBAKED_TORCH_SPYRE_DIR || 'torch-spyre' }}
          venv_path: ${{ inputs.prebaked_image && env.PREBAKED_VENV_PATH || '.venv' }}
          extra_test_flags: ${{ matrix.suite.extra_test_flags }}
          parallel: ${{ matrix.suite.parallel }}
          junit_xml_path: ${{ env.REPORT_PATH }}
          report_name: ${{ matrix.suite.report_name }}
          pre_run: |
            set +u
            unset _IBM_AIU_SETUP
            rm -rf /tmp/etc/ibm/spyre/topo.json
            source /etc/profile.d/ibm-aiu-setup.sh || exit 1

      - name: Upload JUnit XML report
        if: always()
        continue-on-error: true  # transient artifact-service 403s must not fail a job whose tests passed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.suite.report_name }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: warn
          retention-days: ${{ inputs.report_retention_days }}
          overwrite: true

  # ---------------------------------------------------------------------------
  # Job 2f: test matrix result -- the job that actually decides pass/fail for the reusable workflow (test/test_multi_spyre are continue-on-error, so this job's own conclusion is what needs.run-tests.result sees in tests.yml / tests-nightly.yml).
  # ---------------------------------------------------------------------------
  test_result:
    name: Test matrix result
    needs: [collect_failed_suites_early, collect_failed_suites, test_retry, test_retry_final]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate combined result
        run: |
          echo "Early wave retried suites  : ${{ needs.collect_failed_suites_early.outputs.has_failed }}"
          echo "Final wave retried suites  : ${{ needs.collect_failed_suites.outputs.has_failed }}"
          echo "test_retry result          : ${{ needs.test_retry.result }}"
          echo "test_retry_final result    : ${{ needs.test_retry_final.result }}"

          FAIL=0
          if [[ "${{ needs.test_retry.result }}" == "failure" ]]; then
            echo "::error::One or more suites still failed after the early pod-level retry."
            FAIL=1
          fi
          if [[ "${{ needs.test_retry_final.result }}" == "failure" ]]; then
            echo "::error::One or more suites still failed after the final pod-level retry."
            FAIL=1
          fi
          # The final collector is the only thing that reads EVERY descriptor, and `test` is
          # continue-on-error: if it dies, test_retry_final skips and the run would report
          # green having never re-run -- or even listed -- the suites that failed.
          if [[ "${{ needs.collect_failed_suites.result }}" == "failure" ]]; then
            echo "::error::The pod-level-retry collector failed; failed suites may not have been retried."
            FAIL=1
          fi
          # An early collector that died costs only the head start: it claims nothing, so
          # the final wave retries every failed suite itself.
          if [[ "${{ needs.collect_failed_suites_early.result }}" == "failure" ]]; then
            echo "::warning::The early retry collector failed; the final wave covered its suites."
          fi
          # A wave whose collector found failures but whose retry job never ran. The final
          # wave excludes what the early wave CLAIMED, not what it re-ran, so a skipped
          # test_retry would otherwise strand those suites: nothing re-runs them and
          # nothing reports them, because their first attempt was continue-on-error.
          # Belt and braces -- the retry jobs' `if:` is the collectors' own guard plus a
          # non-empty matrix, so this should be unreachable.
          for wave in \
            "early:${{ needs.collect_failed_suites_early.outputs.has_failed }}:${{ needs.test_retry.result }}" \
            "final:${{ needs.collect_failed_suites.outputs.has_failed }}:${{ needs.test_retry_final.result }}"; do
            IFS=: read -r name had_failures retry_result <<< "$wave"
            if [[ "$had_failures" == "true" && "$retry_result" == "skipped" ]]; then
              echo "::error::The ${name} wave found failed suites but its retry job never ran; they were neither re-run nor reported."
              FAIL=1
            fi
          done
          exit "$FAIL"

  # ---------------------------------------------------------------------------
  # Job 3: Report test suites that ran zero tests
  #
  # Runs after both matrix jobs (even if they fail) and checks every uploaded
  # JUnit XML artifact for a zero-test result.  Issues ::warning:: annotations
  # and writes a step summary table (does NOT fail the workflow).
  # ---------------------------------------------------------------------------
  report_empty_suites:
    name: Report empty test suites
    runs-on: ubuntu-latest
    # Waits for both pod-level retry waves too, so a suite fixed by retry (overwrite: true replaces its report) is read post-correction.
    needs: [generate_matrix, test, test_multi_spyre, test_retry, test_retry_final]
    if: always()

    steps:
      - name: Download all XML artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p xml_artifacts
          # --paginate: same page-cap trap as collect_retry_suites.py; an
          # un-paginated query would miss XML reports past the first page and
          # under-report the empty-suite check. Emit a per-object JSON stream
          # (gh rejects --slurp with --jq) and slurp it into one array.
          # created_at lets the python step below dedupe re-run duplicates by name, keeping the newest.
          ARTIFACTS=$(gh api --paginate \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | endswith(".xml")) | {id: .id, name: .name, created_at: .created_at}' \
            | python3 -c "import json,sys; print(json.dumps([json.loads(l) for l in sys.stdin if l.strip()]))")

          ARTIFACTS="$ARTIFACTS" python3 <<'PYEOF'
          import json, os, subprocess
          artifacts = json.loads(os.environ['ARTIFACTS'])
          repo = "${{ github.repository }}"

          # Keep only the newest artifact per name (see the created_at note above).
          latest = {}
          for a in artifacts:
              existing = latest.get(a["name"])
              if existing is None or a["created_at"] > existing["created_at"]:
                  latest[a["name"]] = a

          downloaded = 0
          for a in latest.values():
              zip_path = f"xml_artifacts/{a['name']}.zip"
              try:
                  result = subprocess.run(
                      ["gh", "api", f"/repos/{repo}/actions/artifacts/{a['id']}/zip"],
                      capture_output=True, check=True,
                      env={**os.environ},
                  )
                  with open(zip_path, "wb") as f:
                      f.write(result.stdout)
                  subprocess.run(
                      ["unzip", "-q", "-o", zip_path, "-d", "xml_artifacts/"],
                      check=True,
                  )
                  downloaded += 1
              except subprocess.CalledProcessError as e:
                  # Skip a single bad artifact instead of aborting the whole job.
                  stderr = e.stderr.decode(errors="replace") if e.stderr else str(e)
                  print(f"::warning::Could not download artifact {a['name']} (id {a['id']}): {stderr.strip()}")
          print(f"Downloaded {downloaded} of {len(latest)} artifact(s).")
          PYEOF

      - name: Check for empty suites
        run: |
          python3 <<'PYEOF'
          import os
          import sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          xml_dir = Path("xml_artifacts")
          xml_files = sorted(xml_dir.glob("**/*.xml"))

          empty = []
          for xml_file in xml_files:
              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  # Handle both <testsuite> and <testsuites><testsuite ...> forms
                  # Count <testcase> elements directly — the tests= attribute
                  # is unreliable when pytest-xdist produced the XML (it writes
                  # tests="0" in the suite header even when cases are present).
                  total_tests = len(root.findall(".//testcase"))
                  if total_tests == 0:
                      empty.append(xml_file.stem)
              except ET.ParseError as e:
                  print(f"::warning::Could not parse {xml_file.name}: {e}")

          # Build step summary
          lines = []
          if empty:
              lines.append("### Empty test suites detected\n")
              lines.append(
                  "The following suite(s) uploaded a JUnit XML report with **0 tests**:\n"
              )
              lines.append("| Artifact |")
              lines.append("|---|")
              for name in empty:
                  lines.append(f"| `{name}` |")
              lines.append("")
              lines.append(
                  "> **Note:** This is a warning only — the workflow is not failed."
              )
          else:
              lines.append("### Empty suite check: all suites ran at least one test.")

          summary = "\n".join(lines)
          print(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(summary + "\n")

          # Emit ::warning:: annotations for each empty suite
          for name in empty:
              print(f"::warning title=Empty test suite::{name} reported 0 tests collected")

          sys.exit(0)
          PYEOF
