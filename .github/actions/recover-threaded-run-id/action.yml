name: Recover threaded run_id
description: |
  Recovers a one-file identity artifact for an ingest that runs on `workflow_run` and
  therefore cannot receive it as a dispatch input.

  Two callers, one mechanism: `run-id` carries the orchestrator's threaded uuid, `artifact-id`
  the identity of what the leg actually ran.

  Jenkins mints one uuid per test run and threads it to the dispatched workflow, so the
  ingest stamps test_case_runs with the SAME id the Jenkins-side artifact_results writer
  recorded and the two join on one identity. A workflow_run consumer sees none of the
  triggering run's inputs, so the producing workflow uploads the id as a one-file artifact
  and this reads it back.

  Empty output is normal when the producer uploaded nothing (a GHA-initiated run has no
  orchestrator uuid, and the ingest derives its own id). An artifact that EXISTS but cannot be
  read fails the step instead: proceeding would write rows under a derived id that joins
  nothing, while a re-run recovers the real one. An expired artifact cannot be recovered by a
  re-run, so it warns and yields empty.

  Read the result from the `value` output. `run_id` is kept as an alias for the original
  caller and returns the same string.

  Pair it with the upload side in the dispatched workflow:

      - run: printf '%s' "$ {{ inputs.run_id }}" > run-id.txt
      - uses: actions/upload-artifact@<pinned>
        if: $ {{ inputs.run_id != '' }}
        with: { name: run-id, path: run-id.txt, retention-days: 7 }

inputs:
  triggering-run-id:
    description: >-
      The GHA run id of the workflow that produced the artifact, i.e.
      github.event.workflow_run.id on a workflow_run trigger.
    required: true
  repository:
    description: owner/repo holding the artifact. Defaults to the current repository.
    required: false
    default: ${{ github.repository }}
  artifact-name:
    description: Name of the one-file artifact carrying the id.
    required: false
    default: run-id
  label:
    description: What to call the value in the log line (a job recovering two ids needs both).
    required: false
    default: Threaded run_id
  github-token:
    description: Token for the artifacts API. Needs actions:read on `repository`.
    required: true

outputs:
  value:
    description: The recovered id, or '' when the run carried none.
    value: ${{ steps.recover.outputs.run_id }}
  run_id:
    description: Alias of `value`, kept so the original caller needs no edit.
    value: ${{ steps.recover.outputs.run_id }}

runs:
  using: composite
  steps:
    - name: Recover ${{ inputs.artifact-name }}
      id: recover
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TRIGGERING_RUN_ID: ${{ inputs.triggering-run-id }}
        REPO: ${{ inputs.repository }}
        ART_NAME: ${{ inputs.artifact-name }}
        LABEL: ${{ inputs.label }}
      run: |
        set -uo pipefail
        warn() {
          echo "::warning title=${LABEL} not recovered::$1"
          echo "- :warning: **${LABEL} not recovered:** $1" >> "$GITHUB_STEP_SUMMARY"
        }
        fail() {
          echo "::error title=${LABEL} not recovered::$1"
          echo "- :x: **${LABEL} not recovered:** $1" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }
        retry() {
          local i
          for i in 1 2 3; do
            "$@" && return 0
            [ "$i" -lt 3 ] && sleep $((i * 5))
          done
          return 1
        }
        list_artifacts() {
          gh api --paginate \
            "/repos/${REPO}/actions/runs/${TRIGGERING_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"${ART_NAME}\") | \"\(.id) \(.expired)\"" \
            > "${workdir}/list"
        }
        fetch_artifact() {
          rm -rf "${workdir}/out"
          gh api "/repos/${REPO}/actions/artifacts/${AID}/zip" > "${workdir}/a.zip" \
            && unzip -o -q "${workdir}/a.zip" -d "${workdir}/out"
        }
        if [ -z "${TRIGGERING_RUN_ID}" ]; then
          echo "No triggering run id given — nothing to recover for ${ART_NAME}."
          echo "run_id=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        workdir=$(mktemp -d)
        trap 'rm -rf "${workdir}"' EXIT
        retry list_artifacts || fail "listing artifacts of run ${TRIGGERING_RUN_ID} failed; re-run this job."
        read -r AID EXPIRED < "${workdir}/list" || true
        RID=""
        if [ -z "${AID:-}" ]; then
          # Only a dispatched run can carry an id, and an expired artifact drops out of the listing.
          EVENT=$(gh api "/repos/${REPO}/actions/runs/${TRIGGERING_RUN_ID}" --jq .event 2>/dev/null || echo unknown)
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            warn "dispatched run ${TRIGGERING_RUN_ID} has no ${ART_NAME} artifact (expired, or dispatched without one); the ingest derives an id that joins no orchestrator row."
          else
            echo "${ART_NAME} not uploaded by ${EVENT} run ${TRIGGERING_RUN_ID} — the ingest derives its own id."
          fi
        elif [ "${EXPIRED}" = "true" ]; then
          warn "artifact ${ART_NAME} of run ${TRIGGERING_RUN_ID} expired; the ingest derives an id that joins no orchestrator row."
        else
          retry fetch_artifact || fail "downloading artifact ${ART_NAME} (id ${AID}) failed; re-run this job."
          # One file, but its name is the producer's choice.
          f=$(find "${workdir}/out" -type f | head -1)
          [ -n "${f}" ] && RID=$(tr -d '[:space:]' < "${f}")
          [ -n "${RID}" ] || fail "artifact ${ART_NAME} (id ${AID}) holds no id."
        fi
        echo "${LABEL}: ${RID:-<none>}"
        echo "run_id=${RID}" >> "$GITHUB_OUTPUT"
