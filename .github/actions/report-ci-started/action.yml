name: Report CI started to pytorch/pytorch
description: >-
  Sends a CRCR in_progress callback for one job-name. repository_dispatch
  only. Pair with ./report-ci-completed from the SAME job (same job_name) --
  CRCR's check_run_id only carries over within a single job.

inputs:
  job_name:
    description: CRCR job-name, e.g. "linux-x86_64 / pytorch / build"
    required: true

runs:
  using: composite
  steps:
    - name: Report CI started to pytorch/pytorch
      if: github.event_name == 'repository_dispatch'
      continue-on-error: true
      uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
      with:
        status: in_progress
        job-name: ${{ inputs.job_name }}
