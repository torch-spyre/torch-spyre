name: Ingest JUnit XML into ClickHouse
description: >
  Parse JUnit/benchmark XML files in a directory and insert their rows into
  ClickHouse via `python -m spyre_clickhouse_ingest results`. This is the SINGLE ingest
  implementation shared by two callers: the push-to-clickhouse.yaml
  workflow_run job (which downloads uploaded artifacts first) and the perf job
  in _test_matrix.yaml (which pushes its report.xml INLINE on the card runner,
  because on a public repo benchmark numbers must not be uploaded as
  world-readable artifacts). Secrets cannot reach a composite action, so the
  caller passes the ClickHouse connection as plain inputs.

inputs:
  xml-dir:
    description: Directory to glob for *.xml (non-recursive). Empty = skip.
    required: false
    default: ''
  workflow:
    description: Workflow name recorded against the rows.
    required: false
    default: ''
  branch:
    description: Branch recorded against the rows.
    required: false
    default: ''
  sha:
    description: Commit sha recorded against the rows.
    required: false
    default: ''
  run-id:
    description: >
      UUID identifying the test run, threaded from the dispatching orchestrator so
      test_runs joins artifact_results. Empty on a GHA-only run, which mints its own.
    required: false
    default: ''
  gha-run-id:
    description: Numeric GitHub Actions run id, used as the dedup key.
    required: false
    default: ''
  run-attempt:
    description: >
      GitHub run attempt the XMLs came from. Set, a re-run's cases replace the earlier
      attempt's in v2; empty (default) keeps first-write-wins.
    required: false
    default: ''
  artifact-id:
    description: >
      artifact_id of what the leg ACTUALLY RAN, derived by derive-gha-artifact-id on the
      runner. Set, the ingest also writes the artifacts row and the artifact_results verdict;
      empty (default) writes neither, leaving every existing caller unchanged.
    required: false
    default: ''
  artifact:
    description: >
      What the leg ran, as a v2-artifact spec (image:, rpm:, wheel:, generic:, gha:<record>
      or an artifact_id), when there is no artifact-id record. Registered, tagged with the
      tag inputs, then given the leg's verdicts.
    required: false
    default: ''
  tag-family:
    description: Tag family for `artifact` (e.g. nightly-supply-chain); its resolved tag is recorded.
    required: false
    default: ''
  tag:
    description: Full tags for the leg's artifact, one per line.
    required: false
    default: ''
  tag-date:
    description: YYYY-MM-DD dating the family's fallback tag. Empty = the run's own day.
    required: false
    default: ''
  repository:
    description: >
      owner/repo the tested commit came from, recorded in artifacts.sources -- the column
      resolve_covered_tiers.py reaches an artifact through. Empty = GITHUB_REPOSITORY.
    required: false
    default: ''
  triggered-at:
    description: Trigger timestamp recorded against the rows (may be empty).
    required: false
    default: ''
  pr-number:
    description: PR number associated with the rows (empty on non-PR runs).
    required: false
    default: ''
  ci-event:
    description: >
      Event of the run that built the leg's artifact (push | pull_request | ...): a push to
      main tags it <repo>@<sha12> (main), a pull request <repo>#<pr> and <repo>#<pr>@<sha12>
      (pr). Empty tags nothing beyond the tag inputs.
    required: false
    default: ''
  trigger-type:
    description: Suite tier (e.g. perf | regression | integration | smoke).
    required: false
    default: ''
  component:
    description: >
      Component to stamp on v2 rows. Empty = the ingest script's own product. Set it when a
      cell runs ANOTHER component's suite through this script: component is a test_case_id
      hash input, so the wrong value gives the same test a different identity rather than
      merely mislabelling it.
    required: false
    default: ''
  platform:
    description: >
      Platform arch recorded on benchmark_runs rows (e.g. x86_64). Empty =
      the ingest script falls back to its own host-arch default.
    required: false
    default: ''
  script-repo:
    description: >
      Repository holding extensions/clickhouse-ingest, for the sparse-checkout
      fallback. Consumers outside torch-spyre must keep this default -- without
      it the fallback checks out the CALLING repo and finds no library.
    required: false
    default: torch-spyre/torch-spyre
  script-ref:
    description: >
      Ref of script-repo to check out. Pin to a tag from another repo; the
      default tracks that repo's default branch.
    required: false
    default: ''
  torch-spyre-dir:
    description: >
      Fallback directory containing extensions/clickhouse-ingest when the
      workspace does not already have this ref's copy. The action searches
      $GITHUB_WORKSPACE first so a prebaked product tree cannot hide a
      newer sparse-checkout. Empty = workspace, then sparse-checkout.
    required: false
    default: ''
  clickhouse-host:
    description: ClickHouse host. Empty = skip the whole ingest (clean no-op).
    required: false
    default: ''
  clickhouse-port:
    description: ClickHouse port (default 443 inside the script).
    required: false
    default: ''
  clickhouse-user:
    description: ClickHouse user (default "default" inside the script).
    required: false
    default: ''
  clickhouse-pass:
    description: ClickHouse password.
    required: false
    default: ''
  clickhouse-db:
    description: ClickHouse database (default "spyre" inside the script).
    required: false
    default: ''
  clickhouse-db-v2:
    description: >
      Schema-v2 database. Every v2 statement is qualified with it, because test_cases and
      benchmark_runs exist in both generations with incompatible shapes. Empty makes the v2
      write a no-op, so an un-updated caller is unaffected.
    required: false
    default: ''
  schema:
    description: >
      Which schema generation to write: v1 (default) | v2 | both. `both` is the migration
      window -- v1 stays authoritative while v2 accumulates the same runs.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The ingest's get_client() reads CLICKHOUSE_HOST/PASS as REQUIRED env
    # (a KeyError, not a clean skip, when absent), and an empty --xml-dir hits
    # sys.exit(1). So the no-op gate MUST live here: when the connection or the
    # dir is not configured, set configured=false and every later step is a
    # no-op. This is what lets a caller without ClickHouse secrets (or a run
    # with no XML) pass cleanly.
    - name: Gate on ClickHouse config and XML dir
      id: gate
      shell: bash
      env:
        CH_HOST: ${{ inputs.clickhouse-host }}
        XML_DIR: ${{ inputs.xml-dir }}
      run: |
        if [ -z "${CH_HOST}" ]; then
          echo "::notice::ClickHouse host not configured — skipping ingest."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        elif [ -z "${XML_DIR}" ]; then
          echo "::notice::No xml-dir provided — skipping ingest."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    # $GITHUB_WORKSPACE (the job's checkout of this ref) before torch-spyre-dir, so a prebaked
    # tree cannot hide a newer library; a sparse-checkout when neither has one.
    - name: Locate the ingest library (on disk)
      id: locate
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      env:
        TS_DIR: ${{ inputs.torch-spyre-dir }}
      run: |
        REL=extensions/clickhouse-ingest/spyre_clickhouse_ingest/results.py
        for base in "${GITHUB_WORKSPACE}" "${TS_DIR}"; do
          if [ -n "${base}" ] && [ -f "${base}/${REL}" ]; then
            echo "clickhouse-ingest library: ${base}/extensions/clickhouse-ingest"
            echo "CHLIB=${base}/extensions/clickhouse-ingest" >> "$GITHUB_ENV"
            echo "need-checkout=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "Ingest library not on disk — will sparse-checkout."
        echo "need-checkout=true" >> "$GITHUB_OUTPUT"

    # `repository` and `path` are both load-bearing for callers outside torch-spyre: without
    # repository this checks out the CALLING repo, and without path it overwrites the
    # caller's workspace (its XML included).
    - name: Checkout the ingest library (fallback)
      if: steps.gate.outputs.configured == 'true' && steps.locate.outputs.need-checkout == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: ${{ inputs.script-repo }}
        ref: ${{ inputs.script-ref }}
        path: .ingest-src
        sparse-checkout: extensions/clickhouse-ingest
        sparse-checkout-cone-mode: false

    - name: Set the ingest library path (fallback)
      if: steps.gate.outputs.configured == 'true' && steps.locate.outputs.need-checkout == 'true'
      shell: bash
      run: echo "CHLIB=${GITHUB_WORKSPACE}/.ingest-src/extensions/clickhouse-ingest" >> "$GITHUB_ENV"

    - name: Install uv
      if: steps.gate.outputs.configured == 'true'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # latest-known, not "latest": it resolves to the newest uv whose checksum is
        # bundled INTO this setup-uv pin, resolved locally with no release lookup. A
        # just-published release is not yet mirrored on releases.astral.sh, so "latest"
        # 404s there and falls back to GitHub Releases, which rate-limits (429) once the
        # fleet requests it concurrently. Bumping setup-uv moves this version forward.
        version: latest-known

    - name: Setup venv and dependencies
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      run: |
        # Create the ingest venv in the workspace, NOT the baked shared venv, so
        # the ingest deps never perturb the dev image's torch-spyre environment.
        uv venv
        source .venv/bin/activate
        uv pip install requests clickhouse-driver clickhouse-connect lxml regex "${CHLIB}"

    - name: Ingest XML files into ClickHouse
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      env:
        CLICKHOUSE_HOST: ${{ inputs.clickhouse-host }}
        CLICKHOUSE_PASS: ${{ inputs.clickhouse-pass }}
        # Port/user/db are optional. Only export them when non-empty: the script
        # reads PORT via int(os.environ.get("CLICKHOUSE_PORT", 443)), so an
        # empty-string value would break int(""), and empty user/db would
        # override the script's sensible defaults ("default" / "spyre").
        CH_PORT_IN: ${{ inputs.clickhouse-port }}
        CH_USER_IN: ${{ inputs.clickhouse-user }}
        CH_DB_IN: ${{ inputs.clickhouse-db }}
        CH_DB_V2_IN: ${{ inputs.clickhouse-db-v2 }}
        SCHEMA_IN: ${{ inputs.schema }}
        PLATFORM_IN: ${{ inputs.platform }}
        COMPONENT_IN: ${{ inputs.component }}
        ARTIFACT_ID_IN: ${{ inputs.artifact-id }}
        ARTIFACT_IN: ${{ inputs.artifact }}
        TAG_FAMILY_IN: ${{ inputs.tag-family }}
        TAGS_IN: ${{ inputs.tag }}
        TAG_DATE_IN: ${{ inputs.tag-date }}
        REPOSITORY_IN: ${{ inputs.repository }}
        CI_EVENT_IN: ${{ inputs.ci-event }}
        RUN_ATTEMPT_IN: ${{ inputs.run-attempt }}
      run: |
        source .venv/bin/activate
        [ -n "${CH_PORT_IN}" ] && export CLICKHOUSE_PORT="${CH_PORT_IN}"
        [ -n "${CH_USER_IN}" ] && export CLICKHOUSE_USER="${CH_USER_IN}"
        [ -n "${CH_DB_IN}" ] && export CLICKHOUSE_DB="${CH_DB_IN}"
        # Only exported when non-empty: target_database() treats an unset value as "v2 not
        # configured", which is what makes the v1 default cost nothing.
        [ -n "${CH_DB_V2_IN}" ] && export CLICKHOUSE_DB_V2="${CH_DB_V2_IN}"
        [ -n "${SCHEMA_IN}" ] && export INGEST_SCHEMA="${SCHEMA_IN}"
        # Optional flags only when set: an empty --arch would override the host-arch default.
        ARGS=()
        [ -n "${PLATFORM_IN}" ] && ARGS+=(--arch "${PLATFORM_IN}")
        [ -n "${COMPONENT_IN}" ] && ARGS+=(--component "${COMPONENT_IN}")
        [ -n "${RUN_ATTEMPT_IN}" ] && ARGS+=(--run-attempt "${RUN_ATTEMPT_IN}")
        [ -n "${REPOSITORY_IN}" ] && ARGS+=(--repository "${REPOSITORY_IN}")
        [ -n "${CI_EVENT_IN}" ] && ARGS+=(--ci-event "${CI_EVENT_IN}")
        [ -n "${ARTIFACT_IN}" ] && ARGS+=(--artifact "${ARTIFACT_IN}")
        [ -n "${ARTIFACT_ID_IN}" ] && [ -z "${ARTIFACT_IN}" ] && ARGS+=(--artifact-id "${ARTIFACT_ID_IN}")
        [ -n "${TAG_FAMILY_IN}" ] && ARGS+=(--tag-family "${TAG_FAMILY_IN}")
        [ -n "${TAG_DATE_IN}" ] && ARGS+=(--tag-date "${TAG_DATE_IN}")
        while IFS= read -r t; do
          t="${t//[[:space:]]/}"
          [ -n "${t}" ] && ARGS+=(--tag "${t}")
        done <<< "${TAGS_IN}"
        python -m spyre_clickhouse_ingest results \
          --xml-dir "${{ inputs.xml-dir }}" \
          --workflow "${{ inputs.workflow }}" \
          --branch "${{ inputs.branch }}" \
          --sha "${{ inputs.sha }}" \
          --run-id "${{ inputs.run-id }}" \
          --gha-run-id "${{ inputs.gha-run-id }}" \
          --triggered-at "${{ inputs.triggered-at }}" \
          --pr-number "${{ inputs.pr-number }}" \
          --trigger-type "${{ inputs.trigger-type }}" \
          "${ARGS[@]}"
