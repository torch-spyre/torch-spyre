name: Ingest JUnit XML into ClickHouse
description: >
  Parse JUnit/benchmark XML files in a directory and insert their rows into
  ClickHouse via `python -m spyre_clickhouse_ingest results` (or, with vllm-results-dir /
  sendnn-report / benchmarks-dir / tables-dir / bench-dir, those kinds into spyre_v2). This is the SINGLE ingest
  implementation shared by two callers: the push-to-clickhouse.yaml
  workflow_run job (which downloads uploaded artifacts first) and the perf job
  in _test_matrix.yaml (which pushes its report.xml INLINE on the card runner,
  because on a public repo benchmark numbers must not be uploaded as
  world-readable artifacts). Secrets cannot reach a composite action, so the
  caller passes the ClickHouse connection as plain inputs.

inputs:
  xml-dir:
    description: Directory to glob for *.xml (non-recursive). Empty = skip.
    required: false
    default: ''
  vllm-results-dir:
    description: >
      vLLM bench *.json to ingest instead of XML (v2 only; perf verdict). Set at most one of
      xml-dir, vllm-results-dir, sendnn-report, benchmarks-dir, tables-dir, bench-dir.
    required: false
    default: ''
  sendnn-report:
    description: The perf suite's report_sendnn.txt to ingest instead of XML (v2 only).
    required: false
    default: ''
  benchmarks-dir:
    description: >
      *.json of {"benchmarks": [...]} rows to ingest instead of XML (v2 only); trigger-type
      perf or quality, and component names the suite's owner.
    required: false
    default: ''
  tables-dir:
    description: >
      One <table>.json per results table ({"rows": [...]}: test_case_runs, benchmark_runs,
      capability_runs, artifact_results) to ingest instead of XML (v2 only); trigger-type is the
      bundle's one tier, and component names the suite's owner. Format: extensions/clickhouse-ingest/docs/table-formats.md.
    required: false
    default: ''
  bench-dir:
    description: >
      A spyre-bench results directory (its result.json files) to ingest as a `bench` bundle instead of
      XML (v2 only). Needs channel-trust; trigger-type is the tier (perf or quality), and workflow names
      the verdict series when the trust is ci.
    required: false
    default: ''
  channel-trust:
    description: >
      Trust this channel records for bench-dir: ci | lab | external. Empty records external. Only a
      workflow that runs on trusted code with its own ClickHouse secrets may pass ci; the action
      accepts ci only on push, schedule and workflow_dispatch events (a PR- or comment-triggered
      run passes lab); it cannot tell which code produced the results. Setting it without bench-dir is an error.
    required: false
    default: ''
  perf:
    description: vLLM run context, one k=v per line (model, tensor_parallel, head_sha, ...).
    required: false
    default: ''
  workflow:
    description: Workflow name recorded against the rows.
    required: false
    default: ''
  branch:
    description: Branch recorded against the rows.
    required: false
    default: ''
  sha:
    description: Commit sha recorded against the rows.
    required: false
    default: ''
  run-id:
    description: >
      UUID identifying the test run, threaded from the dispatching orchestrator so
      test_runs joins artifact_results. Empty on a GHA-only run, which mints its own.
    required: false
    default: ''
  gha-run-id:
    description: Numeric GitHub Actions run id, used as the dedup key.
    required: false
    default: ''
  run-attempt:
    description: >
      GitHub run attempt the XMLs came from. Set, a re-run's cases replace the earlier
      attempt's in v2; empty (default) keeps first-write-wins.
    required: false
    default: ''
  artifact-id:
    description: >
      artifact_id of what the leg ACTUALLY RAN, derived by derive-gha-artifact-id on the
      runner. Set, the ingest also writes the artifacts row and the artifact_results verdict;
      empty (default) writes neither, leaving every existing caller unchanged.
    required: false
    default: ''
  artifact:
    description: >
      What the leg ran, as a v2-artifact spec (image:, rpm:, wheel:, generic:, gha:<record>
      or an artifact_id), when there is no artifact-id record. Registered, tagged with the
      tag inputs, then given the leg's verdicts.
    required: false
    default: ''
  tag-family:
    description: Tag family for `artifact` (e.g. nightly-supply-chain); its resolved tag is recorded.
    required: false
    default: ''
  tag:
    description: Full tags for the leg's artifact, one per line.
    required: false
    default: ''
  tag-date:
    description: YYYY-MM-DD dating the family's fallback tag. Empty = the run's own day.
    required: false
    default: ''
  repository:
    description: >
      owner/repo the tested commit came from, recorded in artifacts.sources -- the column
      resolve_covered_tiers.py reaches an artifact through. Empty = GITHUB_REPOSITORY.
    required: false
    default: ''
  triggered-at:
    description: Trigger timestamp recorded against the rows (may be empty).
    required: false
    default: ''
  pr-number:
    description: PR number associated with the rows (empty on non-PR runs).
    required: false
    default: ''
  purpose:
    description: >
      Why the run happened (nightly | weekly | merge | on-demand | ...), recorded as run.purpose on the perf
      rows; only nightly, weekly and merge runs join verdict baselines. Empty records none.
    required: false
    default: ''
  ci-event:
    description: >
      Event of the run that built the leg's artifact (push | pull_request | schedule | ...): a
      push to main tags it <repo>@<sha12> (main), a scheduled run of main also nightly-<day>
      (nightly), a pull request <repo>#<pr> and <repo>#<pr>@<sha12> (pr). Empty tags nothing
      beyond the tag inputs.
    required: false
    default: ''
  trigger-type:
    description: Suite tier (e.g. perf | regression | integration | smoke).
    required: false
    default: ''
  component:
    description: >
      Component to stamp on v2 rows. Empty = the ingest script's own product. Set it when a
      cell runs ANOTHER component's suite through this script: component is a test_case_id
      hash input, so the wrong value gives the same test a different identity rather than
      merely mislabelling it.
    required: false
    default: ''
  platform:
    description: >
      Platform arch recorded on benchmark_runs rows (e.g. x86_64). Empty =
      the ingest script falls back to its own host-arch default.
    required: false
    default: ''
  script-repo:
    description: >
      Repository holding extensions/clickhouse-ingest, for the sparse-checkout
      fallback. Consumers outside torch-spyre must keep this default -- without
      it the fallback checks out the CALLING repo and finds no library.
    required: false
    default: torch-spyre/torch-spyre
  script-ref:
    description: >
      Ref of script-repo to check out. Pin to a tag from another repo; the
      default tracks that repo's default branch.
    required: false
    default: ''
  torch-spyre-dir:
    description: >
      Fallback directory containing extensions/clickhouse-ingest when the
      workspace does not already have this ref's copy. The action searches
      $GITHUB_WORKSPACE first so a prebaked product tree cannot hide a
      newer sparse-checkout. Empty = workspace, then sparse-checkout.
    required: false
    default: ''
  venv:
    description: >
      Existing venv that already has spyre-clickhouse-ingest and its deps installed, e.g. the
      caller's own ingest venv. Set, the action reuses it instead of locating the library and
      building its own. Empty = build .venv in the workspace.
    required: false
    default: ''
  clickhouse-v2-host:
    description: ClickHouse endpoint serving the v2 database. Empty (with clickhouse-host also empty) = skip the whole ingest (clean no-op).
    required: false
    default: ''
  clickhouse-v2-port:
    description: Port of clickhouse-v2-host (default 443 inside the library).
    required: false
    default: ''
  clickhouse-v2-user:
    description: Scoped v2 writer login; required once a host is set.
    required: false
    default: ''
  clickhouse-v2-pass:
    description: Password for clickhouse-v2-user.
    required: false
    default: ''
  clickhouse-db-v2:
    description: The v2 database every statement is written to.
    required: false
    default: spyre_v2
  clickhouse-host:
    description: Deprecated, used when clickhouse-v2-host is empty (host and port resolve together).
    required: false
    default: ''
  clickhouse-port:
    description: Deprecated, see clickhouse-host. Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-user:
    description: Deprecated, used when clickhouse-v2-user is empty (user and password resolve together). Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-pass:
    description: Deprecated, see clickhouse-user. Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-db:
    description: Deprecated and ignored (the legacy database); everything is written to clickhouse-db-v2.
    required: false
    default: ''
  schema:
    description: Deprecated and ignored; the schema is always v2.
    required: false
    default: ''
  strict:
    description: >
      'true' (default) passes --strict: a failed v2 write, an unrecorded artifact verdict, a tag
      that fell back to misc, or v2 tables the login cannot see fail the step. 'false' downgrades
      those, and parked rows (exit 75), to warnings. It does not cover a missing login, an
      unreachable host or a perf report with no records, which still fail (use continue-on-error
      on the step to tolerate an outage). An unset host skips either way.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The ingest's get_client() reads CLICKHOUSE_HOST/PASS as REQUIRED env
    # (a KeyError, not a clean skip, when absent), and an empty --xml-dir hits
    # sys.exit(1). So the no-op gate MUST live here: when the connection or the
    # dir is not configured, set configured=false and every later step is a
    # no-op. This is what lets a caller without ClickHouse secrets (or a run
    # with no XML) pass cleanly.
    - name: Gate on ClickHouse config and XML dir
      id: gate
      shell: bash
      env:
        CH_V2_HOST_IN: ${{ inputs.clickhouse-v2-host }}
        CH_OLD_HOST_IN: ${{ inputs.clickhouse-host }}
        XML_DIR: ${{ inputs.xml-dir }}${{ inputs.vllm-results-dir }}${{ inputs.sendnn-report }}${{ inputs.benchmarks-dir }}${{ inputs.tables-dir }}${{ inputs.bench-dir
          }}
        VENV: ${{ inputs.venv }}
        BENCH_DIR_G: ${{ inputs.bench-dir }}
        OTHER_DIRS_G: ${{ inputs.xml-dir }}${{ inputs.vllm-results-dir }}${{ inputs.sendnn-report }}${{ inputs.benchmarks-dir }}${{ inputs.tables-dir }}
        TRUST_G: ${{ inputs.channel-trust }}
      run: |
        if [ -n "${BENCH_DIR_G}" ] && [ -n "${OTHER_DIRS_G}" ]; then
          echo "::error::bench-dir cannot be combined with another results input."
          exit 1
        fi
        if [ -n "${TRUST_G}" ] && [ -z "${BENCH_DIR_G}" ]; then
          echo "::error::channel-trust applies to bench-dir only."
          exit 1
        fi
        if [ "${TRUST_G}" = ci ]; then
          case "${GITHUB_EVENT_NAME}" in
            push|schedule|workflow_dispatch) ;;
            *)
              echo "::error::channel-trust ci is accepted only on push, schedule and workflow_dispatch events, not ${GITHUB_EVENT_NAME}: the results may come from code a PR author controls."
              exit 1 ;;
          esac
        fi
        CH_HOST="${CH_V2_HOST_IN:-${CH_OLD_HOST_IN}}"
        if [ -z "${CH_HOST}" ]; then
          echo "::notice::ClickHouse host not configured — skipping ingest."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        elif [ -z "${XML_DIR}" ]; then
          echo "::notice::No results input provided — skipping ingest."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "install=$([ -z "${VENV}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        fi

    # $GITHUB_WORKSPACE (the job's checkout of this ref) before torch-spyre-dir, so a prebaked
    # tree cannot hide a newer library; a sparse-checkout when neither has one.
    - name: Locate the ingest library (on disk)
      id: locate
      if: steps.gate.outputs.install == 'true'
      shell: bash
      env:
        TS_DIR: ${{ inputs.torch-spyre-dir }}
      run: |
        REL=extensions/clickhouse-ingest/spyre_clickhouse_ingest/results.py
        for base in "${GITHUB_WORKSPACE}" "${TS_DIR}"; do
          if [ -n "${base}" ] && [ -f "${base}/${REL}" ]; then
            echo "clickhouse-ingest library: ${base}/extensions/clickhouse-ingest"
            echo "CHLIB=${base}/extensions/clickhouse-ingest" >> "$GITHUB_ENV"
            echo "need-checkout=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "Ingest library not on disk — will sparse-checkout."
        echo "need-checkout=true" >> "$GITHUB_OUTPUT"

    # `repository` and `path` are both load-bearing for callers outside torch-spyre: without
    # repository this checks out the CALLING repo, and without path it overwrites the
    # caller's workspace (its XML included).
    - name: Checkout the ingest library (fallback)
      if: steps.gate.outputs.install == 'true' && steps.locate.outputs.need-checkout == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: ${{ inputs.script-repo }}
        ref: ${{ inputs.script-ref }}
        path: .ingest-src
        sparse-checkout: extensions/clickhouse-ingest
        sparse-checkout-cone-mode: false

    - name: Set the ingest library path (fallback)
      if: steps.gate.outputs.install == 'true' && steps.locate.outputs.need-checkout == 'true'
      shell: bash
      run: echo "CHLIB=${GITHUB_WORKSPACE}/.ingest-src/extensions/clickhouse-ingest" >> "$GITHUB_ENV"

    - name: Install uv
      if: steps.gate.outputs.install == 'true'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # latest-known, not "latest": it resolves to the newest uv whose checksum is
        # bundled INTO this setup-uv pin, resolved locally with no release lookup. A
        # just-published release is not yet mirrored on releases.astral.sh, so "latest"
        # 404s there and falls back to GitHub Releases, which rate-limits (429) once the
        # fleet requests it concurrently. Bumping setup-uv moves this version forward.
        version: latest-known

    - name: Setup venv and dependencies
      if: steps.gate.outputs.install == 'true'
      shell: bash
      run: |
        # Create the ingest venv in the workspace, NOT the baked shared venv, so
        # the ingest deps never perturb the dev image's torch-spyre environment.
        uv venv
        source .venv/bin/activate
        uv pip install requests clickhouse-driver clickhouse-connect lxml regex "${CHLIB}"

    - name: Ingest XML files into ClickHouse
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      env:
        CH_V2_HOST_IN: ${{ inputs.clickhouse-v2-host }}
        CH_V2_PORT_IN: ${{ inputs.clickhouse-v2-port }}
        CH_V2_USER_IN: ${{ inputs.clickhouse-v2-user }}
        CH_V2_PASS_IN: ${{ inputs.clickhouse-v2-pass }}
        CH_OLD_HOST_IN: ${{ inputs.clickhouse-host }}
        CH_OLD_PORT_IN: ${{ inputs.clickhouse-port }}
        CH_OLD_USER_IN: ${{ inputs.clickhouse-user }}
        CH_OLD_PASS_IN: ${{ inputs.clickhouse-pass }}
        CH_DB_V2_IN: ${{ inputs.clickhouse-db-v2 || 'spyre_v2' }}
        CH_DB_OLD_IN: ${{ inputs.clickhouse-db }}
        SCHEMA_IN: ${{ inputs.schema }}
        STRICT_IN: ${{ inputs.strict }}
        PLATFORM_IN: ${{ inputs.platform }}
        COMPONENT_IN: ${{ inputs.component }}
        ARTIFACT_ID_IN: ${{ inputs.artifact-id }}
        ARTIFACT_IN: ${{ inputs.artifact }}
        TAG_FAMILY_IN: ${{ inputs.tag-family }}
        TAGS_IN: ${{ inputs.tag }}
        TAG_DATE_IN: ${{ inputs.tag-date }}
        REPOSITORY_IN: ${{ inputs.repository }}
        CI_EVENT_IN: ${{ inputs.ci-event }}
        PURPOSE_IN: ${{ inputs.purpose }}
        BRANCH_IN: ${{ inputs.branch }}
        RUN_ATTEMPT_IN: ${{ inputs.run-attempt }}
        VENV: ${{ inputs.venv || '.venv' }}
        XML_DIR_IN: ${{ inputs.xml-dir }}
        VLLM_DIR_IN: ${{ inputs.vllm-results-dir }}
        SENDNN_IN: ${{ inputs.sendnn-report }}
        BENCH_DIR_IN: ${{ inputs.benchmarks-dir }}
        TABLES_DIR_IN: ${{ inputs.tables-dir }}
        BENCH_RESULTS_IN: ${{ inputs.bench-dir }}
        CHANNEL_TRUST_IN: ${{ inputs.channel-trust }}
        PERF_IN: ${{ inputs.perf }}
        WORKFLOW_IN: ${{ inputs.workflow }}
        SHA_IN: ${{ inputs.sha }}
        RUN_ID_IN: ${{ inputs.run-id }}
        GHA_RUN_ID_IN: ${{ inputs.gha-run-id }}
        TRIGGERED_AT_IN: ${{ inputs.triggered-at }}
        PR_NUMBER_IN: ${{ inputs.pr-number }}
        TRIGGER_TYPE_IN: ${{ inputs.trigger-type }}
      run: |
        source "${VENV}/bin/activate"
        # Host and login resolve as one unit: a v2 host never receives the deprecated login.
        if [ -n "${CH_V2_HOST_IN}" ]; then
          CH_HOST_IN="${CH_V2_HOST_IN}" CH_PORT_IN="${CH_V2_PORT_IN}" CH_USER_IN="${CH_V2_USER_IN}" CH_PASS_IN="${CH_V2_PASS_IN}"
        else
          CH_HOST_IN="${CH_OLD_HOST_IN}" CH_PORT_IN="${CH_OLD_PORT_IN}"
          if [ -n "${CH_V2_USER_IN}" ]; then CH_USER_IN="${CH_V2_USER_IN}" CH_PASS_IN="${CH_V2_PASS_IN}"; else CH_USER_IN="${CH_OLD_USER_IN}" CH_PASS_IN="${CH_OLD_PASS_IN}"; fi
        fi
        if [ -n "${SCHEMA_IN}" ] && [ "${SCHEMA_IN}" != v2 ]; then echo "::warning::the schema input is deprecated and ignored: writing v2 only"; fi
        if [ -n "${CH_DB_OLD_IN}" ] && [ "${CH_DB_OLD_IN}" != "${CH_DB_V2_IN}" ]; then echo "::warning::the clickhouse-db input is deprecated and ignored: writing to ${CH_DB_V2_IN}"; fi
        [ -n "${CH_USER_IN}" ] && [ -n "${CH_PASS_IN}" ] || { echo "::error::a ClickHouse host is set but the login is missing: set clickhouse-v2-user and clickhouse-v2-pass (a v2 host never gets the deprecated login)"; exit 1; }
        export CLICKHOUSE_HOST="${CH_HOST_IN}" CLICKHOUSE_V2_HOST="${CH_HOST_IN}"
        export CLICKHOUSE_USER="${CH_USER_IN}" CLICKHOUSE_V2_USER="${CH_USER_IN}"
        export CLICKHOUSE_PASS="${CH_PASS_IN}" CLICKHOUSE_V2_PASSWORD="${CH_PASS_IN}"
        export CLICKHOUSE_DB="${CH_DB_V2_IN}" CLICKHOUSE_DB_V2="${CH_DB_V2_IN}"
        unset CLICKHOUSE_PORT CLICKHOUSE_V2_PORT
        [ -z "${CH_PORT_IN}" ] || export CLICKHOUSE_PORT="${CH_PORT_IN}" CLICKHOUSE_V2_PORT="${CH_PORT_IN}"
        export INGEST_SCHEMA=v2
        # Optional flags only when set: an empty --arch would override the host-arch default.
        ARGS=(--schema v2)
        [ "${STRICT_IN}" = false ] || ARGS+=(--strict)
        [ -n "${PLATFORM_IN}" ] && ARGS+=(--arch "${PLATFORM_IN}")
        [ -n "${COMPONENT_IN}" ] && ARGS+=(--component "${COMPONENT_IN}")
        [ -n "${RUN_ATTEMPT_IN}" ] && ARGS+=(--run-attempt "${RUN_ATTEMPT_IN}")
        [ -n "${REPOSITORY_IN}" ] && ARGS+=(--repository "${REPOSITORY_IN}")
        [ -n "${CI_EVENT_IN}" ] && ARGS+=(--ci-event "${CI_EVENT_IN}")
        [ -n "${PURPOSE_IN}" ] && ARGS+=(--purpose "${PURPOSE_IN}")
        [ -n "${ARTIFACT_IN}" ] && ARGS+=(--artifact "${ARTIFACT_IN}")
        [ -n "${ARTIFACT_ID_IN}" ] && [ -z "${ARTIFACT_IN}" ] && ARGS+=(--artifact-id "${ARTIFACT_ID_IN}")
        [ -n "${TAG_FAMILY_IN}" ] && ARGS+=(--tag-family "${TAG_FAMILY_IN}")
        [ -n "${TAG_DATE_IN}" ] && ARGS+=(--tag-date "${TAG_DATE_IN}")
        while IFS= read -r t; do
          t="${t//[[:space:]]/}"
          [ -n "${t}" ] && ARGS+=(--tag "${t}")
        done <<< "${TAGS_IN}"
        # The non-XML kinds go through the bundle writer, which needs a run URL to link the verdict.
        if [ -n "${VLLM_DIR_IN}" ]; then ARGS+=(--vllm-results-dir "${VLLM_DIR_IN}")
        elif [ -n "${SENDNN_IN}" ]; then ARGS+=(--kind sendnn --sendnn-report "${SENDNN_IN}")
        elif [ -n "${BENCH_DIR_IN}" ]; then ARGS+=(--benchmarks-dir "${BENCH_DIR_IN}")
        elif [ -n "${TABLES_DIR_IN}" ]; then ARGS+=(--tables-dir "${TABLES_DIR_IN}")
        elif [ -n "${BENCH_RESULTS_IN}" ]; then ARGS+=(--bench-dir "${BENCH_RESULTS_IN}")
        else ARGS+=(--xml-dir "${XML_DIR_IN}")
        fi
        [ -n "${BENCH_RESULTS_IN}" ] && [ -n "${CHANNEL_TRUST_IN}" ] && ARGS+=(--channel-trust "${CHANNEL_TRUST_IN}")
        [ -n "${VLLM_DIR_IN}${SENDNN_IN}${BENCH_DIR_IN}${TABLES_DIR_IN}${BENCH_RESULTS_IN}" ] && \
          ARGS+=(--run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
        while IFS= read -r kv; do
          kv="${kv//[[:space:]]/}"
          [ -n "${kv}" ] && ARGS+=(--perf "${kv}")
        done <<< "${PERF_IN}"
        rc=0
        python -m spyre_clickhouse_ingest results \
          --workflow "${WORKFLOW_IN}" \
          --branch "${BRANCH_IN}" \
          --sha "${SHA_IN}" \
          --run-id "${RUN_ID_IN}" \
          --gha-run-id "${GHA_RUN_ID_IN}" \
          --triggered-at "${TRIGGERED_AT_IN}" \
          --pr-number "${PR_NUMBER_IN}" \
          --trigger-type "${TRIGGER_TYPE_IN}" \
          "${ARGS[@]}" || rc=$?
        # strict=false: parked rows (exit 75) are a warning, not a failed step.
        if [ "${rc}" -eq 75 ] && [ "${STRICT_IN}" = false ]; then
          echo "::warning title=ClickHouse::rows were parked, not stored; strict is false, so the step passes"
          rc=0
        fi
        exit "${rc}"

    # The spool holds full rows and is never uploaded; `spool list` prints one line per batch without them.
    - name: Publish a rows-free manifest of parked ClickHouse rows
      id: ch-spool
      if: always() && steps.gate.outputs.configured == 'true'
      shell: bash
      env:
        VENV: ${{ inputs.venv || '.venv' }}
      run: |
        spool="${CH_WRITE_SPOOL:-${RUNNER_TEMP}/ch-spool}"
        compgen -G "${spool}/[0-9]*.json" > /dev/null || exit 0
        py="${VENV:-.venv}/bin/python"
        if [ ! -x "${py}" ]; then
          echo "::warning title=ClickHouse::rows are parked in ${spool}, but this action's venv is missing"
          exit 0
        fi
        # One manifest line per batch for the whole job: batches another action already listed are skipped.
        seen="${RUNNER_TEMP}/ch-spool-listed.jsonl"
        touch "${seen}"
        errs="${RUNNER_TEMP}/ch-spool-list.err"
        CH_WRITE_SPOOL="${spool}" "${py}" -m spyre_clickhouse_ingest spool list 2> "${errs}" \
          | grep -vxF -f "${seen}" > "${RUNNER_TEMP}/ch-spool-manifest.jsonl" || true
        if [ -s "${errs}" ]; then
          echo "::warning title=ClickHouse spool::$(head -c 500 "${errs}" | tr '\n' ' ')"
        fi
        [ -s "${RUNNER_TEMP}/ch-spool-manifest.jsonl" ] || exit 0
        cat "${RUNNER_TEMP}/ch-spool-manifest.jsonl" >> "${seen}"
        { echo "parked=true"; echo "id=$(date +%s)-${RANDOM}${RANDOM}"; } >> "$GITHUB_OUTPUT"
        echo "::warning title=ClickHouse::rows were parked, not stored; see the step summary"

    - name: Upload the parked-rows manifest
      if: always() && steps.ch-spool.outputs.parked == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ch-spool-manifest-xml-${{ github.job }}-${{ github.run_attempt }}-${{ steps.ch-spool.outputs.id }}
        path: ${{ runner.temp }}/ch-spool-manifest.jsonl
        retention-days: 7
