name: Ingest hardware-failure diagnostics into ClickHouse
description: >
  Download every job log from a GHA run, parse it for hardware failures
  (.github/scripts/parse_hw_failures.py) and insert the records into ClickHouse
  (.github/scripts/ingest_hw_diagnostics.py). The SINGLE implementation of the
  push-hw-diagnostics-to-clickhouse.yaml job, extracted so another repo can call it directly
  instead of copying that job's checkout+venv+install+download+parse+ingest steps. Secrets
  cannot reach a composite action, so the caller passes the ClickHouse connection and a GH
  token as plain inputs.

inputs:
  gha-run-id:
    description: Numeric GitHub Actions run ID of the run whose job logs are analysed.
    required: true
  workflow-name:
    description: Name of the triggering workflow, e.g. 'tests'. The tier when trigger-type is empty.
    required: false
    default: tests
  trigger-type:
    description: >
      Test tier of the analysed run, a run_id hash input: pass the value the case ingest used,
      so the two writers derive one id. Empty falls back to workflow-name.
    required: false
    default: ''
  run-url:
    description: URL of the analysed run. Empty computes it from repository + gha-run-id.
    required: false
    default: ''
  component:
    description: Component whose suite this is.
    required: false
    default: torch-spyre
  arch:
    description: >
      Arch of the ANALYSED legs, not of this ingest job -- never $(uname -m), which would
      report the ingest runner instead. arch is a run_id hash input: a wrong value derives
      an id that joins nothing, silently.
    required: false
    default: x86_64
  threaded-run-id:
    description: Orchestrator-minted run uuid, when one exists. Empty derives one instead.
    required: false
    default: ''
  jenkins-run-key:
    description: Jenkins externalizable id ('folder/job#123'), when Jenkins dispatched this leg.
    required: false
    default: ''
  artifact-id:
    description: >
      artifact_id of what this leg ran, when known; a derive-gha-artifact-id record
      ("id|base|installed") is accepted as is.
    required: false
    default: ''
  table:
    description: Target ClickHouse table. Empty uses the script's own default.
    required: false
    default: ''
  gh-token:
    description: Token `gh api` uses to list and download job logs.
    required: true
  repository:
    description: owner/repo the analysed run belongs to. Empty = this job's own repository.
    required: false
    default: ''
  script-repo:
    description: Repository holding the canonical scripts, for the sparse-checkout fallback.
    required: false
    default: torch-spyre/torch-spyre
  script-ref:
    description: Ref of script-repo to check out. Pin to a tag from another repo.
    required: false
    default: ''
  torch-spyre-dir:
    description: Fallback directory holding a torch-spyre checkout. Empty = workspace, then sparse-checkout.
    required: false
    default: ''
  clickhouse-v2-host:
    description: ClickHouse endpoint serving the v2 database. Empty (with clickhouse-host also empty) = skip the whole ingest (clean no-op).
    required: false
    default: ''
  clickhouse-v2-port:
    description: Port of clickhouse-v2-host (default 443 inside the library).
    required: false
    default: ''
  clickhouse-v2-user:
    description: Scoped v2 writer login; required once a host is set.
    required: false
    default: ''
  clickhouse-v2-pass:
    description: Password for clickhouse-v2-user.
    required: false
    default: ''
  clickhouse-db-v2:
    description: The v2 database every statement is written to.
    required: false
    default: spyre_v2
  clickhouse-host:
    description: Deprecated, used when clickhouse-v2-host is empty (host and port resolve together).
    required: false
    default: ''
  clickhouse-port:
    description: Deprecated, see clickhouse-host. Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-user:
    description: Deprecated, used when clickhouse-v2-user is empty (user and password resolve together). Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-pass:
    description: Deprecated, see clickhouse-user. Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-db:
    description: Deprecated and ignored (the legacy database); everything is written to clickhouse-db-v2.
    required: false
    default: ''
  clickhouse-schema-user:
    description: Deprecated and ignored (CI runs no DDL); kept so older callers raise no unexpected-input warning.
    required: false
    default: ''
  clickhouse-schema-pass:
    description: Deprecated and ignored, see clickhouse-schema-user.
    required: false
    default: ''
  schema:
    description: Deprecated and ignored; the schema is always v2.
    required: false
    default: ''
  strict:
    description: >
      'true' (default): a failed insert fails the step. 'false' downgrades a failed insert and
      parked rows (exit 75) to warnings. A missing login or an unreachable host still fails
      (use continue-on-error on the step to tolerate an outage). An unset host skips either way.
    required: false
    default: 'true'

outputs:
  json-file:
    description: Path to the parsed JSON file, for the caller to upload as its own artifact.
    value: ${{ steps.parse.outputs.json-file }}

runs:
  using: composite
  steps:
    # The no-op gate lives here, not in the library: ingest_hw_diagnostics.py's get_client()
    # reads CLICKHOUSE_HOST as a required env (a KeyError, not a clean skip, when absent).
    - name: Gate on ClickHouse config
      id: gate
      shell: bash
      env:
        CH_V2_HOST_IN: ${{ inputs.clickhouse-v2-host }}
        CH_OLD_HOST_IN: ${{ inputs.clickhouse-host }}
      run: |
        CH_HOST="${CH_V2_HOST_IN:-${CH_OLD_HOST_IN}}"
        if [ -z "${CH_HOST}" ]; then
          echo "::notice::ClickHouse host not configured — skipping ingest."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup spyre-clickhouse-ingest
      id: setup
      if: steps.gate.outputs.configured == 'true'
      uses: ./.github/actions/setup-clickhouse-ingest
      with:
        extra-scripts: |
          .github/scripts/parse_hw_failures.py
          .github/scripts/ingest_hw_diagnostics.py
        script-repo: ${{ inputs.script-repo }}
        script-ref: ${{ inputs.script-ref }}
        torch-spyre-dir: ${{ inputs.torch-spyre-dir }}

    - name: Setup the GitHub CLI
      if: steps.gate.outputs.configured == 'true'
      uses: ./.github/actions/setup-gh-cli

    - name: Download job logs
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        REPO: ${{ inputs.repository || github.repository }}
        RUN_ID: ${{ inputs.gha-run-id }}
      run: |
        set -euo pipefail
        source .venv/bin/activate
        mkdir -p raw_logs

        python3 - << 'PYEOF'
        import os

        from spyre_clickhouse_ingest.gha_logs import (
            download_job_logs_or_die,
            list_jobs,
            load_jobs,
        )

        # filter=latest keeps a prior attempt of this run from doubling every row.
        list_jobs(os.environ["REPO"], os.environ["RUN_ID"], "/tmp/jobs.jsonl")
        download_job_logs_or_die(
            load_jobs("/tmp/jobs.jsonl"),
            repo=os.environ["REPO"],
            out_dir="raw_logs",
        )
        PYEOF

    - name: Parse logs
      id: parse
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      env:
        ROOT: ${{ steps.setup.outputs.root }}
        RUN_ID: ${{ inputs.gha-run-id }}
        WORKFLOW: ${{ inputs.workflow-name }}
      run: |
        set -euo pipefail
        source .venv/bin/activate
        SAFE_WF=$(echo "${WORKFLOW}" | tr ' ' '_')
        JSON_FILE="hw_diagnostics_${SAFE_WF}_${RUN_ID}.json"
        echo "json-file=${JSON_FILE}" >> "$GITHUB_OUTPUT"
        echo "JSON_FILE=${JSON_FILE}" >> "$GITHUB_ENV"
        python3 "${ROOT}/.github/scripts/parse_hw_failures.py" \
          --log-dir raw_logs \
          --run-id  "${RUN_ID}" \
          --out     "${JSON_FILE}"

    - name: Ingest into ClickHouse
      if: steps.gate.outputs.configured == 'true'
      shell: bash
      env:
        ROOT: ${{ steps.setup.outputs.root }}
        CH_V2_HOST_IN: ${{ inputs.clickhouse-v2-host }}
        CH_V2_PORT_IN: ${{ inputs.clickhouse-v2-port }}
        CH_V2_USER_IN: ${{ inputs.clickhouse-v2-user }}
        CH_V2_PASS_IN: ${{ inputs.clickhouse-v2-pass }}
        CH_OLD_HOST_IN: ${{ inputs.clickhouse-host }}
        CH_OLD_PORT_IN: ${{ inputs.clickhouse-port }}
        CH_OLD_USER_IN: ${{ inputs.clickhouse-user }}
        CH_OLD_PASS_IN: ${{ inputs.clickhouse-pass }}
        CH_DB_V2_IN: ${{ inputs.clickhouse-db-v2 || 'spyre_v2' }}
        CH_DB_OLD_IN: ${{ inputs.clickhouse-db }}
        SCHEMA_IN: ${{ inputs.schema }}
        STRICT_IN: ${{ inputs.strict }}
        RUN_URL_IN: ${{ inputs.run-url }}
        SERVER_URL: ${{ github.server_url }}
        TABLE_IN: ${{ inputs.table }}
        THREADED_RUN_ID_IN: ${{ inputs.threaded-run-id }}
        COMPONENT_IN: ${{ inputs.component }}
        ARCH_IN: ${{ inputs.arch }}
        JENKINS_RUN_KEY_IN: ${{ inputs.jenkins-run-key }}
        TRIGGER_TYPE_IN: ${{ inputs.trigger-type || inputs.workflow-name }}
        ARTIFACT_ID_IN: ${{ inputs.artifact-id }}
        REPO: ${{ inputs.repository || github.repository }}
        RUN_ID: ${{ inputs.gha-run-id }}
      run: |
        set -euo pipefail
        source .venv/bin/activate
        # Host and login resolve as one unit: a v2 host never receives the deprecated login.
        if [ -n "${CH_V2_HOST_IN}" ]; then
          CH_HOST_IN="${CH_V2_HOST_IN}" CH_PORT_IN="${CH_V2_PORT_IN}" CH_USER_IN="${CH_V2_USER_IN}" CH_PASS_IN="${CH_V2_PASS_IN}"
        else
          CH_HOST_IN="${CH_OLD_HOST_IN}" CH_PORT_IN="${CH_OLD_PORT_IN}"
          if [ -n "${CH_V2_USER_IN}" ]; then CH_USER_IN="${CH_V2_USER_IN}" CH_PASS_IN="${CH_V2_PASS_IN}"; else CH_USER_IN="${CH_OLD_USER_IN}" CH_PASS_IN="${CH_OLD_PASS_IN}"; fi
        fi
        if [ -n "${SCHEMA_IN}" ] && [ "${SCHEMA_IN}" != v2 ]; then echo "::warning::the schema input is deprecated and ignored: writing v2 only"; fi
        if [ -n "${CH_DB_OLD_IN}" ] && [ "${CH_DB_OLD_IN}" != "${CH_DB_V2_IN}" ]; then echo "::warning::the clickhouse-db input is deprecated and ignored: writing to ${CH_DB_V2_IN}"; fi
        [ -n "${CH_USER_IN}" ] && [ -n "${CH_PASS_IN}" ] || { echo "::error::a ClickHouse host is set but the login is missing: set clickhouse-v2-user and clickhouse-v2-pass (a v2 host never gets the deprecated login)"; exit 1; }
        export CLICKHOUSE_HOST="${CH_HOST_IN}" CLICKHOUSE_V2_HOST="${CH_HOST_IN}"
        export CLICKHOUSE_USER="${CH_USER_IN}" CLICKHOUSE_V2_USER="${CH_USER_IN}"
        export CLICKHOUSE_PASS="${CH_PASS_IN}" CLICKHOUSE_V2_PASSWORD="${CH_PASS_IN}"
        export CLICKHOUSE_DB="${CH_DB_V2_IN}" CLICKHOUSE_DB_V2="${CH_DB_V2_IN}"
        unset CLICKHOUSE_PORT CLICKHOUSE_V2_PORT
        [ -z "${CH_PORT_IN}" ] || export CLICKHOUSE_PORT="${CH_PORT_IN}" CLICKHOUSE_V2_PORT="${CH_PORT_IN}"
        export INGEST_SCHEMA=v2
        RUN_URL="${RUN_URL_IN:-${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}}"
        TABLE_ARGS=()
        [ "${STRICT_IN}" = false ] || TABLE_ARGS+=(--strict)
        if [ -n "${TABLE_IN}" ]; then
          [[ "${TABLE_IN}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::the table input must be a plain SQL identifier"; exit 1; }
          TABLE_ARGS+=(--table "${TABLE_IN}")
        fi
        rc=0
        python3 "${ROOT}/.github/scripts/ingest_hw_diagnostics.py" \
          --json-file      "${JSON_FILE}" \
          --run-id         "${THREADED_RUN_ID_IN}" \
          --component      "${COMPONENT_IN}" \
          --arch           "${ARCH_IN}" \
          --gha-run-id     "${RUN_ID}" \
          --jenkins-run-key "${JENKINS_RUN_KEY_IN}" \
          --trigger-type   "${TRIGGER_TYPE_IN}" \
          --run-url        "${RUN_URL}" \
          --artifact-id    "${ARTIFACT_ID_IN}" \
          ${TABLE_ARGS[@]+"${TABLE_ARGS[@]}"} || rc=$?
        # strict=false: parked rows (exit 75) are a warning, not a failed step.
        if [ "${rc}" -eq 75 ] && [ "${STRICT_IN}" = false ]; then
          echo "::warning title=ClickHouse::rows were parked, not stored; strict is false, so the step passes"
          rc=0
        fi
        exit "${rc}"

    # The spool holds full rows and is never uploaded; `spool list` prints one line per batch without them.
    - name: Publish a rows-free manifest of parked ClickHouse rows
      id: ch-spool
      if: always() && steps.gate.outputs.configured == 'true'
      shell: bash
      run: |
        spool="${CH_WRITE_SPOOL:-${RUNNER_TEMP}/ch-spool}"
        compgen -G "${spool}/[0-9]*.json" > /dev/null || exit 0
        py=".venv/bin/python"
        if [ ! -x "${py}" ]; then
          echo "::warning title=ClickHouse::rows are parked in ${spool}, but this action's venv is missing"
          exit 0
        fi
        # One manifest line per batch for the whole job: batches another action already listed are skipped.
        seen="${RUNNER_TEMP}/ch-spool-listed.jsonl"
        touch "${seen}"
        errs="${RUNNER_TEMP}/ch-spool-list.err"
        CH_WRITE_SPOOL="${spool}" "${py}" -m spyre_clickhouse_ingest spool list 2> "${errs}" \
          | grep -vxF -f "${seen}" > "${RUNNER_TEMP}/ch-spool-manifest.jsonl" || true
        if [ -s "${errs}" ]; then
          echo "::warning title=ClickHouse spool::$(head -c 500 "${errs}" | tr '\n' ' ')"
        fi
        [ -s "${RUNNER_TEMP}/ch-spool-manifest.jsonl" ] || exit 0
        cat "${RUNNER_TEMP}/ch-spool-manifest.jsonl" >> "${seen}"
        { echo "parked=true"; echo "id=$(date +%s)-${RANDOM}${RANDOM}"; } >> "$GITHUB_OUTPUT"
        echo "::warning title=ClickHouse::rows were parked, not stored; see the step summary"

    - name: Upload the parked-rows manifest
      if: always() && steps.ch-spool.outputs.parked == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ch-spool-manifest-hw-${{ github.job }}-${{ github.run_attempt }}-${{ steps.ch-spool.outputs.id }}
        path: ${{ runner.temp }}/ch-spool-manifest.jsonl
        retention-days: 7
