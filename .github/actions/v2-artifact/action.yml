name: Resolve or record a v2 artifact
description: >
  Name an artifact by spec and get its one spyre_v2 artifact_id: the existing record when there
  is one, else the identity registration derives, recorded and tagged
  (`python -m spyre_clickhouse_ingest artifacts ensure`). Specs: image:, rpm:, wheel:,
  generic:, gha:<id>|<base>|<installed>;component=<c>, id:<id> or a bare artifact_id. A failure
  is reported as an error annotation and leaves the outputs empty; the job fails unless
  `strict: 'false'`.

inputs:
  artifact:
    description: The spec, e.g. image:icr.io/<repo>@sha256:<digest> or gha:<record>;component=<c>.
    required: true
  arch:
    description: The artifact's arch (an identity input of a gha record); `multi` keeps a manifest list.
    required: true
  tag-family:
    description: A tag family (snap-supply-chain, nightly-supply-chain, ...); resolves and records its tag.
    required: false
    default: ''
  tag:
    description: Full tags to record, one per line; one in a family replaces that family's resolved tag.
    required: false
    default: ''
  tag-date:
    description: YYYY-MM-DD dating a family's fallback tag. Empty = today (UTC) when the family is dated.
    required: false
    default: ''
  lookup:
    description: auto (an existing record wins) | off (derive only, no database) | only (must already exist).
    required: false
    default: auto
  registry:
    description: auto (call the registry only when the spec needs it) | off.
    required: false
    default: auto
  origin:
    description: artifacts.origin of a new record.
    required: false
    default: built
  source:
    description: The repo@[ref@]sha a new record was built from, one per line.
    required: false
    default: ''
  identity-dep:
    description: identity_deps entries, one per line (e.g. base=<artifact_id>).
    required: false
    default: ''
  context-dep:
    description: context_deps entries, one per line.
    required: false
    default: ''
  prop:
    description: key=value props of a new record, one per line.
    required: false
    default: ''
  tag-prop:
    description: key=value props of each recorded tag, one per line.
    required: false
    default: ''
  run-url:
    description: The CI run behind the record. Empty = this workflow run.
    required: false
    default: ''
  dry-run:
    description: Resolve and print what would be written; write nothing. Without a ClickHouse host it derives only.
    required: false
    default: 'false'
  strict:
    description: >
      'true' (default): fail the job when the artifact cannot be resolved or recorded; 'false'
      keeps an error annotation and empty outputs. An unset host skips either way; a set host
      with no login fails.
    required: false
    default: 'true'
  clickhouse-host:
    description: Deprecated, used when clickhouse-v2-host is empty (host and port resolve together).
    required: false
    default: ''
  clickhouse-port:
    description: Deprecated, see clickhouse-host. Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-user:
    description: Deprecated, used when clickhouse-v2-user is empty (user and password resolve together). Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-pass:
    description: Deprecated, see clickhouse-user. Never used once clickhouse-v2-host is set.
    required: false
    default: ''
  clickhouse-v2-host:
    description: ClickHouse endpoint serving spyre_v2. Empty (with clickhouse-host also empty) = resolve only (dry-run) or skip.
    required: false
    default: ''
  clickhouse-v2-port:
    description: Port of clickhouse-v2-host (default 443 inside the library).
    required: false
    default: ''
  clickhouse-v2-user:
    description: Scoped v2 writer login; required once a host is set (the deprecated clickhouse-user is never sent to a v2 host).
    required: false
    default: ''
  clickhouse-v2-pass:
    description: Password for clickhouse-v2-user.
    required: false
    default: ''
  clickhouse-db-v2:
    description: The v2 database every statement is written to (default spyre_v2).
    required: false
    default: ''
  registry-username:
    description: Registry user for image specs (ICR_USERNAME).
    required: false
    default: ''
  registry-password:
    description: Registry password for image specs (ICR_PASSWORD).
    required: false
    default: ''
  artifactory-user:
    description: Artifactory user for rpm/wheel/generic specs.
    required: false
    default: ''
  artifactory-token:
    description: Artifactory token for rpm/wheel/generic specs.
    required: false
    default: ''

outputs:
  artifact-id:
    description: The artifact_id, or '' when the spec named nothing.
    value: ${{ steps.ensure.outputs.artifact-id }}
  tag:
    description: The tag resolved for tag-family, or ''.
    value: ${{ steps.ensure.outputs.tag }}
  tag-family:
    description: The family of that tag, or ''.
    value: ${{ steps.ensure.outputs.tag-family }}
  source:
    description: 'Where the id came from: given, existing, label or derived.'
    value: ${{ steps.ensure.outputs.source }}
  json:
    description: The full result, as `artifacts ensure` prints it.
    value: ${{ steps.ensure.outputs.json }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: latest-known

    # The package from this action's own tree, so a caller on @main or @<branch> gets that
    # ref's code; @main is the fallback when the tree is not on disk.
    - name: Install spyre-clickhouse-ingest
      shell: bash
      env:
        CHLIB: ${{ github.action_path }}/../../../extensions/clickhouse-ingest
        VENV: ${{ runner.temp }}/v2-artifact-venv
      run: |
        set -euo pipefail
        if [ -f "${CHLIB}/pyproject.toml" ]; then
          SPEC="${CHLIB}"
        else
          SPEC="git+https://github.com/torch-spyre/torch-spyre@main#subdirectory=extensions/clickhouse-ingest"
        fi
        uv venv -q "${VENV}"
        VIRTUAL_ENV="${VENV}" uv pip install -q "${SPEC}"
        echo "spyre-clickhouse-ingest: ${SPEC}"

    - name: Ensure ${{ inputs.artifact }}
      id: ensure
      shell: bash
      env:
        VENV: ${{ runner.temp }}/v2-artifact-venv
        ARTIFACT: ${{ inputs.artifact }}
        ARCH: ${{ inputs.arch }}
        TAG_FAMILY: ${{ inputs.tag-family }}
        TAGS: ${{ inputs.tag }}
        TAG_DATE: ${{ inputs.tag-date }}
        LOOKUP: ${{ inputs.lookup }}
        REGISTRY: ${{ inputs.registry }}
        ORIGIN: ${{ inputs.origin }}
        SOURCE: ${{ inputs.source }}
        IDENTITY_DEPS: ${{ inputs.identity-dep }}
        CONTEXT_DEPS: ${{ inputs.context-dep }}
        PROPS: ${{ inputs.prop }}
        TAG_PROPS: ${{ inputs.tag-prop }}
        RUN_URL: ${{ inputs.run-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        DRY_RUN: ${{ inputs.dry-run }}
        STRICT: ${{ inputs.strict }}
        CH_V2_HOST_IN: ${{ inputs.clickhouse-v2-host }}
        CH_V2_PORT_IN: ${{ inputs.clickhouse-v2-port }}
        CH_V2_USER_IN: ${{ inputs.clickhouse-v2-user }}
        CH_V2_PASS_IN: ${{ inputs.clickhouse-v2-pass }}
        CH_OLD_HOST_IN: ${{ inputs.clickhouse-host }}
        CH_OLD_PORT_IN: ${{ inputs.clickhouse-port }}
        CH_OLD_USER_IN: ${{ inputs.clickhouse-user }}
        CH_OLD_PASS_IN: ${{ inputs.clickhouse-pass }}
        CLICKHOUSE_DB_V2: ${{ inputs.clickhouse-db-v2 || 'spyre_v2' }}
        ICR_USERNAME: ${{ inputs.registry-username }}
        ICR_PASSWORD: ${{ inputs.registry-password }}
        ARTIFACTORY_USER: ${{ inputs.artifactory-user }}
        ARTIFACTORY_TOKEN: ${{ inputs.artifactory-token }}
      run: |
        set -uo pipefail
        cmd=ensure
        # Host and login resolve as one unit: a v2 host never receives the deprecated login.
        if [ -n "${CH_V2_HOST_IN}" ]; then
          CH_HOST_IN="${CH_V2_HOST_IN}" CH_PORT_IN="${CH_V2_PORT_IN}" CH_USER_IN="${CH_V2_USER_IN}" CH_PASS_IN="${CH_V2_PASS_IN}"
        else
          CH_HOST_IN="${CH_OLD_HOST_IN}" CH_PORT_IN="${CH_OLD_PORT_IN}"
          if [ -n "${CH_V2_USER_IN}" ]; then CH_USER_IN="${CH_V2_USER_IN}" CH_PASS_IN="${CH_V2_PASS_IN}"; else CH_USER_IN="${CH_OLD_USER_IN}" CH_PASS_IN="${CH_OLD_PASS_IN}"; fi
        fi
        # Override anything the caller's job env carries: the routing is decided by the inputs alone.
        export CLICKHOUSE_HOST="${CH_HOST_IN}" CLICKHOUSE_V2_HOST="${CH_HOST_IN}"
        export CLICKHOUSE_USER="${CH_USER_IN}" CLICKHOUSE_V2_USER="${CH_USER_IN}"
        export CLICKHOUSE_PASS="${CH_PASS_IN}" CLICKHOUSE_V2_PASSWORD="${CH_PASS_IN}"
        unset CLICKHOUSE_PORT CLICKHOUSE_V2_PORT
        [ -z "${CH_PORT_IN}" ] || export CLICKHOUSE_PORT="${CH_PORT_IN}" CLICKHOUSE_V2_PORT="${CH_PORT_IN}"
        if [ -z "${CLICKHOUSE_HOST}" ]; then
          if [ "${DRY_RUN}" != "true" ]; then
            echo "::notice title=v2 artifact::no clickhouse-host; ${ARTIFACT} not recorded."
            exit 0
          fi
          cmd=resolve LOOKUP=off
        fi
        if [ "${cmd}" = ensure ] && { [ -z "${CLICKHOUSE_USER}" ] || [ -z "${CLICKHOUSE_PASS}" ]; }; then
          echo "::error title=v2 artifact::a ClickHouse host is set but the login is missing: set clickhouse-v2-user and clickhouse-v2-pass (a v2 host never gets the deprecated login)"
          exit 1
        fi
        export CLICKHOUSE_DB="${CLICKHOUSE_DB_V2}"
        args=(--artifact "${ARTIFACT}" --arch "${ARCH}" --lookup "${LOOKUP}"
              --registry "${REGISTRY}" --origin "${ORIGIN}" --run-url "${RUN_URL}")
        [ -n "${TAG_FAMILY}" ] && args+=(--tag-family "${TAG_FAMILY}")
        [ -n "${TAG_DATE}" ] && args+=(--tag-date "${TAG_DATE}")
        [ "${DRY_RUN}" = "true" ] && args+=(--dry-run)
        repeat() {
          local v
          while IFS= read -r v; do
            v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"
            if [ -n "${v}" ]; then args+=("$1" "${v}"); fi
          done <<< "$2"
          return 0
        }
        repeat --tag "${TAGS}"
        repeat --source "${SOURCE}"
        repeat --identity-dep "${IDENTITY_DEPS}"
        repeat --context-dep "${CONTEXT_DEPS}"
        repeat --prop "${PROPS}"
        repeat --tag-prop "${TAG_PROPS}"

        out="$(mktemp)"
        if "${VENV}/bin/python" -m spyre_clickhouse_ingest artifacts "${cmd}" "${args[@]}" > "${out}"; then
          "${VENV}/bin/python" - "${out}" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        r = json.load(open(sys.argv[1]))
        for key, out in (("artifact_id", "artifact-id"), ("tag", "tag"),
                         ("tag_family", "tag-family"), ("source", "source")):
            print(f"{out}={r.get(key) or ''}")
        print("json=" + json.dumps(r, sort_keys=True))
        PY
          echo "artifact: $(cat "${out}")"
          echo "- v2 artifact \`${ARTIFACT}\`: \`$(cat "${out}")\`" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        msg="v2 artifact ${ARTIFACT} was not resolved or recorded (see the log above)."
        echo "::error title=v2 artifact::${msg}"
        echo "- :x: ${msg}" >> "$GITHUB_STEP_SUMMARY"
        [ "${STRICT}" = false ] || exit 1
        exit 0

    # The spool holds full rows and is never uploaded; `spool list` prints one line per batch without them.
    - name: Publish a rows-free manifest of parked ClickHouse rows
      id: ch-spool
      if: always()
      shell: bash
      run: |
        spool="${CH_WRITE_SPOOL:-${RUNNER_TEMP}/ch-spool}"
        compgen -G "${spool}/[0-9]*.json" > /dev/null || exit 0
        py="${RUNNER_TEMP}/v2-artifact-venv/bin/python"
        if [ ! -x "${py}" ]; then
          echo "::warning title=ClickHouse::rows are parked in ${spool}, but this action's venv is missing"
          exit 0
        fi
        # One manifest line per batch for the whole job: batches another action already listed are skipped.
        seen="${RUNNER_TEMP}/ch-spool-listed.jsonl"
        touch "${seen}"
        errs="${RUNNER_TEMP}/ch-spool-list.err"
        CH_WRITE_SPOOL="${spool}" "${py}" -m spyre_clickhouse_ingest spool list 2> "${errs}" \
          | grep -vxF -f "${seen}" > "${RUNNER_TEMP}/ch-spool-manifest.jsonl" || true
        if [ -s "${errs}" ]; then
          echo "::warning title=ClickHouse spool::$(head -c 500 "${errs}" | tr '\n' ' ')"
        fi
        [ -s "${RUNNER_TEMP}/ch-spool-manifest.jsonl" ] || exit 0
        cat "${RUNNER_TEMP}/ch-spool-manifest.jsonl" >> "${seen}"
        { echo "parked=true"; echo "id=$(date +%s)-${RANDOM}${RANDOM}"; } >> "$GITHUB_OUTPUT"
        echo "::warning title=ClickHouse::rows were parked, not stored; see the step summary"

    - name: Upload the parked-rows manifest
      if: always() && steps.ch-spool.outputs.parked == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ch-spool-manifest-artifact-${{ github.job }}-${{ github.run_attempt }}-${{ steps.ch-spool.outputs.id }}
        path: ${{ runner.temp }}/ch-spool-manifest.jsonl
        retention-days: 7
