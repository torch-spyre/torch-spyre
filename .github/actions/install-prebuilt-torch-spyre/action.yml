name: Install prebuilt torch-spyre
description: |
  Download the single prebuilt torch-spyre wheel (built once by the
  build_torch_spyre job) and install it non-editable, with NO C++ compilation.

  This is the per-test-job replacement for the old build-from-source step: it
  still runs `uv sync` to materialise the venv + torch + test deps, but with
  `--no-install-project` so the C++ extension is never rebuilt; the prebuilt
  wheel is then dropped on top with `uv pip install`.

inputs:
  torch_spyre_dir:
    description: Path to the checked-out torch-spyre directory
    required: false
    default: torch-spyre
  artifact_name:
    description: Name of the uploaded wheel artifact to download
    required: false
    default: torch-spyre-wheel
  run_id:
    description: >-
      Workflow run ID to download the artifact from. Empty (default) =
      current run.
    required: false
    default: ''
  github_token:
    description: Token used to look up the artifact when run_id is set
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # latest-known, not "latest": it resolves to the newest uv whose checksum is
        # bundled INTO this setup-uv pin, resolved locally with no release lookup. A
        # just-published release is not yet mirrored on releases.astral.sh, so "latest"
        # 404s there and falls back to GitHub Releases, which rate-limits (429) once the
        # fleet requests it concurrently. Bumping setup-uv moves this version forward.
        version: latest-known

    # Restores UV_CACHE_DIR from /storage-1 instead of PyPI; its post step saves it back at job end.
    - name: uv cache (NFS)
      uses: torch-spyre/spyre-inference/.github/actions/uv-nfs-cache@e353b30d6311b5872ab1176c4a0b47a2e8d571ab
      with:
        storage-root: /storage-1/torch-spyre/.cache/uv
        key-files: ${{ inputs.torch_spyre_dir }}/uv.lock

    - name: Download prebuilt wheel
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ github.workspace }}/prebuilt-wheel
        run-id: ${{ inputs.run_id }}
        github-token: ${{ inputs.github_token }}

    # download-artifact can leave a TRUNCATED wheel and still report
    # outcome=success, so uv is blamed instead (issue #5732). Test the zip and
    # re-fetch, as #5370's ingest fetch does. `gh` is absent from the ARC runner
    # images, so install it on demand (pattern: recover-threaded-run-id).
    - name: Check for the GitHub CLI
      id: gh
      shell: bash
      run: echo "present=$(command -v gh >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Setup the GitHub CLI
      if: steps.gh.outputs.present != 'true'
      uses: ./.github/actions/setup-gh-cli

    - name: Verify the wheel, re-fetching a truncated download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token || github.token }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        ARTIFACT_RUN_ID: ${{ inputs.run_id || github.run_id }}
      run: |
        set -uo pipefail
        DEST="$GITHUB_WORKSPACE/prebuilt-wheel"

        # Detects an incomplete transfer, not wheel validity. testzip() RETURNS
        # the bad member and raises nothing, so it must be compared against None:
        # bare `testzip()` exits 0 on CRC corruption. Stderr dropped (noisy trace).
        good() {
          local w
          w="$(ls -1 "$DEST"/*.whl 2>/dev/null | head -1)"
          [[ -n "$w" ]] || return 1
          # One line: an unindented heredoc would end this YAML block scalar.
          python3 -c "import sys, zipfile; \
            zipfile.ZipFile(sys.argv[1]).testzip() is None \
            or sys.exit('corrupt zip member')" "$w" 2>/dev/null
        }

        ATTEMPTS=3
        for attempt in $(seq 1 "$ATTEMPTS"); do
          if good; then
            # Same `ls -1 | head -1` as the install step: same wheel.
            ls -l "$(ls -1 "$DEST"/*.whl | head -1)"
            exit 0
          fi
          # Nothing left to verify after the last attempt: don't sleep or re-fetch.
          [[ "$attempt" -eq "$ATTEMPTS" ]] && break
          echo "::warning::Prebuilt wheel is missing or not a readable zip" \
            "(truncated download), attempt ${attempt}/${ATTEMPTS}; re-fetching" \
            "'${ARTIFACT_NAME}' from run ${ARTIFACT_RUN_ID}."
          sleep $((attempt * 5))
          # No `set -e`: an unguarded mkdir failure would get blamed on the upload.
          rm -rf "$DEST"
          if ! mkdir -p "$DEST"; then
            echo "::error::Cannot create the wheel download directory ${DEST}." >&2
            exit 1
          fi
          # `?name=` filters server-side: a run uploads ~200 artifacts and the
          # wheel is not on page 1. A failed fetch is not fatal; `good` re-checks.
          aid="$(gh api \
                   "/repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}/artifacts?name=${ARTIFACT_NAME}" \
                   --jq '[.artifacts[] | select(.expired == false)] | last | .id // empty')" || aid=""
          if [[ -n "$aid" ]]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
                > "${DEST}/artifact.zip" \
              && unzip -o -q "${DEST}/artifact.zip" -d "$DEST" || true
            rm -f "${DEST}/artifact.zip"
          else
            echo "::warning::Could not resolve artifact id for '${ARTIFACT_NAME}'" \
              "in run ${ARTIFACT_RUN_ID}."
          fi
        done

        echo "::error::Prebuilt wheel '${ARTIFACT_NAME}' did not transfer" \
          "completely after 3 attempts; the uploaded artifact may itself be bad." >&2
        exit 1

    - name: Install prebuilt wheel
      shell: bash
      env:
        TORCH_SPYRE_DIR: ${{ inputs.torch_spyre_dir }}
      run: |
        source "$HOME/.bashrc"
        source /etc/profile.d/ibm-aiu-setup.sh

        [[ "$TORCH_SPYRE_DIR" != /* ]] && TORCH_SPYRE_DIR="${PWD}/${TORCH_SPYRE_DIR}"
        echo "TORCH_SPYRE_DIR $TORCH_SPYRE_DIR"

        cd "$TORCH_SPYRE_DIR"

        # Materialise the venv with all deps (torch + test extras) but DO NOT
        # build the project -> no C++ compile. Then install the prebuilt wheel.
        uv sync --verbose --frozen --all-extras --no-install-project
        source .venv/bin/activate

        WHEEL="$(ls -1 "$GITHUB_WORKSPACE"/prebuilt-wheel/*.whl | head -1)"
        if [[ -z "$WHEEL" ]]; then
          echo "::error::No prebuilt wheel found under prebuilt-wheel/" >&2
          exit 1
        fi
        echo "Installing prebuilt wheel: $WHEEL"
        uv pip install --no-deps --reinstall "$WHEEL"

        # Remove the checked-out torch_spyre/ SOURCE package so it cannot shadow
        # the installed wheel. The repo-root conftest.py makes pytest's rootdir
        # (the repo root) land on sys.path, so `import torch_spyre` would resolve
        # to this source tree — which, in the wheel flow, has NO compiled _C.so —
        # and autoload dies with "No module named 'torch_spyre._C'" (that is what
        # broke every test job). We install and test the wheel, never the source
        # tree, so dropping the source package here makes the wheel the only
        # importable torch_spyre. tests/ (oot_framework, configs, test files) is
        # untouched; no test imports from the source package.
        if [[ -d torch_spyre ]]; then
          echo "Removing checked-out torch_spyre/ source package (wheel is authoritative)"
          rm -rf torch_spyre
        fi

        uv pip show torch

        # Guardrail: prove the installed wheel (site-packages) — NOT an editable
        # rebuild from the source tree — is what resolves, and that the compiled
        # _C.so shipped inside it. find_spec locates the module WITHOUT importing
        # torch_spyre, so it does not start the Spyre runtime here.
        python - <<'PY'
        import importlib.util
        import os
        import sys

        # `python -` puts '' (cwd = the repo root we cd'd into) at sys.path[0],
        # so the checked-out torch_spyre/ source tree — which has NO compiled
        # _C.so — would shadow the installed wheel and make this check resolve
        # the wrong package. Drop cwd from the search path so find_spec sees the
        # site-packages wheel, exactly as the test jobs do (pytest runs from the
        # test file's directory, never the repo root).
        sys.path = [p for p in sys.path if p not in ("", os.getcwd())]

        spec = importlib.util.find_spec("torch_spyre")
        assert spec is not None and spec.origin, "torch_spyre not importable"
        assert "site-packages" in spec.origin, (
            f"torch_spyre resolved to {spec.origin}, expected the installed wheel"
        )
        so = os.path.join(os.path.dirname(spec.origin), "_C.so")
        assert os.path.exists(so), f"_C.so missing next to {spec.origin}"
        print("OK:", spec.origin, "| _C.so present")
        PY
