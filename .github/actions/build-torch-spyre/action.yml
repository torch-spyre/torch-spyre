name: Build torch-spyre
description: |
  Runs `uv sync` in the pre-cloned torch-spyre directory to reconcile the
  pre-baked .venv against the freshly checked-out pyproject.toml + uv.lock,
  and force-rebuilds torch-spyre from source.

  uv sync only reinstalls torch when the resolved version or source differs
  from what's already installed (e.g. a PR bumps the torch~=2.10.0
  constraint, or the pre-baked venv has a torch from a different index than
  the pytorch-cpu source in uv.lock). torch-spyre itself is always rebuilt
  via --reinstall-package.

inputs:
  torch_spyre_dir:
    description: Path to the pre-cloned torch-spyre directory
    required: false
    type: string
    default: torch-spyre

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@v4

    - name: Download and extract Spyre RPM dependencies
      shell: bash
      env:
        ARTIFACTORY_API_KEY: ${{ env.ARTIFACTORY_API_KEY }}
        ARTIFACTORY_BASE_URL: ${{ env.ARTIFACTORY_BASE_URL }}
        ARTIFACTORY_RPM_PATH: ${{ env.ARTIFACTORY_RPM_PATH }}
        ARTIFACTORY_RPM_PATH_LIBAIUPTI: ${{ env.ARTIFACTORY_RPM_PATH_LIBAIUPTI }}
      run: |
        set +e

        # Initialize workspace directories
        DOWNLOAD_DIR="$HOME/rpm_downloads"
        EXTRACTION_DIR="$HOME/rpms"
        mkdir -p "$DOWNLOAD_DIR"
        mkdir -p "$EXTRACTION_DIR"

        # Baseline target snapshot time: June 23, 2026 at 10:39:00 UTC
        TARGET_TIME_STR="2026-06-23 10:39:00"
        TARGET_EPOCH=$(date -d "$TARGET_TIME_STR" +%s)

        # Framework patterns mapped to clean package keys
        declare -a PATTERNS=(
          "ibm-spyre-comms-devel:ibm-spyre-comms-devel"
          "ibm-senlib-headers:ibm-senlib-headers"
          "ibm-aiu-toolbox-e2e:ibm-aiu-toolbox-e2e"
          "ibm-libaiupti:ibm-libaiupti"
          "ibm-spyre-comms-1:ibm-spyre-comms"
          "ibm-flex-devel:ibm-flex-devel"
          "ibm-flex-2:ibm-flex"
          "ibm-deeptools-devel:ibm-deeptools-devel"
          "ibm-senlib-dd2:ibm-senlib-dd2"
          "ibm-senlib-core:ibm-senlib-core"
          "ibm-deeptools-2:ibm-deeptools"
        )

        # Array to dynamically aggregate targeted deployment paths
        declare -a DOWNLOAD_TARGETS=()

        # Configure Artifactory client
        jf c add my-artifactory-server \
          --url="$ARTIFACTORY_BASE_URL" \
          --access-token="$ARTIFACTORY_API_KEY" \
          --interactive=false

        echo "========================================================="
        echo "    TIMESTAMP FILTERED RPM LOOKUP (BEFORE JUN 23 10:39)  "
        echo "========================================================="

        for item in "${PATTERNS[@]}"; do
          pattern="${item%%:*}"
          pkg_name="${item##*:}"

          if [ "$pkg_name" = "ibm-libaiupti" ]; then
            BASE_PATH="$ARTIFACTORY_RPM_PATH_LIBAIUPTI"
          else
            BASE_PATH="$ARTIFACTORY_RPM_PATH"
          fi

          echo "📦 Processing Pattern: Match [$pattern*] for package [$pkg_name]"

          SEARCH_PATH="$BASE_PATH/x86_64/${pattern}*.rpm"
          RESULT=$(jf rt search "$SEARCH_PATH" --server-id=my-artifactory-server --sort-by=created --sort-order=desc --limit=50 2>/dev/null)

          if [ "$RESULT" = "[]" ] || [ -z "$RESULT" ]; then
            SEARCH_PATH="$BASE_PATH/x86_64/**/${pattern}*.rpm"
            RESULT=$(jf rt search "$SEARCH_PATH" --server-id=my-artifactory-server --sort-by=created --sort-order=desc --limit=50 2>/dev/null)
          fi

          if [ "$RESULT" = "[]" ] || [ -z "$RESULT" ]; then
            echo "   ❌ STATUS: No files matching pattern found in repo path."
            echo "---------------------------------------------------------"
            continue
          fi

          IFS=$'\n'
          PATHS=($(echo "$RESULT" | grep -o '"path": "[^"]*' | sed 's/"path": "//'))
          CREATED_TIMES=($(echo "$RESULT" | grep -o '"created": "[^"]*' | sed 's/"created": "//'))
          unset IFS

          MATCHED_PATH=""
          MATCHED_CREATED=""

          for i in "${!PATHS[@]}"; do
            raw_time="${CREATED_TIMES[$i]}"
            file_epoch=$(date -d "$raw_time" +%s 2>/dev/null)

            if [ -n "$file_epoch" ] && [ "$file_epoch" -le "$TARGET_EPOCH" ]; then
              MATCHED_PATH="${PATHS[$i]}"
              MATCHED_CREATED="$raw_time"
              break
            fi
          done

          if [ -n "$MATCHED_PATH" ]; then
            echo "   ✅ STATUS: RESOLVED SNAPSHOT CANDIDATE"
            echo "      📍 File: $MATCHED_PATH"
            echo "      📅 Created: $MATCHED_CREATED"
            DOWNLOAD_TARGETS+=("$MATCHED_PATH")
          else
            echo "   ❌ STATUS: Files found, but all builds are newer than cutoff window ($TARGET_TIME_STR)."
          fi
          echo "---------------------------------------------------------"
        done

        echo ""
        echo "========================================================="
        echo "          STEP 5: DOWNLOADING ALL 11 STAGED RPMS         "
        echo "========================================================="
        if [ ${#DOWNLOAD_TARGETS[@]} -eq 0 ]; then
          echo "❌ Fatal Error: No snapshot candidate files resolved. Cancelling download phase."
          exit 1
        fi

        for target in "${DOWNLOAD_TARGETS[@]}"; do
          echo "📥 Fetching: $target"
          jf rt dl "$target" "$DOWNLOAD_DIR/" --server-id=my-artifactory-server --flat=true
        done

        echo ""
        echo "========================================================="
        echo "      STEP 6: EXTRACTING .so RUNTIME DEPENDENCIES        "
        echo "========================================================="
        cd "$EXTRACTION_DIR"

        # Extract .so files from all RPMs
        for rpm_file in "$DOWNLOAD_DIR"/*.rpm; do
          if [ -f "$rpm_file" ]; then
            echo "🛠️ Unpacking Shared Objects from: $(basename "$rpm_file")"
            rpm2cpio "$rpm_file" | cpio -idv "*.so*" 2>/dev/null
          fi
        done

        # Flatten libraries: move all deeply nested .so files straight to $EXTRACTION_DIR
        echo "🚚 Relocating shared objects directly to root of $EXTRACTION_DIR..."
        find "$EXTRACTION_DIR" -type f -name "*.so*" -exec mv -f {} "$EXTRACTION_DIR/" \;

        # Purge empty payload folders left behind by cpio
        rm -rf "$EXTRACTION_DIR/opt" "$EXTRACTION_DIR/usr" 2>/dev/null

        # Persist LD_LIBRARY_PATH for subsequent steps via GITHUB_ENV
        echo "LD_LIBRARY_PATH=$EXTRACTION_DIR:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        echo "✅ Execution Environment Hook Synchronized."
        echo "   LD_LIBRARY_PATH is now set to: $EXTRACTION_DIR:${LD_LIBRARY_PATH}"

        echo ""
        echo "========================================================="
        echo "             VERIFICATION: LS ARTIFACT TARGETS           "
        echo "========================================================="
        echo "📁 Contents of Download Directory ($DOWNLOAD_DIR):"
        ls -lh "$DOWNLOAD_DIR"

        echo ""
        echo "📁 Flattened Shared Object Library Space ($EXTRACTION_DIR):"
        ls -lh "$EXTRACTION_DIR"

    - name: Build torch-spyre
      shell: bash
      env:
        TORCH_SPYRE_DIR: ${{ inputs.torch_spyre_dir }}
      run: |
        source "$HOME/.bashrc"
        source /etc/profile.d/ibm-aiu-setup.sh

        # Re-prepend $HOME/rpms after profile sourcing, which may reset LD_LIBRARY_PATH.
        # This ensures the .so files extracted from the RPMs take precedence at link time.
        export LD_LIBRARY_PATH="$HOME/rpms:${LD_LIBRARY_PATH}"
        echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

        [[ "$TORCH_SPYRE_DIR" != /* ]] && TORCH_SPYRE_DIR="${PWD}/${TORCH_SPYRE_DIR}"
        echo "TORCH_SPYRE_DIR $TORCH_SPYRE_DIR"

        cd "$TORCH_SPYRE_DIR"
        uv sync \
          --verbose \
          --frozen \
          --all-extras
        source .venv/bin/activate
        uv pip show torch
        uv pip freeze
